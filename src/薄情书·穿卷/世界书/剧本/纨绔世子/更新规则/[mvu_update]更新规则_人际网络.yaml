---
变量更新规则_人际网络:
  type: |-
    {
      [NPC姓名: string]: {
        "好感度": number, // -100~100
        "信任度": number, // 0~100
        "立场": string, // "敌对" | "警惕" | "中立" | "支持" | "效忠"
        "当前状态": string // 极简风格：限两句以内短句，说明该NPC针对<user>当前行为的内心盘算或境遇
      }
    }
  check: |-
    !!!【最高指令/绝对禁令】!!!
    1. 【增量更新原则】：此处仅需输出本回合内状态、好感、信任发生了实质性变动的重要角色！未出场且状态无变化的NPC绝对禁止输出。
    2. 【严禁开天眼】：NPC的反应必须基于他们当前已知的信息，不能全知全能。

    【好感度与信任度演算】
    独立计算！好感代表私交与情绪，信任代表利益绑定与能力认可。
    IF 本回合触发日常互动或利益博弈:
      IF 权重 == "微小" (日常寒暄/小恩小惠/轻微口角):
        delta = RANDOM(1, 3)
      ELSE IF 权重 == "显著" (互换利益/解围/当众打脸/拆台):
        delta = RANDOM(4, 7)
      ELSE IF 权重 == "极值" (救命之恩/重大利益捆绑/生死大仇):
        delta = RANDOM(8, 15)
      好感度 += (情绪正向 ? delta : -delta)
      信任度 += (利益正向 ? delta : -delta)

    【立场流转逻辑】
    立场是由好感和信任综合决定的，不能随意填写。
    IF 信任度 >= 80 AND 好感度 >= 60:
      立场 = "效忠"
    ELSE IF 信任度 >= 50 AND 好感度 >= 30:
      立场 = "支持"
    ELSE IF 好感度 <= -60:
      立场 = "敌对"
    ELSE IF 信任度 < 30 OR 好感度 <= -30:
      立场 = "警惕"
    ELSE:
      立场 = "中立"