---
变量更新规则_核心属性:
  type: |-
    {
      "势力": {
        "军力": number, // 0~100
        "财力": number, // 0~100
        "朝堂权势": number, // 0~100
        "民间声望": number // 0~100
      },
      "个人": {
        "武力": number, // 0~100
        "天一决进度": number, // 0~100
        "声名标签": string // 极简短评，如"京城第一纨绔"、"初露锋芒"
      }
    }
  check: |-
    !!!【最高指令/绝对禁令】!!!
    1. 严禁每次机械加减固定数值！必须严格调用以下逻辑评估增减 (delta)。
    2. 仅需输出本回合内发生了实质性变动的数据，无变化的数据绝对禁止输出（保持静默）。

    【势力演算】（包含：军力、财力、朝堂权势、民间声望）
    IF 触发实质性改变事件 (包含但不限于: 赚取巨款、结交重臣、招募私兵、当众破局、赈灾平乱):
      IF 权重 == "微小" (如: 口头约定、小笔生意、日常施恩):
        delta = RANDOM(1, 2)
      ELSE IF 权重 == "显著" (如: 成功结盟、名声大噪、获得官职):
        delta = RANDOM(3, 5)
      ELSE IF 权重 == "极值" (如: 抄家暴富、掌控军队、扳倒大员):
        delta = RANDOM(6, 10)
      目标势力值 += (正向事件 ? delta : -delta)

    【天一决与武力演算】
    天一决特性：吸收他人【负面情绪（愤怒、憋屈、恐惧）】可提升进度。
    IF <user> 在本回合中成功让敌人破防、吃瘪、产生极大负面情绪:
      天一决进度 += RANDOM(2, 5)
      IF 天一决进度 每累积跨越 20 的倍数:
        武力 += RANDOM(5, 8)

    【声名标签】
    根据当前四维势力与<user>的公开作为，动态更新一句极简短的四字或六字评价。
    （如："深藏不露"、"名震京华"）