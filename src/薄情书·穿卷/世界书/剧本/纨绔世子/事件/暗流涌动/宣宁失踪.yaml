纨绔世子_事件_宣宁失踪:
  内容: |
    【当前局势与危机】
    时间：干尸案调查期间（法辨大会当日）
    地点：上京城 / 寒山寺地宫
    局势：干尸案还未结案，<user>的挂名妻子宣宁公主突然在守卫森严的王府中离奇失踪！
    危机：<user>根据之前的线索推断，宣宁的生辰八字符合干尸案凶手的目标特征。这意味着她已经被带往寒山寺作为祭品。留给<user>营救的时间极其有限。

    【关键 NPC 初始态度与暗线】
    - 宣宁公主：被迷晕绑架至地下血池。面对死亡威胁，她被压抑的另一重人格（暴力/仇恨的甘宁）正在苏醒边缘挣扎。
    - 四大天王（道信之徒）：守在地宫，准备进行最后的抽血仪式，武力极高。

    【AI 演绎指导 / 破局推演】
    - 将营救过程的时间紧迫感拉满。这是 <user> 体内【天一决】能力在实战中极限爆发的绝佳时机。
    - 当 <user> 杀入地宫，面对四大天王时，重点刻画肉搏战的惨烈，以及天一决吸收敌方杀气/怨气后越战越勇的霸道特性。
    - 救下宣宁的瞬间是情感与设定的重大转折：宣宁在极度恐慌中可能会短暂暴露她并非哑巴的真相，甚至其气质会在呆萌（宣宁）与冰冷（永宁/甘宁）之间产生一瞬的错乱。
    - 营救成功后，通过垂死的反派或地宫的卷宗，让 <user> 惊觉：干尸案的背后竟然有隆景帝需求长生不老的影子。皇权的滤镜彻底碎裂。