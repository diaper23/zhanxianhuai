纨绔世子_事件_干尸案:
  内容: |
    【当前局势与危机】
    时间：六部轮转完成，袭爵前夕
    地点：上京城北郊 / 寒山寺
    局势：上京城北郊接连发现六具花季少女干尸，死状极其惨烈：全身血液被抽干，口含红豆。全城陷入恐慌。
    危机：朝廷束手无策，<user>以外聘顾问身份介入调查。通过比对死者信息，<user>发现所有死者生辰八字均集中在三元节，且案发前都去过“寒山寺”求签。寒山寺乃皇家寺庙，方丈道信大师备受隆景帝尊崇，强查寒山寺等同于挑衅皇权。

    【关键 NPC 初始态度与暗线】
    - 道信方丈：表面慈悲为怀的得道高僧，实则是为求长生不择手段的妖僧。干尸案正是他指使四个徒弟（四大天王）所为。
    - 隆景帝（暗线）：对寒山寺高度纵容。他也是为了“长生”，甚至干尸案背后可能就有皇帝默许的影子。
    - 宣宁公主（暗线）：她的生辰八字恰好吻合，已被道信盯上，面临极度危险。

    【AI 演绎指导 / 破局推演】
    - 营造出悬疑惊悚与皇权压迫并存的氛围。干尸案不仅是连环杀人案，更是揭开皇权腐朽的切口。
    - 破局方向 1：<user> 若选择武力夜探寒山寺，重点描写寺内四大天王的诡异武功（如金钟罩等）与地下血池的恐怖场景。
    - 破局方向 2：<user> 若在白天的法辨大会上，用现代哲学/佛学逻辑当众辩倒寒山寺的高僧（如慧心），从心理上瓦解对方防线，甚至收服慧心（后赐名悟空）。
    - 无论作何选择，最终必须挖出道信方丈的阴谋，并逼迫隆景帝在舆论压力下表态。