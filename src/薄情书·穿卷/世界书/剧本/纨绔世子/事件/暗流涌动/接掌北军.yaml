  内容: |
    【当前局势与危机】
    时间：北方战报传来之后
    地点：太极殿朝堂 / 陇州（镇北军大营）
    局势：关子安（镇北军叛徒，隆景帝的狗）在北方激进挑衅蛮族，导致安北军大败，六万精锐折损。北方边境危在旦夕。
    危机：朝野震动。费田（废帝遗留）在早朝故意捅破这一消息，满朝文武逼迫隆景帝必须派<user>率领镇北军旧部北上平乱。隆景帝被迫答应，但他私下与段盎密谋了一个恶毒的“狡兔死走狗烹”计划——等<user>平乱耗尽兵力后，就地解除兵权并诛杀。

    【关键 NPC 初始态度与暗线】
    - 隆景帝：咬碎了牙，但在满朝百官的逼迫下只能放虎归山。
    - 费田：暗中对<user>使了个眼色，深藏功与名。
    - 邱天材（陇州刺史，朝廷走狗）：在陇州军营里耀武扬威，试图压制镇北军旧将。

