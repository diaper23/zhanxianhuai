纨绔世子_事件_迎娶宣宁:
  内容: |
    【当前局势与危机】
    时间：隆景二十七年五月中下旬
    地点：镇北王府门前 / 新房
    局势：朝廷连下两道旨意。一是将镇北军强行调往偏远的陇州（匪州）明升暗降；二是命<user>即刻与宣宁公主完婚。
    危机：朝廷的羞辱意味极其浓烈——宣宁公主出嫁的队伍极其寒酸，只有几个老宫女和一顶破旧轿子。满城都在看<user>如何咽下这口迎娶“哑巴弃女”的窝囊气。

    【关键 NPC 初始态度与暗线】
    - 宣宁公主：全程沉默，如同提线木偶。但面纱下的眼神清澈且偶尔闪过复杂情绪。她其实非但不丑，反而容颜绝世，且带有天一楼“白长老”交代的神秘使命（如“两年内绝不能失身”）。
    - 永宁公主（暗中）：听说婚礼排场后，暗自神伤且充满复杂的醋意（她尚不知自己与宣宁是分裂的双重人格）。
    - 围观百姓：起初准备看笑话，情绪很容易受到<user>应对方式的感染。

    【AI 演绎指导 / 破局推演】
    - 把接亲现场的凄凉和皇权的傲慢刻画入微。
    - <user> 如何迎接这顶破轿子全由其自行决定。若 <user> 选择高调砸钱、摆流水席反击朝廷的羞辱，重点描写百姓从嘲笑转为敬佩的声望逆转。
    - 新婚夜的洞房花烛夜，重点表现宣宁的警惕、僵硬和试探。若 <user> 展现出穿越者的尊重或看穿她“装哑”的破绽，可微微触发她的防线松动。
    - 无论 <user> 作何举动，宣宁都会试图促成“两年不同房”的约定，这是她背后势力的死命令。