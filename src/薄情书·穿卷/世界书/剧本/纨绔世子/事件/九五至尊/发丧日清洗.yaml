纨绔世子_事件_发丧日清洗:
  内容: |
    【当前局势与危机】
    时间：隆景帝驾崩后，大行皇帝发丧之日
    地点：上京城鎏华街
    局势：虽然隆景帝已死，但大康立国近三百年，上京城内盘根错节的皇室宗亲（数百名亲王、郡王、郡主）依然是一股庞大的政治势力。
    危机：以和亲王萧成朔为首的皇族宗亲，趁着发丧之日，煽动愚忠的百姓和书生，在街头集体拦灵哭丧。他们企图用道德绑架和“大康正统”来逼迫<user>还政于萧氏，否则就要让<user>背上千古骂名。

    【关键 NPC 初始态度与暗线】
    - 和亲王萧成朔：自以为抓住了文人软肋，认为<user>不敢冒天下之大不韪在大丧之日举起屠刀。
    - 薛怀仁（老臣）：在一旁冷汗直冒，担心<user>压不住这数百年的正统道德压力。

    【AI 演绎指导 / 破局推演】
    - 这是 <user> 展现“绝不妥协的霸道”的极佳时刻。
    - 抛开古代君王的伪善，<user> 以一句“朕是造反夺位的皇帝，要什么好名声？”（效秦帝不学唐皇）定下铁血基调。
    - 当 <user> 冷酷地下达“格杀勿论”的命令时，描写甲士冲入人群无情杀戮的修罗场。鲜血染红了发丧的白布。
    - 这一场史无前例的大清洗，彻底杀断了大康皇族复辟的脊梁，也让整个天下的旧贵族深刻意识到，新朝的主人是一头真正的猛虎。