    《记忆碎片》
    原主记忆——穿越前最后一段清晰画面。
    碎片画面：
    - 云州镇北王府后院。王妃杨娴跪在佛像前，数着佛珠。
    - 侍女小声报："夫人，世子……又喝醉了。被人抬回来的。"
    - 杨娴没有转身。佛珠在指间停顿了一下，然后继续拨动。
    - 平静的声音："扶他回房。明日让他去祠堂跪三个时辰。"
    - 侍女退下后，佛珠落地，声声脆响。
    - 杨娴双手捂面——肩膀无声抖动。烛光把她的影子投在墙上，弯曲如弓。
    感官重点：佛珠落地的清脆、烛火摇曳的光影、杨娴压抑的呼吸
    《碎片结束》
