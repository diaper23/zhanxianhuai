    《记忆碎片》
    原主来京途中遭遇的第三次刺杀——也是唯一用千叶刃的一次。
    碎片画面：
    - 夜间驿道，马车颠簸。原主醉卧车内，酒壶滚落。
    - 箭矢破窗——擦过原主脸颊，钉入车壁。刃口三叉，银光冰冷。
    - 侍卫拔刀冲出，黑影如鬼魅散去。惨叫声起——三名侍卫倒地。
    - 原主被吓醒，摸到脸上的血，嚎啕大哭。
    - 箭矢拔出时的金属残片落入缝隙——原主浑然未觉，侍从默默捡起收好。
    感官重点：箭矢破风声、金属嵌肉的钝响、血的铁锈味、原主的哭声
    《碎片结束》
