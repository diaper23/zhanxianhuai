    《记忆碎片》
    原主幼年在云州的记忆——镇北军校场阅兵。
    碎片画面：
    - 父亲关重山骑黑鬃战马立于点将台，铠甲反射日光。
    - 十万铁骑以百人为方阵列于平原，旌旗如林。"镇北"大纛在风中猎猎作响。
    - 父亲一挥手——十万人同时拔刀，刀光如雪崩。大地在整齐的踏步声中颤抖。
    - 小关宁骑在侍从肩头，双眼放光，小拳头攥紧——"爹爹好厉害！"
    - 关重山低头看向他，嘴角一弯——那是记忆中父亲唯一的笑容。
    感官重点：马嘶声、万人齐步的震动、铠甲日光刺目、风卷旗帜的啪啪声
    《碎片结束》
