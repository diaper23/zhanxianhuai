    《记忆碎片》
    非传统记忆——<user>在攻破上京前夜的独处时刻。
    碎片画面：
    - 大帐之中，地图铺满案面。上京城的城防图被烛光照亮。
    - <user>背对所有人，独立帐前。遥望南方——上京城的灯火隐约可见。
    - 想起穿越第一天——那个书房里的傍晚，窗外同样是上京的灯火。
    - 彼时孤身一人，空壳世子，满城嘲笑。
    - 此时三十万铁骑在背后安静扎营。火把连成星河。
    - 伸手——手指比当初粗了一圈，虎口有老茧，骨节曾断裂再接。
    - 风从北方来。带着草原和铁锈的气味。
    感官重点：篝火噼啪、远方城市光晕、北风中的铁锈与草味、自己心跳声
    《碎片结束》
