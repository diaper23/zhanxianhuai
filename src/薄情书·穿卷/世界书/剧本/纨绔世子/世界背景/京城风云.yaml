---
世界背景_京城风云:
  时代: 大康王朝·隆景二十七年
  概况: |
    大康王朝国祚二百七十六年，当今隆景帝在位第二十七年。
    三国鼎立：大康（中原）、大梁（西方强国）、大魏（东方）。
    北方蛮荒：乃蛮部等游牧民族常年入侵。

  核心矛盾: |
    隆景帝推行削藩：镇北王是唯一外姓实权世袭藩王，首当其冲。
    一个月前，镇北王关重山率十万精锐入蛮荒后全军失踪——朝廷暗中操作的结果。
    <user>作为世子，是朝廷下一步打压的目标。

  地理:
    上京城: |
      大康国都。分内城（皇宫、官衙）和外城（民居、商铺）。
      设东市/西市两大商贸中心。
      国子监位于城北，六部衙门位于皇城南。
    镇北王府: |
      位于上京城东北角。曾经宏伟，如今门可罗雀。
      府内仅剩数十名老仆和少量护卫。
      <user>穿越后的起始地点。
    云州: 镇北王府的封地大本营，位于北方边疆。目前由王妃杨娴坐镇。
    陇州: 匪患横行的偏远州。镇北军即将被调往此处（明升暗降）。

  朝堂势力:
    雪党: |
      以次辅薛怀仁为首，主张激进削藩。
      核心成员：赵立本、薛庆（户部侍郎）、邓丘（兵部左侍郎）
      策略：先削兵权，再治罪名，最后除人
    梅党: |
      以吏部尚书卢照龄为首，温和派。
      不反对削藩但反对手段过激。
      潜在的拉拢对象。
    皇权中枢: |
      隆景帝、首辅陆泰渊、太监总管冯元
      表面中立实则主导一切阴谋

  社会文化:
    - 科举取士为正途，国子监为最高学府
    - 武道体系：一至九品，五品为分水岭
    - 商业繁荣但商人地位低于士大夫
    - 诗词文化发达，有诗阁/词阁/画阁/琴阁等文人组织

  <user>的初始处境:
    身份: 镇北王世子·关宁，京城出名的纨绔废物
    资源: 王府空壳 + 少量银两 + 母亲的暗中资助
    人脉: 几乎为零（原主把所有关系都败光了）
    危机: 明日将接旨——退永宁公主婚约、改赐宣宁公主（哑巴）、命入国子监
    暗线: 来京路上三次刺杀未追究，第三次使用朝廷专用箭矢"千叶刃"
    金手指: 天一决秘籍（即将获得）——吸收负面情绪修炼 + 过目不忘 + 恢复力异常

  阶段目标:
    - 通过八门会考获得为官资格
    - 调查三次暗杀的幕后主使
    - 建立政治人脉和经济基础
    - 完成六部轮转全甲继承王位
    - 在此过程中韬光养晦，积蓄力量
