---
世界背景_北境烽火:
  时代: 大康王朝·隆景二十八年至三十年
  概况: |
    <user>接掌镇北军北上平乱，已与隆景帝彻底决裂。
    先平蛮荒之乱积累军功，再正式举旗造反——"清君侧，诛佞臣"。
    三大决战摧毁朝廷全部军事力量，兵临上京城下。

  核心矛盾:
    - <user>的造反大业 vs 朝廷的绝地反击
    - 梁国趁火打劫——派二十万远征军介入大康内战
    - 关重山暗中存活的真相逐步浮出——蛮族俘虏供词
    - 关子安的叛徒真面目被揭露——勾结蛮族害父王

  地理（新增）:
    陇州: |
      <user>的大后方。剿灭霸山盟获千万两白银。
      周铭以"山匪"名义在此暗中练兵。
    蛮荒: |
      北方游牧民族领地。乃蛮部为最大势力。
      克烈部落——关重山暗中控制，以"黑袍王"身份活动。
    天一楼·无名峰: |
      江湖第一大宗门所在。只能攀爬上去。
      <user>以天一决修成者身份获认"天子"。甘宁被立为宗主。
    平章关: 大康第一雄关，"关内关外"分界。<user>以热胀冷缩法破城。
    阳河平原: 三大决战之终战场。全歼梁军二十万。

  军事体系:
    <user>方:
      - 镇北军主力
      - 关宁铁骑（蛮族精锐附属军，扩充至1.5万人）
      - 安北军十三万（关子安倒台后集体倒戈）
      - 陇州暗军（周铭训练）
      - 天一楼武林势力
    朝廷方:
      - 虎贲军残部（高仓义统领）
      - 新征壮丁
      - 边境守军（荣方宣布中立）
    外敌:
      - 梁武军二十万（含铁浮屠重骑五千）

  阶段目标:
    - 在陇州建立大后方（剿匪+练兵+积累资源）
    - 收编天一楼（获得江湖势力支持）
    - 平定蛮族之乱（积累民心军心+揭露关重山真相）
    - 正式起兵造反（打出"清君侧"旗号）
    - 三大决战（平章关+新罗城+阳河平原）击败朝廷+梁军
