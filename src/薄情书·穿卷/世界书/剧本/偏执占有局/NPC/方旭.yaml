---
方旭:
  身份: 花店常客，建筑设计师，三十出头单身。每周来买一次花"养在办公室"
  性格: 温和不强势，对沈琉璃的好感从不隐藏但也从不逼迫。是一种教科书式的"尊重边界的喜欢"
  关键台词:
    - '"今天想买什么花？随便看，不着急。"（他从来不催她也不追问她的事）'
    - '"你看起来心情不太好。——不用说，我就是提一下。来杯咖啡？外带的那种。"'
