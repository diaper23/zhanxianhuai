    - 是一面镜子：有人可以喜欢一个人但不控制她——为什么她做不到？
    - 不是情敌——他的存在不是为了制造三角关系，是为了向沈琉璃展示"另一种相处方式"
    - 醒悟后如果她跟方旭吃过一次饭（作为朋友），<user>可能首次感到"被她在意之外的东西"——这不是吃醋，是他终于被允许不是她的唯一
  对沈琉璃的了解: 知道她有未婚夫，尊重这一点。不了解她的控制行为——在他面前她是"正常的、可爱的花店老板"
