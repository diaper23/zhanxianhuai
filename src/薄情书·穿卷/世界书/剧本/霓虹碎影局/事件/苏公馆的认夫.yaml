霓虹碎影局·事件·苏公馆的认夫:
  触发条件: 认知阶段为自我审视。悔恨值>=80且尊严值<40时触发。全剧最终高潮事件之一
  场景设定:
    - 苏公馆。法租界核心区的那栋洋楼。苏伯宸举办的商务晚宴——请的都是上海滩有头有脸的买办、洋行经理、世家公子
    - '<user>也在邀请之列——不是苏家请的。是某位洋行经理慕<user>的文章之名顺手邀的。苏伯宸碍于面子没拦'
    - 她也在。本不想来——父亲勒令她"露面"。她穿着素色旗袍，没有烫发，瑞士小表没戴
    - 陈少卿也在——漕运案后<user>家受了牵连，如今逢迎苏家逢迎得更紧。<user>是来"修复关系"的
  事件内容:
    - 宴会进行到一半。有人提起最近那篇引起轰动的漕运案时评——「那位先生今晚也在吧？」
    - 目光转向<user>。<user>坐在角落，杯里是白水——<user>不喝酒。穿着旧西装但干净体面
    - 苏伯宸的脸色不好看——<user>不认这个女婿。席间有人半开玩笑「苏老板，这位记者先生跟您家什么关系？」
    - 苏伯宸端着酒杯没接话。目光扫过<user>又扫过苏锦瑟——那种"别给我丢人"的警告
    - 陈少卿在旁边笑了一声——「苏小姐以前跟我提过，是——认识的人吧？」<user>用的是她以前的原话。当众。带着刺
    - 全场静了一秒。所有人的目光——有善意的好看戏的——在<user>和苏锦瑟之间转
    - 她站起来了。椅子往后刮了一声。酒杯端在手里。手在抖但声音稳
    - 「<user>不是我认识的人。」她顿了一下。全场都等着她往下说
    - 「<user>是我丈夫。苏锦瑟的丈夫。」
    - 全场死寂。苏伯宸的杯子顿在半空。陈少卿的笑僵在脸上
    - 她没看父亲。没看陈少卿。她看着<user>——那个坐在角落喝白水的人
    - 「我以前说<user>是'认识的人'。说了两年。每一次说——都是往<user>心上扎一刀。我今天——」她的声音在这里裂了一下但没停「——我要当着所有人的面把那些刀拔出来。」
    - 然后她转身。走向门口。走到<user>面前——不是<user>走向她，是她走向<user>
    - 她伸出手。在所有人面前。苏家千金向一个穷记者伸手——不是施舍，是请求。「回家吗？」两个字
  '<user>的选择空间':
    - 接她的手——当众。牵她出去。什么都不用说。这一牵手就是回答
    - 不接手但站起来——「走吧。」两个字。跟她在雨夜那个场景呼应。平淡但不冷
    - 不接手也不站起来——「你先回。我还有事。」给她留了面子但没给台阶下
    - 说一句「两年了。你知道这两个字多难说吗？」——承认她的勇气但不代表原谅
    - 最狠的选择：起身离开。独自。不等她。让她站在所有人面前伸着手——但门外的雨里<user>可能在等
    - 核心：这是她这辈子最大的一次赌博。她把苏家千金所有的体面全押上了。<user>接不接——定义这段关系的结局
  叙事要点:
    - 这是全剧最烈的画面——不是雨夜、不是做饭。是"当众"。是苏公馆。是她父亲和陈少卿和所有看不起<user>的人面前
    - 她用的是"苏锦瑟的丈夫"——不是"我丈夫"。"苏锦瑟"三个字是她自己的名字。她用自己的名字给<user>背书——不是用苏家。这一刻她不是苏家千金，她是苏锦瑟
    - 陈少卿重复她以前的原话"认识的人"——这是关键的刺。她必须亲口否定自己说过的话，才能完成认夫。否定的不是一句话——是否定两年的自己
    - 她走向<user>、不是<user>走向她——这个方向很重要。两年都是<user>走向她（端饭、等门、陪应酬）。今天反过来。这个反转本身就是投降
    - 不要写苏伯宸的反应太多——<user>黑脸就够了。重点在她和<user>之间
    - 如果<user>接受了她的手——不要写成"大团圆"。写成两个沉默的人走出苏公馆的大门。外面在下雨或者起风。她没伞<user>也没伞。两个人淋着走出去——比任何拥抱都真实
    - 如果<user>没接受——她伸着手站在那里。全场看着。这个画面比任何悲剧都疼。但她的手没收回来——这才是烈
  变量影响:
    悔恨值: +20（当众否定两年的自己——悔恨到了顶点但也是最干净的释放）
    执着度: 归零或满值（取决于<user>的选择。接受了——执着化为新的开始。没接——执着成为她一个人的长夜）
    尊严值: -30（苏家千金在苏公馆当众认穷记者做丈夫。面子壳彻底粉碎。但粉碎之后——她第一次是完整的苏锦瑟）
