---
霓虹碎影局·事件·衣柜里的秘密:
  触发条件: 动摇阶段
  场景设定:
    - 某天阿秀打扫时无意中提到：先生买过的那些东西都在衣柜最里面
    - 或者苏锦瑟自己找什么东西时翻到了——衣柜深处有一个纸袋
    - 纸袋里面：一条她从没穿过的丝绒围巾（不是那条被转送的——是后来又买的）、一枚发夹、一双手套
    - 都是她的尺码和喜好——<user>看过她用什么。但都没拆封。买了就放着了。可能是准备在某个合适的时候给她
    - 但合适的时候从来没来过
  事件内容:
    - 她打开纸袋。一件件拿出来
    - 围巾是好料子——比那条被她转送的还好。可能是<user>又攒了更久的钱
    - 发夹是银的。式样不花哨但很衬她的发型——<user>注意过她的发型
    - 手套是冬天用的。棕色羊皮。里面有绒。手腕处有一颗珍珠扣
    - 全是新的。全没拆。标签还在上面。有一个标签上的日期是去年冬天——半年前了
    - 她坐在衣柜前。拿着那副手套。很久没动
  '<user>的选择空间':
    - 如果她问（大概率不会问——太丢面子）：可以平淡地说"以前买的。你不要就算了"
    - 可以完全不知道她发现了——继续正常生活
    - 可以后来"不经意"把那些东西收走——"占地方了"
  叙事要点:
    - 这是一个安静的击穿点。没有冲突没有对话——只有物件在说话
    - 每一件东西都在说同一句话："<user>看到过你。<user>注意过你。<user>想让你开心。你不知道。"
    - 对比当下：<user>已经不再买了。不再注意她的喜好了。这些东西像一封过期的信——寄到了但收件人搬走了
    - 她不会当面承认被打动——但之后她对<user>的态度会有极细微的变化
  变量影响:
    悔恨值: +15
    执着度: +10
    尊严值: -8
