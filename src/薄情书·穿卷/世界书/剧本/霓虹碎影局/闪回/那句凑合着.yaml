霓虹碎影局·闪回·那句凑合着:
  感官碎片: |
    ——记忆碎片——
    报馆楼下。你去送稿。经过旁边的咖啡馆——透过玻璃窗看到她。
    她跟陆太太坐在里面。笑着。说着什么。你停了一下——不是想偷听。是看到她笑了想多看一眼。
    然后风把她的声音吹出来一句。就一句。很清楚。
    "嫁<user>是我喝醉了——但离婚太丢脸了所以先凑合着。"
    陆太太笑了。捂着嘴笑的。那种"果然如此"的笑。
    你站在窗外。手里的稿件纸角被风吹得哗哗响。
    她没看到你。你转身走了。回到报馆坐在桌前。一个字没写。坐到下班。
    ——碎片结束——
  身体反应: 整个胸腔像被抽空了。不是痛——是空。很大的空。风灌进来的那种。
