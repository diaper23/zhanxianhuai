---
炉鼎焚天局·事件·顾北辰弃她:
  触发条件: 认知阶段为醒悟。灵力反噬事件之后、宗门议论扩散后触发
  场景设定:
    - 顾北辰的洞府。她来送丹药——照例。但这次他的弟子在门口说"师父闭关，不见客"
    - 她等了两个时辰。他出来了——跟另一个丹修从里面一起出来。有说有笑
    - 他看到她。微微停顿。然后走过来。表情平淡得像看一个普通师妹

  事件内容:
    - 他跟她说了一段话。表面客气实则切割：
      「映霜——最近宗门里关于你的传言比较多。我闭关冲击化神的关键期……不太方便跟你走得太近。」
      顿了顿。看着远处。
      「等风波过去再说吧。你照顾好自己。」
      然后转身走了。走得像剑一样直。没回头。
    - 他用了一模一样的话——跟她对他说"好好休息"一样的温度。零度。
    - 她站在原地。风把她的衣袍吹得凌乱。身边有弟子经过好奇地看她——以前所有人见到她都低头行礼，现在开始有人用看热闹的眼神了
    - 回去的路上她走了一条最偏僻的小径。不想被人看到。到了一个无人处——蹲下来。手指抠着石头地面直到指甲裂开。没哭。就是蹲着。喘不上气

  '他的选择空间':
    - 如果他恰好在这条路上——看到了她最狼狈的样子。他可以走过去、可以转身、可以从她身边经过假装没看见
    - 如果他没看到——他会从其他渠道得知顾北辰跟柳映霜"疏远了"的消息
    - 如果他选择在这一刻给她一个反应（哪怕只是一个眼神）——那是她崩塌过程中唯一的锚点

  叙事要点:
    - 顾北辰的切割是全剧最讽刺的对称——他对她做的事跟她对他做的一模一样
    - 但她在被切割的瞬间还不会联想到他——她只是痛。纯粹的被抛弃的痛
    - 联想会在之后慢慢来——可能是当天夜里失眠时、可能是下次看到他平静的眼神时
    - 她的崩溃要写得克制——天才的自尊不允许她在任何人面前哭。所以只是蹲着。指甲抠地面。喘不上气
    - 那个新丹修是谁不重要——重要的是顾北辰已经找到了"替代品"。她曾经就是他的替代品
    - 这是镜像叙事的高潮：他→她→顾北辰→新人。链条上每个人都在利用下一个

  变量影响:
    悔恨值: +20（被抛弃的痛苦会在后续转化为对他的移情——"他当时是不是也是这种感觉"）
    执着度: +15（顾北辰不要她了→她更需要他——但这次的"需要"已经不纯粹是资源了）
    尊严值: -20（被公开冷遇+有人目睹。天才的面子碎了最大一块）
