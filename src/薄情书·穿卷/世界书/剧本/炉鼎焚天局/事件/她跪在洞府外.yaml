---
炉鼎焚天局·事件·她跪在洞府外:
  触发条件: 认知阶段为自我审视。修为倒退严重、灵力反噬加剧后触发
  场景设定:
    - 深夜。<user>的偏院外。月光冷白
    - 柳映霜跪在石阶下。白衣沾了露水。冷玉簪歪了但她没去理
    - 她已经跪了一个时辰。不是演戏——她的膝盖在发抖但没有起来的意思
    - 偏院的灯亮着。<user>在里面。门关着

  事件内容:
    - 灵力反噬加剧。她的修为从金丹巅峰跌落到金丹中期——还在继续退。经脉疼痛、失眠、灵力失控频发
    - 她不是来求爱的——是来求活的。但"活"和"<user>"已经分不开了
    - 她跪在那里时想的不是"<user>会不会开门"——是"我有什么资格让<user>开门"
    - 如果<user>开门：
      她抬头。脸色苍白。嘴唇干裂。第一句话不是道歉——是：「你的灵根……恢复了多少？」
      不是在算计。是在确认<user>活过来了。确认她没有把<user>害死。
      然后才是：「我不知道该怎么还你。但我在想办法。」
      声音很轻。像怕<user>听到又怕<user>听不到
    - 如果<user>不开门：
      她一直跪到天亮。清晨第一缕光照到她时——她站起来。膝盖已经跪麻了，站不稳。
      扶着墙走了几步。转身看了一眼关着的门。没有怨。只是走了。
      第二天、第三天——她又来了。

  '<user>的选择空间':
    - 开门——跟她面对面。可以冷淡、可以质问、可以沉默地看着她
    - 不开门——让她跪着。听着外面的声音或者假装没察觉
    - 开门说一句话然后关上——比如"你不欠我的。走吧。"或者"你欠的不是跪能还的"
    - 第二天当面问她——在有光的白天面对这件事，而不是在夜晚的情绪里

  叙事要点:
    - 这是她第一次以"低姿态"出现在<user>面前——但不要写成讨好。是一种"我无计可施了"的坦然
    - 她的跪不是"追夫手段"——是真正的无路可走。修为在退、人在衰、没有人帮她、她自己也不想再逃避
    - 那句"你的灵根恢复了多少"是全剧最关键的台词之一——因为这是她第一次关心的不是自己的修为而是<user>的
    - 月光、露水、歪掉的冷玉簪——这些细节比任何语言都更能表达她的崩塌
    - 不要写她哭——天才到最后一刻也不会哭。她的眼睛是干的。这比哭更让人难受
    - 如果<user>真的一直不开门——她的反复出现不是纠缠。是赎罪。她把自己放在了"等判决"的位置上

  变量影响:
    悔恨值: +20（跪这个动作本身就代表她彻底承认了自己的错）
    执着度: +25（已经不是"资源需求"——是不可名状的、第一次体验的、不知道该叫什么的情感）
    尊严值: -25（天才修士跪在曾经的炉鼎门前。这是她人生中最丢脸的事。但她不在乎了）
