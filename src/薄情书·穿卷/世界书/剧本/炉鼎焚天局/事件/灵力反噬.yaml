---
炉鼎焚天局·事件·灵力反噬:
  触发条件: 认知阶段为动摇或醒悟。距离上次双修超过两个月后自然触发
  场景设定:
    - 柳映霜闭关练丹时突然灵力失控——丹炉炸了。碎片划伤她的手臂
    - 她坐在满地碎片中检查自己的灵力——发现丹田里有一股"不属于自己"的灵力在排异
    - 这些灵力是从<user>身上抽取的。没有持续的双修补充和融合，它们开始与她本身的灵力冲突
    - 表现：施法不稳、灵力波动异常、严重时经脉胀痛。修为不进反退

  事件内容:
    - 她开始恐慌——不是因为疼，是因为修为在倒退
    - 查阅典籍发现：单向抽取的灵力如果长期不融合会产生排异反应。轻则修为停滞，重则走火入魔
    - 解决方案只有两个：继续双修（让灵力持续融合）或者将抽取的灵力"还回去"（但她不会这个术法）
    - 她第一次真正意识到：她的修为有多少是建立在<user>的灵力之上的——答案是至少三成
    - 这个事实击穿了她"我只是借助了一下"的自欺——不是借助。是依赖。是寄生
    - 她从闭关室出来时手臂上的伤还在流血。经过<user>偏院时——脚步犹豫了。第一次

  '<user>的选择空间':
    - 如果<user>看到她受伤——可以选择冷眼旁观、假装没看到、或出乎她意料地问一句
    - 如果<user>没看到——<user>可能从其他渠道（苏璃、宗门传言）得知她出了问题
    - 可以利用这个信息——她现在很脆弱，<user>可以趁机提条件或加速她的崩塌
    - 也可以什么都不做——让她自己面对后果

  叙事要点:
    - 灵力反噬是因果报应的物理化——她从<user>身上拿走的东西在反噬她
    - 但不要写成"天道惩恶"——写成一个简单的物理机制。偷来的东西本来就不稳定
    - 她面对这个事实时的心理变化：否认→查证→确认→恐慌→然后呢？
    - 那个"然后呢"很关键——动摇阶段的她会想"怎么解决问题"（还是功利思维）；醒悟阶段的她会想"我对<user>做了什么"
    - 她经过偏院时脚步的犹豫——是这个事件里最重要的微动作。写好这两秒比写一千字心理活动有效

  变量影响:
    悔恨值: +15（被迫面对"三成修为是偷来的"这个事实）
    执着度: +5（她需要<user>——不再只是资源需求，还有生存需求）
    尊严值: -8（天才发现自己的根基有三成是偷的——自尊碎了一角）
