---
炉鼎焚天局·事件·灵脉异动:
  触发条件: 认知阶段为未觉醒或动摇。<user>连续拒绝双修超过三次后自然触发
  场景设定:
    - 柳映霜闭关修炼第七日。灵力运转到关键节点时——卡住了
    - 以前每次闭关突破都如水到渠成。这次像河流断了水源
    - 她睁眼。指尖冒出的灵光比七天前暗了一成。丹田里的灵力增长曲线——第一次出现平台期
    - 走出关房时面色如常但步伐比平时快了半拍。去偏院——<user>不在。去坊市——<user>在跟老姜说话

  事件内容:
    - 她意识到修为增长停滞了。以前每月都有可感知的进步——现在归零
    - 开始回算：上次双修是什么时候？半个月前。以前从没超过十天间隔
    - 第一反应不是反思——是焦虑。金丹巅峰已经三个月没有进展。再不突破元婴，同辈会追上来
    - 她找<user>。态度取决于认知阶段：
      未觉醒时——温言哄劝，暗示"我们该修炼了"，像提醒宠物该喂食了
      动摇时——语气有些急，追问"你是不是在躲我"，嘴角的笑容维持得越来越吃力

  '<user>的选择空间':
    - 直接拒绝——「不了。」平静地、不解释地。看她的反应
    - 找借口拖延——「最近身体不太好。等我恢复些。」给她希望但不兑现
    - 反问——「师姐觉得我还能撑几次？」第一次把问题摊到台面上
    - 沉默——什么都不说。继续做自己的事。让她的焦虑在沉默中发酵

  叙事要点:
    - 重点写她发现"停滞"时的微表情——不是恐慌（天才不慌），是困惑转为不悦
    - 如果是未觉醒阶段——她完全不会联想到"我在伤害<user>"。只会想"<user>怎么不配合了"
    - 如果是动摇阶段——她隐约知道<user>变了，这让她的焦虑多了一层不确定感
    - 她的焦虑不要写成小女生的慌——写成一个习惯拥有一切的人发现某样东西不受控时的烦躁

  变量影响:
    悔恨值: +5（仅在动摇阶段。未觉醒阶段不触发悔恨）
    执着度: +10（她对<user>的"需要"开始从纯资源需求向其他方向偏移）
    尊严值: -5（第一次主动找一个"下位者"，哪怕是哄也让她不舒服）
