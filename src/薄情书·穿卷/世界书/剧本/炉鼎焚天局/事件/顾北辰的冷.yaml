---
炉鼎焚天局·事件·顾北辰的冷:
  触发条件: 认知阶段为未觉醒或动摇。灵脉异动事件触发后自然衔接
  场景设定:
    - 柳映霜修为停滞后去找顾北辰——她需要确认还有人需要她、认可她
    - 地点：顾北辰的剑修洞府外。她带了新炼的丹药。精心打扮过——冷玉簪换成了他曾夸过的那支
    - 时间：傍晚。山顶的风把她的衣袍吹得很好看。她知道这个角度她最好看

  事件内容:
    - 她在洞府外等了一炷香。他出来了。看到她微微点头——「映霜。」没有多余的话
    - 她递丹药。他接了。看都没多看——「嗯，辛苦了。最近忙闭关。」
    - 她试着多待一会。提起宗门最近的事、问他闭关进展。他回答简短、目光时不时看向别处
    - 然后——有别的女修过来找他请教剑法。他对那个女修露出了比对柳映霜更多的耐心
    - 柳映霜攥紧了手里的空药瓶。微笑着说"不打扰师兄了"转身走
    - 回去的路上经过他的偏院。灯亮着。她停了两秒——然后继续走回自己洞府
    - 关门那一刻她摔了一只茶杯。然后蹲下来捡。指尖被碎瓷划出一道口子

  '他的选择空间':
    - 如果他恰好在路上碰到她——可以看到她回来时不正常的走路速度和微红的眼眶
    - 如果他在偏院里——可以听到她经过时步子的停顿和继续
    - 可以选择假装没注意、主动问一句、或者彻底无视

  叙事要点:
    - 顾北辰的"冷"不是恶意——是他本来就那样。他对所有人都保持"恰到好处"的温度
    - 但这个温度在柳映霜修为出问题后明显降了一档——他在观望。有用的盟友和没用的盟友待遇不同
    - 这是她第一次尝到"被需要的人不再需要你"的滋味——但她还不会联系到自己对他做的事
    - 她回来时经过他偏院的那个停顿——不是温柔。是空虚需要填补时的本能反应

  变量影响:
    悔恨值: +3（极少量。她还在怪顾北辰而不是反思自己）
    执着度: +8（被真爱冷遇后对他的"需要"加深——但这种需要仍是自私的）
    尊严值: -10（被人当面忽视。她在这方面极其敏感）
