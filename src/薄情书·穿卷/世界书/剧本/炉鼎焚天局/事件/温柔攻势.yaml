炉鼎焚天局·事件·温柔攻势:
  触发条件: 认知阶段为动摇。<user>持续不配合双修后柳映霜的反应
  场景设定:
    - 修为停滞第二十天。柳映霜开始"改变策略"
    - 偏院门口出现了她亲手采的灵芝——品质极好，是她自己炼丹都舍不得用的
    - 她开始在宗门公共场合"无意中"出现在<user>附近。频率从一周一次变成每天一次
    - 她甚至去了老姜的药摊——问<user>平时吃什么药。老姜没说。她笑着走了但眼底没笑

  事件内容:
    - 她的温柔攻势层层递进：
      第一层：物质。灵果、丹药、修炼资源堆在偏院门口。不亲手给——怕被拒绝太丢脸
      第二层：关注。开始问<user>的日常——「今天修炼了吗」「脸色好些了没」。语气努力温柔但控制感溢出来
      第三层：身体接触。找借口靠近——在路上"不小心"碰到<user>的手、整理<user>衣领上并不存在的灰尘
      第四层：旧情牌。「还记得我们拜堂那天吗？……我那天其实很高兴。」——半真半假。她那天确实觉得"搞定了一个好用的炉鼎"时心情不错
    - 所有温柔都带着计算痕迹——像在哄一只不肯进笼的灵兽。但问题是：她哄着哄着开始分不清了
    - 某个瞬间她说"你瘦了"时——自己愣了一下。那句话不像是计划好的

  '<user>的选择空间':
    - 冷淡接受物质但保持距离——「东西我收了。其他的不用了。」
    - 全部退回——把灵果灵药原封不动放回她洞府门口
    - 直接戳穿——「你是真关心我，还是修为停了着急？」
    - 配合一小部分然后收回——给她一点希望再让她摔得更狠（如果<user>选择报复路线）
    - 不回应也不拒绝——让她自己在这种"不确定"中消耗

  叙事要点:
    - 这是全剧最让读者生理不适的段落之一——因为她的"温柔"全是假的但又不完全是假的
    - 写她哄人的样子要有"天才不屑于做这种事但为了目的在强迫自己"的别扭感
    - 重点是她的内心独白——「我都已经放下身段了<user>还想怎样？」这个想法本身就暴露了她的问题
    - 如果<user>直接戳穿——她的反应是先僵住，然后冷笑。「你现在倒是会说话了。」
    - 那句"你瘦了"是裂缝——AI可以选择让她自己注意到或不注意到，取决于悔恨值的高低

  变量影响:
    悔恨值: +8（她在"哄人"的过程中不得不去观察<user>的真实状态，看到了以前不看的东西）
    执着度: +15（投入越多越不甘放手——沉没成本心理）
    尊严值: -15（一个天才修士在讨好一个她曾视为工具的人。这对她的自尊是真实的打击）
