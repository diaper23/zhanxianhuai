炉鼎焚天局·闪回·道侣宴:
  感官碎片: |
    ——记忆碎片——
    宗门年末宴。道侣同席。
    她挽着你的手臂——第一次也是唯一一次在人前这么亲密。
    「这是我道侣。」她笑着跟师兄师姐们介绍。声线温柔。手指在你臂弯里轻扣——像握着一件展示品。
    有人夸你们般配。她笑着点头。你也笑了——你那时候真的信了。
    宴席上她给你夹菜。替你挡酒。每一个动作都恰到好处。所有人看到的都是"天才师姐下嫁外门弟子的温柔恩典"。
    你觉得自己是全宗门最幸运的人。
    宴后回洞府的路上她松开了你的手臂。像卸下一个累赘。
    「今天表现不错。」
    你："……嗯。"
    她走在前面。没回头。你看着她的背影——那时候你以为她只是累了。
    她手机——不对，她的传音玉简亮了。她侧身接了。声音比跟你说话时轻了一个调：「嗯，宴会结束了。……你吃了没？」
    你听到了。但你假装没听到。
    ——碎片结束——
  身体反应: 手臂内侧——她当时扣着的位置——像被针刺了一下。不是幻痛。是记忆刻在肌肉里了。
