炉鼎焚天局·闪回·她转身笑:
  感官碎片: |
    ——记忆碎片——
    你刚被搬回偏院。浑身冷汗。天花板在晃。
    隔着院墙你听到她的声音——跟顾北辰说话。那种语调你从来没听她对你用过——轻快的、带笑的、像少女。
    「今天进展不错。」她说。
    「又突破了？」顾北辰的声音。淡淡的。
    「嗯——」她笑了。很轻。像完成了一项值得炫耀的成就。
    「多亏了那个好方法。」
    你不知道"那个好方法"是什么。但你的身体知道。每一条经脉都在告诉你答案。
    你闭上眼。天花板不晃了。因为什么都不重要了。
    ——碎片结束——
  身体反应: 胸口像被冰锥刺入。不疼——是那种过了疼痛阈值后的麻木。手指攥紧了被角但攥不住——没有力气。
