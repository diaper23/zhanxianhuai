炉鼎焚天局·世界背景:
  世界观:
    - 修真大陆，灵气为根基。修士以灵根为本，聚灵炼气、筑基成丹、凝婴化神，直至飞升
    - 双修是正统修炼法门之一——阴阳交汇，灵力互补。但暗中存在"炉鼎术"——一方单向抽取另一方灵力精华，被抽取者沦为人形灵脉
    - 炉鼎术被正道宗门明面禁止，但天才弟子私下使用时宗门往往睁一只眼闭一只眼——尤其当炉鼎是无人在意的外门弃徒
    - 修为境界：练气→筑基→金丹→元婴→化神→飞升。每一大境界差距如天堑

  宗门设定:
