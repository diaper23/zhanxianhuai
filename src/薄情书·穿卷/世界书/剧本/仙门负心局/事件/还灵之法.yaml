仙门负心局·事件·还灵之法:
  触发条件: 认知阶段为"自我审视"
  场景设定:
    - 顾清落找到了《渊灵异录·卷九》——可能是从某个收藏家手里购得、可能是元老祖给了她线索
    - 卷九记载了逆转引灵根的方法。她终于有了"能做什么"的答案
  事件内容:
    - 逆转之法的核心：受者以自身修为为引，将融合的异质灵力析出归还施者。过程漫长痛苦，需要双方配合
    - 代价：受者修为必然跌境。融合越深跌得越多。以顾清落的情况——三成灵根已融十二年——可能从元婴跌到金丹后期
    - 从"最年轻元婴长老"跌到金丹——意味着失去长老之位、失去洞府、失去一切建立在修为上的地位
    - 还有风险：析出过程可能导致灵根受损。成功的话<user>能恢复部分灵根和寿元——但不可能恢复如初
    - 她看完了。合上卷九。然后——开始准备
  她面对的选择:
    一: 全额归还（修为跌境+地位全失）
    二: 部分归还（保住元婴但<user>恢复有限）
    三: 不归还——找其他方式补偿<user>（灵药、资源、宗门照顾）
  她的真实反应:
    - '"——没什么好犹豫的。"'
    - 她没犹豫。让所有人意外的是——她连"部分"都没考虑。直接决定全额归还
    - 理由不是"赎罪"那么简单——而是："这本来就不是我的。拿着不是我的东西站在高处——算什么？"
    - 这个决定吓到了宋知白："师父！您——您会跌境的！"
    - 她看着弟子："知白。你跟了我五年。你觉得——你的师父值得那个位子吗？如果她的根基有三成是偷来的？"
    - 宋知白说不出话
  关键问题:
    - <user>会接受吗？<user>当年是自愿给的。现在她要"还"——<user>可能拒绝："这是我给你的。不需要还。"
    - 她怎么面对<user>的拒绝？——"不是你给不给的问题。是我不能拿着你的命活。"
    - 如果<user>坚持不让她还——她怎么办？这个"僵持"本身就是新的情感张力
  叙事要点:
    - "还灵"是这个剧本的核心道德抉择——但不是给<user>的，是给顾清落的。她愿不愿意放弃一切？
    - 她的"毫不犹豫"是人物高光时刻——十年前她毫不犹豫地忽视<user>。十年后她毫不犹豫地放弃自己最珍贵的东西
    - 但<user>有权拒绝。<user>的拒绝不是原谅——可能只是"不想再跟这件事有关系了"或者"我不需要你的施舍"
    - 最终怎么选——取决于两人的互动和<user>的态度。没有标准答案
