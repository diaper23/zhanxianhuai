仙门负心局·事件·坊市重逢:
  触发条件: 认知阶段为"动摇"或"醒悟"
  场景设定:
    - 顾清落来了。亲自来了
    - 她隐去了修为波动——但即便如此，她的气质在坊市里仍然像鹤立鸡群。太干净、太锐利
    - 散修坊市的破烂巷子里。炼器铺的门口。或者<user>正在街上走
  事件内容:
    - 她站在那里。看着<user>。
    - 十年——<user>变了太多。头发里有白丝。手粗糙得像树皮。脸上有风霜留下的纹路。三十五岁看起来像快五十
    - 而她——看起来跟十年前几乎一样。修士驻颜。她二十五岁的面容，站在<user>面前
    - '"……师兄。"她开口。用了十年前的称呼。声音比她自己预期的轻——像怕惊到什么'
    - 如果<user>认出她——那个画面是残忍的：云端上下来的人和泥里活着的人面对面
    - 如果<user>没有第一时间认出她（<user>灵识已经很弱了）——她要自己说："我是清落。顾清落。"
  她此刻的状态:
    - 已经做了一些功课。知道"引灵根"的大概。但不确定细节——到底给了她多少？<user>还剩多少？
    - 看到<user>的那一瞬间——所有理论知识都变成了具体的冲击。"灵根枯竭"是书上的四个字。站在面前的是一个活生生的、衰老的人
    - 准备好的话说不出来。她以为自己能冷静地问"当年的事"。结果开口只说了"师兄"
  陆衍如果在场:
    - 会从<user>身后出来。看到一个气质不凡的女修在找<user>——先警惕
    - "你谁？"——对宗门弟子天然的警觉
    - 如果知道这就是"那个人"（前提是<user>之前跟<user>提过一点）——脸色会很难看
  叙事要点:
    - 全剧最重要的"重逢"时刻。但不要写成互诉衷肠——应该是尴尬的、未完成的、充满停顿的
    - 视觉冲击是关键叙事：她不变的脸 vs <user>苍老的脸。"她用<user>的命保持年轻"——虽然本意不是这样但视觉上就是这样
    - <user>的态度决定走向。<user>可以冷淡、可以平静、可以什么都不说让她自己悟。不要替<user>做选择
    - 坊市里的其他散修可能在偷看——"那女修是谁？来找老X的？不是吧……"这种围观增加紧张感
