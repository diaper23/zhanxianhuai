---
仙门负心局·事件·典籍线索:
  触发条件: 认知阶段为"动摇"
  场景设定:
    - 天璇宗藏经阁深处。只有长老级才能进入的禁区
    - 顾清落在这里找了三天了。翻遍了灵根异变、体质特殊、修为赠予相关的所有古籍
  事件内容:
    - 终于在一本落满灰尘的杂录里找到了——《渊灵异录·卷七》
    - '"引灵根者，天生异禀。其灵根之力可缓渡于亲近之人。受者灵根增益、修为精进如神助；施者灵根渐枯、寿元折损、修途断绝。"'
    - '"引灵根之渡，需肌肤相近或灵力相交。时日越久、渡出越多。施者往往不言不语，甘愿至死。"'
    - '"辨识之法：受者灵根中可探得异质灵力残留。年深日久渐融，百年后不可分辨。"'
    - 最后一行小字：'"逆转之法见卷九。代价极大。"——卷九所在的位置是空的。被人取走了或遗失了'
  她的反应:
    表面: |
      拿着书的手指在发白。指尖陷进书页里。
      站在那里不知道多久。藏经阁管事的弟子来问"长老可还要灯油？"她才回过神——"不必。"
      合上书。放回原位。走出藏经阁时步子很稳——但走法不对。像在刻意控制
    内心: |
      "肌肤相近或灵力相交。"——<user>每次护法时坐得那么近。她以为<user>只是——
      "时日越久、渡出越多。"——三年。整整三年。
      "施者灵根渐枯、修途断绝……"
      ……<user>现在是什么样子？
      她不知道。她十年没想起过<user>。甚至不确定<user>是不是还活着。
      "甘愿至死。"——甘愿。<user>是甘愿的。所以从来没说。
    后续:
      - 当天没回洞府。去了外门旧址——山脚下的石阶。长满苔藓。十年前他们在这里排队
      - 在那里站了很久。天黑了才回去。宋知白在洞府门口等她——"师父去哪了？"她说"散步"
      - 那天夜里没有打坐。坐在蒲团上。眼睛睁着。到天亮
  叙事要点:
    - 典籍的文字要冷静客观——像学术描述。这种冷静跟她的内心崩塌形成反差
    - "甘愿至死"四个字是核弹。<user>从来没告诉她——因为说了她会拒绝。而<user>的"甘愿"不需要她知道
    - 卷九的缺失是伏笔——逆转之法存在但她现在拿不到。这给后面"还灵之法"事件留口
    - 她去外门旧址不是矫情——是需要"回到原点"。站在他们曾经共存的地方，试图理解那三年到底发生了什么
