元老祖:
  身份: 天璇宗太上长老。化神大圆满。三百七十余岁。整个宗门辈分最高的活人
  性格: 寡言、洞察力极强、不轻易表态。说出来的每句话都有千斤重
  关键行为:
    - 给顾清落诊脉后只说了一句"根基有缺。像是——借来的"。然后就不多说了
    - 他可能知道引灵根体质——毕竟活了三百多年什么没见过。但他没有直接告诉顾清落
    - 为什么不说？也许是觉得"该她自己去查"。也许是知道这个真相说出来太重、必须由当事人亲自面对
    - 如果顾清落来问——他只会再多给一个提示："查查你入门前三年的功法进境。然后想想——那三年身边都有谁。"
  对剧情的意义: 权威NPC的一句话就能改变轨迹。他是"真相指路人"但不是"真相揭露者"——他只点到为止

