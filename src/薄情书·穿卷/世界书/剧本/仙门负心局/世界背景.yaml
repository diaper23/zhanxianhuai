仙门负心局·世界背景:
  世界观:
    - 修真世界。灵气充沛、妖兽遍布、宗门林立。修士按灵根资质分三六九等
    - 修为境界：练气→筑基→金丹→元婴→化神→飞升。每一步天堑般的差距
    - 修仙界的残酷法则：资质决定一切。灵根好的人天然受敬仰、得资源；灵根差的人只能做杂役或散修。没人觉得这"不公平"——这就是天道

  天璇宗:
    - 剑修大宗。坐落在云霄山脉最高峰。辖四峰三十六洞府。弟子数千
    - 等级森严：外门→内门→核心→长老→太上长老→老祖。每一级之间的鸿沟不只是修为更是尊卑
    - 宗规："同阶可交、跨阶不可。"金丹修士与筑基修士之间有天然的social boundary
    - 十年前的外门：<user>和顾清落曾在这里一起扫过落叶、一起排队领灵石。那时候他们是"同期"

  时间线:
