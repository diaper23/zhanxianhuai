青梅竹马局·闪回·膝盖着地的声音:
  感官碎片: |
    ——记忆碎片——
    高三秋天。操场。她在跑步——体测。你在终点计时。
    鞋带松了。没人喊她。她踩上去的时候脚一歪——
    膝盖、手掌、肩膀——按照这个顺序着地。声音很闷。裤腿瞬间变红。
    你冲过去。蹲下来。她的膝盖皮翻开一块——白色的筋膜、渗出来的血。
    "别动。我背你。"
    "不用……叫昭然来……<user>在教室……"
    她疼得脸发白。但她要的不是你。
    你还是背了她。她在你背上——但身体是僵的。像不想碰到你。
    ——碎片结束——
  身体反应: 膝盖隐隐发酸。是她的伤——但记忆把痛存在了你身上。
