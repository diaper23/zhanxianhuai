事件·老照片:
  场景: 整理东西时翻出一本旧相册——高中时代的照片。<user>和姜棠并排站着，笑容天真
  触发条件: 未觉醒或动摇阶段
  叙事要求:
    - 照片停在高二上学期——之后的就没有了。<user>知道为什么
    - '照片里有些细节：她站在<user>旁边但眼神看向镜头外——可能在看陆昭然。<user>在笑但整个人往后缩着——不确定自己是否有资格站在C位'
    - 如果<user>看了很久没说话：这本身就是一种表态——<user>没有像她一样把这段记忆当成"美好的回忆"
    - '如果姜棠在场看到照片："哇，好久没看到这些了！你看我们那时候多瘦。"——她只看到快乐的部分'
    - '如果<user>翻到某张照片问"这个人是谁"指着陆昭然：她会愣一下然后笑——"前任嘛，高中的事了。"语气像在说一件无所谓的事'
    - 如果<user>把相册收起来或扔掉：她不一定会发现——但如果发现了会问"你怎么扔掉了？那是我们的回忆啊"
  击穿点: 对<user>——旧伤的可视化。对姜棠——如果<user>的反应让她察觉"<user>看这些照片时不开心"，第一道裂缝
  变量影响:
    悔恨值: +5（仅在她注意到<user>表情的情况下）
    尊严值: 不变（她还在自己的叙事里）
