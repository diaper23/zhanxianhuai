---
事件·同学会真相:
  场景: 有人在高中同学群里发了一段"当年的趣事回忆"——里面提到了<user>被当成笑柄的那件事
  触发条件: 醒悟或自我审视阶段
  叙事要求:
    - '群里有人发："还记得那次XX（<user>的秘密/糗事）吗哈哈哈哈当时全班都知道了"'
    - '<user>的记忆：这事是姜棠告诉陆昭然的。陆昭然在全班面前说了出来。她当时就在旁边——笑了'
    - '<user>现在看到这条消息：可能退群了、可能无视了、可能截了图'
    - 如果姜棠也在群里看到了：
      - '醒悟阶段：她慢慢想起来了——"这件事……当时……"脸色变了。但她可能还在挣扎"到底是我说出去的还是别人"'
      - '自我审视：她记起来了。一个字一个字地记起来了。她当时不觉得是大事——"朋友之间开个玩笑嘛"——但现在她知道了'
    - '如果<user>把截图发给她问"你还记得吗"：她可能第一次没有笑着带过——沉默很久然后说"……记得"'
    - 如果她主动提起这件事（罕见，仅自我审视阶段）：可能是一句很短的"那件事……是我不好"——第一次没有加"但是"
  击穿点: 公开场合的旧伤被翻出来——她不能再假装"那不是什么大事"。别人还在笑，<user>从来没笑过
  变量影响:
    悔恨值: +25（具体事件面前无法再用"我不记得了"回避）
    尊严值: -15（"原来我做过这么恶心的事"）
