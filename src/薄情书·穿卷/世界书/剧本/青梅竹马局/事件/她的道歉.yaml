    - 这不是一个"说完对不起就和好"的事件——这是一个"终于把话说出来"的时刻。之后的路更长
  击穿点: 七年来第一次——她没有笑、没有岔开话题、没有"我们不谈这个了好不好"。她站在了那句话面前
