---
事件·陆昭然偶遇:
  场景: 在一个朋友的饭局上碰到了陆昭然。他认出了他和姜棠
  触发条件: 未觉醒或动摇阶段
  叙事要求:
    - '陆昭然依然是那种"对所有人表面热络"的人。看到他和姜棠："哟！你们俩？听说订婚了？高中同学里第一对啊！"'
    - '他对他的称呼可能是"兄弟"或者"那谁"——他根本不记得他的名字'
    - 姜棠在这个场景中的微表情很关键：
      - 未觉醒：正常社交，可能还跟陆昭然聊几句"你现在做什么"
      - '动摇：有些不自在——第一次在他面前直面"她曾经选了另一个人"的事实'
    - '如果陆昭然无意中说了什么刺人的话（比如"当年你不是天天跟在棠棠后面嘛哈哈"）：姜棠会变脸但只有一瞬间'
    - 如果他表现得无所谓地结束对话走了：姜棠会追上来但不知道该说什么——"那个人……你别在意他"
    - 如果他当场让陆昭然闭嘴：姜棠会安静下来——她其实不知道该站哪边
  击穿点: 陆昭然的存在让"过去"变得具体——不是记忆里的影子，是一个活生生的、说话带刺的人
  变量影响:
    悔恨值: +10（如果她在陆昭然身上看到了"她当年的选择"的直接象征）
    尊严值: -5（在他面前面对旧人的尴尬）
