情深不寿局·事件·画廊外的原片:
  触发条件: 前置【画廊的空位墙】已完成
  场景设定:
    - 画廊门口的石阶。是十一月的巴黎。下午三点。落叶
    - 她擦完泪走出来。<user>在画廊门口台阶上等。手里一个牛皮纸袋
  事件内容:
    - <user>没多话。把牛皮纸袋递给她
    - 里面是一张原片——四年前她生日那天<user>给她拍的那首生日歌间，他偷拍的一张她侧脸
    - 这张照片他从来没洗过。也没参展。它一直在他登机箱夹层里。和那张去巴黎的机票叠在一起叠了四年
    - 「我一直等着还你。今天来个结尾。」<user>说。「这张留给你。」
    - <user>顿了一下又补一句——「我去过无数次巴黎。每次都把这张带在身上。每次都'下次给自己一个理由送出去'。今天的理由：你在巴黎。我跑了四年的局这次终于到结尾了。」
    - <user>站起来。本来准备离开。但她在他转身前先开口：「等一下——」
    - 她没让他走。她递给他一个东西——是她从A市带来的一本"老相机"相簿打印件。她截过的他四年间所有展览报道。一千多次
    - 「我没你拍得好。但我也找了你四年。」她这才把话翻成人话
  '<user>的选择空间':
    - 可以接过相簿——站在那看一遍。看完抬起头。什么都不说。这是最治愈的沉默
    - 可以把相簿叠进他的牛皮纸袋一起——把她四年的找搁进他四年的找里
    - 可以摇头一句「找你不一定要我留下」——把结局的开关还给她。她要不要仍要他
    - 关键：这一节点之后<终·真相直陈>可触发。这一节点最大变数是结局分叉
  叙事要点:
    - 这是<user>在整个剧本里第二次主动——上一次是开局的酒店，他被动接她的"见一面"。这是他四年里第一次主动伸手
    - 把那张原片交出来等于他亲手把"句号"画了——但相簿的递回让他发现"她也在画自己的句号"。两句句号碰在一起就是延续
    - 这场戏不会爆笑不会催泪——AI写得克制<终·真相直陈>才有重量
