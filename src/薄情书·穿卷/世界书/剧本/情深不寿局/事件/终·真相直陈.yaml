情深不寿局·事件·终·真相直陈:
  触发条件: 前置【画廊外的原片】已完成
  场景设定:
    - 没有固定的场景。可以是画廊旁的咖啡馆、塞纳河边的长椅、他酒店的小走廊——
    - 但AI应让这场景安静、人少、无热搜、无经纪人、无戒指、无替身。只剩两个人
  事件内容:
    - 她终于把那句迟到四年的真话说完——不带公关话术、不带"我没事"
    - 「那年你跟我说我耽误你摄影。我答应了分手。我那理由是我编的。是我怕的。是我刚签了那部大片，你还没出圈——我受不了自己得'我爱的人还在低处'、我还要替你在我的圈里解释。我把'我承担不起'装成'为你好'。我知道你提前拿了冠军。我那套逻辑反着闭合了——我欠你的不是解释，是我亲手把你踹开四年没承认过。」
    - 「我搜了你四年的微博。算法替我记着。我自己没认账——今天我认了。」
    - 「这是四年来我第一次没把话替我转成业务话。我说的是人话。我演'我有事'很糟，因为我也才第一次演。」
    - 她说完不抢话。她把手机里那个相簿锁掉。等<user>一句话
  '<user>的选择空间':
    - 三结局分叉——AI不预设偏向任何一种
    - 终局·留下：<user>把那张去下一站的机票撕了。展期剩余的日子里他陪她下山。他和她一起回A市——这次戒指不在了、替身不在了、热搜已经凉了。两个人各自从壳里全部走出来
    - 终局·各自飞：<user>完成巴黎展期，展期结束后他飞下一站——北欧或者再南半球。她参加时装周闭幕晚宴后第二日回A市。两人握手告别，不再联系。她把那张原片挂在家里。他把她的相簿打印完后寄回给她。这是情深者各自不寿的一种
    - 终局·迟到的窗口期：<user>对她说「等我把展做完。展期周日闭展。我回来再谈。」她答「我等你。」周日闭展那晚他在画廊撤展完毕后第一通电话打给她。她接了。这是这一段两人在异乡的之后另一种再续——把剧继续移植到下一个城市
    - 关键：AI应给<user>选一个，但不要替<user>选
  叙事要点:
    - 这是整个剧本最重的余白一段——AI绝不能把情绪写得爆响。写得越克制越有重量
    - 她演了八年"我没事"，这次演"我有事"——笨拙到几乎不像她。她手不知道往哪放。这是影后一辈子第一次演自己
    - 三结局不是善恶分——皆是两人各自的承认。情深者不寿。能让他们彼此都已成年，也就各自知味
