    - 周慎把眼镜摘下来擦了一下：「您知道这意味着什么——明天早上热搜会回到您头上。第二条会比第一条更凶。」
    - 她说：「不发了。我跟他是<有过>关系。我承认。」
    - 周慎第一次没说话。他把那份稿子收回去，撕成两半。再一段一段放回了自己的抽屉。替她撕过了的那一份他没多看
    - 「行。」周慎说。「林惊晚——您想清楚。我不再替您演这件事。」他把眼镜擦完又戴上
    - 这是她出门那天。她回一次头，没说什么。「再替您演的比您演自己的还多」这句之后她出门
