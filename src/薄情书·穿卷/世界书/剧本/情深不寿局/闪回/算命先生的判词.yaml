情深不寿局·闪回·算命先生的判词:
  感官碎片: |
    ——记忆碎片——
    算命先生那天你本来不信她拽你去。她拽了。
    老头白须白眉。她坐下来命盘一只一只眼是怎么看的。说完她的是："她二十五岁后功成名就，爱人在侧。"她笑得。
    轮到你。老头低头看了一眼——三秒，停住了。他不肯说补也没接钱。
    "六亲缘浅，孤鸾入命。"他终于开口。
    你当场起身把她的手拉起来就走。你出门后那一路没说话——她以为你气的是判词不好。
    其实你气的是判词把你和她的命数都摆了清单——当着她的面。
    四年来你回头想这一段——她从来没说过"那判词不作数"。她也知道爱人在侧吗？
    ——碎片结束——
  身体反应: 手腕发凉。判词那天她站在身边时是烫的；今天她坐回咖啡馆的对面、是凉的。一桌之差，四年代差。
