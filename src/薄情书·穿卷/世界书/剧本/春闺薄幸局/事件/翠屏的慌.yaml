春闺薄幸局·事件·翠屏的慌:
  触发条件: 认知阶段为"未觉醒"或"动摇"
  场景设定:
    - 午后。县衙偏厅。翠屏受沈令怡之命来给<user>送换季衣裳（其实是来探虚实——<user>最近在忙什么）
    - 她到的时候<user>不在——在外面巡查水渠工地。她被师爷请到偏厅等
    - 等的时候她看到了桌上的公文——不经意间扫到了一行字
  事件内容:
    - 那行字：<user>在查城东某处产业的归属——那正好是沈玉衡的别院所在的地段
    - 翠屏不识太多字但"城东"、"沈"、"别院"几个她认得。手心一下出了汗
    - 她想拿起来仔细看——但师爷还在旁边。只能假装不经意
    - '<user>回来了。看到翠屏——表情平淡。"翠屏姑娘。夫人有事？"'
    - 翠屏递了衣裳。嘴上说着例行话。但眼神忍不住往那沓公文上飘——<user>注意到了
    - '<user>什么都没说。只是把公文翻了个面。动作自然——像顺手。但翠屏知道<user>看到了她的眼神'
    - 回去的路上翠屏心里七上八下——"<user>是不是在查沈公子？<user>知道了多少？"
    - 她没有立刻告诉沈令怡。犹豫了。这是她第一次——没有第一时间跟主子说
  <user>的选择空间:
    - 可以什么都不问——让翠屏自己慌。沉默比追问更有压迫感
    - 可以轻描淡写提一句"城东那片地最近不太平"——试探翠屏的反应
    - 可以正式地查沈玉衡的底细（让师爷去打听）
    - 关键：不揭穿。但让对方知道"我不是瞎子"
  叙事要点:
    - 翠屏是沈令怡的眼线——但她此刻第一次对主子有了隐瞒。这个裂缝很重要
    - '<user>翻公文的那个动作——不是藏。是"我让你看到了一点，又收回了"。掌控感'
    - 翠屏的害怕不是怕<user>——是怕"如果<user>知道了一切，小姐怎么办"。她的忠诚还在沈令怡这边但开始动摇
    - 这个事件是"信息权"的转移——<user>开始掌握主动了
  变量影响:
    悔恨值: +3
    执着度: +5
    尊严值: -3
