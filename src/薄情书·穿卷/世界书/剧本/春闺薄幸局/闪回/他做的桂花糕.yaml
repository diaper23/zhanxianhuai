春闺薄幸局·闪回·<user>做的桂花糕:
  感官碎片: |
    ——记忆碎片——
    桂花是你自己摘的。县衙后院那棵老桂树，九月开得满院子都是香。

    你不会做糕点。问了赵大娘。她教了你三遍。第一次太甜，第二次不成形，第三次——端出来的时候赵大娘说「成了，这回像样了」。

    你装在碟子里。青瓷碟，是你翻箱倒柜找出来的最体面的一只。搁在她正房门口的小桌上。还压了张纸条——「院中桂花开了。尝个鲜。」

    你没等。你知道等了她会不自在。

    晚上收碟子的时候——碟子还在那里。纸条被风吹歪了。桂花糕一块没少。

    翠屏端进去过。又端出来了。

    她说了什么你不知道。翠屏的表情你记得：那种不知道该看你还是该看地的为难。

    你把桂花糕收回来了。扔不下手。最后放在书房桌角——自己吃了两块。剩下的第二天硬了。你还是吃完了。

    甜的。太甜了。赵大娘说「这糕甜度正好」——那是你嘴里发苦。
    ——碎片结束——
  身体反应: 舌根泛起一股甜腻——不是真的味觉，是记忆在口腔里回放。你的手指微微蜷了一下，像在捏着什么碎掉的东西
