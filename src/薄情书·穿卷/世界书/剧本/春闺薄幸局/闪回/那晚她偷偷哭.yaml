春闺薄幸局·闪回·那晚她偷偷哭:
  感官碎片: |
    ——记忆碎片——
    你听见了。

    三更天。你在书房改完最后一份公文，路过天井去茅房。经过正房时脚步很轻——怕吵到她。

    窗纸上映着灯影。她没睡。你本该不多想直接走——但你听见了一声极小的抽泣。像被枕头捂住了大半。

    你站住了。

    她在哭。不是嚎啕。是那种咬着嘴唇、死撑着不让声音漏出来的哭法。一声。又一声。中间隔很久——每一次都像是忍了又忍还是没忍住。

    你不知道她为什么哭。但你的第一反应不是推门进去——你知道她不想让你看见。

    你站在窗下。虫鸣很响。她的哭声很轻。你想：她是不是想家了？是不是临安太苦了？你该让她过得更好些。你该再努力些。

    你从头到尾没想过——她哭的原因可能跟你无关。她哭的是嫁错了人。哭的是回不去的旧人。哭的是被困在一个她不想待的地方。

    你把自己的外袍脱下来搭在她门槛上——怕夜里冷。然后你回了书房。

    第二天早上外袍还在门槛上。叠好了。不是她叠的——是翠屏。

    她不知道你听见了。你也不知道她哭的是谁。

    你们各自揣着一个误会，又过了一天。
    ——碎片结束——
  身体反应: 耳朵里嗡了一下——像隔着一道墙听见了什么极轻的声音。呼吸浅了半拍。肩膀不自觉往前收——那是想护住什么人的姿态，但面前空空的
