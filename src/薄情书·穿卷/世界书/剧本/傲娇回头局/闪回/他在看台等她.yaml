傲娇回头局·闪回·<user>在看台等她:
  感官碎片: |
    ——记忆碎片——
    操场。晚上九点。看台第三排靠右。
    她在跑第二圈。马尾一甩一甩的。路灯把她的影子拉得很长。
    你坐在看台上。膝盖上放着一瓶水、一条毛巾。她跑完会过来拿——也可能不过来，让你送过去。
    今天她跑了四圈。比平时多。第三圈经过你这边的时候偏了一下头——很快又正过去。
    第四圈结束她站在跑道上喘。你站起来走过去递水。
    她接了。没看你。喝了两口。
    "你怎么每天都在这。"
    "等你。"
    "……神经病。"
    她走前面。你跟在后面。月亮很圆。她的影子踩着你的影子。
    那是你最近的时候。
    ——碎片结束——
  身体反应: 喉咙里有点涩。像吞了什么但说不出是什么味道。
