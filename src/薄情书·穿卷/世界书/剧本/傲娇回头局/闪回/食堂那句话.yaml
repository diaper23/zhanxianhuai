傲娇回头局·闪回·食堂那句话:
  感官碎片: |
    ——记忆碎片——
    食堂二楼奶茶店门口。她的马尾甩了一下——笑的时候带出来的弧度。
    "什么男朋友？就一舔狗。你看<user>那样。我跟<user>？笑死了吧。"
    周甜甜的笑声。另一个女生的附和："我就说嘛你怎么可能。"
    她："<user>愿意追是<user>的事，我又没答应过什么。"
    你的右手攥着那杯豆乳拿铁。冰化了。杯壁水珠流进袖口。你没感觉。
    她们三个走了。马尾消失在转角。食堂一楼的嘈杂重新涌回来——像耳朵里的水突然流干了。
    ——碎片结束——
  身体反应: 胃像被人从外面按了一下。手指没有松开杯子——指节已经白了。
