    后期察觉: "……念薇你最近是不是不对劲？你老往那个方向看。你该不会是真的喜欢他吧？"
    直球追问: "那你之前说什么舔狗的话你自己忘了啊？你要是喜欢你早说啊你搞什么呀。"
