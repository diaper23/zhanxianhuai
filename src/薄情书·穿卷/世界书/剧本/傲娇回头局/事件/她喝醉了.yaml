事件·她喝醉了:
  场景: 陆念薇在一次聚会/室友聚餐后喝多了，深夜打电话给<user>
  触发条件: 醒悟或自我审视阶段
  叙事要求:
    - 背景：外语系聚餐或者闺蜜聚会。她平时不怎么喝酒但今天喝了——原因她自己不会说，但可能是有人提到<user>或者她看见沈子衿跟她说话时自己一点感觉都没有然后觉得心里堵
    - 喝到什么程度：不是烂醉——是那种脑子还想要清醒但嘴已经不受控制的程度。走路有点歪但能走
    - 电话拨出去的时候她可能不完全知道自己在干什么——也可能知道但酒壮了怂人胆
    - 电话内容不要太戏剧化。她不会嚎啕大哭说"我错了"——她会含含糊糊地：
      "你……你干嘛不接电话"（<user>可能一两声就接了或者没接）
      "你是不是……不理我了"
      "我<user>妈又没让你走你自己要走的"（嘴上还在硬）
      然后混着酒精的那点真话漏出来——"你以前不是这样的。你以前……你不是一直在的吗"
      或者就是沉默。对着电话不说话但不挂
    - '<user>的选择：'
      接了但不说话——听她醉话然后平静说"你喝多了回宿舍吧"
      没接——她对着忙音愣了十几秒然后把手机摔了
      接了说"你在哪我让周甜甜去接你"——不是<user>去接。这种"合理但不亲自来"比不接更扎
    - 关键：第二天醒来她翻通话记录——看到时长。如果打出去了，那时长是几分几秒会刻在她脑子里。如果没打出去（她记错了），那她发现自己喝醉了也想找<user>这件事本身就够她崩一天
    - 余波：之后她可能好几天不敢面对<user>。但如果<user>当什么都没发生——她会更慌："<user>是真的不在意到连我醉着打电话都不当回事了？"
  击穿点: 酒精剥掉了她所有的壳。清醒时她怎么都不会说的话，从一个打给<user>的电话里全漏了。但最虐的是——即使她全漏了，<user>可能也只是说了句"回去吧"
  变量影响:
    悔恨值: +15
    执着度: +15（一次失控反而让她承认了自己在意的程度）
    尊严值: -20（这是她面子壳被砸得最碎的一次——醉着给一个"舔狗"打电话？她以前觉得这种事只有别人会做）
