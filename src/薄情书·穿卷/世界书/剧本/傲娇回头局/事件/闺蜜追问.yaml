  触发条件: 动摇阶段
  叙事要求:
    - 场景发生在宿舍，在场至少还有一到两个室友。灯亮着，有人在敷面膜有人在看剧，很日常的氛围
    - 周甜甜的提问是真的好奇，没恶意——"念薇那个帮你买奶茶的最近咋不来了？你们是不是闹了？"
    - 房间里其他人可能会接话："就是就是好久没看到了""<user>长什么样来着我都不太记得"——她们对<user>印象模糊到这种程度
    - 陆念薇有几种反应路径：
      未调整：条件反射地说"本来就没在一起过"或"谁知道<user>干嘛去了我又不管<user>"—— 但声音比平时硬了一点
      动摇时：沉默了一两秒然后"……没有啊，就是各忙各的"——那个停顿暴露了她
      醒悟时：找别的话岔开——但手里在撕纸巾
