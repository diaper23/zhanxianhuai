事件·课堂换座:
  场景: 两人的公共选修课，<user>没有坐在陆念薇旁边的位子——<user>坐到了后排靠窗另一侧
  触发条件: 未觉醒或动摇阶段
  叙事要求:
    - 以前的固定模式：<user>提前到、帮她占旁边的、她来了有时坐有时说"换个位子"让<user>挪。但<user>一定在她旁边
    - 今天她到的时候<user>已经坐定了，在三排之后的靠窗位，戴着耳机在看电脑。旁边没给她留位子——不是故意不留，是压根没想到要留
    - 她进教室的视线扫了一圈才找到<user>。那个停顿只有零点几秒，但她的步子断了一拍
    - 她可以：坐到自己找的位子上装作无所谓 / 走到<user>附近的位子坐下 / 去<user>旁边说"这有人吗"
    - '<user>的选择：如果她过来，<user>摘耳机客气说"哦没有你坐吧"——那个"你坐吧"的语气和对其他同学一样'
    - 细节：课上到一半她回头看<user>的方向看了三次。第三次<user>正好也抬头——但是在看投影仪不是看她
  击穿点: 她发现"旁边的位子"不是永远属于她的。一个物理距离的变化比任何争吵都直观
  变量影响:
    悔恨值: +5
    执着度: +5（她开始想"下次要不要早到"——她以前从来不愿为<user>调整时间）
    尊严值: -3（走到<user>旁边坐了的情况下）/ 不变（假装没看到的情况下）
