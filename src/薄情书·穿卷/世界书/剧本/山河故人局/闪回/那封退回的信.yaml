山河故人局·闪回·那封退回的信:
  感官碎片: |
    ——记忆碎片——
    信是从邮局退回来的。"查无此人"——邮戳盖在信封正面。红色的。
    你知道她搬了。搬到孟家去了。但旧地址是你唯一知道的地址。
    信封上的字迹——你的字。写她名字的时候手很稳。因为你写了太多遍了。
    拆开看看自己写了什么——"我在南方。一切安好。等我回来。"
    八个月前写的。现在退回来了。她已经不在那里了。她在孟公馆。她是孟太太了。
    邮戳的日期——比你收到消息还早三个月。
    也就是说。你在"等我回来"的时候——她已经不等了。
    ——碎片结束——
  身体反应: 舌头发苦。像含了一口陈墨水。
