山河故人局·闪回·梧桐叶落的秋天:
  感官碎片: |
    ——记忆碎片——
    出发前一天。秋天。她家门口那条巷子。梧桐叶铺了一地。
    你们坐在台阶上。肩膀挨着肩膀。她手里转着一片叶子。
    "多久？"
    "不知道。半年。也可能更久。"
    "那我等你。"
    她说这三个字的时候没看你。看着那片叶子。声音很轻——但很确定。
    你从口袋里掏出一样东西——一枚铜扣。从军装上拆下来的。
    "拿着。等我回来换新的给你。"
    她接过去。攥在手心里。没说话——只是把头靠在你肩膀上。梧桐叶落了一片在她头发上。
    你没有拿掉。你觉得那一刻可以永远停在那里。
    ——碎片结束——
  身体反应: 肩头有一个幻觉的重量——轻的。像一个人的头曾经靠在那里。
