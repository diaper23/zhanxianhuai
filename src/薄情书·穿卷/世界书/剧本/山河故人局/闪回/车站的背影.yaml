山河故人局·闪回·车站的背影:
  感官碎片: |
    ——记忆碎片——
    火车站。你从南方回来。九月。站台上全是人——挑担的、提箱的、抱孩子的。
    你穿过人群。左腿已经不好了。每一步都要多用一分力气。
    出站口。你看见了她——不。是她的背影。旗袍。蓝色。头发盘起来了——以前她都是披着的。
    旁边站着一个男人。西装。很高。他伸手扶她上了汽车。黑色的汽车。很新。
    车门关上的声音——"咔"。很轻。但在站台的嘈杂里你偏偏听见了。
    车开走了。你站在出站口。左手提着一只旧皮箱。右手空的——本来是留着牵她的。
    ——碎片结束——
  身体反应: 左腿隐隐抽了一下。右手无意识地张开又攥紧。
