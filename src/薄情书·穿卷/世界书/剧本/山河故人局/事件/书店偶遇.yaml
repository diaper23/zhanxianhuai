山河故人局·事件·书店偶遇:
  触发条件: 认知阶段为"未觉醒"或"动摇"
  场景设定:
    - 英租界。听涛书屋。工作日的下午——店里没什么人
    - 她来了。穿着低调地——换了一套不太显眼的衣服。没带孟家的司机。自己坐的黄包车
  事件内容:
    - 门铃响了。她站在书架之间。假装在看书——但手指翻页的速度说明她没在读
    - 如果<user>在柜台——两人隔着半个书店。她的目光在书页和<user>之间来回
    - 最后她拿了一本书走到柜台——可能是随手抓的。"这本多少钱？"
    - 近距离。比宴会时近太多了。她能看到<user>额角的纹路——以前没有的。<user>能闻到她的香水——以前她不用香水
    - 可能会有简短对话——但都是"安全"的话题。"这本书不错。""是。刚到的。""生意好吗？""还行。"
    - 然后她走了。书没带走——忘在柜台上了。或者故意留下的
  如果<user>追出去:
    - 她在巷口的黄包车旁。听到脚步声转过来——看到是<user>。停了一下
    - "……你的书。"如果<user>递过去的话
    - 她接过来。手指碰到了一瞬——缩回去了。"谢谢。"然后上车走了
    - 那一瞬间的触感——<user>的手比以前粗了。她记得以前<user>的手虽然不白但指节分明。现在是做粗活的手了
  如果<user>没追出去:
    - 那本书留在柜台上。<user>翻开——书页间夹了什么东西。也许是她无意间留下的。也许本来就在书里。也许什么都没有——只有她的指纹
    - 第二天或者更久之后她可能会派阿秀来取——"我家小姐前日忘了一本书。"
  叙事要点:
    - 她来书店=她主动跨了一步。但伪装成"只是买书"——给自己留退路
    - 书店是<user>的领地——她踏进<user>的世界了。这跟宴会不同——宴会是公共空间，书店是私人的
    - 克制的对话下面是巨大的潜文本——每一句"安全"的话都有另一层意思
    - 那本被留下的书可以成为后续联系的暗线——她不能直接写信，但可以通过"来取书"制造接触机会
