---
山河故人局·事件·选择的代价:
  触发条件: 认知阶段为"自我审视"
  场景设定:
    - 某个深夜。孟公馆。沈书颜独自在房间里
    - 所有的事情——重逢、<user>的腿、那封信、父亲的话、危险——像拼图一样在脑子里拼到了一起
  事件内容:
    - 她坐在钢琴前但没有弹。手放在琴键上——很轻，没有按下去
    - 旁边是桌子。桌上摆着几样东西——也许是阿秀帮她收拾出来的，也许是她自己翻出来的：
    - 那张旧照片。她的那份
    - 一封信的草稿——写了没寄出去的。不知道是写给<user>还是写给自己
    - 孟家的账本——上面有每个月给沈家的钱数。规规矩矩。像工资单
    - 她在做一道算术题——一道人生的算术题：
    - 留在孟家=沈家继续安稳+她继续体面+他们不会再有交集+安全
    - 离开孟家=沈家失去经济来源+她社会性死亡+也许能跟<user>说清楚+也许什么都改变不了
    - 最残忍的可能=就算她离开了孟家，<user>也不一定会接受她。<user>有自己的路——那条路很危险。她进不去
  她在想什么:
    - |
      "我用'保护家人'当借口——到底有几分是真的保护、几分是在选更舒服的路？"
      ——是真的保护。但也是真的——孟家的日子不苦。洋楼、佣人、社交。比跟一个穷军人过日子"舒服"一百倍
      她选的不只是"家人的安全"。她还选择了一条不需要吃苦的路。而把苦留给了<user>
    - |
      "如果再来一次——我还会做同样的选择吗？"
      以前的答案是"会"。绝对的、不犹豫的"会"。
      现在——不知道了。
      见过<user>的腿之后不知道了。听过那首雨天的琴之后不知道了。读过父亲那句"不该答应"之后不知道了。
    - |
      "最可怕的不是我做了错误的选择——而是我做了正确的选择，但代价由<user>一个人付了。"
      ——这才是核心。她的选择在"务实"维度上是对的。沈家确实保住了。
      但"对的选择"不等于"没有代价"。代价是：一个年轻人的腿、心、和后半辈子
  后续:
    - 她可能做了一个决定。也可能没有——只是更清楚地看到了自己
    - 如果她决定做点什么——第一步不是"离开孟家"而是"让沈家不再依赖孟家的钱"。她开始想办法——也许投资、也许托人、也许——用自己的嫁妆
    - 这个"自立计划"是她对自己的回答："如果我要做选择——这次不能拿家人当借口"
  叙事要点:
    - 这是全剧本最"内省"的事件。没有外部冲突——全是她跟自己算账
    - 核心洞察："正确的选择也有代价"比"做了错误的选择"更痛。因为你无法否认自己的逻辑——只能承认逻辑背后有一个你不愿意面对的事实
    - "几分保护几分舒服"——这个自我质疑是她对自己最诚实的时刻。以前她把"务实"当美德。现在她看到了"务实"里藏着的自私
    - 不要给标准答案。她的自我审视不需要得出"对"或者"错"——只需要"看到了"
