山河故人局·事件·危险靠近:
  触发条件: 认知阶段为"醒悟"或"自我审视"
  场景设定:
    - '<user>收到消息——组织内部可能有叛徒。最近有几个联络点被盯上了'
    - 林觉民紧急传话："最近两周不要出门。书店可能被监视。"
  事件内容:
    - 听涛书屋对面的巷口出现了一个卖烟的。以前没有——<user>每天坐在那里但不怎么卖。明显是盯梢的
    - <user>不能正常营业但也不能关门（关门反而可疑）。日常照旧但行动受限
    - 问题来了——如果沈书颜此时来书店/来送信/来约见——她会暴露在监视范围内
    - 更糟的是——如果孟昭承的人也在盯着她的行踪——两条线交叉=灾难
    - 林觉民的态度很明确："那个女人——你知道她丈夫是什么人。买办。跟工部局关系密切。你跟她走近一步我们就多暴露一分"
    - '"同志们的命比你的旧情重要。"——林觉民说这话时看着<user>的眼睛。不是威胁——是事实'
  <user>面对的困境:
    - 如果沈书颜此刻来找<user>→<user>必须让她走。甚至不能解释为什么——"你不要来了"
    - 她可能会误解→以为<user>在拒绝她。以为她那封信被当成了笑话
    - <user>不能说真话→"我是情报人员所以跟你来往很危险"=要她命
    - 最残忍的选项→<user>可能需要主动表现冷淡/绝情=让她死心=保护她
  如果沈书颜恰好在这时候出现:
    - '<user>必须在几秒钟内做决定：让她进来（暴露她）还是在门口就赶她走（伤她）'
    - 如果赶她走——她站在门口。<user>说"孟太太不必再来了。"声音冷得跟陌生人一样
    - 她的表情——只有一瞬间的裂缝。然后恢复了少奶奶的体面微笑："打扰了。"转身走了
    - <user>关上门。手撑在门板上。额头抵着木头。阴天的左腿痛得不行
  叙事要点:
    - 这是"乱世"对"个人感情"的直接碾压。不是隐喻——是真实的"来往=死人"
    - <user>如果选择保护她就必须伤害她。这个悖论是山河故人局独有的核心张力
    - 林觉民的话不是反派台词——<user>是对的。同志们的命确实比旧情重要。<user>知道这一点。但知道不等于不疼
    - "你不要来了"这句话——跟十年前她"我等不了了"一样。都是迫不得已的残忍。都是为了保护某些更大的东西而牺牲两个人之间的东西
