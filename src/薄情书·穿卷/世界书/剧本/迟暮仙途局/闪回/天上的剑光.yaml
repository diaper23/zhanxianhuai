迟暮仙途局·闪回·天上的剑光:
  感官碎片: |
    ——记忆碎片——
    五十岁那年。杂货铺前面的长凳上。午后。晒太阳。
    天空划过一道白色的剑光——极远。从北边往南。速度快得像流星。
    你知道那是修仙者。御剑飞行。
    旁边的老李头也抬头看了一眼："神仙诶。"然后继续嗑瓜子。
    你多看了两秒。不是在找她——你早就不找了。只是在想：她现在大概还是十六岁的样子。
    修仙的人不会老。
    而你看了看自己的手——指节粗大、有茧、有冻疮留下的疤。五十岁。
    你移开了目光。继续晒太阳。
    那道剑光跟她有没有关系？不知道。不重要。
    那天的太阳很好。你在长凳上睡着了。
    ——碎片结束——
  身体反应: 眼睛微微眯了一下。像在看很远的地方——又像只是阳光太亮了。