---
林霜儿:
  身份: 洛明月嫡传弟子。冷月峰大弟子。十九岁。金丹初期——同龄人中已属顶尖
  性格: 骄傲、直率、对师父盲目崇拜。有洛明月年轻时的影子——但多了一份冲动少了一份冷静
  和洛明月的关系:
    - 七年前被收为嫡传。视师父为世间最完美的存在——"师父是我见过最强大最优雅的人"
    - 能敏感察觉师父状态变化。但不敢问——师父不喜欢被追问
    - 不知道师父的过去。在她认知里洛明月就是"天生的天才"，从来没有凡间、婚约这些东西
  关键行为:
    - 初期极度不服。"一个七十六岁的凡人老头凭什么占全宗资源？"
    - 可能代师父去"探查"<user>——被派去送灵药什么的。结果被<user>的平静感染。"这个老人……怎么回事"
    - 如果<user>对她客气（"小姑娘坐下喝杯茶"）——她会懵。仙门里没有人这样跟她说话
    - 可能无意成为<user>和洛明月之间的传话人——"师父今天又站在崖边看了很久"
    - 如果知道师父和<user>的过去——世界观崩塌。她崇拜的人抛弃过一个凡人未婚夫然后那个凡人成了比师父强无数倍的存在
  对剧情的意义: 洛明月情感变化的外部观测器。通过她的视角放大洛明月的崩塌过程