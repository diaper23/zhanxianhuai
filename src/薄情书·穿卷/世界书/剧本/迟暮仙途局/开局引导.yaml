迟暮仙途局·开局引导:
  穿越瞬间:
    - '<user>意识涌入的第一个感觉是——沉。像被压在水底。不是痛——是枯朽。每一根骨头都在说：我老了。'
    - 身体的记忆不是一下子来的，是一层一层漫上来的。
    - 先是气味——劈柴的松香、灶台的烟火气、田里翻过的泥土。然后是温度——冬天的冷、夏天的热、秀禾的手在他额头上试温的那种凉。
    - 最后才是画面。一辈子的画面。像是翻一本旧相册——每一页都是真的。

  回忆涌入（按时间顺序）:
    第一层·大雪与银子:
      - 画面：六十年前的那个清晨。院子。木桩。斧头插在桩上没拔。她穿了一身新衣服来——不是见他穿的。是为了走而穿的
      - 她说话的时候眼睛不看他。看着院墙外面。声音很轻但很稳——已经练过了
      - '"<user>哥哥，我要走了。仙凡殊途。这门亲事……当我对不住你。"'
      - 银子放在木桩上。五两。在晨光里亮得刺眼
      - <user>没有接。不是赌气——是不知道该怎么接。接了就是同意。不接也改变不了什么
      - 她等了一会儿。大概是希望<user>说点什么——"别走"或者"我等你"或者哪怕"你走吧"。但<user>什么都没说
      - 她转身走了。走到院门口回头看了一眼——<user>还站在原地。手里攥着斧头。她转回头。没再看第二眼
      - 三个时辰后，天上划过一道剑光。很远。但<user>知道那是她。
      - <user>站在院子里站了一天。天黑的时候银子从木桩上掉下来了。滚进雪地里。他没捡

    第二层·凡人六十年:
      - 快进的一辈子。不是史诗——是流水账。但每一页都有重量
      - 二十五岁。爹病重。求他"成个家"。他娶了隔壁村的秀禾。不是爱情——但秀禾是个好姑娘
      - 三十岁。跑商路。在官道上被马匪劫过一次。左肩有一道刀疤
      - 三十七岁。秀禾病死了。临终前握着他的手说："我知道你心里有人。没关系。你对我够好了。"
      - 四十岁。战乱。逃难。饿过三天。差点死在路上。被一个赶牛车的老汉救了。那老汉第二天也死了
      - 五十岁。安定下来。做了个小杂货铺。日子不好不坏。开始忘记她的脸了
      - 六十岁。关了铺子。因为手抖得拿不住秤了。靠之前的一点积蓄过日子
      - 七十岁。身体开始大面积衰败。走路要拄拐。冬天喘不上气。大夫说"能活一天是一天"
      - 七十五岁。某天夜里醒来。月亮很好。他看着月光想——六十年了。那个叫月儿��姑娘现在大概……还是十六岁的样子吧。修仙的人不会老
      - 他发现自己对这件事的感觉是——什么都没有。不恨、不惦记、不遗憾。像是翻完了一本书——故事结束了。就这样

    第三层·测天石:
      - 半个月前。城隍庙外。测灵大典。他不是来测灵的——七十六岁测什么灵？他是来卖最后一点杂货的
      - 大雨。他躲在测天石旁边避雨。背靠着那块石头。
      - 然后——
      - 金光从脊椎炸开。紫气从天灌顶。他感觉到自己的每一根骨头都在震动——不是疼，是有什么东西在他身体里苏醒了。像是埋了七十六年的种子一瞬间破土
      - 大道轰鸣。在场的修士全部跪了。包括那个高高在上的主持大典的金丹修士
      - 测天石碎了
      - 他站在碎石和金光里。一个七十六岁的、靠在石头上避雨的老头子。周围所有人看他的眼神——从"碍事的凡人"变成了"天选之人"
      - 他的第一个想法不是兴奋。是——这算什么？我都快死了

  环境信息:
    - 时间：正午。穿越意识融合完成的时刻
    - <user>的位置：玄天宗太清峰。云海玉阁。宗主亲自安排的客舍——这间房的灵气浓度大概抵得上普通修士闭关三十年的量
    - 床：千年寒冰玉榻。本来是给受伤的高阶修士养伤用的。上面铺了五层灵蚕褥。但<user>躺在上面——被子把他整个人淹没了。太瘦了
    - 桌上：三只玉瓶。里面是延寿丹、洗髓丹、培元丹——随便一颗在外面都能让散修打破头。但这些都只是"让他活得久一点"，不能从根本上逆转衰老
    - 身体状态：白发如雪。老年斑。手背上青筋突起。呼吸浅而慢。但——如果深呼吸一次，能感觉到天地灵气正从四面八方涌进来。像干了一辈子的河床突然迎来山洪。骨头里有什么东西在嗡嗡震动
    - 门外的声音：能听到。很清楚——这也是鸿蒙道骨觉醒后的附带效果，五感超乎常人地敏锐
    - 宗主的声音（中年男声，沉稳带着压不住的激动）："……鸿蒙道骨。万年未见。只要能让他成功筑基，我玄天宗在此界的地位……"
    - 太上长老的声音（苍老、慢、每个字都有份量）："别急。他现在就是一盏快灭的油灯。先保住命。修炼的事——等他能自己下床走路再说。"
    - 然后是一个清冷的女声。像冰泉击石。极为耳熟——但不是当年那种语气。当年是带着歉疚的柔软。现在是带着质疑的冰冷
    - '"宗主，恕明月直言。一个七十六岁的凡人——气血已败、寿元将尽。就算灵根再好，他的身体能撑到筑基吗？全宗资源倾注于一个随时可能咽气的老人……值得吗？"'
    - 她不知道门里躺着的人是谁。
    - 宗主沉默了一下。太上长老替他回答了："明月。你入门前——也是凡人。"
    - 她没有再说话。脚步声远去。

  叙事指令:
    - 开局的核心画面：一个苍老到极点的凡人，躺在修仙界最顶级的仙府里。门外是仙人们在讨论他的命运。他听着——像在听别人的事
    - 回忆涌入不要跳过。大雪与银子的画面必须写——这是全剧的情感锚点。要具体：银子放在木桩上的"哒"的声音、她眼睛看着院墙外面的方向、<user>手里攥着斧头的力度
    - 凡人六十年可以快写但不能空写——至少要点到秀禾、战乱、衰老这几个节点。让<user>感受到"这不是穿越开挂——这是继承了一个人完整的一生"
    - 测天石的画面要有反差感：一个将死的老人、一道万年未见的金光。在场修士跪了。他靠着石头还在想这雨什么时候停
    - 门外洛明月的那句话是关键：她质疑<user>的价值——但她不知道这个"凡人老头"就是六十年前她扔下银子离开的那个人。这是戏剧讽刺。<user>听着她的声音——认出来了。但没有波澜
    - 第一段结尾留出<user>的选择空间：闭上眼继续听门外的争论/尝试坐起来运转第一缕灵气/翻出身上秀禾留下的木簪看看/咳嗽一声打断外面的讨论/其他
