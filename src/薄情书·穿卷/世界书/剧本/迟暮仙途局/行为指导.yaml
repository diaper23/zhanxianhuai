    - <user>的变化：修为提升后容貌缓慢蜕变。不是变回少年——而是白发依旧但皮肤光滑了、皱纹浅了、眼睛开始有神光。像一棵枯木逢春。到后期是"鹤发童颜"的仙人姿态——比洛明月的驻颜更有压迫感
