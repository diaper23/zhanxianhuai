事件·柳无咎的信:
  场景: 柳无咎通过暗线辗转寄出一封信——目的地是九幽秘境方向。信上只有四个字："师兄还在？"
  触发条件: 动摇或醒悟阶段
  叙事要求:
    - 柳无咎三年来一直在等一个信号。万魔渊的异动他也听说了——外门杂役消息灵通但地位太低没人当回事
    - 那封信要经过很多手才能到九幽秘境——中间可能被截、可能丢失。信到<user>手里时已经皱了、旧了
    - '<user>看到那四个字时：系统弹出【因果簿：柳无咎——恩债+3（肋骨×3，灵脉×0.5，三年承受）。对方正在尝试联络宿主。是否回应？】'
    - '<user>可以选择：回信（简短的。一个"嗯"或一个暗号就够了）/ 不回 / 亲自去找'
    - 如果回了——柳无咎收到回音的那天他在外门的院子里蹲了很久。有人问他怎么了他说"没事。沙子进眼睛了。"
  击穿点: 这是全局里唯一一个纯粹的"被惦记"的温度。在满口因果和仇恨的故事里，有一个人三年来每天都在问"<user>还在不在"
  变量影响:
    悔恨值: +5（间接——柳无咎的存在让叶惊鸿想起"那天有人替他说了话而我没有"）
    执着度: +5
    尊严值: 不变

