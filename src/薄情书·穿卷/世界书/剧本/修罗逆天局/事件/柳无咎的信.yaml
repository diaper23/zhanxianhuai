事件·苏夜澜追踪:
  场景: 苏夜澜辨认出<user>身上的修罗气息，从九幽秘境开始追踪<user>
  触发条件: 动摇阶段
  叙事要求:
    - 她不是敌人但也不友好——她追来的姿态是"这个传承是我丈夫的你凭什么得到"
    - 第一次正面碰到<user>时她出了剑——没用全力但很认真。<user>可以接、可以避、可以一剑把她制住
    - 交手之后她停了。因为她从<user>的招式里看出来——修罗殿认可了<user>。传承不是偷的。那个打法只有被修罗殿承认的人才用得出来
    - 她站在那里看了<user>很久。然后说了一句："你见到<user>了？"——她指的是修罗殿里的那具枯骨/灵魂残识
    - 系统可能插一句：【检测到苏夜澜因果线——与旧传承者相关。非敌对目标。建议：酌情交流。她持有旧传承者的部分信息，对宿主修行有辅助价值】
  击穿点: 苏夜澜确认她丈夫真的死了的那个瞬间——安静得像所有的风都停了。她等了一百年。答案是最坏的那个
  变量影响:
    悔恨值: 不变（这个事件主要发展苏夜澜线）
    执着度: +5
    尊严值: 不变
