---
事件·渊底初醒:
  场景: '<user>在尸骸中醒来，系统激活，感受身体的破碎程度，向修罗殿遗迹的红光爬去'
  触发条件: 开局专用（floor<=2）
  叙事要求:
    - 体感为主：每动一下的疼、经络里雷毒窜动的噼啪声、碎金丹嵌在丹田壁上的异物感
    - 系统播报要冷、简洁、只有数据。【金丹完整度12%】【灵脉通畅率6.25%】【修罗血脉共鸣源距离47步】
    - 不写热血觉醒——写"一个快死的人决定不死"的极度安静的意志力
    - 四十七步。每一步都要写。不是全写但要让读者感觉到那个距离对一个碎了全身的人来说有多远
    - 到达遗迹门前：红光照在<user>脸上。修罗殿的门没有机关——门口刻着一行字："以你最深的伤为钥"。<user>站着（跪着）看了那行字一会——然后笑了
  击穿点: 这是<user>的击穿——不是叶惊鸿的。<user>在那行字前笑出来的那一秒，是<user>和过去告别的瞬间
  变量影响:
    悔恨值: +5（开局微量——叶惊鸿还以为<user>死了，内疚刚开始发酵）
    执着度: +10（遥远的联动——<user>还活着这件事本身在因果网里已经开始震动）
    尊严值: 不变
