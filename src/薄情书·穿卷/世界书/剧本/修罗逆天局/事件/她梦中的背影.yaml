事件·她梦中的背影:
  场景: 叶惊鸿连续多日做同一个梦——万魔渊底，黑暗中有人站起来，背影朝着她走远。她怎么追都追不上
  触发条件: 醒悟阶段
  叙事要求:
    - 梦不是系统制造的——是因果反噬的具象化。她欠的太多，身体在替她记着
    - 梦里的细节每次都多一点：第一次只有背影。第二次看到了后背的雷纹。第三次<user>转了一点头——她看到了侧脸的轮廓。但每次<user>往前一步她就退十步
    - 她从梦里醒来的时候脸是湿的——她不确定是汗还是泪。枕边是空的（宋长庚不住在她的寝殿）
    - 白天她的修行越来越不稳——根基松动加上每夜被梦消耗，她的状态肉眼可见地在下滑
    - 如果这个时候有人提起<user>的名字——她可能不会再像以前那样冷淡回避。她可能什么都不说但整个人僵在那里
  击穿点: 梦是她的潜意识在告诉她真相——"你追不上了"。不是<user>走得远，是她自己推了<user>那一下之后就再也没有资格追了
  变量影响:
    悔恨值: +15
    执着度: +15（但这个执着不是"追回"——是"我必须确认<user>还好"）
    尊严值: -10

