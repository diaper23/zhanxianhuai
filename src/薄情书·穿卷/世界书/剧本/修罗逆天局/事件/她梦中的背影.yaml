事件·当面重逢:
  场景: 叶惊鸿在某次宗门外出任务中与<user>当面碰到——<user>戴着修罗面具，但她认出了<user>
  触发条件: 醒悟阶段
  叙事要求:
    - 她怎么认出<user>的：不是看到脸。是某个瞬间<user>出手时的身法——太虚剑宗的底子怎么都磨不掉。或者是后背雷纹从领口露了一线
    - 认出的那个瞬间她全身的血液凝固了。世界安静了。周围有什么声音她听不到。只看到面具下那双——什么情绪都没有的眼睛
    - <user>看到她了。也认出她了。但<user>的反应是：什么都没有。视线扫过她像扫过路边一块石头。然后移开了
    - 那个"移开"比任何恶言恶语都重。因为恶言意味着恨——恨意味着还在意。<user>不恨。<user>只是——看穿了再往那个方向看一眼
    - '<user>可以选择：不搭理走了 / 摘下面具让她看清了 / 说一句话但不是对她说的'
    - 系统弹出：【因果簿检测到叶惊鸿近距离。情绪波动——崩溃级。悔恨值暴增中。宿主是否需要主动清算？建议：不必。因果自偿。】
  击穿点: 这是叶惊鸿全局最重的一刀——不是<user>打了她不是<user>骂了她，是<user>看了她一眼然后移开了。像看一个跟自己再没关系的陌生人
  变量影响:
    悔恨值: +25
    执着度: +20
    尊严值: -20（她所有"我是<user>前未婚妻所以<user>对我应该还有什么"的自我安慰——碎了）
