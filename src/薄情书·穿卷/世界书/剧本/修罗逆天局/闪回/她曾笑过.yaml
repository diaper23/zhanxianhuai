修罗逆天局·闪回·她曾笑过:
  感官碎片: |
    ——记忆碎片——
    入门第一年。秋。剑修课结束。她的发被汗黏在额头上。
    "你的剑法比师兄还稳。"她说。嘴角翘着。左手别了一朵不知道从哪摘的花在耳后。
    那天<user>练了三个时辰。腿都在打颤。但她说那句话的时候所有的酸胀都不疼了。
    "以后我替你挡剑。"<user>说。十六岁。认真的。
    "切。谁要你挡。"她把花从耳后摘下来——犹豫了一下——塞进<user>衣领里。"诶别弄掉了，我摘给你的。"
    <user>把那朵花风干了。夹在剑谱第三十七页。后来那本剑谱也被回收了。花不知道还在不在。
    但她说"摘给你的"时尾音上扬的弧度——在不在。
    ——碎片结束——
  身体反应: 胸口那个位置又动了一下。不是痛。比痛更糟。是——有过温度的证据。
