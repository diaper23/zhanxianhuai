修罗逆天局·闪回·最后一推:
  感官碎片: |
    ——记忆碎片——
    论道台。所有人都看着<user>。
    宋长庚的话像隔了一层水——听得清但不真实。"剑骨非正统……魔渊遗骨……"
    <user>看她。她站在宋长庚后面半步。头低着。手垂在身侧。没有看<user>。
    "惊鸿。"<user>叫了一声。
    她抬头了。眼眶是红的——但嘴唇抿着。那个表情<user>读不出来。是愧疚？是恐惧？还是从一开始就——
    然后她走到<user>面前。手按在<user>胸口。
    不重。甚至在发抖。
    但方向是向外的。
    风灌入后背。脚下空了。世界翻转。她的脸越来越小。越来越远。
    <user>看见她蹲下去了——蹲在台边。是在看<user>坠落还是在腿软？
    来不及想了。黑暗。
    ——碎片结束——
  身体反应: 胸口那个位置——她掌心按过的地方——像有什么东西压了一下。不重。但一直在。
