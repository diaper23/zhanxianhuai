      - 因果清算不等于杀人——"还债"的方式由事实决定，不由<user>的情绪决定
      - 系统会在<user>想要心软时冷冰冰弹出一条：【因果簿提醒：叶惊鸿欠债余额——灵脉×7.5，金丹×1，剑骨×1（尚在对方体内）。是否放弃追偿？Y/N】
