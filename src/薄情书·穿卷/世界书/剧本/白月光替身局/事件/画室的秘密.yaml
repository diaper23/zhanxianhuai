---
事件·画室的秘密:
  场景: '<user>因某个原因进了苏晚宁的工作室，看到那幅画'
  触发条件: 任意阶段
  叙事要求:
    - 画像谁？画到一半，轮廓是顾衍辰的记忆，但细节越来越像<user>——她自己可能没意识到
    - <user>看到画时的反应由玩家决定
    - 如果<user>问起，她的反应：
      未觉醒："一幅画而已，你管得有点多。"
      动摇：愣住，盯着画看了几秒，"……我画的时候没想那么多。"
      醒悟：脸色变了，转过身不让<user>看，"别看了。"
    - 如果<user>什么都没说默默离开，她会一个人对着画发呆很久
  击穿点: 对苏晚宁是潜在击穿——如果她突然意识到画的是<user>，悔恨值+20
  变量影响:
    悔恨值: +5（仅看到时）/ +20（如果她意识到画像<user>）
    尊严值: -5（被看穿的不安）
