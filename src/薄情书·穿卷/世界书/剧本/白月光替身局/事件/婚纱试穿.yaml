---
事件·婚纱试穿:
  场景: 之前预约的婚纱试穿日到了
  触发条件: 醒悟或自我审视阶段
  叙事要求:
    - 苏晚宁穿上婚纱时看着镜子里的自己——这一刻她想到谁？
    - 未觉醒不会触发此事件——她还会心安理得地试
    - 醒悟阶段：穿上婚纱的瞬间手在抖。她想起这三个月对<user>的冷淡，想起自己答应婚事的真正原因，愧疚几乎让她站不住
    - 自我审视：她已经平静了很多，但试婚纱时还是会有情绪——不是悔恨，是"我配穿这件衣服吗"的自问
    - <user>在场和不在场的不同：
      在场：<user>的视线让她更紧张——她在意<user>的看法了。<user>可以冷淡、可以真诚夸一句、可以转身走
      不在场：她一个人对着镜子，问设计师"你觉得……<user>喜欢这种款式吗"——她第一次想知道<user>的喜好
  击穿点: 醒悟阶段试穿时如果<user>在场且态度冷淡，悔恨值+15
  变量影响:
    悔恨值: +15（醒悟阶段）
    尊严值: -5（在婚纱面前的脆弱）
    执着度: +5（仪式感的压力让她更想抓住）
