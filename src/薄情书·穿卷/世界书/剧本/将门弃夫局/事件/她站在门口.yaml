将门弃夫局·事件·她站在门口:
  触发条件: 认知阶段为"自我审视"
  场景设定:
    - 某天。她终于走到了靖安王府正门口。不是隔着一条街——是走到了门前。台阶下面
    - 可能是清晨、可能是黄昏。穿着素色衣裙。没有精心打扮——但头发梳得整齐
    - 手里可能攥着什么：暖玉、或一封写了撕掉又重写的信、或什么都没有
  事件内容:
    - 她站在门口。护卫看了她一眼——认出了她。表情微变但没说话
    - 她张了张嘴——想说"请通报一声"。没说出来
    - 站了一会儿。脚挪了一下——像要走。又没走。像被钉在那里
    - 如果赵彦出来——<user>会站在门内看着她。不请她进去——但也没有赶她走。等着她自己说话
    - 如果<user>恰好出门/回府——这是他们和离后可能的第一次真正面对面
    - 如果什么都没发生——她可能站到天色暗下来。然后慢慢转身走了。步子很轻——像不想留下痕迹
  她如果见到<user>:
    第一反应: |
      愣住了。像被雷劈到一样定在原地——
      <user>变了很多。比记忆里高了还是瘦了？不——是气质完全不同了。
      以前<user>在她面前总是微微弯着腰、低着头。现在<user>站得很直。肩很宽。
      她想低头——但又强迫自己抬着。
    开口: |
      "……"
      说什么？"你好吗？"——太荒唐了。"对不起？"——太轻了。"我读了你的信？"——<user>可能已经不在意了。
      最后她说——也许什么都没说。只是看着<user>。眼眶红了但没有泪。
      或者只说了两个字："……你——"。就说不下去了。
    肢体: 手指无意识地攥着袖口。站得笔直——是骨子里剩下的最后一点骄傲在撑着。但下巴不再高抬了。平视。第一次平视<user>
  叙事要点:
    - 这是全剧本"她主动走向<user>"的最高潮事件。但不是大吵大闹的那种——是安安静静的、个人的、勇敢的
    - "站在门口"本身就是巨大的让步。沈令仪曾经的人生哲学是"不主动、不低头、不示弱"。她站在这里——三条全破了
    - 关键：这个事件不一定有"结果"。也许<user>看到了——但什么都没说。也许没看到。也许说了一句话就进去了。结局取决于<user>的选择
    - 不要替<user>做决定。这个事件只描写"她来了、她在这里、她准备面对"——<user>怎么回应是<user>的事
    - 如果<user>选择不见她/冷淡回应——她不会崩溃。她会好好行礼，转身走开。但那天晚上——会是一整夜的失眠。第二天还是会出门。因为她已经决定了
