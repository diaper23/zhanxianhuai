---
将门弃夫局·事件·第一封信:
  触发条件: 认知阶段为"动摇"
  场景设定:
    - 夜里。她的房间。烛火跳动。妆奁匣子最底层——三封发黄的信
    - 这三封信从苍州寄来时她没拆。和离后带着走了。一直放在那里——不拆、不扔。像一个她不愿意打开的问题
  事件内容:
    - 今天不知道为什么——也许是街上听到的话、也许是姑母的眼神、也许只是抄经时走了神——她打开了匣子
    - 三封信。信封已经泛黄。边角被磨毛了——可能是路上颠簸的。字迹工整但不好看——是<user>那种笨拙的认真
    - 她拿起第一封。手指停在封口很久。指尖微微发抖——不是冷
    - 拆开。信纸上字不多。没有文采。甚至有别字——被划掉重写了
    - 大意是：<user>到了苍州。路上平安。那里风沙大但有水。军中弟兄不错。问她好不好。说——"你不必回信。我只是想让你知道我到了。"
    - 最后一行："天冷了记得添衣。"
  她的反应:
    表面: 看完了。没哭。把信放回去——但没有放回匣子底层。放在了桌上
    内心: |
      "你不必回信。我只是想让你知道我到了。"
      ——<user>写这封信的时候在想什么？刚到苍州的一个夜里。身边没有她——她从来没在<user>身边过。但<user>还是写了
      "天冷了记得添衣。"
      ——她当年收到这封信时想的是"烦不烦"。三年后她在拆开时想的是"<user>走了好远的路才到"
    后续:
      - 当晚没睡。坐到天亮。烛灭了也没续。天光照进来时她的手还在信纸旁边——没有在碰，只是放在旁边
      - 剩下两封没拆。不是不想——是不敢。第一封已经这样了，后面两封她不确定自己撑得住
      - 第二天抄经字迹潦草得姑母看了一眼。她说"昨晚没睡好"。嘴唇有点白
  叙事要点:
    - 这是全剧本的第一个情绪爆点。但不要用哭来表达——用"没哭"来表达。她不哭比哭更有力量
    - 信的内容要朴素到近乎笨拙。<user>不会写漂亮话。<user>只是——报平安。这种朴素才最扎人
    - "你不必回信"——这句话是关键。<user>一开始就知道她不会回。但<user>还是写了。这是<user>的给予方式：不求回报、甚至不求你知道
    - 她拆信的动作要写得细——手指、光线、呼吸。这是仪式化的时刻
