---
将门弃夫局·事件·街头议论:
  触发条件: 认知阶段为"未觉醒"或"动摇"
  场景设定:
    - 沈令仪难得出姑母府门。去绸缎铺买线——给佛经抄本做封面。秋日天凉，路上人不多
    - 经过茶楼时听到里面的议论。不是专门针对她——只是京城百姓茶余饭后的话题
  事件内容:
    - 茶客甲："靖安王不是从苍州那边打回来的？听说在边关八年，连个通房都没有。"
    - 茶客乙："有什么稀奇。人家志在天下，哪有空想这些。"
    - 茶客甲："也不全是。听说<user>当年成过亲。侯府的大小姐——就是后来抄家那个沈家。"
    - 茶客乙："啊？那后来呢？"
    - 茶客甲："和离了呗。大小姐嫌人家出身低。人家一走八年封了王，她倒去姑母家抄经了。"
    - 茶客乙压低声音："啧啧，这可真是……风水轮流转。"
  她的反应:
    未觉醒阶段:
      表面: 步子没停。甚至没有加快。下巴微抬——是从小养成的体面
      内心: '"嫌人家出身低"——这话不全对。她嫌的是<user>的一切：粗糙的手、不会说话的嘴、笨拙的讨好。她嫌的是命不由己。但这些她不会跟茶楼里的人解释'
      后续: 回去抄经。那天的字比平时用力——笔画末梢带钩。姑母看了一眼没说什么
    动摇阶段:
      表面: 步子顿了一下。只一下。然后继续走——但手里捏着布袋的力气大了些
      内心: '"连个通房都没有"。八年。这个细节她第一次意识到。<user>当年在苍州——也是独自一人吗？'
      后续: 那天没去绸缎铺。直接回了姑母府。晚饭没吃完就说困了
  叙事要点:
    - 议论的内容不需要全部准确——民间传言就是这样半真半假
    - 重点不是议论本身，而是她"被旁人用三言两语概括"的感受。她整个人生被压缩成了一句茶余闲话
    - 不要让她当场失态。她是侯门出身——在外面永远是体面的。所有的裂缝都在回到房间之后
