---
将门弃夫局·事件·秦姑姑出现:
  触发条件: 认知阶段为"醒悟"或"自我审视"
  场景设定:
    - 清晨或黄昏。姑母府的后门或附近的巷子
    - 一个穿着朴素的老妇人在等她。头发花白了许多——但那双眼睛她认得
  事件内容:
    - 秦姑姑。三年没见了。侯府被抄后她回了乡下老家。沈令仪以为这辈子再也见不到她
    - '"姑娘。"秦姑姑看着她。眼眶先红了。声音哑得像含着什么东西——"姑娘瘦了。"'
    - 沈令仪愣了很久。然后问："姑姑怎么来了京城？"
    - 秦姑姑说是托人打听到她在这里。攒了些路费就来了。"老奴不放心姑娘一个人。"
    - 坐下来之后。秦姑姑开始说那些年——
    - '"姑娘在苍州那三年……将军<user>——"她顿了顿——"姑娘不知道的事太多了。"'
    - 然后是细节。一点一点的、琐碎的、当年她没注意到或者注意到了不在意的——
    - "将军每回出征前都会去镇上买茶叶，就姑娘爱喝的那种。要走三十多里地。回来膝盖都是肿的。"
    - "冬天灶房的柴不够——将军半夜去劈的。怕白天响动吵着姑娘。"
    - "和离书那天……将军签完名在廊下站了一炷香。老奴从后面看着——<user>的手一直在抖。"
  她的反应:
    表面: |
      一开始是听着。端正地坐着。像在听别人的故事。
      听到"三十里地"的时候手指蜷了一下。
      听到"和离书那天"的时候——茶杯放下了。因为端不住了。
      没哭。但嘴唇咬得很紧。很久之后说了一句："姑姑……我当年——"没说完。
    内心: |
      所有的细节。像碎玻璃一样一片一片插进来。
      她当年知道<user>做这些吗？知道一部分。但她的反应是——"<user>本就该这么做。<user>是我丈夫。"
      不。<user>不只是"丈夫"。<user>是一个她连名字都不愿意叫的人——在为她做这些。
      和离书那天<user>的手在抖。她当时在厅堂另一头——她看到了。但她以为那是"不甘心"。
      不是。是心碎。
    后续:
      - 留秦姑姑在姑母府住下。姑母同意了——"多个人照应你也好。"
      - 当晚秦姑姑在隔壁房间。沈令仪一个人对着那三封信——把剩下两封全拆开了
      - 三封信读完。窗外天快亮了。她翻出那块暖玉。贴在脸颊上——已经不暖了。攥了一夜
  叙事要点:
    - 秦姑姑是"补全信息"的角色。她说出的每一个细节都是沈令仪当年忽略的/看到了不在意的
    - 核心手法：琐碎打败宏大。不是"<user>为你出生入死"——而是"<user>走三十里路买茶叶膝盖肿了"。越日常越心碎
    - 秦姑姑不责备她。这种"不责备"比赵彦的冷更难受——因为赵彦代表的是外界的审判，秦姑姑代表的是"连你自己人都知道你错了"
    - "和离书那天<user>的手在抖"——这个细节要特别着力。她当年注意到了但解读错了。现在重新知道真相——才是最疼的
