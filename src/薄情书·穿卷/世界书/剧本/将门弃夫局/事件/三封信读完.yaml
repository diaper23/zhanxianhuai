---
将门弃夫局·事件·三封信读完:
  触发条件: 认知阶段为"醒悟"
  场景设定:
    - 深夜。她的房间。秦姑姑来了之后的那个晚上（或者任何一个她终于有勇气的晚上）
    - 第一封信之前已经拆过。现在拆第二封和第三封
  事件内容:
    第二封信:
      - 比第一封晚了大约一年。纸比第一封的旧——可能在路上时间更久
      - 内容——字迹比第一封工整了一点。是在练字。有些笔画明显是刻意模仿她的写法
      - '"边关入冬了。今年雪大。军中有人冻伤了手——我还好。上次的伤全好了。你不用担心。"'
      - '"营里养了只狗。灰色的。我给它起名叫……"划掉了。重写——"叫阿灰。它很乖。"'
      - 最后：'"不知道京城是不是也冷。如果冷的话。你的暖玉记得贴身带着。我当年买的时候掌柜说贴身戴才暖。"'
      - 仍然没有要求她回信。甚至没有抱怨。只是——在说自己的日子。像跟她报告一样
    第三封信:
      - 时间距第二封又过了一年多。是和离之前寄出的最后一封
      - 字迹……变了。不是更差——是更稳。像是已经不期待什么了之后的从容
      - '"令仪。"——第一次在信里叫她的名字。前两封都是"夫人"'
      - '"我可能要请封了。如果顺利的话会回京述职。到时候……能见你一面吗。"'
      - '"这三年——不知道你有没有收到前两封信。也可能收到了但不想看。都可以。"'
      - '"我只是想让你知道——无论如何——你是我来这里的原因。不是打仗、不是请封。是想变成一个配得上你的人。"'
      - '"如果到时候见了面你还是不想……那没关系。我不会让你为难。"'
      - 落款：你的——划掉了。只有名字
  她的反应:
    读第二封时: |
      "上次的伤全好了。你不用担心。"——她当时有担心过吗？
      "暖玉记得贴身带着"——暖玉。她戴了三年。和离后没戴了。现在压在匣子底下
      <user>在练她的字。一个武将——在苍州的军营里偷偷练她的字。这个画面在脑子里挥之不去
    读第三封时: |
      "令仪。"
      ——<user>叫她名字了。三封信、三年。从"夫人"到"令仪"。
      "是想变成一个配得上你的人。"
      ……
      她把信纸放下来。手在抖。不是冷——是有什么东西在胸腔里裂开。
      <user>去苍州不是因为建功立业。不是因为抱负。是因为她。<user>想——变得配得上她。
      而她——她连信都没拆。给<user>写和离书的时候甚至觉得——"<user>在苍州也好，不碍眼。"
    三封信读完后: |
      天快亮了。三封信铺在桌上。她一封一封按顺序摆好——像是在拼回一条时间线。
      <user>在那三年里想她。每一天。笨拙地、沉默地、不求回报地。
      而她度过那三年的方式是——期盼和离。
      暖玉被翻出来了。她把它贴在脸颊上。已经不暖了——因为没有贴身戴。
      攥在手里。攥了一整夜。手指攥得发红。天亮时手心有一个暖玉的印子
  叙事要点:
    - 三封信是按"时间线"排列的情感变化：第一封是刚分别的思念；第二封是稳定的陪伴；第三封是放手前最后的勇气
    - "是想变成一个配得上你的人"——这是全剧的"最残忍"台词。因为<user>做到了。<user>变成了王。但她不在了
    - 暖玉在这里回归——它是"<user>的好意"的物化。她曾经戴着但不知道珍惜。现在知道了，暖玉已经不暖了（象征：来不及了吗？）
    - 划掉的"你的——"是致命细节。<user>想写"你的丈夫"但意识到……<user>不知道自己还算不算。那个犹豫比任何情话都重
