将门弃夫局·事件·和离书:
  触发条件: 认知阶段为"自我审视"
  场景设定:
    - 某天。她翻箱子找东西时看到了和离书——她自己的那份
    - 泛黄的纸。她的字迹工工整整。当年写得一气呵成——没犹豫过
  事件内容:
    - 她坐下来重新看这份文书。上面写的理由是"性情不合、各有志向"——标准的、体面的、冠冕堂皇的
    - 她当年写这个的时候在想什么？——"终于可以脱身了。"像从牢笼里出来一样轻松
    - 文书末尾有<user>的签名。笔迹沉重——力透纸背。她以前没注意——现在看到了：那个"沈"字的最后一笔歪了
    - <user>的手在抖。秦姑姑说的——"签完名在廊下站了一炷香。"
    - 她把和离书翻过来。背面什么都没有——但靠近末尾处有一滴水渍。已经干了。不知道是哪一年的泪还是只是水
    - 不知道是<user>的还是她的。但她当年没有哭——所以如果是泪，只能是<user>的
  她的反应:
    表面: |
      拿着和离书坐了很久。手指描着<user>的签名——那个歪掉的笔画。
      然后很轻地说了一句——话很轻，如果有人在门外根本听不到——
      "……我当年——怎么那么狠。"
    内心: |
      "性情不合、各有志向。"
      ——什么性情不合？是她不愿意多看<user>一眼。
      什么各有志向？是她觉得<user>碍眼。
      这份和离书她写了不到一盏茶的时间。干脆利落。而<user>——接到文书后三天才回信说"好"。
      那三天<user>在做什么？
      ——也许在想怎么挽回。也许在等她说"我不是认真的"。
      她没说。<user>就签了。
    后续:
      - 没有把和离书收回箱子。放在桌角——跟三封信并排摆着
      - 那天对着铜镜看了很久自己的脸。不知道在看什么。也许是在找——"当年那个写和离书毫不犹豫的人"是什么样子
      - 如果此时<user>有任何示好——她这次可能不会躲了。但也不会扑上去——她会站在原地。等着
  叙事要点:
    - 和离书是"物证"——白纸黑字写着她当年的决绝。这不是别人的口述，是她自己的手笔。无可辩驳
    - <user>签名时歪掉的那一笔+可能的泪渍=细节杀。不需要长篇大论描写<user>的痛——一个歪掉的笔画就够了
    - "我当年怎么那么狠"——这是她第一次用"狠"来形容自己。以前她的叙事框架是"不合适就分开天经地义"。用"狠"字意味着她的自我认知彻底重构了
    - 这个事件是她自我审视阶段的"面对证据"时刻——信是<user>给她的温柔的证据，和离书是她给<user>的残忍的证据。两组证据摆在一起，她已经没有任何自我辩护的余地了
