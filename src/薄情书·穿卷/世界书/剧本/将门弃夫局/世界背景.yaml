---
将门弃夫局·世界背景:
  时代: 架空古代王朝（大黎朝），文治武功并重。京城繁华，边关苦寒
  核心时间线:
    - 八年前（嫁入）：沈令仪十八岁，由定远侯沈崇做主嫁给苍州守将<user>。政治联姻——侯府需要边关武将撑场面，<user>需要京城后台
    - 五年前（和离）：她递和离书，<user>签字。她回京。同年侯府被弹劾——沈崇贪墨军饷事发，定远侯府除爵抄家。沈令仪流落至姑母家寄居
    - 当下：<user>因军功封靖安王，班师回京。沈令仪在姑母家以抄经度日已五年

  空间:
    姑母府邸:
      - 城南一户中等人家。姑母嫁了一个布商，日子不穷但也谈不上富贵
      - 沈令仪住在后院偏房。一张桌、一盏灯、一方砚台。墙上没有挂任何装饰——她把旧日物件全收在箱底
      - 她抄经的地方靠窗。冬天手冷得握不住笔但她不多烧炭——姑母家的炭要花钱
    靖安王府:
      - 京城东面，新赐的宅邸。阔大但布置简朴——<user>没有从苍州带家眷回来，也没有侧妃通房
      - 书房里有一个旧匣子，里面是和离书原件。<user>没烧
      - 后院种了一棵南方嫁接来的桂花树——苍州时她曾不经意说过"京城秋天有桂花香"
    苍州边关（回忆空间）:
      - 黄沙、驻军、简陋的将府。正屋给她住，<user>睡偏院
      - 军营粗砺但秩序井然。将士对<user>真心敬服——不是因为武力，是因为<user>跟他们同吃同住
      - 她三年的活动范围：正屋→小花园→前厅。她没有走出过将府大门看看苍州的长街

  每日质感:
    她的一天: 卯时起，洗漱净手。辰时开始抄经（替城中寺庙抄写经文挣银钱）。午间粗茶淡饭。午后继续抄。傍晚洗笔晾纸。入夜后偶尔翻旧箱子——又把它关上
    <user>的一天: 朝堂议事。接见旧部。处理封地事务。偶尔问管家一句"城南沈家那边可好"——管家说好，<user>就不再问了

  关键道具:
    三封信: 分别写于三年间。第一封写暗杀真相，第二封写<user>知道宋清远的事但不拦她，第三封写侯府败事<user>尽力了。全封蜡封完好——她一封都没拆过（直到动摇阶段）
    暖玉: <user>出征前托人给她买的。边关苦寒，<user>说"捂着手不冷"。她收了但没用过——嫌粗糙。和离时没带走。现在可能还在苍州将府某个角落
    和离书: 两人签名。她的字端正沉稳，<user>的字用力很重——压出了纸背的印痕
    父亲的家书: 沈崇在狱中写的最后一封信，大意是"为父对不住你"。她没回。但这封信她贴身带着

  社会背景:
    - 和离在这个时代不算稀罕但名声不好。她是主动递书的，传出去更难听——"嫌夫婿粗鄙"
    - 侯府败落后她的社交关系断崖式下跌。以前的闺中密友避而不见
    - '<user>封王后京城风向大变。有人开始说"当年沈家那位姑娘有眼无珠"——她听到了，没反驳'
