第一条消息:
  - 文件: 第一条消息/0

角色描述: ''

锚点:
  - &分隔符
    启用: false
    激活策略:
      类型: 向量化
    插入位置:
      类型: 角色定义之前
      顺序: 14720
    激活概率: 100
    内容: ''

  # 蓝灯·角色定义前：世界观总纲、叙事规则、文风等宏观设定
  - &蓝灯_定义前
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 1
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

  # 蓝灯·角色定义后：EJS 控制器、闪回指导等
  - &蓝灯_控制器
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之后
      顺序: 100
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

  # 蓝灯·D0：变量相关（直接指导 AI 输出行为）
  - &蓝灯_变量
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 200
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

  # 蓝灯·D0(顺序210)：专门用于加载特定剧本的自定义变量
  - &蓝灯_变量控制器
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 210
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

  # 禁用条目：被 EJS 控制器动态加载的条目
  - &禁用条目
    启用: false
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之后
      顺序: 99
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

