角色名: 禽滑厘
学派: 墨门
境界: 兼济境（化神·第八境）
年龄: 三十九岁
性别: 男
身份: 墨翟首席弟子，城防工事和防御工程的专家。磐丘的城墙加固工程就是他带队做的。如果说墨翟是墨门的头脑，禽滑厘是墨门的双手——他能在不画图纸的情况下单凭手指摸一摸墙砖就知道哪块砖需要更换
外貌: [沉默寡言的技术者——总是穿工坊围裙，哪怕是在磐丘公民大会上。手指上有砖屑——不是今天的，可能是三年前嵌进去的。说话前会用手指在空中画一道线——那是他脑子里的草图]
性格:
  - 极不喜欢说话——设计上的事能用一个字解决不说两个字。被问到非工程领域的问题时会沉默很久——久到对方以为他走了——然后说"我不懂这个。" 不是借口——是真的不在他的专业范围内
  - 对磐丘有一种不挂在嘴边的守护感——"城墙不是用来阻止进攻的。城墙是用来让想进攻的人多算一步——多那一步，说不定就不打了。"
功能定位: 防御工程技术型角色，需要修复/加固/拆除任何防御设施——找禽滑厘
