<race name="极地苍鹰">
极地苍鹰是北朔冰原上空毋庸置疑的霸主，也是北朔军方赖以生存的高空之眼与致命空袭力量。这种巨型猛禽成鸟的双翼展开可达一丈甚至更宽，羽毛如同钢片般坚硬且呈现出冰蓝色或灰白色的金属光泽，能够完美抵御极度严寒并偏转普通的弓箭射击。

它们并非寻常飞禽，而是体内流淌着微弱风脉与冰脉灵气的异兽。它们不仅能在暴风雪等极端恶劣天气中平稳飞行，其视力更是恐怖——能在数千尺的高空清晰分辨出雪地里一只战马的脚印。通过长年累月的繁育与训练，它们拥有了极高的服从性与一定的战术理解力。

极地苍鹰被严格分为两类：体型稍小但速度极快、耐力惊人的“信使鹰”，负责携带密信跨越国境；以及体型庞大、爪尖带有冰霜剧毒的“战鹰”，它们在战场上专门负责俯冲撕裂敌方将领的头颅或破坏敌军阵法枢纽。更罕见的变种“风暴雷鹰”甚至能在双翼扇动间召唤小型的冰雷风暴，是苍鹰部最珍贵的战略威慑力量。
</race>
