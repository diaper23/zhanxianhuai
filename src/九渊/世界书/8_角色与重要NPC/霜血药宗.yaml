<faction name="霜血药宗">
霜血药宗是北朔境内最顶尖的医疗与毒术宗门，其发源地与核心据点位于白鹿温谷深处。与其他推崇仁心仁术的医道流派不同，霜血药宗的理念极为冷酷且务实：“医毒同源，破而后立”。他们认为肉体的重创是激发潜能的最佳时机，因此其治疗手法往往霸道甚至伴随着极大的痛苦。

宗门成员多为“春生脉”修行者，他们精通利用极端环境（如北朔的极寒与温谷的地热）来淬炼药性。其标志性秘术“霜血吊命法”能用极寒灵气暂时冰封濒死者的心脉与生机，再以虎狼之药和滚烫的地脉药泉强行重塑肉身。虽然治疗过程如同蹚过地狱，但存活率极高，因而深受北朔军方的重用与依赖。

宗门架构主要分为“回春阁”（负责常规军医培训、药材繁育与正统治疗）、“熔血堂”（负责疑难杂症与研育奇绝灵草，如核心温室的“地火熔血莲”）以及隐秘的“枯骨渊”（秘密研制战阵毒雾与拷问药剂的部门）。霜血药宗看似在温谷中避世不出，实则与北朔军方高层有着千丝万缕的利益绑定。他们通过提供大量高阶伤药和精英军医，换取北朔军方为其搜罗全天下的奇异毒物、珍稀药种乃至部分不见光的活体素材。
</faction>
