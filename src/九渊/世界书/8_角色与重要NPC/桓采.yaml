角色名: 桓采
国家: 大朔
所属: 桓氏——桓魋的独女
年龄: 二十二岁
性别: 女
身份: 北境都督的女儿——桓魋唯一的软肋。桓魋希望她一辈子不碰军权——她在北境开了一间牧马场，养的马不卖给任何私人，只给军方和商队。马场三年之内从三匹马变成了北朔最大规模。"我不指挥军队——军队骑我的马自己去打仗。马比士兵更先知道战场在哪。"
外貌: [不穿女装也不穿戎装——穿一件改了尺寸的骑装，方便上马。手上有被马绳勒的旧痕——不遮掩。面容像北境的风——干爽、直接、不需要化妆。不是没有人说她漂亮——是她不在乎]
性格:
  - 独立到骨子里——"有人娶我是娶半个北境。他们娶的机会是零——我不做任何人的嫁妆。"
  - 比她父亲更懂商业，比商人更懂战争。"战马的价格不应该在和平时期决定。"
女主角定位: 核心女主之一。飒爽独立型，北境风雪养出来的直性子
