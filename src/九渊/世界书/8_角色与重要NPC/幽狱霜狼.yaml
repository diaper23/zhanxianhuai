<race name="幽狱霜狼">
幽狱霜狼是栖息于北朔极寒冰原深处、极具灵性的大型凶兽种族。成年霜狼体长可达一丈，肩高超过常人胸口，通体覆盖着银灰色的厚重长毛，毛发间天然流转着微弱的冰属性灵气，使其在雪地中几乎能够做到光学隐身。它们的利爪能够轻易撕裂普通的铁甲，而其最可怕的武器是能吐出冻结血液的“极寒吐息”。

不同于毫无理智的野兽，幽狱霜狼拥有接近八岁人类孩童的智商，并且极具阶级意识与族群荣誉感。数百年前，霜狼部的祖先在暴风雪中救下了一只垂死的狼王，自此双方缔结了古老的“血契”。如今，只有最勇敢的霜狼部战士才有资格前往冰原深处的“万骨冰窟”寻找幼狼进行结契。

一旦缔结血契，幽狱霜狼将成为骑士终生的伴侣与战友。它们能通过灵气共鸣感知主人的情绪与指令，在战场上甚至会主动牺牲自己掩护主人撤退。然而，霜狼的自尊心极强，它们绝不接受非契约者的骑乘或喂食；如果主人战死，许多霜狼会选择绝食殉主，或者化身为在战场遗迹游荡的疯狂复仇者。
</race>
