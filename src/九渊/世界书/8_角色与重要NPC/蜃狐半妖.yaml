<race name="蜃狐半妖">
蜃狐半妖是北朔特有的一支亚人种群，主要聚居于雪狐温谷及周边商道。他们的外貌保留了大量人类特征，但长有毛茸茸的狐耳与一条（罕见者为多条）蓬松的狐尾，瞳孔在兴奋或施法时会竖立成狐狸般的细缝，且身上天生带有一种极淡却能影响心智的奇特异香。

与以武力见长的其他北朔部族不同，蜃狐半妖在肉体力量上极为孱弱，但他们是天生的精神系与幻术系修行者。他们不仅拥有过目不忘的记忆力，更擅长施展名为“海市蜃楼”的微型心智幻术。在商贸谈判中，他们能通过幻术放大对手的贪婪或恐惧，从而在价格交锋中占尽上风；在鉴别货物时，他们的感知能轻易穿透伪装，辨别出灵矿的真伪与纯度。

因为这种狡黠与天赋，蜃狐半妖在【极光商会】中身居高位，几乎垄断了高端鉴定师与谈判代表的职位。然而，在崇尚绝对武力的北朔社会底层，他们常被其他部族的战士鄙视为“只会耍嘴皮子的软弱狡兽”。尽管如此，当一位大朔的富商在谈判桌上被蜃狐半妖微笑着掏空了最后一个铜板时，没人敢小看这些毛茸茸的“弱者”。
</race>
