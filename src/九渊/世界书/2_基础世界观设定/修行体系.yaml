通用境界框架:
  概述:
    九渊世界一切修行途径——无论七大学派、旧气脉（以'关'而非'境'衡量）、心炉或冥契——在学术讨论和跨途径比较时，可映射到统一的十一层通用境界框架。
    此框架并非人为设计——它由渊息本身的十一层渗透梯度决定：九渊九层加上地表和天穹残迹，共十一层灵气过滤梯度。修行者自地表始，逐层向更深处的灵气源头靠近。
    每一通用大境界内分四小境界：初期→中期→后期→巅峰。

  通用十一境:
    凡胎境: 第〇境 —— 凡人肉身，一切修行之起点。寿命不过百年，力气不过百斤。会饿、会冷、会病、会死
    启灵境: 第一境 —— 灵性初启。修行者开始感知到'气'或'道'或'势'或'火种'或'回响'的存在
    筑基境: 第二境 —— 根基奠定。修行所需的底层通路被打通或构建
    凝脉境: 第三境 —— 通路稳固。力量运转从'偶然'变成'必然'
    化炁境: 第四境 —— 力量质变。灵气或替代能源从'不纯'转为'纯粹'
    结丹境: 第五境 —— 核心成形。体内凝结出稳定的力量核心（金丹/仁核/心炉/契痕核心等）
    元婴境: 第六境 —— 内我诞生。修行者可以在体内观照自我
    出窍境: 第七境 —— 内我出体。意识或力量可以超越肉身范围
    化神境: 第八境 —— 身心合一。灵肉界限开始模糊
    合道境: 第九境 —— 与道共振。修行者的存在本身成为法则的一部分
    超脱境: 第十境 —— 传说境界，超越修行体系本身。无人可以证实

  说明:
    - 本通用框架仅用于跨途径比较和学术讨论（如郢丘的辩论中作为'通用语'）。实际叙事中，跨途径角色不说'我是结丹境'而说'我是修身境'或'我的炉子到了锻骨'。
    - 旧气脉体系不被此框架直接衡量——气脉不用'境'而用'关'（见气脉修行条目）。在学术语境中将气脉九关勉强映射到通用十一境以供参考，但此映射本身就是对气脉本义的扭曲——气脉天衡宗不承认此映射。



十道途索引:
  概述: 九渊世界存在十种修行途径——七大学派、旧气脉、心炉、冥契。
  儒门 —— 养浩然气:
    核心: 以道德践履滋养浩然正气。行善气增，行不义气损。力量至纯至刚，克制阴邪
    境序: 凡胎→志学→格物→诚意→正心→修身→齐家→治国→平天下→参天→圣人
    通用映射: 凡胎(0)→志学(启灵1)→格物(筑基2)→诚意(凝脉3)→正心(化炁4)→修身(结丹5)→齐家(元婴6)→治国(出窍7)→平天下(化神8)→参天(合道9)→圣人(超脱10)
    破境: 靠道德践履与浩然气积累。德亏值过高则无法突破。破境条件均为道德考验（公开认错→格物三问→三月不欺心→自我牺牲→匿名善举→调解积怨→行政改革→改变国家制度→一生无憾→不明）

  道宗 —— 观象合真:
    核心: 与天地节律共振，不主动吸取灵气——灵气自然流入。力量表现为内在安定，攻击打在身上被消解
    境序: 凡胎→观象→守一→合气→炼精→结丹→元婴→出神→忘我→归真→无待
    通用映射: 凡胎(0)→观象(启灵1)→守一(筑基2)→合气(凝脉3)→炼精(化炁4)→结丹(结丹5)→元婴(元婴6)→出神(出窍7)→忘我(化神8)→归真(合道9)→无待(超脱10)
    破境: 靠感知自然节律。心斋值过低则灵气共振断裂。突破依赖与自然的深度同化（山野静坐→守一波→与暴风同频→炼丹炼化→息极结丹→温养元婴→元婴离体→忘我借象→成为节律→逍遥）

  释家 —— 禅定明心:
    核心: 通过禅定破除执念，照见自性。不依赖外部灵气。高境者不可被迷惑/侵蚀
    境序: 凡胎→发心→持戒→坐禅→初禅→二禅→三禅→四禅→空观→见性→觉者
    通用映射: 凡胎(0)→发心(启灵1)→持戒(筑基2)→坐禅(凝脉3)→初禅(化炁4)→二禅(结丹5)→三禅(元婴6)→四禅(出窍7)→空观(化神8)→见性(合道9)→觉者(超脱10)
    破境: 靠破除执念。执障过高则禅定无法深入。突破依赖禅定功夫（七日坐禅→持戒一年→十二时辰不换腿→离欲→内触妙乐→离喜得乐→不苦不乐→照见五蕴皆空→明心见性→成佛）

  法家 —— 格物量化:
    核心: 修行如法律般标准化、可量化、可复制。天赋不应决定上限。同境同规程者战力差不超过5%
    境序: 凡胎→识法→律己→立规→立法→立制→执衡→定分→宪天→垂法→法身
    通用映射: 凡胎(0)→识法(启灵1)→律己(筑基2)→立规(凝脉3)→立法(化炁4)→立制(结丹5)→执衡(元婴6)→定分(出窍7)→宪天(化神8)→垂法(合道9)→法身(超脱10)
    破境: 靠完成标准化修行规程。偏差值过高则灵气输出不稳。突破依赖规程执行（通过资格考试→百日无偏差→三年规划→为五人定规程→推行制度→处理制度危机→跨国法典→元规则→千年基石→规则化身）

  墨门 —— 制器利天下:
    核心: 制造即修行。在锤炼材料中锤炼自身，在设计结构中理解天地法则。随身带工具箱
    境序: 凡胎→识器→学徒→匠师→大匠→工圣→造化→开物→兼济→天工→道器
    通用映射: 凡胎(0)→识器(启灵1)→学徒(筑基2)→匠师(凝脉3)→大匠(化炁4)→工圣(结丹5)→造化(元婴6)→开物(出窍7)→兼济(化神8)→天工(合道9)→道器(超脱10)
    破境: 靠成功制造器物。工债（未完工项目）过多则修行效率下降。突破依赖制造成就（独立制器→按图制十件→首创器物→触通忘我→器物教化使用者→意外良性效果→提炼通用原理→改变十万人生活→器物即法则→器物即道）

  兵家 —— 战意淬体:
    核心: 生死一线间潜力被逼到极限，静坐一年不如一场恶战。力量无固定形态，极难预判
    境序: 凡胎→习战→新卒→百夫→战将→兵主→知己→知彼→不战→止戈→战神
    通用映射: 凡胎(0)→习战(启灵1)→新卒(筑基2)→百夫(凝脉3)→战将(化炁4)→兵主(结丹5)→知己(元婴6)→知彼(出窍7)→不战(化神8)→止戈(合道9)→战神(超脱10)
    破境: 靠实战极限突破。透支度过高则身体崩溃。突破依赖战场成就（扛输不溃→实战存活→三次本能正确决策→指挥百人胜→打赢不该赢的仗→完成不可能任务→预测敌将决策→不战屈人→打完不再需要打→以战争与天地对话）

  纵横家 —— 观势借力:
    核心: 感知和引导人与人、国与国之间的力量流动。一场战争可能在开打前三五年就被决定了胜负
    境序: 凡胎→观微→揣摩→飞箝→阖捭→转丸→结网→执枢→造势→本经→无形
    通用映射: 凡胎(0)→观微(启灵1)→揣摩(筑基2)→飞箝(凝脉3)→阖捭(化炁4)→转丸(结丹5)→结网(元婴6)→执枢(出窍7)→造势(化神8)→本经(合道9)→无形(超脱10)
    破境: 靠成功引导现实中势力流向。因果链断裂则修行效率下降。突破依赖谋略成就（预测小事件→准确判断对方真实立场→引导决策→三方连环操作→维持三年因果链→织成三国五年因果网→以沉默影响局势→创造自行运转的大势→成为势本身→无形无迹）

  旧气脉 —— 天人古道（以'关'衡量，不用'境'）:
    核心: 最古老的修行方式。无学说、无世界观——只告诉你灵气怎么走。依赖天赋（灵根九品不可后天提升）和师承（频率需匹配，一人最多三徒）。天闭后灵气来源从九重天切为九渊渗透——旧气脉遭受不可逆重创
    关序: 凡胎→启窍关→引息关→通脉关→辟府关→凝元关→开玄关→冲虚关→御气关→化虚关→天人（关后·传说）
    通用映射（仅学术参考，天衡宗不承认）: 凡胎(0)→启窍(启灵1)→引息(筑基2)→通脉(凝脉3)→辟府(化炁4)→凝元(结丹5)→开玄(元婴6)→冲虚(出窍7)→御气(化神8)→化虚(合道9)→天人(超脱10)
    冲关: 靠天赋+师承。不是"破境"是"冲关"——冲过去还要一直走功，停在关口经脉会回缩。启窍需师长灵气入体点窍（频率必须匹配，否则经脉撕裂）；引息需首次独自完成小周天；通脉需在师长监护下完成大周天（失败则经脉反噬躺三个月）；辟府需连续七天不睡觉向丹田注灵气；凝元需用意念"冷却"丹田液化灵气；开玄需自己找到体内玄关并冲开（有人一辈子找不到）；冲虚需神识标记追踪活物；御气需用意念操控外部灵气推动实物；化虚——唯一在世者陆怀远，他也不知道自己怎么冲的

  心炉 —— 燃情铸炉:
    核心: 以情感和意志为薪柴，在丹田中"生"出一座炉子。完全不依赖外部灵气——任何人都可能生出心炉，只要经历过足够强烈的情感。东屿灵气稀薄处诞生
    境序: 凡胎→触火→聚薪→生炉→控焰→锻骨→淬魂→炉照→纯青→薪尽→永燃
    通用映射: 凡胎(0)→触火(启灵1)→聚薪(筑基2)→生炉(凝脉3)→控焰(化炁4)→锻骨(结丹5)→淬魂(元婴6)→炉照(出窍7)→纯青(化神8)→薪尽(合道9)→永燃(超脱10)
    破境: 靠燃烧情感。薪柴值归零则心炉熄灭（烬灭：身活神死）。突破依赖情感/意志考验（捕捉情绪中的丹田热度→维持热度一整天→将摧毁性打击转化为燃料→用意念控焰→掌心熔化金属→冷热极速切换三次→点燃他人的熄灭心炉→连续燃烧一个月→燃料耗尽火仍烧→死后炉火不灭）
    铁律: 保护弟子。不兼修——引入外部灵气会引发心炉爆炸

  冥契 —— 契灵共息:
    核心: 与深渊之下被封印的上古存在建立精神缔约。契灵不是工具，是对等主体。在南烬合法，在大朔和西戈为非法（可处死）
    境序: 凡胎→聆渊→辨音→契约→共息→借力→同体→双魂→溯源→化渊→开禁
    通用映射: 凡胎(0)→聆渊(启灵1)→辨音(筑基2)→契约(凝脉3)→共息(化炁4)→借力(结丹5)→同体(元婴6)→双魂(出窍7)→溯源(化神8)→化渊(合道9)→开禁(超脱10)
    破境: 靠与契灵深化共鸣。契约深度不可逆上升，满100则被同化。突破依赖缔约深度（封印薄弱处静坐聆渊→契灵主动回应→鲜血缔约→完成双息交换→三次安全借力→契灵主动开放感知→十息内换位归来→契灵自愿展示上古记忆→融合为共生体→操控封印局部——禁术）
    铁律: 不兼修——契灵排斥所有其他修行方式。缔约不可逆

  散修:
    核心: 未加入任何途径的独立修行者。大多沿用旧气脉残缺传承，或开创偏门功法（进境快但反噬重）。巅峰通常不超过凝脉境（第三境）。渊下野异变散修可能因灵气紊乱而发生不可预测的经脉重组——可能获得超常能力，也可能经脉全毁，最终多自燃而亡

  兼修速查:
    可兼修: 儒法（大朔官员标配）、兵法（西戈模式）、墨法（技术官僚）、道释（南烬隐者）、气脉儒门（大朔世家）
    不可兼修: 儒道（入世vs出世）、纵横儒（信用冲突）、兵释（杀vs不杀）、心炉气脉（物理排斥——外灵入炉则爆）、冥契任何（契灵排斥一切外源修行）
