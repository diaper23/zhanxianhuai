时间体系:
  纪元: 渊历（九渊正历）——以远古渊息观测者计渊氏在龙脊山首建观渊台、完成第一个完整渊息周期测定之年为渊历元年
  前渊历: 渊历元年之前的年份以"前渊历 XX 年"逆推计数
  天闭之年: 九重天封闭、九渊封印设立之岁——发生于渊历 2100 年，距今约 2950 年
  当前年份: 渊历 5050 年
  历法详情: 十二月（端萌畅盈炽溟敛肃凝寂藏穷）、四息（升盛敛藏）、二十四渊候、年终穷日等

关键历史节点（所有年份均为渊历纪年）:
  - 渊历 2100 —— 天闭之年：九重天封闭，九渊封印设立。所有关于天界的记载同时消失，原因不明
  - 渊历 2100~2200 —— 大崩坏时代：修行体系全面崩溃（天界灵气断绝），旧秩序瓦解，人口锐减。幸存者从废墟中重建文明
  - 渊历 2200~2400 —— 重建时代：气脉体系在废墟中重新建立（灵气来源从"天界"切换为"九渊渗透"）。大朔雏形形成，首批封印守护者出现
  - 渊历 2400~2900 —— 大朔兴起：中原统一，九渊盟成立。气脉体系被正式确立为正统
  - 渊历 2550 —— 心炉诞生：第一批心炉行者出现在东海贫瘠岛屿。灵气稀薄的环境中有人找到了不依赖灵气的修行方式。心炉体系在后两百年间从东海扩散
  - 渊历 2700 —— 冥契者发现：南烬地区出现第一批与上古存在建立共鸣的修行者。大朔和九渊盟将其定性为异端
  - 渊历 2950 —— 南烬建国：南方嬴氏统一南境各部，以"上古直系"自居，冥契体系合法化。大朔发兵南征，在"赤野之战"中惨败——这是大朔第一次在对外战争中失利
  - 渊历 3100 —— 铭痕技术起源：铭痕技术从姜氏工匠的实践中萌芽。最初只是对上古封印纹路的拙劣模仿，但逐渐发展为实用体系
  - 渊历 3200~3500 —— 铭痕军备竞争：各国意识到铭痕技术可以量产装备军队。西戈最先大规模应用，军力爆发
  - 渊历 3300 —— 大朔—西戈首战：西戈首次挑战大朔霸权，双方在西部边境交战三年，以和谈结束。西戈虽未获胜但已证明能与大朔抗衡
  - 渊历 3600 —— 天衡宗独立：天衡宗从大朔朝廷控制下脱离，宣布"修行认证不受皇权管辖"。大朔皇帝被迫承认——天衡宗掌握了气脉修行者的品级认证权
  - 渊历 3900 —— 北朔联盟形成：雪域七部在外部压力下组成联盟。此前七部各自为政，是大朔和西戈的扩张促使他们联合
  - 渊历 4200 —— 东屿联盟形成：千岛海商首次召开"岛主大会"，形成非正式的统一对外政策
  - 渊历 4500 —— 冥契会谈：南烬与天衡宗进行秘密会谈，试图让冥契体系获得部分承认。会谈内容至今未公开，但此后南烬与天衡宗之间维持着微妙的非官方渠道
  - 渊历 4700 —— 心炉盟形成：各地心炉行者开始在东海岛屿建立非正式互助网络。不是组织，更接近于"有困难找过来人"的口头约定
  - 渊历 4800 —— 渊鸣事件：渊下野所有冥契者在同一天感知契灵发出相同共鸣频率——持续七天七夜。事后无人能解释原因
  - 渊历 4900 —— 渊下野成型：封印薄弱区域的灵气紊乱达到临界，各国先后撤出驻军，默契形成。渊下野的非正式秩序（断罪者/渊守人/墟市）在此后两百年间逐渐确立
  - 渊历 5000 —— 西戈新霸崛起：西戈完成军制改革，三大商团与军方全面融合。以"封印不应由一国垄断"为名重启对大朔的挑战
  - 渊历 5050 —— 当前：大朔与西戈在边境持续对抗。南烬内部"开禁派"壮大，厉氏将领在边境频繁挑衅。北朔和东屿观望，渊下野暗流涌动

反复出现的模式:
  - 每逢大国对抗加剧，冥契者活跃度上升——封印松动可能与之相关
  - 心炉行者的数量在战争和灾难时期暴增——人在绝境中更容易凝聚心炉
  - 铭痕技术的每一次重大突破都发生在军备竞赛时期
  - 天衡宗在大事件中始终保持中立立场，但其高层与各国世家的个人关系无法割裂
