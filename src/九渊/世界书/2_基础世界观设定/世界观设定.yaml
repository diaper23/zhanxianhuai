世界框架: 古典仙侠架空世界，名"九渊"
世界结构:
  - 天有九重：九重天为上古天界，天闭之年（渊历 2100 年）突然封闭，三万年来无人再能抵达
  - 地有九渊：大地之下九层深渊，第九渊镇压着上古时代被封印的存在
  - 人间界：天渊之间的凡世，灵气自深渊裂隙中渗透而出，是万物修行的根基

灵气来源:
  - 灵气不来自天界，而来自九渊之下的渗透——修行本质是从封印裂隙中汲取逸散之力
  - 灵气浓度由封印状态决定：封印稳固处灵气稀薄（如东屿群岛），封印薄弱处灵气浓郁但紊乱狂暴（如渊下野）

核心矛盾:
  - 封印的真相：大朔官方称封印是上古诸圣舍身所设；南烬称封印是篡改历史的谎言；七大学派各有解读
  - 封印该不该动：大朔主张维持现状；南烬主张揭开真相；冥契者认为封印之下才是真实；学派间争论不休
  - 霸国争锋：大朔（守成霸主）vs 西戈（新兴挑战者）是当前主矛盾；南烬积蓄力量；北朔与东屿观望
  - 学问与权力：七大学派的学者周游列国推销学说——君主选择学派，学派也在选择君主。这一模式改变了整个世界的权力格局

七大学派速览:
  - 儒门：养浩然气，以道德践履滋养正气，德亏则气衰。封印应由有德者守护，主张六国共管封印
  - 道宗：观象合真，与天地节律共振，上善若水不争而胜。封印是干预自然，顺其自然不妄动
  - 释家：禅定明心，破除执念照见本性。封印与封印之下之物皆为相。利用封印制造杀戮则必出手阻止
  - 法家：格物量化，将修行拆解为标准步骤，不依赖天赋。封印应纳入法律制度框架
  - 墨门：制器利天下，制造即是修行。封印是上古圣贤留下的器物，应被研究维护而非一国垄断
  - 兵家：战意淬体，生死一线是最好的修炼。封印是战略要地，只关心军事后果
  - 纵横家：观势借力，感知力量流向，合纵连横。封印是博弈筹码，不表态只帮助各方争取最大利益

十二国格局:
  六大国:
    - 大朔：中原旧霸，皇帝—门阀共治，儒门+法家国策。文化输出力极强，积弊也最深
    - 西戈：西陲强藩，军功爵+商业寡头，兵家+法家+墨门国策。最年轻的大国，军事最强但文化自卑
    - 南烬：南方古邦，神权君主制，道宗+释家国策。上古直系后裔，封印态度与中原截然相反
    - 北朔：雪域诸部联盟，冰脉是气脉在极寒中的自然变异。七部共治，正在向统一国家转型
    - 东屿：千岛商盟，寡头共和，墨门+纵横家国策。不以领土军队立国，以商船航线维生
    - 渊下野：无主之地，封印最薄弱处，逃亡者最后的庇护所。六国在此不动用军队是唯一共识
  六小国: 梁川（缓冲国）、越棘（丛林代理战场）、磐丘（山路要塞）、商於（商业城邦）、涪陵（水网泽国、学者隐居地）、郢丘（文化圣地、学界最高论坛）

四大宗门势力:
  - 天衡宗：旧气脉体系的活化石，修行史重镇，七大学派之争中保持中立，山门在大朔境内但不受管辖
  - 心炉盟：心炉行者互助网络，非组织化的组织，旧心炉体系的精神继承者，活跃于东屿和渊下野
  - 冥契会：以契灵感应为纽带的秘密结社，与南烬嬴氏有千丝万缕联系，在南烬之外被定为非法
  - 隐元阁：跨国情报—商业组织，名义上经营古籍铭痕器，实则贩卖情报，在六大国十二区域均设分号

社会秩序:
  - 学派的游说改变了旧有"修行者高于凡人"的等级结构——各家学说对修行者与凡人关系有不同定义
  - 世家门阀同时掌控修行传承和政治权力，寒门通过法家标准化修行或墨门技术培训争取上升空间
  - 各国体制差异巨大，学派流动使文化和技术在敌对国之间传播
  - 郢丘是唯一各国学者可自由汇聚、不受母国立场约束之处——"郢丘之辩"是学界最高荣誉

大国担当与小国生存:
  - 六大国各扛一条人族防线：大朔镇渊关、西戈铭痕军工、南烬封印沟通、北朔极北防线、东屿海上航路、渊下野渊守人
  - 六小国各有活法：梁川保粮、越棘祖训、磐丘守路、商於立约、涪陵济流民、郢丘存学脉
  - 正常国家有清官也有贪官，有明君也有昏君；判断标准只有一个——为民还是害民
  - 每国都有2~3个"顶着人族往前走的人"——不完美，有私心，但关键时刻不跪；玩家要学会认出、追随、或成为他们
