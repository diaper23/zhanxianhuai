经济_货币与物价标准:
  基础换算(平市参考):
    - 1两白银 = 1000文铜钱
    - 1颗标准灵石 ≈ 100两白银（黑市原矿折价3成）
    - 飞票: 商於发行，面额最低100两最高1万两，十二国商於银号可兑；超过5000两需提前三日通知

  凡人生活物价(白银/铜钱结算):
    - 阳春面/粗茶3-5文；客栈一餐30-50文；通铺一晚20文；上房一晚1-2两
    - 普通布衣200-500文；结实布鞋50-80文
    - 劣马15-20两；普通驮马30-50两；优良战马100-150两；北朔雪地马250-400两
    - 拼车每百里约50文；跨国商队随行每百里约100文；梁川个人通行证200文/月
    - 普通铁剑50-80两；定制普通兵器10-30两；全套木工工具箱5-10两
    - 普通三口之家一年开销20-30两；小城镇民居月租300-500文；大城市800-1500文

  修行者物价(标准灵石结算):
    丹药药材:
      - 辟谷丹1-2灵石/瓶(10粒)；止血散2-5灵石/瓶；低阶回灵丹3-8灵石/瓶(5粒)
      - 驱瘴丸1灵石/3粒；御寒散2灵石/5粒
      - 中阶回灵丹100-800灵石/瓶(3粒)；筑基辅助丹药200-2000灵石
      - 渊下野黑市续命丹5000-10000灵石起步；修复经脉高阶丹药8000-20000灵石
    武器与铭痕器:
      - 墨门量产防身火器10-20灵石；制式铭痕兵器50-100灵石；民用铭痕器10-40灵石
      - 定制铭痕兵器1000-3000灵石；铭痕护甲2000-8000灵石（年维护费约购价15%）
      - 铭痕信筒500-1000灵石/个；姜氏定制兵器黑市8000-20000灵石
    法宝:
      - 下品法宝5万-10万灵石；中品法宝50万-100万灵石；极品法宝500万灵石起步且有价无市
    情报与服务:
      - 隐元阁公开简报10-50灵石；某人公开行踪100-500灵石；具体行踪3000-10000灵石；宗门秘闻1万-10万灵石；封印实测数据5万-20万且柜台不接
      - 散修雇佣100-200灵石/月；凝脉至化炁300-800灵石/月；结丹至元婴出手5000-20000灵石
      - 出窍至化神出手20万灵石起步；心炉行者不收灵石只收"对等交换"；冥契者南烬境外不可公开雇佣
      - 铭痕信筒单次5-10灵石，跨国每多一个中转站+5灵石；跨国商队长途20-50灵石/人

  区域经济差异:
    大朔: 物价基准；天京高约30%；铭城买铭痕器便宜约15%
    西戈: 灵石及灵石制品便宜约20%；非灵石商品（粮食/布料）贵约30%；铁门城军工性价比最高
    南烬: 冥契相关物品合法交易仅在此国，境外翻3-5倍；原始灵林药材最丰富但私下采药非法
    北朔: 御寒物资为刚需且南下商路翻倍；七部内部以"温谷供暖份额"分配，外来者只能高价购买
    东屿: 海铭制品便宜30%~50%；大陆标准铭痕器贵约20%；海市是最大商业与情报中心
    渊下野: 无官方货币，灵石为事实通货，以物易物和情报交换更常见；摊位保护费不统一且断罪者令后翻倍
    梁川: 大朔-西戈关系紧张时物价首先波动（粮价最先涨）；过境关税是财政核心
    磐丘: 物流成本为平原2-3倍；过境关税是最大收入，税关小吏权力被放大
    商於: 飞票发行国；仲裁判决十二国有效但费用极高
    郢丘: 物价稳定；纸张印刷价格在郢丘之辩前波动；富商以每年500-2000两白银"捐资助学"换入学名额
    越棘: 无统一政权，货币流通极为有限；外来者只能以实物交换——药品、武器和盐最通用
    涪陵: 银两购买力约为大朔60%；劳动力极廉价（日酬20-30文）

  物价波动因子:
    - 息盛季（尤其息极日前后）：丹药和铭痕器需求上涨30%~50%
    - 穷日期间：凡人市场停滞，渊下野墟市反常活跃
    - 双息日（约19年一次）：修行物资价格一日内可能翻倍
    - 封印松紧度每±10：渊下野黑市药剂价格反向变动约15%；渊鸣级突变引发战略物资抢购
    - 大朔-西戈冲突升级→梁川粮价上涨、磐丘过关税上调、商於粮食飞票暴涨

  各阶层收入参考:
    凡人底层: 佃农/搬运/矿工月入1-3两；手工业者3-8两；小商贩/跑堂2-5两+食宿
    凡人中层: 账房/书吏8-20两；商铺掌柜15-30两；铭痕工坊低级匠师20-40两
    凡人上层: 大商会东家年入数百至数千灵石；隐元阁情报分析师月薪10-30灵石
    修行底层: 散修护院月入5-20灵石；学派低境弟子10-30灵石+俸禄
    修行中层: 军中百夫长/县令级30-100灵石；天衡宗外门执事/墨门匠师50-150灵石；隐元阁分号掌柜100-500灵石
    修行上层: 一军主将/一郡太守年入以千灵石计，财富以法宝地产情报人脉为主

  DM_经济铁律:
    - 【余额必核】：任何交易前核对「经济」余额，不足则交易绝对失败，不得赊账成功或对方主动降价
    - 【收入必源】：每笔灵石/银两收入必须有可追溯来源——任务、战利品、悬赏、情报或底层劳作；严禁凭空捏造灵石矿脉、远古宝藏或暴利途径
    - 【阶层必符】：NPC收入支出必须符合阶层与境界。路边茶馆老铁匠不可能随手掏出一颗灵石（约等于他两年收入）；散修请人吃饭付铜钱绝不动灵石
    - 【低阶收入上限】：启灵至筑基散修拼死一次战斗的收入不超过同境修行者一个月雇佣费（约几十灵石）；轻松暴富行为直接判定为遭高阶修士掠夺或黑市黑吃黑
    - 【黑市必险】：黑市交易被抬价、掉包、跟踪、黑吃黑是常态
    - 【心炉不认灵石】：心炉行者只接受等价情报、一个承诺、修一件器物或"借个火"
    - 【冥契非卖品】：与契灵缔约不是商品；宣称"出卖契灵缔约服务"的人必定是骗子
