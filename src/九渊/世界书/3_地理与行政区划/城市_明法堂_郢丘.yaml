<region region="明法堂">
明法堂的四面高墙严丝合缝——没有窗户，只有玄武岩与黑铁组成的绝对对称。建筑占地约十亩，通体以产自大朔北境的墨色玄武岩砌筑，外层镶以外表毫无装饰的黑铁板材。整座建筑的平面是一个精确的正方形——边长恰好二百四十尺，任何一边的测量误差不得超过三指宽。院内不见一草一木——法家认为植物的自然生长是"无序与混沌"——整个庭院唯一的色彩来自铭刻在石碑与铁柱上的猩红法条。这些法条以朱砂混灵石灰浆填入刻痕，即使在阴天也会反射出一种让人不舒服的暗红色光泽。

【建筑结构与功能区域】
明法堂由地上两层与地下三层组成，地上部分用于教学与公开辩论，地下部分用于秘密研究。

地面层正门上方镶嵌着一块长九尺的铁匾，上面以刀削般的方正字体刻着法家核心理念："法者，国之权衡也。"进门后是一座没有任何陈设的大厅，灰色石板地面被无数学徒的脚步磨损出浅浅的凹痕——这些凹痕以门为中轴呈对称分布，因为法家学徒从入门的第一天起就被训练"走路必须走直线"。大厅两侧各设六扇铁门，通向十二间规格完全相同的判例教学室。每间教学室配备一面可翻转的黑铁书写墙和四十个固定在地面上的铁制座椅——不能移动，因为"法不因人而异，座不因时而移"。

地下第一层是判例档案室，收藏着来自六国的判例与律法文书的原始卷宗与复刻本——总计超过两万三千份，按国别与年代分类编号，存放在以灵石干燥阵维持恒定湿度的玄武岩石柜中。档案室内设有三间研读室，仅对法家正式弟子与持有明法堂审批函的外学派学者开放。档案室的值守员每天二十四小时轮班——不是怕失窃，是墨家想借用一份三百年前关于水权分割的判例作为工程论证依据时，必须在值守员在场的情况下查阅，并在登记簿上写明用途。

地下第二层是模拟法庭——法家称之为"阿鼻台"。这座圆形的审判模拟室以深色砂岩砌筑，中央是一座略高于地面的正方形审判台，周围环绕三层阶梯式旁听席，可容纳约一百人。台上方悬着一块刻满微小铭文的黑曜石——这是阿鼻台的核心：铭文激活后，台上的辩论者会被幻术笼罩，亲身承受所辩论案件中被告人所遭受的一切。学徒们在这里不仅辩论卷宗，还要亲身承受被指控者所承受的酷刑——鞭笞、镣铐、流放路上的风雪，甚至死刑。若是出现致命的法理错误——轻则精神崩溃，重则永久性识海损伤。明法堂的学徒毕业率约为六成——那四成没有毕业的人，大部分不是在考试中失败，是在阿鼻台上撑不下去。

地下第三层是秘密立法讨论厅。这部讨论厅的外墙以"绝音断影"之阵完全封隔，内部布设一张椭圆形长桌，十二个座位。定期有来自各国的权臣与秘宗宗主披着隐匿法袍到访——隐匿法袍以特殊黑色织物制成，覆面后无人能辨认身份，确保了在此密谈之人不受监视。表面上探讨法律草案修订，实则进行着以合法外衣包裹的政治交易。厅内"绝音断影"由明法堂历代六位阵法师以自身三年的修为献祭铸成——泄密者将被阵法自动抽干神识，变作一具没有任何记忆的空壳。自阵法运行一百一十年以来，没有人能活着说出秘密立法讨论厅内部的任何细节——不是没人尝试过，是阵法把他们的"说"变成了"呼吸"和"空白"。

【法家在郢丘的输出与策略】
明法堂是法家编纂与输出律法草案的核心场所。各国君主、丞相与议会每有新的立法计划，都会派遣使者来明法堂密商草案。明法堂每月平均输出四至七份完整的法律草案，涵盖刑律、税收、土地、继承、贸易等几乎所有领域。这些草案由明法堂派遣法家学者到各国朝廷直接呈递——从不通过邮驿，因为"法在未颁布之前，不属于任何人，也不能被任何人截获"。

明法堂的学术声誉建立在它的一项特殊能力上——法理陷阱的设计。法家学者以其对法律条文与法理法则的精通，能在法典中埋设表面上无害的条款，这些条款在特定条件下触发的法律后果可以在多年后令一国政治局势为之动摇。明法堂有一个专设的"法理推演室"，九名法家最高级别的推演师以数理模型和因果链推导各国现行法律的潜在缺陷与可被利用的漏洞。推演结果封存在"灰部"——明法堂的秘密档案部——永不解密。郢丘城内流传着一条说法：明法堂真正的武器不是武力，是在九州各国法典中逐年埋下的法理陷阱——当某个国君发现自己的即位诏书在法理上可以被郢丘的某份判例推翻时，陷阱已经封了口。

【禁色传统与规矩】
明法堂有一条严格的着装规矩：入内所有人——不论身份、学派、来访目的——必须穿素灰色长袍。鲜艳色彩被视为"法无情而色有情"的违规，将被请出并在七日内不得入内。明法堂自己也以身作则——从导师到学徒到清洁工，每日穿着完全一致的素灰袍。这条规矩曾引发道宗一位炼丹师的愤怒抗议——他认为灰色抑制了灵感。明法堂的回复只有一句话："法不需要灵感，法需要准确。"

在郢丘，明法堂与辩经院之间有一道细若游丝的张力。辩经院的原则是"什么都可以说"，明法堂的原则是"说出去的要负法理责任"。两家之间从未公开冲突——但法家学者极少在辩经院参与与自身学派无关的辩论，辩经院也无法使任何一场关于法律的法家内部辩论被纳入公开记录。这个微妙的对立维持了数百年，从未被摆在纸面上——或许是因为双方都知道，一旦摆上纸面，就是需要在郢丘论坛上辩论的东西了。
</region>
