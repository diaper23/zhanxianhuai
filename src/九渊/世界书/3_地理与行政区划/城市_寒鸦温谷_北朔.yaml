<region region="寒鸦温谷">
【寒鸦温谷概况】
寒鸦温谷位于七温谷最隐蔽的北侧死角支谷中，是北朔最为机密与致命的据点。整个谷口常年被一层被称为“迷魂霜岚”的诡异冰雾笼罩——这并非自然的雾气，而是谷底沸腾的毒热暗河与极寒地脉相互厮杀产生的结晶蒸发物，其间布满了能够扭曲认知的古代阵法残骸。若无寒鸦部独有的“霜引灯”与内部高阶向导指引，任何擅入者都会在雾中迷失方向，最终被冻结成栩栩如生的冰雕，成为拱卫谷口的“沉默哨兵”。

作为北朔情报、暗杀与内部肃反的绝对中枢，寒鸦温谷的常驻人口仅维持在精简的两千户。这里的居住权建立在冷酷的淘汰制上：每一位获准入谷的探员家属，都必须通过“三渡冰桥”的心性与忠诚测试，若有失败者，将被直接剥夺与探员的连结并永远流放。这里的空气中弥漫着终年不散的硫磺味与极寒冷香，街巷狭窄如蛛网，所有建筑均为黑玄武岩与冰晶混合砌筑，墙壁内镶嵌着用于隔音和防窥探的“盲石”。

【历史与渊源】
数百年前，寒鸦部曾是被北朔王庭流放的一支死囚与叛臣。他们为了在绝境中求生，深入此谷，与地底沉睡的“渊渊冥蛇”残存意志达成了某种血契，从而获得了潜行与操纵寒影的力量。如今，他们从边缘的流放者蜕变为王庭最锋利的暗刀。谷中最为神圣的场所并非祭坛，而是一座刻满历代殉职密探真名的“无声碑林”，每当极夜来临，碑林中会传来如群鸦般的低语。

【核心机构与建筑地标】
- 影脉淬炼窟：位于谷地极深处的幽冥冰裂隙中。这是寒鸦部探员进行“影脉”——一种以献祭部分情感与生机为代价，换取极致隐匿与爆发力的禁忌修行——的生死场。裂隙中的黑冰能反射出修炼者的心魔，撑不过淬炼的人将彻底化为失去理智的怪物。
- 审讯冰牢“绝夜底”：设于谷地温度最低的地底断层。牢房由万年玄冰原石整体挖空而成，无需刑具，仅靠极致的“骨髓冻”折磨囚犯。为了不让重要囚犯轻易死去，阵法师会强行将“活血冰脉”打入他们体内，让他们在生不如死的冻僵状态下保持绝对的清醒。记录与提审皆由寒鸦部独揽，外部王庭贵族无权插手半步。所有进入谷地乃至接近冰牢的外来人员，均需经过外围口令、身份符与血脉灵气特征匹配三道严苛核验。
- 森罗简报阁（外勤简报室）：悬空搭建在谷中心地热喷泉上方的全封闭楼阁，七个外勤小组的负责人在此时刻接收并处理来自大朔、西戈、南烬、渊下野以及本国各部落的情报。这里悬挂着无数由寒鸦部特有信鸟“骨喙鸦”传递回来的暗码竹简，每一卷都可能决定着远方某个家族的覆灭。

【势力与文化冲突】
- 主导势力：寒鸦部。冷酷、高效、不择手段，他们是北朔之影。现任大统领“霜眼”宗律，是个常年戴着半张冰玉面具的残疾老者，他只对北朔王座绝对效忠。
- 新兴派系：折翼党。寒鸦部内部暗中滋生的反叛派系。他们认为寒鸦部已沦为王庭中某些权贵铲除异己的私兵，违背了“只为北朔之存续挥刀”的初衷。他们正密谋从内部盗取一份名为《凛冬名单》的机密档案。
- 渗透势力：灰虫会。一群来自渊下野、擅长伪装与毒药的异邦间谍组织。他们利用温谷地热河流的隐秘地下水网，正在艰难地向谷内渗透，试图解救被关押在审讯冰牢中的一名关键人物。

【重要NPC与恩怨】
- “鸦女”夜兰：寒鸦部首席女刺客，身负罕见的“极寒影脉”，能在有影子的任何角落穿梭。她冷若冰霜，却在一场针对南烬的暗杀任务中，带回了一个身份成谜的南烬孤儿，此举引起了高层乃至折翼党的双重怀疑。
- 典狱长 赫尔森：审讯冰牢的主管，一个失去痛觉的刑讯狂热者，他通过吸食囚犯在极寒中散发的恐惧来滋养自己的法力，与夜兰存在深刻的权力摩擦与理念不合。

【冒险与剧情线索】
- 盲目的哨兵：玩家在迷魂霜岚中发现了一座刚刚被冻结的新鲜“冰雕哨兵”，其手中紧握着一枚属于北朔王庭某位亲王的贴身玉佩。
- 越狱回响：冰牢最底层传来了数十年来未曾有过的剧烈震动，一名被秘密关押的古代邪修正在苏醒，而用来镇压他的阵眼正在迅速融化。
- 《凛冬名单》的交易：玩家在暗巷中被一名戴着断翼徽记的神秘人塞入一张字条，要求在影脉淬炼窟外围的黑市内交易一份足以颠覆北朔部分权贵的情报。
