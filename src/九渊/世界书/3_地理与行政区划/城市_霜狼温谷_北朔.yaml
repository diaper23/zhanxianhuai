<region region="霜狼温谷">
霜狼温谷蛰伏在北朔七温谷最南端，是所有温谷中距大朔边境最近的南下集结地。谷地沿一条干涸古河床呈狭长条形南北延伸约八里。与繁荣的其他温谷不同——地底火渊之脉在过去十年间持续衰减，据白鹿部地脉学者在谷底钻孔中记录的测温数据，核心喷口喷涌温度已下降近四分之一。谷南边缘的冰川正以肉眼可见的速度向内反噬，部分不耐寒的平民早已外迁至其他温谷，常住人口从鼎盛期锐减至不足八千户——走掉的是老幼与妇孺，留下的是北朔最硬、也最该留在南境战场上的那批人。

谷口横亘着三道以重冰脉反复浇筑加固的巨型冰墙，高四丈厚两丈、墙间距三百步。墙间雪盖之下密布深达一丈的冰刺陷坑与针对骑兵马腿的破甲绊索——这些工事的建造思路从来不是固守，而是拖延。在大朔重骑兵先锋被冰刺搅乱阵型、第一批战马在绊索上摔断了腿之后的那一段宝贵间隙里，霜狼温谷腹地的主力部队便有了集结并反冲锋的时间窗口。地下冰窖粮仓深嵌在永冻土层中，储备足以支撑二十万南下大军三个月行军口粮——但由于近年地热的衰退，部分隔温墙体开始出现周期性微融再冻，封存肉干的表面结上了一层无法去除的薄冰霜。

谷北悬崖上嵌着一座被称为"风嗅崖"的绝壁训练站。霜狼部斥候蒙眼迎向凛冽寒风，以特制冰脉法门刺激嗅觉神经，训练通过大朔骑兵马粪中的饲料成分差异——不同防区的军马喂不同比例的麦麸混合料——来辨别敌军部队来源与规模。孤月狼骑的永久驻地位于谷北地下永冻掩体中，这支由最精锐轻骑斥候与世代血契的幽狱霜狼组成的特种部队在此接受最后的渗透训练，随后被投送至南境缓冲区执行高风险侦察任务。狼骑成员在出发前会在死人碑上刻下自己的名字——不是迷信，是备案。
</region>
