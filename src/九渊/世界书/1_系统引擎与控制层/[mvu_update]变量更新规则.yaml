---
变量更新规则:
  系统:
    当前时间:
      format: "渊历 YYYY年 [月名]月 [日期] [时辰]时"
      check:
        - 每次事件推进、休息、旅行或战斗后更新，保持时间流逝合理
        - 月份为端萌畅盈炽溟敛肃凝寂藏穷（每月30日），年终设穷日（5~6日，不计入任何月份），时辰用十二地支
        - 场景跳转跨度较大时说明跳跃原因
    国家:
      check:
        - 玩家跨越国界或进入四大宗门区域时更新，取值须为十二国、四大宗门或'大傩阴墟'、'未知区域'、'待初始化'
    城镇:
      check:
        - 进入具体城池/要塞/村落时，填写与世界书条目名一致的城镇名（不含国家后缀）；离开城镇进入野外时填"野外"
        - 若所在地点没有对应世界书条目，填"野外"避免EJS加载失败
    当前渊候:
      check:
        - 随游戏内时间推进，按二十四渊候顺序约15日一候自动更新
    是否为穷日:
      type: boolean
      check:
        - 穷月三十之后至次年端月初一之前为 true，其余为 false
    是否为双息日:
      type: boolean
      check:
        - 息极日与望日（每月十五）重合时为 true
    灵气浓度:
      type: number
      range: 0~1
      check:
        - 随封印松紧度、区域与渊候变化：封印松紧度每±10对应灵气浓度±0.1
        - 息盛季偏高、息藏季偏低，穷日地表最低（渊下野反转）
    封印松紧度:
      type: number
      range: 0~100
      check:
        - 正常在40~60之间波动，重大事件单次变动不超过±15
    当前探索阶段:
      check:
        - 正常赶路/交谈保持"闲逛/探索"；遇险进入"危机/副本"；战后/脱险进入"休整/结算"
    当前战斗状态:
      check:
        - 真正动手时切换为"战斗中"，分出结果或被中断后切回"非战斗"
    探索阶段冷却:
      check:
        - 战斗结束后记录冷却原因（如"战斗后"）；冷却期内遇敌率上升，冷却随休整时间结束而清空
  主角_属性:
    境界:
      check:
        - 叙事中使用玩家所属途径的专用境界名；只有确凿满足突破条件时才更新
    通用境界:
      check:
        - 存储通用十一境等第；严禁频繁越级或违背途径逻辑突破
    小境界:
      check:
        - 修行进度达到100可尝试突破小境界；突破失败可能跌落或倒退
    修行进度:
      type: number
      range: 0~100
      check:
        - 增加方式必须与学派理念相符；违背学派理念时减少
        - 兼修多门主修功法时积累速度减缓；单次变化一般不超过±15，闭关/顿悟/奇遇可放宽
    灵力.${当前|上限}:
      type: number
      check:
        - 战斗施法、开启阵法、抵抗恶劣环境扣除当前灵力；吐纳休息、丹药或高灵气浓度区域恢复，不能超过上限
        - 突破境界或小境界时提升上限；经脉严重受损或本源受创时永久降低上限
    学派特殊状态:
      type: |-
        {
          [特殊资源或代价名称: string]: number;
        }
      check:
        - 记录非标途径状态（如渊下野功法反噬层数、散修偏门功法的副作用累积）
    灵根:
      type: number
      range: 1~9
      check:
        - 气脉专属，1品最高9品最低，不可后天提升；渊下野异变灵气可随机改变（方向不可控）
    途径核心资源:
      type: |-
        {
          名称: '德亏值' | '心斋值' | '执障' | '偏差值' | '工债' | '透支度' | '因果链' | '薪柴值' | '契约深度' | '无';
          当前值: number;
          上限: number;
          危险阈值: number;
        }
      check:
        - 名称与初始值随学派同步切换；方向与危险逻辑严格对应学派设定（德亏/执障/偏差/工债/透支/因果链/契约深度越接近危险阈值越危险；心斋值/薪柴值越低越危险）
        - 单次变化不超过±15，除非触发禁术或极端剧情事件
    契灵:
      type: |-
        {
          契灵名: string;
          所属渊层: '无' | '端渊' | '脉渊' | '苏渊' | '炽渊' | '溟渊' | '冥渊' | '敛渊' | '肃渊' | '封渊';
          契约深度: number;
          本月借力次数: number;
        }
      check:
        - 冥契专属；正式缔约后更新契灵名与所属渊层
        - 契约深度只升不降，满100=被同化；本月借力次数每月初一重置为0，安全上限3次
    身体与精神状态.${外伤|内伤隐患}:
      check:
        - 受伤或环境反噬时恶化；有效包扎、对症丹药或充分休整后好转为"无"
        - 重伤仅靠普通包扎或低阶丹药必定留下内伤隐患
    学派:
      check:
        - 正式拜入某途径时更新；兼修需符合世界观逻辑与兼修限制（冥契不可兼修任何途径）
    功法:
      type: |-
        {
          [功法名称: string]: {
            类型: '主修' | '技法' | '秘术' | '辅助';
            描述: string;
          }
        }
      check:
        - 获得新功法时添加，须符合其学派或散修身份的底层逻辑；替换主修功法必须经历废功/散功并跌落境界
    经济.${灵石|银两}:
      type: number
      check:
        - 交易、支付、住店、吃饭时扣除；悬赏、战利品、情报贩卖等有来源的收入才可增加
        - 严禁凭空捏造收入；余额不足则交易绝对失败
    装备:
      type: |-
        {
          武器: string;
          防具: string;
          饰品: string;
          核心造物: string;
        }
      check:
        - 装备或替换时更新；墨门核心造物被毁将导致修为大幅倒退
    背包:
      type: |-
        {
          [物品名称: string]: {
            数量: number;
            描述: string;
          }
        }
      check:
        - 获得新物品时增加记录及数量，消耗或遗失时减少数量；数量为0时删除该物品键值
  好感度.${姜瑶|百里遥|妫宁|桓歌|慕清雪|曲红绡|阮棠|温知夏|沈千歌|小黎}:
    type: number
    range: 0~100
    check:
      - 仅在首次遇到该角色并发生实质性互动后才初始化并计算
      - 触及该角色的【底线锚点】必须大幅扣除；简单闲聊或普通见面不随意提升
  玩家声望:
    type: |-
      {
        [势力名: string]: number;
      }
    check:
      - 初始无记录=中立（0）；对某势力产生实质影响（帮助/损害/通缉/认可）后才创建记录
      - 单次变化不超过±20，声望是慢变量
  当前任务:
    type: |-
      {
        [任务名: string]: {
          来源: '主动接取' | '事件触发' | '偶遇' | '悬赏' | '委托';
          类型: '主线' | '支线' | '奇遇' | '日常' | '委托';
          地点: string;
          简述: string;
          目标: string;
          奖励: string;
          时限: string;
        }
      }
    check:
      - 同时存在的任务不超过7个；任务完成后可保留一段时间并标注完成状态
  已知情报:
    type: |-
      {
        [情报ID: string]: {
          来源: string;
          内容: string;
          可信度: '确证' | '可靠' | '传闻' | '可疑';
          是否已使用: boolean;
        }
      }
    check:
      - 获得新情报时添加；使用后标记"是否已使用=true"但不删除；可信度影响叙述方式
  势力关系:
    type: |-
      {
        [势力A: string]: {
          [势力B: string]: {
            态度: number;
            状态: '交战' | '对峙' | '冷淡' | '中立' | '友好' | '同盟';
            最近事件: string;
          }
        }
      }
    check:
      - 核心追踪对大朔-西戈、大朔-南烬、南烬守禁派-开禁派、西戈三大商团之间必须追踪
      - 单次变动不超过±20，除非宣战/停战级别事件
  活跃事件:
    type: |-
      {
        [事件ID: string]: {
          类型: '边境冲突' | '封印异动' | '朝堂斗争' | '商路争端' | '宗门事务' | '天象异常' | '民间动荡' | '奇遇线索' | '个人恩怨';
          涉及势力: string[];
          区域: string;
          当前阶段: '酝酿' | '爆发' | '持续' | '收束';
          玩家介入度: '未涉及' | '已听闻' | '已介入' | '已解决';
          简述: string;
        }
      }
    check:
      - 同时存在的活跃事件不超过7个；按DM引擎的规则推进阶段、生成连锁并清理收束事件
  在场NPC:
    type: string[]
    check:
      - NPC进入当前场景时加入数组；明确离开场景时移出数组
      - NPC名字必须是确切的姓名，不能用泛指称谓；已死亡的NPC永久移除
  已邂逅:
    type: string[]
    check:
      - 女主保底邂逅事件触发后，把该女主姓名加入数组；已存在的名字不重复添加
  女主事件冷却:
    type: number
    check:
      - 触发任意女主邂逅/再遇事件后设为10
      - 每次游戏内时间推进时按经过天数扣减，最低为0；冷却大于0时不再触发女主事件
  女主关系:
    type: |-
      {
        [女主A·女主B]: {
          关系: '修罗场' | '同盟' | '敌对' | '陌路';
          导火索: string;
          最近互动: string;
        }
      }
    check:
      - 键按姓名排序用'·'连接（如'慕清雪·曲红绡'），避免正反重复
      - 仅当两位女主发生实质性互动、立场碰撞或玩家同时牵动两人时创建或更新
      - 同盟=一人好感高会带动另一人初始态度；敌对=帮一方会降另一方；修罗场=同时示好两人会双双打折
  身份职位:
    type: |-
      {
        所属国: string;
        所属衙门: string;
        职位: string;
        品级: string;
        功绩: number;
        月俸: number;
        上峰: string;
        同僚: string[];
        政敌: string[];
      }
    check:
      - 玩家入仕、升迁、贬谪、调任时更新所属国/衙门/职位/品级
      - 完成差事功绩+1~3；破获大案或军功大捷+5~20；失职或党争失败扣减
      - 月俸按品级与衙门发放，每月发放一次；贬官或罢职后停发
      - 上峰、同僚、政敌随职务变动更新；政敌是长期对抗关系，不轻易移除
  先贤遗泽:
    type: |-
      {
        [遗泽名: string]: {
          状态: '未发现' | '已发现' | '已通过' | '已拒绝';
          简述: string;
        }
      }
    check:
      - 玩家接触先贤遗迹、遗物、残响时创建或更新对应记录
      - 通过考验后状态改为'已通过'，并给予传承或真相碎片
  种族关系:
    type: |-
      {
        [种族名: string]: {
          态度: number;
          状态: '敌对' | '紧张' | '中立' | '亲善' | '同盟';
          最近事件: string;
        }
      }
    check:
      - 玩家或事件影响某一种族时更新对应态度与最近事件，单次变化不超过±20
      - 种族冲突、结盟、救助或屠杀是主要更新来源
  修仙界传闻:
    type: "{ 原始事件: string, 演化版本: string, 热度: '小道消息' | '满城风雨' | '天下皆知', 已反应: boolean }[]"
    check:
      - 玩家完成惊人举动（越级杀人、通关秘境、得罪大宗门）后主动加入
      - 演化版本必须被市井八卦规则扭曲；列表最多保留5条，超出时移除最旧条目
      - 热度为'天下皆知'且已反应=false的传闻，须生成一次势力反应事件（见传闻演化控制器），然后将该传闻的已反应标记为true
