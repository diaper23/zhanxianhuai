<faction name="折翼党">
折翼党是隐秘滋生于北朔情报机关【寒鸦部】内部的激进反叛派系，犹如潜伏在阴影中的毒瘤。他们的标志是一枚被折断的黑铁乌鸦羽翼徽记。

该派系的核心成员多为经历过无数残酷外勤、身心俱疲且产生信仰动摇的资深探员。他们反叛的理由并非投靠敌国，而是认为现今的寒鸦部高层已经腐朽——不再是“只为北朔之存续挥刀”的纯粹利刃，而是沦为了大可汗与几位实权亲王铲除异己、党同伐异的私家刽子手。他们亲眼目睹了太多忠诚的北朔将领因为莫须有的罪名死于自己人的暗杀，对内部肃反的残酷感到绝望与愤怒。

折翼党行事极端隐秘，擅长利用寒鸦部内部的盲区进行联络与破坏。他们目前的首要目标是从寒鸦温谷最机密的档案室中盗取一份名为《凛冬名单》的绝密竹简。这份名单记录了北朔高层大量通敌、贪腐与陷害忠良的铁证。折翼党企图以此为筹码，彻底清洗北朔朝堂，哪怕代价是引发一场惨烈的内战。
</faction>
