<faction name="霜骨兄弟会">
霜骨兄弟会是活跃于北朔雪原边缘与国境真空地带的一个臭名昭著的法外狂徒组织。他们并非单一的盗匪，而是由北朔的逃兵、大朔被通缉的死囚、西戈的破产雇佣兵以及失去部族的流浪半妖拼凑而成的暴力混合体。

这群人没有家国荣誉，只信仰冰冷的灵矿与沾血的钱币。与【极光商会】那种有着官方背景、讲究规则的黑白通吃不同，霜骨兄弟会的行事作风毫无底线。他们最擅长的营生是：袭击补给商队、绑架贵族换取赎金，以及向天下各国倒卖北朔的最高级军备资源。

他们极其眼馋【苍鹰部】的雷鹰雏鸟与雷鹏卵（在渊下野的黑市上，一枚活的雷鹰卵能换取一整个城池的财富），因此长期在雷鹰巢下层的冰台边缘游荡，甚至重金买通了部分外围守卫。同时，他们也会在冰湖渔场劫掠昂贵的冰晶鲟鱼卵，或者在奔雷牧场外围试图偷猎落单的幼年猛犸。霜骨兄弟会的几位当家都是穷凶极恶的亡命徒，是北朔正规军在肃清边境时最头疼的毒疮。
</faction>
