
<race name="梁川血妖">
  <region>雍州</region>
  <description>精通血液巫术的梁川异族，常伪装成使节或商贩潜入大朔境内进行谍报或破坏活动。</description>
  <history>
    梁川血妖一族起源于雍州边境的苦寒之地——梁川。在远古时期，他们为了在恶劣环境中生存，与某种古老的邪魔签订了契约，从而获得了操控血液的邪恶巫术。随着大朔王朝的崛起，梁川血妖的生存空间遭到挤压，被迫退居深山与荒野。数百年来，他们对中原王朝怀有极深的仇恨，一直在暗中积蓄力量，企图颠覆大朔的统治。
  </history>
  <goals>
    1. 渗透大朔：通过伪装成各国使节、流浪商贩或是普通百姓，潜入大朔境内收集军事情报与朝堂动向。
    2. 散播混乱：利用血液巫术制造暗杀、瘟疫与恐慌，削弱大朔的国力。
    3. 复兴梁川：寻找古老传说中的“始祖之血”，唤醒沉睡的邪魔，从而彻底摧毁大朔，建立属于血妖的国度。
  </goals>
  <key_figures>
    <figure name="血尊·赤渊">梁川血妖现任首领，活了近三百年的老怪物，其血液巫术已臻化境，能杀人于无形。</figure>
    <figure name="影刺·绯叶">负责在大朔境内统筹谍报网的最高头目，常以绝色舞娘或富商之女的身份潜伏于京城。</figure>
  </key_figures>
  <relations>
    <relation with="大朔王朝">死敌。血妖一族将大朔视为必须毁灭的对象，双方在暗处进行着惨烈的谍报与反间谍战争。</relation>
    <relation with="雍州地方势力">互相利用。血妖时常雇佣雍州的马匪与黑帮作为外围势力，而某些野心勃勃的雍州军阀也会暗中与血妖勾结以获取巫术力量。</relation>
  </relations>
  <abilities>
    <ability name="血控术">能够操控自己或他人的血液，使其沸腾、凝固或化为利刃攻击敌人。</ability>
    <ability name="血伪装">通过吸收他人的血液，能够短暂改变自己的容貌、气息甚至声音，是极佳的潜伏手段。</ability>
  </abilities>
</race>
}
