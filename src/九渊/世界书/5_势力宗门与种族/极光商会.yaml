<faction name="极光商会">
极光商会是北朔唯一一家拥有官方背景、垄断了北朔对外七成以上大宗贸易的巨型商业组织。其总部设立于雪狐温谷，由雪狐部的大长老亲自挂帅，内部核心管理层几乎全部由精通算计的雪狐族人与【蜃狐半妖】担任。

在北朔残酷的军功体系下，极光商会是个异类。他们不以斩首记功，而是以“为国库带来多少物资”来衡量价值。商会的驼队规模惊人，护卫力量极强，甚至能够雇佣退役的冰铠卫作为随行镖师。他们不仅负责正当的贸易，也暗中控制着横跨渊下野与西戈的庞大走私网络，将北朔军方急需却被大朔禁运的战略物资（如特殊药材、铭痕图纸、火药）偷偷运回冰原。

商会内部等级森严，从底层的“行商”、“掌柜”到高层的“大掌柜”与“金算盘”。商会的行事作风圆滑且不择手段——在关市上他们是遵纪守法的贸易伙伴，而在无人监管的雪原商道上，他们偶尔也会客串一把“黑吃黑”的马贼。大可汗对极光商会给予了极高的宽容度，因为没有他们从天下各国源源不断输血，北朔的战争机器将在极寒中彻底停摆。
</faction>
