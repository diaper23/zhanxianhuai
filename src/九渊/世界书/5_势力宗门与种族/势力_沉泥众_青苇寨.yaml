<faction name="沉泥众">
  <description>
    由逃亡收割工与沼泽黑巫组成的隐秘教派，隐匿于青苇寨周边的深沉泥沼之中。他们曾是遭受压迫的底层与边缘者，如今却化作了泥沼中最致命的潜伏者。
  </description>
  <history>
    最初由无法忍受残酷劳作而逃入沼泽的收割工，以及被驱逐的黑巫共同建立。在绝境中，他们听到了泥沼深处传来的低语，从而结成了一个以复仇和生存为核心的隐秘教派。
  </history>
  <belief>
    信奉泥沼中沉睡的古老恶灵。教徒们相信，恶灵是大地腐朽与重生的化身，能赋予他们复仇的力量。他们通过血腥的献祭和诡秘的沼泽仪式来取悦这尊恶灵。
  </belief>
  <goals>
    主要目标是摧毁压迫他们的统治阶层，并在泥沼的庇护下建立属于自己的秩序。他们频频在夜间对苍骨纸会发起破坏与血腥报复，誓要让仇敌的鲜血染红沼泽。
  </goals>
  <key_figures>
    <figure name="腐躯主教" role="精神领袖">最初的黑巫之一，据说身体已经与沼泽的泥泞融为一体，能够驱使泥沼恶灵的部分力量。</figure>
    <figure name="泥鳢行者" role="行动统领">曾是最优秀的收割工，对青苇寨周边的地形了如指掌，主要负责策划对苍骨纸会的夜间袭击。</figure>
  </key_figures>
  <relations>
    <relation target="苍骨纸会" type="死敌">由于过去的压迫，沉泥众对苍骨纸会抱有极深的仇恨，双方冲突不断。</relation>
    <relation target="青苇寨" type="隐蔽地">他们隐匿在青苇寨的泥沼边缘，对于寨子里的普通人既不轻易侵扰，也不允许他们深入自己的领地。</relation>
  </relations>
</faction>
