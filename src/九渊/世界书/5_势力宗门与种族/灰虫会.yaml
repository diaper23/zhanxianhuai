<faction name="灰虫会">
灰虫会是一个发源于渊下野深渊地带、极度擅长易容伪装与毒理刺杀的跨国间谍组织。他们如同地底的灰虫一般，无孔不入、生命力极强，且只要雇主出得起足够的代价（通常是稀有的灵矿、上古秘籍或渊下野的某种豁免权），他们愿意接下任何十二国范围内的脏活。

在北朔境内，灰虫会是少数能让【寒鸦部】感到棘手的外来渗透势力。他们不依赖正统的灵气修为，而是精通利用十二国各地的奇毒、致幻香料以及近乎完美的物理易容术。他们甚至能通过剥取刚死之人的面皮配合秘药，在数日内完美顶替死者的身份。

目前，灰虫会的一支精英小队正潜伏在北朔最危险的寒鸦温谷外围。他们利用温谷地底复杂的毒热暗河与地下水网，正在一寸寸地向谷内的审讯冰牢“绝夜底”渗透。他们的目标是解救一名被寒鸦部秘密关押、掌握着渊下野重大机密的关键人物，或者在解救失败时，抢在北朔撬开他的嘴之前将其灭口。
</faction>
