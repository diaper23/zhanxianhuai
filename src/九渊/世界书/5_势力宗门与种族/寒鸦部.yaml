<faction name="寒鸦部">
寒鸦部是北朔七部中最令人闻风丧胆的“地下之影”，掌控着北朔的谍报、暗杀、刑讯与内部肃反网络。其核心大本营位于终年被迷魂霜岚笼罩的寒鸦温谷。与其他崇尚正面冲杀的北朔勇士不同，寒鸦部信奉“杀戮即是悄无声息的艺术”。

他们的历史起源于一群被流放至绝境的死囚与叛臣，因在绝地中与神秘存在结契而获得了操纵寒影的力量。如今，他们不仅是大可汗手中最锋利的暗刀，也是悬在北朔所有贵族与将领头顶的达摩克利斯之剑。寒鸦部的探员遍布天下十二国，从大朔朝堂上的斟酒侍女到南烬荒漠中的流浪剑客，都可能是他们的眼线。

寒鸦部探员的主修功法为残忍的“影脉”。这是一种必须以献祭部分人类情感（如共情、怜悯乃至痛觉）和肉体生机为代价，换取极致隐匿能力与瞬间爆发力的禁忌秘法。现任大统领“霜眼”宗律，是一位常年戴着半张冰玉面具的残疾老者，他统御着这座冰冷的杀戮机器，只向北朔的最高王座效忠。
</faction>
