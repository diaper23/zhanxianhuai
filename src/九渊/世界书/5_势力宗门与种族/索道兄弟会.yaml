<faction name="索道兄弟会">
索道兄弟会是渗透进铁索渡每一个齿轮中的地下黑帮。他们的核心成员为底层的缆索检修工、绞盘奴隶与渡运站的低级文员。他们利用职务之便，通过篡改磅秤（偷偷虚报货物重量以私吞差额灵石）和伪造铭痕探伤报告（在危险的缆索上尽量延迟检修以延长走私窗口）来大肆盈利。
索道兄弟会真正的利润来源是深夜走私。在子时至寅时铁索渡停运检修期间，他们用特制的滑轮锁扣挂在缆索上无声地滑过二百丈的湖面，将违禁的灵能核心、军械图纸甚至被通缉的逃犯运送到对岸。远帆部曾多次派人潜入抓捕，但兄弟会成员一旦被围便会松开缆索锁扣葬身于下方深不见底的寒渊中——不留活口、不留证据。
</faction>
