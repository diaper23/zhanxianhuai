<race name="蚀瘴族">
蚀瘴族是南烬翠瘴集崖底高浓度金属瘴气污染区中经过数代人自然演化形成的变异亚人种族。他们曾只是被贩卖至翠瘴集充当底层采集苦力的普通部落民，但在常年暴露于翠绿色铜微粒瘴气中的生存压力下，其后代的生理结构发生了不可逆的适应——皮肤苍白如纸，全身分布着青绿色的铜锈状斑纹，双瞳呈诡异的幽绿色。

蚀瘴族对翠瘴气拥有极强的天然抗性——他们能在淡薄的瘴气中自由呼吸而不出现中毒症状，这是他们赖以生存的变异优势。但这份优势的代价是残酷的：一旦离开翠瘴集超过三个月，蚀瘴族的身体便会因缺少环境中特定浓度的翠瘴气（"缺瘴"）而出现脏器枯竭与骨骼衰坏，最终在痛苦中死去。他们被铜鬼帮与裁决所视为最好用的底层劳工——因为不用担心他们跑掉。
</race>
