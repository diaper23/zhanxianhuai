<race name="雪鹿灵族">
雪鹿灵族是世代栖息于北朔极寒地带及温谷的特殊亚种人类（亦被部分正统修士视为半妖）。他们外貌大体与人类无异，但头顶生有晶莹剔透、犹如冰雕般的鹿角（鹿角会随着年龄与修为的增长而增加分叉），双耳尖长且覆有御寒的白色细绒。部分返祖个体的双足会保留类似鹿蹄的结构，使得他们能在松软的厚雪与陡峭的冰壁上如履平地。

他们天生具备极高的草木亲和力，能够感知并安抚灵植的“情绪”，是天生的灵植夫与药农。雪鹿灵族性格多温和、坚韧且习惯于隐忍内敛。在白鹿温谷中，他们是维系庞大草药产量的基石，负责悉心照料那些对灵气波动极其敏感的稀有战伤草药。此外，他们晶莹的鹿角每年初春会自然脱落一次，这种脱落的“冰玉鹿茸”是极品疗伤与稳固心脉的圣药，这曾导致他们在数百年前遭遇过外界修士与贪婪猎人的残酷捕杀。

如今，残存的雪鹿灵族受到了北朔军方与【霜血药宗】的严格庇护，免去了族群覆灭的危机。但作为交换，全族必须世世代代为白鹿温谷的水晶温室无偿劳作。虽然不用再面临风雪与屠戮，但这座温暖安逸的山谷也成了一个巨大的美丽囚笼，绝大多数雪鹿灵族终其一生都无法离开温谷半步。
</race>
