<faction name="孤月狼骑">
孤月狼骑是北朔军方编制中最精锐、最神秘的轻骑斥候与袭扰部队，其大本营驻扎于最前线的霜狼温谷。与骑乘战马的普通游骑兵不同，他们的坐骑是战力恐怖的“幽狱霜狼”。

这支部队的选拔条件极为严苛，候选者必须是具备风、冰双脉潜质的年轻战士。他们不需要穿戴沉重的冰铠，而是装备由特殊雪兽皮革制成的轻型皮甲，武器多为淬了剧毒的弯刀与能在风雪中无声飞行的“霜骨短矛”。孤月狼骑不擅长正面阵地战，他们的核心战术是“风雪隐匿与一击远遁”。在极夜或暴风雪降临时，他们如同真正的幽灵，能悄无声息地抹掉敌方前哨、烧毁粮草并切断大朔军队的补给线。

部队建制以“狼群”为单位，每群二十骑，由一名“头狼”（百夫长）带领。他们的纪律如同野兽般原始残酷——一旦“头狼”阵亡，狼骑们将在战场上直接通过决斗产生新的指挥官。孤月狼骑不仅是北朔南征的先锋耳目，更是大可汗悬在大朔边境线上一把随时会落下的无形冰刃。
</faction>
