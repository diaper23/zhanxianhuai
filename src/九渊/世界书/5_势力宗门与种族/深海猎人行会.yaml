<faction name="深海猎人行会">
深海猎人行会是东屿海兽皮革行的武装狩猎分支。这些猎人不是商人——他们是东屿唯一被允许在深海中使用武力的一群人。他们的工作是在远洋中追踪、捕杀或契约深海巨兽，将巨兽的骨骼、油脂与皮革运回东屿为工业体系提供原材料。

猎人大多修炼心炉体系中的深潜炉或风暴炉——前者允许他们在水下闭气长达数个时辰，后者在遇到致命危险的瞬间能爆发出毁灭性的超载功率。他们的身体在经年累月的深海高压作业下发生了不可逆的适应：耳膜变厚、肺活量增大、肤色因长期缺少阳光而呈苍白色。公会的深海猎人在东屿民间是半偶像半怪物般的存在——孩子们梦想成为他们，而成年人知道这些人的平均寿命不到四十岁。
</faction>
