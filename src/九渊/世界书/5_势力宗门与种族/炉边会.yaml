<faction name="炉边会">
炉边会是东屿心炉修行者的自治议会——全大陆唯一的、完全由修行者自行组织与管理的精神修行共同体。位于传心屿中心的圆形议事厅不设座席、不分主次，全员环炉而坐——这是初代心炉开创者定下的规矩：心炉面前无高低。

炉边会每周举行一次公开讨论会，修行者可自由交流心得、展示新开发的心炉运用技巧——从将深海水压转化为灵能波动的战斗心法到在暴风雨中维持心炉稳定的精神冥想。每周的讨论要点被记录为炉边纪要存档——传心屿档案室中积存下来的数十余年炉边纪要已经成为心炉体系中最为完整的修行参考资料。炉边会在东屿岛主大会中拥有两席常驻代表——这对于一个不以财富或商船吨位衡量地位的组织来说，在东屿这个财阀共和国中是独一无二的。
</faction>
