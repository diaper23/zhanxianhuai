<faction name="异端裁决所">
异端裁决所是南烬不属于四大氏族任何一族、直接向嬴氏王族与最高大祭司效忠的绝对权力机构。自南烬建国以来，滴血崖就是裁决所的中枢——这座黑曜石建筑群如獠牙般嵌在南方暗海的百丈绝壁之上。

裁决所的成员——裁决官与执行者"赤鸦卫"——从平民孤儿与王族死士中选拔，被强行斩断一切尘世羁绊以确保其独立性与绝对忠诚。他们身穿暗红色高领祭袍，戴着无五官的铁面具，享有越过氏族体系进行独立调查、逮捕与处刑的特权。在南烬，没有人不怕赤鸦卫。他们被视为厄运与死亡的化身——但这正是裁决所存在的全部意义：四大氏族互相制衡的平衡之上一柄悬着的利斧。
</faction>
