<faction name="血羽祭司">
血羽祭司是近年来在【苍鹰部】内部隐秘崛起的一个极端御禽教派。与苍鹰部正统的“天目脉”修行者主张与猛禽建立平等、自然的灵魂链接不同，血羽祭司信奉“力量来源于鲜血与畸变”。

该教派的核心高层多为曾在大朔边境战场上遭受过惨烈挫败的御禽师，他们认为传统的猛禽已经无法抗衡大朔的重型神机弩与西戈的防空火器。于是，他们开始在雷鹰巢的深处进行禁忌的血魔法实验：通过向雷鹰的卵中注入狂暴的凶兽之血，或是以自身精血喂食并强行烙印奴役法阵，来催生出体型更庞大、性格极度嗜血且能够释放暗红色雷暴的“变异雷鹰”。

他们的手段极其高效，催生出的变异雷鹰在战场上成为了令人绝望的杀戮机器，但代价也是惨痛的——这些变异禽兽寿命极短，且极易反噬主人。目前，血羽祭司已经暗中掌控了雷鹰巢近半数的高阶繁育权，他们与主张传统御禽之道的保守派之间的矛盾已经到了水火不容的边缘。大可汗拓跋铁对这股极端势力采取了默认的态度，因为北朔现在比任何时候都需要这种疯狂的战斗力。
</faction>
