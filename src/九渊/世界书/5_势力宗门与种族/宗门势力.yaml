宗门概述: 七大学派之外，存在四个不受国家管辖的宗门组织。它们的根基不在学问而在特定的修行传承——旧气脉体系、心炉、冥契——都是在百家争鸣时代前就已存在的修行方式。在学派主导的时代，宗门势力不再拥有话语垄断权，但在特定领域仍有不可替代的影响力

天衡宗:
  定位: 旧气脉体系的活化石，修行史的学术重镇
  山门: 龙脊山脉天柱峰（大朔境内但不属大朔管辖）
  核心权力: 气脉修行者定品认证。七大学派兴起后，气脉不再是各国军队和官僚的主力修行体系——但天衡宗仍保留着最完整的气脉修行文献和定品能力。天衡宗的定品证书在六国仍被认可，虽然它不再决定一个人的仕途
  组织结构:
    宗主: 三老会推举、终身制。现任宗主"陆怀远"（气脉·化虚关——唯一确认在世的化虚关修行者），任职已逾四十年。陆怀远本人承认："天衡宗的黄金时代已经过去了，我们现在的任务不是恢复独尊地位，而是确保气脉的修行智慧不要断。"
    三老会: 学术长老（文献保存与修行理论）、实务长老（定品考核与修行应用）、监察长老（宗内纪律与外交）
    藏书阁: 天衡宗最大的财富——收藏了自渊历两千年至今三千余年间所有气脉修行的文献。各国学者（包括七大学派中人不认可气脉体系的人）都来此查阅资料
  与七大学派关系:
    与儒门: 最密切——儒门养浩然气是对气脉的改良而非颠覆，不少儒门学者兼修天衡宗气脉
    与道宗: 道宗观象合真直接借鉴了气脉中的"感应天地"理念，道宗创始人李耳据说曾在天衡宗藏书阁研读三年
    与法家: 最紧张——法家标准化修行直接冲击了天衡宗"天赋+师承"的精英模式
  内部矛盾: 保守派（坚持旧气脉的纯粹性，拒绝与学派融合）vs 开放派（主张吸收各学派的理念改良气脉体系）

心炉盟:
  定位: 心炉行者的互助网络——不是组织，更接近于"有困难找另一个心炉行者"的口头约定
  起源: 渊历二千五百五十年（天闭后四百五十年），第一个心炉行者在东屿小岛上立"过路石"——任何心炉行者可在石下栖身一夜，离开时留下一点食物或一件小物给下一个行者。石上刻三字："别死。"
  运作方式:
    路标制: 各岛屿和大陆部分城市有心炉行者留下的不显眼标记（燃烧炉子轮廓）。看到路标表示附近有心炉行者愿提供帮助
    师徒连线: 一个炉师最多带三个弟子——每个心炉行者的问题都不同，需要一对一指导
    炉边会: 不定期举行，由某位炉师发起。有时讨论修行问题，有时只是围炉坐着不说话
  与七大学派关系:
    与墨门: 最融洽——墨门为心炉行者提供工具和住所，心炉行者帮墨门测试新造物在极端环境下的表现
    与儒门: 冷淡——儒门认为心炉"燃烧情感换力量"是对人性的扭曲
  主要分布: 东屿（唯一合法尊重心炉行者的国家）、渊下野（最多庇护者）、北朔边缘部落
  铁律: 保护弟子。伤害他人将受所有心炉行者排斥

冥契会:
  定位: 以契灵感应为纽带的秘密结社。不存在于任何国家官方记录——因在多数国家定为非法（南烬除外）
  已知信息（各国情报部门汇总）:
    成员识别: 契约境以上冥契者可通过契灵共鸣互相感知——不需标记、不需暗号
    集会方式: 不存在实体会议。冥契者通过契灵在意识层面交流——不同契灵间的沟通效率和内容因契灵个体差异极不稳定
    目标: 不明。存在四种主流推测：
      - 解开九渊封印释放上古存在（大朔官方指控）
      - 加固封印但不同于大朔的方式来加固（部分渊守人的推测）
      - 利用契灵共鸣建立超越国界的意识网络（天衡宗内部假说）
      - 冥契会没有统一目标——只是冥契者寻求彼此确认的渠道（最多人的客观推测）
  与南烬嬴氏关系: 联系但不从属。嬴氏历代国王即位前曾主动接触冥契会——即位后通常会保持距离（尤其是守禁派）
  活动热点: 渊下野（契灵共鸣最强处，冥契会唯一公开活动处）、南烬（法律保护但被妫氏严密监视）
  著名事件 —— 渊鸣事件（渊历 4800 年）: 渊下野所有冥契者在同一天感知契灵发出相同共鸣频率——持续七天七夜。事后无人能解释原因。九渊盟定性为"封印恶化前兆"，渊守人观测数据不支持也不否定

隐元阁:
  定位: 跨国情报—商业组织，在六大国全部区域和六小国均设有分号。名义上贩卖古籍和铭痕器，实际上是六国最大的情报交易平台
  创建: 不详。第一个分号出现在商於（恰好在商於最适合——永久中立、免税贸易、各国商人云集）。阁主身份从未公开
  运作方式:
    分号制: 每个区域至少一个分号，名义上是古籍/铭痕器店铺。分号掌柜知道的信息严格控制在本店经营范围内
    情报交易: 任何人在任何时候可以走进任何一家分号，提出"出售情报"或"购买情报"。情报价格由掌柜当场面议，不记录在账本上——隐元阁的账本只记书籍和器物交易
    绝不涉足的领域: 九个字刻在每一个分号的柜台上——"不涉封印、不涉刺杀、不涉叛国"
    代价: 违反三不原则的人——顾客上各国的黑名单，掌柜逐出隐元阁
  与七大学派关系:
    与纵横家: 关系最深——纵横家弟子在隐元阁实习是公开的秘密。隐元阁的许多情报分析方法论直接来自《鬼谷子》
    与儒门: 紧张——儒门认为贩卖情报不道德，但儒门官员私下也用隐元阁获取竞争对手的动向
    与法家: 法家试图将隐元阁纳入法律制度框架但隐元阁拒绝——"我们一旦注册为合法情报机构，各国就开始要求'对等开放情报'——那就不是情报交易了，是外交"
  最大价值: 隐元阁是各国私下沟通的非官方渠道——两国之间如果官方断交，它们的密使可能在商於隐元阁分号的后厅碰面。"隐元阁不替任何人传话——但提供说话的地方。"
