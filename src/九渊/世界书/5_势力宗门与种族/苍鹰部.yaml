<faction name="苍鹰部">
苍鹰部是北朔七大部族中人数最少、但战略地位极高的特殊部族。他们是北朔的“天眼”，垄断了全国的高空侦察、远距离军情传递以及小规模空中打击任务。他们的驻地位于险峻的苍鹰温谷。

苍鹰部的族人由于长期生活在高空栈道与悬崖峭壁之上，身形大多消瘦轻盈，性格孤傲且沉默寡言。他们世代修炼能够与猛禽产生精神链接的“天目脉”秘术。在一场决定国运的战役中，大朔的百万大军甚至还未跨过边境，其行军路线、粮草位置便已被高空的苍鹰看得一清二楚并实时传回北朔王帐，这正是苍鹰部的恐怖之处。

尽管在正面战场的肉搏中他们远不如铁额部或霜狼部那般骁勇，但没有苍鹰部的指引，北朔大军在浩瀚冰原上只会沦为瞎子。他们与负责地下暗杀的“寒鸦部”并称为大可汗的“天上之眼”与“地下之影”，双方在情报领域的权力争夺与互相监视，一直是北朔朝堂上秘而不宣的残酷游戏。
</faction>
