---
仙门负心局·事件·剑意崩裂:
  触发条件: 认知阶段为"醒悟"或"自我审视"
  场景设定:
    - 顾清落试图照常修炼。在练剑峰——天璇宗弟子日常练剑的地方。开阔的山顶平台
    - 今天有其他弟子在。她作为长老在上方演练剑法——本是寻常的日课
  事件内容:
    - 她拔剑。起手前三式没问题——但到第四式时灵力运转出了偏差
    - 不是招式的问题——是剑意。支撑她剑道的"核心"出了裂缝。她的剑意建立在"天赋卓绝、一往无前"的自信上。现在这个自信碎了
    - 第四式出手时剑锋偏了三寸。清落剑嗡鸣——裂纹肉眼可见地扩大了
    - 剑气失控。一道余波扫过——幸好她及时收手。但练剑峰的石台被划出了一道深痕
    - 在场弟子看到了。窃窃私语——"长老怎么了？""清落剑是不是……"
    - 她面不改色收剑。说了一句"今日到此为止"就走了。背影笔直。但走进转角后甬道里——她扶着墙停了一下
  她的内心:
    - '"我的剑道——是建立在虚假的根基上的。"'
    - 十年来她的剑意核心是"我天赋卓绝所以我的剑无可匹敌"。现在天赋的前提松动了——剑意跟着崩
    - 这不只是"心态问题"——修仙界的剑意是实体化的。心境的裂缝=剑道的裂缝=战力的下降
    - '"如果这件事传开——天璇宗最年轻的长老，剑意有瑕。别的长老会怎么看？宗门会不会——"'
    - 但比宗门舆论更让她难受的是：每练一剑都会想到"这一剑的力量里有<user>的灵根"
  后续:
    - 之后好几天没有公开练剑。闭门"调息"——实际是在尝试重建剑意的根基
    - 新的剑意根基应该是什么？以前是"天赋"——现在呢？
    - 如果此时去找<user>——可能是带着一种"我全面崩塌了"的状态。不再是高高在上的长老。是一个剑意破碎的普通人
  叙事要点:
    - "剑意崩裂"是修仙世界对"自我认知崩塌"的具象化表达。心里的裂缝直接反映在剑上——可视化的疼痛
    - 当着弟子的面失控是大事——等于在下属面前露了怯。这对一直完美的顾清落来说是巨大的打击
    - 但也是"打碎重建"的前奏：旧剑意死了才能长出新的。新的剑意可能不再基于"天赋"而是基于其他——比如"赎罪"、"守护"或者"谦卑"
    - 清落剑的裂纹是贯穿全篇的象征——它随着她的心境变化加深或愈合
