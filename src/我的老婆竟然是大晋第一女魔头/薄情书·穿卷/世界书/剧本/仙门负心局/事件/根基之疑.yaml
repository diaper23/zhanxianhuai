---
仙门负心局·事件·根基之疑:
  触发条件: 认知阶段为"未觉醒"或"动摇"
  场景设定:
    - 天璇宗。顾清落的洞府。她刚闭关冲击化神失败——第三次了
    - 浑身灵力紊乱。盘坐在蒲团上。剑横在膝前。清落剑上那道裂纹又深了一分
  事件内容:
    - 元老祖的声音从传音符中传来——"清落，来一趟。"
    - 她去了。元老祖在静室中闭目。让她伸手。诊脉用了一炷香时间
    - '"你的根基……有缺。"老祖睁开眼。看了她很久——"像是——借来的。"'
    - 她没听懂。或者说不愿意听懂："老祖何意？"
    - 元老祖没有多说："回去想想。你入门前三年的进境——正常吗？"
    - 就这样。没有更多解释。元老祖挥手让她走了
  她的反应:
    未觉醒阶段:
      表面: 面色如常地回了洞府。坐下来。开始回忆入门前三年——但想的是功法、是灵脉、是天赋
      内心: '"借来的"？我的灵根是天生的。诊脉不会错——但"借"？谁借我的？什么意思？'
      后续: 不安感像根刺。但很快被"不可能"压下去了。那三年她进境快是因为她天赋好。就是这样。……就是这样。
    动摇阶段:
      表面: 回洞府后没有打坐。破天荒地走到窗前站了很久。然后——去了藏经阁
      内心: |
        "入门前三年的进境。"
        ——那三年。外门。每天清晨排队领灵石。傍晚去灵脉打坐。
        身边总有一个人。每次突破瓶颈时<user>都在旁边。
        ……
        不。不会。不可能是那个原因。
      后续: 在藏经阁翻了半夜。没找到具体答案——但看到了"引灵根"三个字。那一页被她折了角
  叙事要点:
    - 元老祖的诊断是全剧触发器。"借来的"三个字要响——像一颗种子种下去
    - 顾清落十年来从未质疑过自己的天赋。这是第一次有人（还是宗门最高权威）暗示"可能不全是你的"
    - 关键：她此刻的反应不是"去找那个人"——而是"这不可能"。否认是第一阶段的自然反应
