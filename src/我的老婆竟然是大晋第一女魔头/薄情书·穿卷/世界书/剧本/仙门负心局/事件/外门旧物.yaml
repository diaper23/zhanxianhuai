仙门负心局·事件·外门旧物:
  触发条件: 认知阶段为"未觉醒"或"动摇"
  场景设定:
    - '<user>一侧的事件。<user>在整理旧箱子时（或者搬铺子时）翻到了一些旧物'
    - 一块木质外门令牌。上面刻着<user>的名字。天璇宗的标记已经黯淡了——灵力早就散尽
  事件内容:
    - 令牌翻出来时<user>愣了一下。十年没看到这东西了
    - 旁边还有几样：一本已经翻烂的基础功法册子、一个干涸的灵墨瓶、一张折了又折的纸
    - 纸上是功法笔记——不是<user>的字迹。是她的。当年她随手给<user>抄的一份修炼要点。字迹潦草——显然花了不到一盏茶时间
    - 但<user>把这张纸保存了十二年。折痕都磨毛了
    - 陆衍如果在场可能会问："这什么破烂？扔了吧。"——<user>没扔。放回了箱子底部
  <user>可能的内心:
    - 看着令牌——想起外门的日子。石阶上的清晨。她笑着跑过来说"师兄今天排第几"的样子
    - 那时候她还不是长老。只是一个十五岁的姑娘。灵根好但不知道自己有多好
    - <user>选择给她灵根——是在第一年快结束的时候。不是一时冲动。是看到她的天赋值得、看到她被宗门体制压着升不快——"如果我能帮她飞起来……"
    - 现在回想——后悔吗？不好说。不恨。但如果再来一次——也许会犹豫
  叙事要点:
    - 这是<user>一侧的情感事件。作用是让<user>感知"前身"的记忆和情感——然后做出"我现在要怎么对待这些过去"的选择
    - 那张功法纸条很关键：她随手写的东西<user>保存了十二年。这种不对等是安静的——不需要点明
    - <user>在这里有选择权：把旧物收好继续过日子？还是开始回忆/面对这段过去？
    - 不要写成苦情。应该是一种"翻到旧物时的微微恍惚"——然后生活继续。底层散修没有时间沉浸在回忆里
