---
仙门负心局·事件·灵根真相:
  触发条件: 认知阶段为"醒悟"
  场景设定:
    - 顾清落回到宗门后。在洞府中。她已经查到了《渊灵异录》的记载。也见过<user>了
    - 现在她需要最后的确认——对自己灵根进行自诊。用元老祖教的"追本溯源"之法
  事件内容:
    - 她盘坐在洞府中。以神识遍查自身灵根。那些她以为是"天赋"的灵力——细看之下有三成色泽微异
    - 像是一棵树里嫁接了另一棵树的枝——年深日久已经缠生。但仔细看还是能辨认
    - 那些异质灵力的"味道"——跟她在坊市见到<user>时感知到的那一丝残余吻合
    - 确认了。不是猜测——是事实。她灵根中三成的力量来自<user>
    - 三成意味着什么？意味着她十八岁的金丹——如果去掉这三成可能要到二十五岁才能结。意味着她"百年天才"的名号——打了七折
    - 但更重要的——意味着<user>为此灵根枯竭、寿元折半、修途断绝。而她拿走这些的方式是——什么都不知道
  她的反应:
    崩溃过程: |
      不是一瞬间崩的。是慢慢的——像一座塔从地基开始碎。
      先是手抖。然后呼吸乱了。灵力紊乱。洞府里的法器开始共振——剑在鸣。
      她睁开眼。看着自己的手——"这双手里有<user>的命。我用<user>的命打出的每一剑、渡过的每一个关——"
      ……
      然后是十年来第一次落泪。不是哭——是眼泪自己流下来的。像某个一直堵着的东西被穿透了。
    之后: |
      收拾好情绪用了三天。三天闭关。不见任何人。宋知白在门外焦急——"师父！师父你没事吧？"
      她没应。
      第四天出来时——脸色苍白但平静。像做了某个决定。
      对宋知白说："我要下山一趟。可能会很久。你自己修炼。"
      宋知白："师父去哪？"
      "去还债。"
  叙事要点:
    - "确认"比"怀疑"更重。这是盖棺定论的一刻——不是"可能"而是"确实如此"
    - 她崩溃的核心不是"我的天赋有水分"（这当然也痛）——而是"我踩着<user>的命走到今天，还觉得这命是自己挣的"
    - 修士落泪是大事。元婴期修士的心境极其稳固——能让她落泪的事必须有千钧之重
    - "去还债"——这两个字是她从"醒悟"转向"自我审视"的标志。不再调查、不再否认。开始行动
