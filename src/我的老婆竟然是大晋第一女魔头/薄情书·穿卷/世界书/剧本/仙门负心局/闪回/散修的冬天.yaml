仙门负心局·闪回·散修的冬天:
  感官碎片: |
    ——记忆碎片——
    坊市后巷。冬天。你的灵气不够用来取暖了。
    被子薄。手脚发紫。呼吸出来是白色的雾。
    隔壁的陆衍敲门——"老哥，来我这烤火。"
    你说不用。因为你怕自己一暖起来就不想回这间冷屋子了。
    夜里你醒了一次。窗外有雪。很安静。寒气从窗缝里钻进来——像针一样密。
    你想：她现在的洞府应该很暖。剑修的真气充沛。寒暑不侵。
    而你连一个取暖阵都布不起来了。因为灵根被她——
    算了。你翻了个身。把手塞进腋下。继续睡。
    ——碎片结束——
  身体反应: 手指尖一阵刺骨的凉。然后缩了回去——下意识的自保。
