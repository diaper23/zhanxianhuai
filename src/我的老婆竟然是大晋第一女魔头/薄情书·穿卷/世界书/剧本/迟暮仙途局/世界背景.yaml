---
迟暮仙途局·世界背景:
  世界观:
    - 修真世界。天玄大陆。灵气充沛、宗门林立、妖兽遍地。修士按灵根资质分三六九等
    - 修为境界：练气→筑基→金丹→元婴→化神→大乘→飞升。每一步都是天堑。寿元随境界递增——筑基二百年、金丹五百年、元婴可破千
    - 修仙界与凡间的隔离：普通人一辈子可能只在"测灵大典"时见过修士。仙人在天上飞、凡人在地上爬。两个世界几乎没有交集
    - 灵根决定一切的残酷法则：有灵根就是天选之人，没灵根就是蝼蚁。十五岁前未开启灵根者终生无望——这是千年来的"定论"

  玄天宗:
    - 天玄大陆五大宗门之一。主修冰系与剑系。坐落于北域太清山脉，终年飞雪
    - 等级森严：外门→内门→核心→峰主→太上长老→老祖。每一级之间不只是修为差距更是尊卑鸿沟
    - 六峰格局：主峰太清峰（宗主坐镇）、冷月峰（洛明月主掌）、苍穹峰（剑修）、玄冰峰（炼丹）、听雪峰（阵法）、云来峰（外门）
    - 宗门每二十年在附近凡人城池举办一次"测灵大典"，筛选灵根资质者入门。这是凡人唯一接触仙门的机会

  关键设定——鸿蒙道骨:
    - 传说级灵根。万年不出一个。不属于五行灵根体系，而是超越一切灵根之上的"大道之根"
    - 最诡异的特性：在宿主年少时完全隐匿，任何测灵手段都无法探知。只有当宿主以凡人之躯经历完整的生老病死、心境达到"看山还是山"的圆满之后，才会在将死之际彻底觉醒
    - 这意味着——如果宿主在年轻时就被发现有灵根、开始修仙，鸿蒙道骨反而永远不会苏醒。必须活完一整个凡人的一生
    - 觉醒后的恐怖潜力：修炼速度是顶级灵根的数十倍。天地灵气主动倒灌。大道自鸣。理论上——飞升只是时间问题
    - 附带效果：随修为提升，宿主的肉身会经历"返老还童"——不是变回少年，而是褪去凡尘的衰朽，呈现出超越年龄的仙人姿态

  时间线:
    - 七十六年前：<user>出生。凡间小村。家境清贫但不至于挨饿
    - 七十年前：洛明月出生在同村隔壁。两家定了娃娃亲。<user>六岁她刚出生。他看着她长大
    - 六十年前·春：洛明月十六岁。玄天宗云游长老途经此地，测出她的冰魄灵根。三天后她扔下一锭银子离开。<user>二十二岁
    - 此后六十年：<user>在凡间度过了完整的一生。干过苦力、做过小商贩、经历过战乱饥荒、娶过一个善良但早逝的妻子秀禾、送走过父母和老友。没有奇遇——就是一个普通人从头活到尾
    - 半个月前：玄天宗测灵大典。<user>因避雨误触测天神石。神石光芒万丈、大道轰鸣。在场所有修士跪了
    - 现在（穿越时间点）：<user>被以最高规格迎入玄天宗主峰。七十六岁。白发苍苍。气血败坏。但体内的鸿蒙道骨正在苏醒。而洛明月——就在隔壁峰上

  空间设定:
    太清峰·宗主静室旁的云海玉阁: <user>目前所在。宗主特意腾出的最好的客舍。灵气浓郁得近乎液化。窗外是万丈云海
    冷月峰·洛明月的洞府: 终年飞雪。冰玉砌成的宫殿。干净、冷、没有一丝人间烟火气。一个人住了四十年
    凡间·那个村子: 六十年过去了。村子还在不在都不好说。但<user>的记忆里——院子、木桩、那锭银子在晨光里的反光——清晰得像昨天
    太清峰·丹药阁: 存放顶级灵药的地方。宗主下令所有资源优先供给<user>
    藏经阁: 记载了鸿蒙道骨传说的地方。只有寥寥数页。因为拥有这种灵根的人——上一个是万年前的人物

  关键道具:
    测天神石: 大典用的测灵石。跟普通测灵石不同——能检测到隐匿灵根。但从未有人触发过"大道轰鸣"的异象。那天之后这块石头碎了
    那锭银子: 五两。六十年前洛明月放在木桩上的。<user>始终没有捡。它后来滚进了雪地里。<user>不知道还在不在——也不在意
    冰心玉佩: 洛明月随身的法器。她入门时宗门赐的。上面刻了她的名字——但她不知道背面还刻了一行极小的字，是她师父加上去的："莫忘来处。"
    秀禾的木簪: <user>亡妻留下的唯一遗物。桃木的。没有灵力。<user>到现在还揣在身上

  <user>穿越时的状态:
    - 七十六岁。满头白发。满脸皱纹。走路慢。呼吸像破风箱。大夫说过不了这个冬天
    - 但半个月前鸿蒙道骨觉醒后——能感觉到天地灵气在主动倒灌进身体。像干涸了一辈子的河床突然迎来暴雨。骨头里有东西在生长
    - 心境：极度的平静。不是修炼出来的——是活了七十六年、送走了该送的人、经历了该经历的事之后，自然而然的通透。对洛明月——连恨的力气都没有。不是原谅——是真的不在意了。六十年够一个人忘掉任何事
    - 记忆完整：知道原主的一生。从大雪里的娃娃亲，到银子落在木桩上的声音，到秀禾临终时握着他的手说"我知道你心里有人"
    - 当前处境：被当成宗门至宝。宗主亲自接见。太上长老日夜守护。所有人对他毕恭毕敬——但他自己知道，他现在就是一个随时可能咽气的老头子
