迟暮仙途局·事件·身份败露:
  触发条件: 认知阶段为"未觉醒"或"动摇"
  场景设定:
    - 太清峰。某次宗门高层的小范围议事。宗主、秦老祖、几位峰主——包括洛明月
    - 议题是<user>的来历和安排。宗主觉得有必要让峰主们了解一下这位"万年天才"的背景
  事件内容:
    - 沈宗主翻开一份简报——是宗门弟子调查<user>来历的记录。很详细
    - '"姓×，名×。凡间×州×县×村人。七十六岁。无修仙经历。已婚丧偶。本次测灵大典中意外触发测天石——"'
    - 宗主念到"×村"的时候——洛明月的手指动了一下。那个村名她没听错
    - 宗主继续往下念。可能念到了<user>的家庭情况、生平。当念到年龄和村名时——
    - 洛明月的脸色没有变化。但她的冰魄灵力波动了一瞬——在座的化神修士都感觉到了
    - 秦老祖看了她一眼。没说什么
    - 散会后。她没有走。站在议事厅门口。宗主已经走了。她一个人站在那里
    - 然后她去查了。去翻了自己入门档案上登记的籍贯——一模一样的村名。翻完之后她坐在藏经阁里坐了很久
    - 六十年。她花了六十年把那个名字忘掉。现在它从一份公文里跳出来砸在了她脸上
  她的反应:
    未觉醒阶段:
      表面: 面无表情地听完。散会后步伐如常地离开。回到冷月峰后关了洞府的门
      内心: 不可能。世上同名同姓的人多了。那个村子不可能只有一个人叫这个名字。——但她知道是他。因为年龄对得上
      后续: 她不会去找<user>。她会先说服自己这不重要——"六十年了。他是他我是我。就算是当年那个人又怎样？"但她今晚的剑练不下去了
    动摇阶段:
      表面: 听到村名时瞳孔收缩了一下。但很快恢复。散会后步伐比平时快
      内心: 是他。那个被她扔下五两银子离开的人。现在躺在太清峰的云海玉阁里——作为全宗的至宝
      后续: 她可能会去云海玉阁附近——不进去。远远地站着。想看一眼。但又觉得看了之后不知道会怎样
  叙事要点:
    - 身份败露不是大场面。是一份公文里的几个字——村名和年龄。越平淡越有杀伤力
    - 洛明月的灵力波动是唯一的外在破绽。修士能感知到彼此的灵力变化——这意味着在座的人都知道她"动了"
    - 关键：她知道之后不会去找<user>。因为她不知道以什么身份去。峰主？前未婚妻？一个六十年前扔下银子跑了的人？每一个身份都让她难堪