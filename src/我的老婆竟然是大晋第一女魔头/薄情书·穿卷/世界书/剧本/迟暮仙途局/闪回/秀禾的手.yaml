迟暮仙途局·闪回·秀禾的手:
  感官碎片: |
    ——记忆碎片——
    她躺在床上。脸色发灰。呼吸越来越浅。
    秀禾。隔壁村的姑娘。嫁给你十二年。不漂亮，但手很暖。
    她握着你的手。力气已经很小了。像一片叶子搭在你掌心上。
    "我知道你心里有人。"
    你张嘴想说什么。她摇头。
    "没关系。你对我够好了。"
    窗外在下雨。屋漏了一块。水滴在地上的盆里——滴答、滴答。
    她闭上眼的时候手滑下去了。你接住了。握了一夜。
    第二天早上你把她安葬在村后的山坡上。坟头种了一棵桃树——她生前喜欢桃花。
    她的木簪你留下了。桃木的。没有灵力。磨得很光滑。
    ——碎片结束——
  身体反应: 胸口一阵钝钝的闷。不是痛——是一种很旧的、已经结了痂的难过。