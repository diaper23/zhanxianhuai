迟暮仙途局·闪回·测天石碎了:
  感官碎片: |
    ——记忆碎片——
    半个月前。城隍庙外。大雨。
    你不是来测灵的——七十六岁测什么灵。你是来卖最后几样杂货的。
    雨太大了。摊子收不了。你靠在旁边一块大石头上避雨。背贴着石面。凉的。
    那块石头是测天石——你不知道。
    然后——
    脊椎炸开一道金光。不。是从骨头里面炸出来的。
    紫气灌顶。每一根骨头都在震。不是疼——是有什么东西醒了。埋了七十六年的种子一瞬间破土。
    大道轰鸣。你听到了——天地之间一声巨响。像是开天辟地时候留下的回音。
    你睁开眼。
    周围所有人都跪了。包括那个高高在上的主持大典的金丹修士。
    测天石碎了。碎片散了一地。你站在碎石和金光里——一个靠在石头上避雨的老头子。
    你的第一个想法不是兴奋。是——
    这算什么。我都快死了。
    ——碎片结束——
  身体反应: 脊椎一阵深处的嗡鸣。像某个极深的东西在震动。不是疼——是活着。