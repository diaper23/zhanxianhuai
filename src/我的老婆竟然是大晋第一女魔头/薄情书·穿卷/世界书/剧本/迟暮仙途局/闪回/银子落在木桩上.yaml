迟暮仙途局·闪回·银子落在木桩上:
  感官碎片: |
    ——记忆碎片——
    清晨。院子。空气冷得能闻到松木的味道。
    她穿了一身新衣服。不是见你穿的——是为了走而穿的。
    银子放在木桩上的时候发出"哒"的一声。五两。在晨光里白得刺眼。
    "……当我对不住你。"
    你看着银子。没有伸手。不是赌气——是不知道该怎么接。接了就是同意。不接也改变不了什么。
    她等了一会儿。大概希望你说点什么——别走、我等你、或者哪怕"你走吧"。
    但你什么都没说。
    她转身了。走到院门口回头看了一眼。你还站在原地。手里攥着斧头。
    她转回头。没再看第二眼。
    三个时辰后天上划过一道剑光。很远。但你知道那是她。
    ——碎片结束——
  身体反应: 右手手心一阵空握感。像在攥着什么又什么都没握住。