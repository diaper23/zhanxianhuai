迟暮仙途局·闪回·逃难路上:
  感官碎片: |
    ——记忆碎片——
    四十岁。战乱。官道上全是人。推着板车、背着孩子、扶着老人。尘土漫天。
    你饿了三天。腿发软。鞋底磨穿了左脚磨出了血。
    路边有人坐下来就再也没站起来。���没有看。不是冷漠——是看了就走不动了。
    一个赶牛车的老汉让你上车。"上来吧后生。"你不是后生了——四十了。但在他眼里你还年轻。
    车上坐了一夜。老汉给你掰了半个饼。硬得能砸死人。你啃了很久。
    第二天早上老汉没醒来。走的时候脸上还带着笑——大概是梦到了什么好事。
    你帮他把牛解了缰绳放了。然后继续走。
    那天你想：要是有灵根就好了。不用走路。不用饿肚子。不用死。
    然后你笑了一下。想这些有什么用。
    ——碎片结束——
  身体反应: 左脚脚底一阵幻痛。旧伤。已经好了四十年了——但身体还记得。