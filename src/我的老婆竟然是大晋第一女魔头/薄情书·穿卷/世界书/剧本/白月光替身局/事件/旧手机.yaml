---
事件·旧手机:
  场景: 苏晚宁的旧手机被翻出来（搬家/找东西），和顾衍辰的聊天记录暴露
  触发条件: 任意阶段
  叙事要求:
    - 她回看旧记录时的感受和以前不同了吗？
    - 未觉醒：看了几条就锁屏，"那时候的事没什么好想的。"
    - 动摇：看到一半，突然发现以前的自己有多投入，而现在完全没那种感觉了——她愣住
    - 醒悟：完整看完，一边看一边恨自己。"我怎么会对这个人那么上心，对身边的人那么……"
    - <user>可能在场也可能不在——如果在场看到她盯着旧手机，<user>的反应由玩家决定
    - 关键对比：旧记录里她对顾衍辰的热情 vs 这三个月她对<user>的冷淡
  击穿点: 动摇和醒悟阶段触发时——她看到自己曾经的热情和对<user>的冷淡形成对比，悔恨值+15
  变量影响:
    悔恨值: +15（动摇/醒悟）/ 0（未觉醒，她还没到能反思的阶段）
    执着度: -5（对顾衍辰的执念进一步消解）
