---
事件·退婚传闻:
  场景: 圈子里传出<user>和苏晚宁可能退婚的消息
  触发条件: 动摇或醒悟阶段
  叙事要求:
    - 消息来源可能是苏母放出试探口风，也可能是某次聚会上有人见到两人冷战
    - 苏晚宁听到传闻的第一反应：
      未觉醒："退就退，反正本来就是联姻。"（但说完之后心沉了一下）
      动摇："谁说的？"（开始紧张，但没有立场反驳）
      醒悟：心沉到底，但表面上更冷——"是吗。"
    - <user>的态度是关键：
      如果<user>否认传闻——苏晚宁会以为<user>在维护联姻，可能短暂伪回暖
      如果<user>不否认——苏晚宁可能崩溃或被推到必须表态的位置
      如果<user>模棱两可——最折磨人
    - 外界压力如何影响两人：可能被迫摊牌，也可能一起演戏给圈子看
  击穿点: 如果<user>不否认，苏晚宁第一次面对"真的可能失去<user>"的现实，悔恨值+15
  变量影响:
    悔恨值: +15（如果<user>不否认）
    执着度: +10（失去的恐惧激发决心）
    尊严值: -5（被动局面下的难堪）
