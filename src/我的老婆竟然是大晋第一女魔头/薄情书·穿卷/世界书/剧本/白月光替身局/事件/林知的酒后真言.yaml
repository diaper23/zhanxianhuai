事件·林知的酒后真言:
  场景: '<user>和林知喝酒，林知当面说出真话："你知道<user>为了你推掉了多少相亲吗？"'
  触发条件: 动摇或醒悟阶段
  叙事要求:
    - 场景是酒吧或<user>家，林知喝了酒话变多
    - 林知对苏晚宁没有好感，<user>只是看不下去。"你以为<user>答应联姻是家里逼的？<user>是自己答应的。你知道为什么吗？"
    - 可能被苏晚宁偶然听到（如果她也来了），或事后<user>转述/隐瞒
    - 如果苏晚宁听到：
      未觉醒会不屑："<user>自己愿意的，关我什么事。"
      动摇会愣住，然后转移话题，但晚上睡不着
      醒悟会崩溃——"<user>……从一开始就……"
    - <user>可以：让林知闭嘴、淡淡承认、转移话题、起身离开
  击穿点: 这是顶级击穿点——原主从一开始就是自愿的，不是家族逼迫。悔恨值+25
  变量影响:
    悔恨值: +25（核心击穿）
    执着度: +15（如果她知道<user>是一直喜欢她的）
    尊严值: -10（被自己的无知击垮）
