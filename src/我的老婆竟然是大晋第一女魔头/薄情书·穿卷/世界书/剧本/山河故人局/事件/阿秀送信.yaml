---
山河故人局·事件·阿秀送信:
  触发条件: 认知阶段为"醒悟"
  场景设定:
    - 某天。听涛书屋。快打烊的时候。一个穿蓝布衫的丫鬟走进来
    - 阿秀。沈书颜派来的。紧张但镇定——她做这种事不是第一次了（但这次不一样）
  事件内容:
    - '"X先生？我家小姐——孟太太让我来拿一本之前订的书。"——先说场面话。旁边可能有人'
    - 等到只剩两人时她才压低声音："小姐让我给您带句话。"
    - 她从袖子里取出一个布包——里面是一封信。信封上没有署名。纸是好纸——孟公馆的信笺
    - 信不长。沈书颜的字工整而克制——
    - '"我知道不该写这封信。但如果不写——我怕这辈子就没机会了。"'
    - '"那年的信——对不起。这三个字太轻了。但我只有这三个字。"'
    - '"你的腿。我听说了。我不配问你疼不疼。但——我想知道。"'
    - '"如果你不想见我不想理我——我理解。把这封信烧了就好。当作从来没有。"'
    - '"但如果你愿意——下周三下午三点。法租界杜美路的天主教堂后面有一个小花园。没什么人。"'
    - 落款只有一个字："颜"——少女时<user>叫她的方式
  阿秀补充的话:
    - '"X先生……小姐写这封信写了三天。撕了七八封。"她犹豫了一下——"小姐最近瘦了很多。"'
    - '"我跟小姐从小一起长大。她这辈子求过的人一只手数得过来。这是——第二次。"第一次是求孟家把她弟弟送出去读书'
    - '"您来不来都行。但——来的话对她好一点。"说完行礼走了'
  <user>的选择:
    - 去——意味着重新打开那道门。也意味着风险（<user>的身份+她的身份=危险组合）
    - 不去——信怎么处理？烧了？留着？
    - 回信——写还是不写？写什么？
    - 跟林觉民商量——会被劝阻："你在做什么？"
  叙事要点:
    - 这封信是沈书颜第一次主动、正式、毫无伪装地面对<user>。不是"恰好路过"不是"来买书"——是"我写信给你因为我放不下"
    - "颜"这个落款是杀手锏——拉回少女时代的亲密称呼。她用这个字=承认了一切
    - 阿秀的补充信息比信本身更有信息量——"写了三天撕了七八封""瘦了很多""这辈子求过的人一只手数得过来"
    - 约见面的地点很讲究：教堂后面的花园=安静、隐蔽、有些神圣感。不是咖啡馆（太公共）不是书店（<user>的地盘她不自在）
