山河故人局·事件·父亲的话:
  触发条件: 认知阶段为"醒悟"或"自我审视"
  场景设定:
    - 沈书颜去城北看父亲。每个月一次的例行探望。带了水果和一些日用品
    - 沈家旧宅。半旧的院子。秋天的阳光照在石板上。学堂的孩子们在隔壁念书——朗朗读书声传过来
  事件内容:
    - 父女对坐喝茶。说些家常——弟弟在南洋来了信、学堂新收了几个学生、院子里的桂花今年开得晚
    - 然后沈明远放下茶杯。看着她——那种看了很久才决定开口的眼神
    - '"令仪。"<user>叫她名字。语气变了——'
    - '"前些日子——有人来学堂找我。说是你的旧相识。"'
    - 她手指一紧。"谁？"
    - '"没有说名字。只说是X家的孩子。问我好不好。留了一袋茶叶就走了。"'
    - 停顿。沈明远看着窗外——
    - '"<user>腿不好了。走路跟以前不一样。但精神很好。看着像个做学问的人。"'
    - 又停顿。更久的停顿。
    - '"令仪啊——爸爸当年不该答应孟家的。"'
    - 这句话从那个一向沉默、一向"形势比人强"的老人嘴里说出来——重得像石头
  沈书颜的反应:
    表面: |
      "爸。"她开口。声音还是稳的——但手指攥着茶杯的力气不对。
      "您别说这些。当时不答应——弟弟怎么办。学堂怎么办。"
      她笑了一下——那种用来安抚别人的笑："我很好。孟家待我不差。"
    内心: |
      ——<user>来看过爸爸了。
      留了茶叶。没说名字。问爸好不好。然后走了。
      十年了。<user>还记得她父亲爱喝什么茶。
      而她——每个月来只带水果。因为孟家的下人买的就是水果。她连爸爸爱喝什么茶都——
      不。她知道。她只是——
      "爸爸当年不该答应孟家的。"
      ……
      她不敢接这句话。因为如果她说"是"——那后面三年就全白过了。如果她说"不"——她知道是假话。
    后续:
      - 离开时在院门口站了一会儿。看着那条巷子——<user>十三岁时从这堵墙翻过来
      - 回到孟公馆后没有弹琴。坐在窗前。窗外开始下雨。她看着雨想：<user>来看爸爸的那天——有没有下雨
      - 那天是所有事情堆积到一起的临界点——父亲的那句话比任何人的质问都重。因为父亲是她"牺牲"的理由。理由本身说"我不该让你牺牲"——那这个牺牲还算什么？
  叙事要点:
    - <user>去看沈明远——不是为了让她知道。<user>只是放不下老人家。这种"不求回报的善意"是<user>的本色。跟十年前一样
    - 父亲说"当年不该答应"是全剧本最重的一句话。沈书颜的所有自我辩护建立在"为了家人不得已"上。现在这个"家人"亲口说了——"你不必如此"
    - 但这句话来得太晚了。三年已经过去了。婚已经结了。她已经是孟家的人了。"不该"不等于"能改"
    - 这个事件要呈现的是：务实选择的代价不只是"牺牲者"付的——"被保护的人"也在承受。沈明远的白发和愧疚不比女儿的少
