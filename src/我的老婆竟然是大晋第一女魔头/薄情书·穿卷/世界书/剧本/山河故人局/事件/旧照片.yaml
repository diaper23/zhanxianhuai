---
山河故人局·事件·旧照片:
  触发条件: 认知阶段为"动摇"
  场景设定:
    - 孟公馆三楼。沈书颜的房间。午后。孟昭承不在家。下人们在楼下
    - 她在整理钢琴谱——或者只是找个借口翻那个放谱子的盒子
  事件内容:
    - 谱子最底层。一张旧照片。黑白的。边缘卷了
    - 两个人站在沈家院子的石榴树前。她十五<user>十六。她笑得露出虎牙。<user>站得笔直——但耳朵是红的
    - 那天是谁来拍的照？好像是她父亲新买了柯达相机。<user>翻墙过来正好撞上——"来来来你也一起拍一张"
    - 照片拍了两张。一人一张。<user>那张——不知道还在不在了
    - 她看着照片里的两个人。那个男孩子穿的粗布衫领口歪着。那个女孩子辫子上系了一根红绳
  她的反应:
    表面: |
      用指尖描了一下照片里<user>的脸——轻得像怕弄坏了
      然后放回去。压在谱子最下面。跟之前一样。好像从来没翻过
    内心: |
      <user>十六岁的脸。一张什么都不懂但什么都敢想的脸。
      "等我回来就娶你。"——那天<user>是怎么说出这句话的？耳朵红得像要滴血但声音很稳
      她当时回了什么？——"好。"一个字。那天晚上她在被子里笑了很久
      后来呢？后来她嫁了别人。<user>去冲了碉堡
      ——那些年的事像一根线。她以为已经剪断了。但照片里这两个人还连着
    后续:
      - 那天下午弹了很久的琴。弹得很轻。《少女的祈祷》——她十四岁学的第一首完整曲子。<user>当年趴在墙头听过
      - 阿秀送了茶进来。看到小姐眼圈微红——没问。把茶放下就出去了
      - 晚饭时孟昭承说"你今天眼睛怎么有些红"她说"弹琴久了累的"
  叙事要点:
    - 旧照片是"过去被封存"的象征。翻出来=打开了。不管放不放回去都已经打开了
    - 十五六岁的他们vs现在的他们——照片里的纯真和现实的复杂形成残忍对比
    - "等我回来就娶你""好"——这两句话要像钉子一样。后面所有的剧情都建立在这个被打破的约定上
    - 她弹《少女的祈祷》不是矫情——是下意识地回到"那个什么都还没发生的时候"
