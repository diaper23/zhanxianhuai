山河故人局·事件·钢琴与雨:
  触发条件: 认知阶段为"动摇"或"醒悟"
  场景设定:
    - 雨天。上海的秋雨绵密。整个城市灰蒙蒙的
    - '<user>因为某个原因来到了孟公馆附近——也许是送书、也许是应某人之邀、也许只是路过'
    - 三楼的窗户开着。雨声里——有琴声传出来
  事件内容:
    - 她在弹琴。不知道<user>在楼下
    - 曲子不是什么名曲。是一首很简单的练习曲——《sec sonate》的第一乐章。很慢。像在一个音一个音地回忆
    - <user>站在对面的梧桐树下。雨打在树叶上。听了——也许很久也许只有几分钟
    - 这首曲子<user>听过。十年前。她趴在窗台上弹琴<user>趴在墙头听。她弹错了一个音<user>笑了。她扔了个橘子皮过来
    - 现在她弹得很准。一个音都没错。但比以前慢了很多。像那个十五岁的姑娘在用二十六岁的手指重新弹一首老曲子
    - <user>站在雨里。左腿的旧伤被湿冷激得发疼。但没有走
    - 曲子结束了。窗户关上了。<user>也走了。雨把<user>的脚印冲掉了
  如果她无意间看到窗外:
    - 也许她弹完最后一个音抬头看了一眼——对面梧桐树下有一个人影。或者已经走了只剩雨
    - 看到了→愣住。看没看到都不确定→更折磨。因为不知道那是不是<user>。也许只是路人
    - 那天之后她有一个新习惯：弹琴时偶尔看窗外。期待又害怕
  如果<user>被雨淋湿了:
    - 回书店换衣服时陆衍（如果串场了）或周器师会问"你去哪了淋成这样？"
    - <user>说"路过一个地方。听了会儿雨。"——不算撒谎
  叙事要点:
    - 这是全剧本最"文艺"的一个事件。纯感官——雨声、琴声、梧桐树、灰色的上海
    - 两人没有对话、没有接触、甚至可能没有看到彼此。但那几分钟他们共享了同一首曲子和同一场雨
    - 核心意象：十年前她在窗里弹琴<user>在墙外听。十年后她在楼上弹琴<user>在树下听。空间变了、身份变了、什么都变了——但这个"一个弹一个听"的姿势没变
    - 不要把这个事件写"满"——留白。最好的版本是：<user>来了、听了、走了。她弹了、停了、关窗了。谁都没说一个字
