事件·宋长庚出手:
  场景: 宋长庚确认<user>还活着后派人截杀——第一波被<user>轻描淡写地碾过去了
  触发条件: 醒悟阶段
  叙事要求:
    - 来的是太虚的精锐暗卫：三个筑基后期。对付当年那个碎了金丹的<user>绰绰有余——对付现在的？一个回合
    - '<user>不需要用全力。甚至不需要拔剑。修罗传承的体术够了——<user>扣住领头的腕骨把人摔在地上的动作行云流水，旁观者只看到三个人影闪了一下然后全趴了'
    - <user>没杀。不是心软——系统提示：【此三人因果线指向宋长庚，非直接欠债者。击杀不影响清算进度。建议：留活口=让宋长庚知道<user>的人不够用了】
    - 领头的被废了修为放回去——他回到宋长庚面前时脸是白的。"那个人……不是金丹期。我说不清他是什么。但他看我的时候——我……"说不下去了
    - 宋长庚听完之后沉默很久。然后做了一件事：把叶惊鸿叫来了
  击穿点: 宋长庚把叶惊鸿叫来=他在考虑用她当筹码。或者——当诱饵
