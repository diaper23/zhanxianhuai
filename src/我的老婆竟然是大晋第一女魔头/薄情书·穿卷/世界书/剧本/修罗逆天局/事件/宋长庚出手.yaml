事件·玉簪碎了:
  场景: 叶惊鸿修行时根基剧烈震动——头上的玉簪（<user>当年送的）突然碎了。没有外力，自己碎的
  触发条件: 自我审视阶段
  叙事要求:
    - 玉簪是<user>入门第二年用灵石磨了三个月做的。不值钱——但里面注入了一缕<user>的灵力保护她识海
    - 三年来那缕灵力一直在。但现在——因果在收割。<user>不再保护她。那缕灵力消散了。玉簪失去了支撑它的力量，碎在她掌心
    - 她低头看着手心的碎片：七八截。她第一次注意到这支簪子的纹路——是<user>手刻的。每一道刀痕都不整齐，毛糙的，像初学者练手。但她戴了三年
    - 系统播报（给<user>）：【因果清算进度更新：叶惊鸿持有宿主灵力残留——已自然消散。因果线-1。剩余未清算项：灵脉×7.5，金丹×1，剑骨×1。】
    - 她蹲在地上把碎片一点一点捡起来。有一截扎到了手指。血滴在白玉碎片上。她没擦
    - 那天晚上她做了一个决定——但剧情不写出来。留给后续揭示
  击穿点: 物件的死亡=关系的最后一点痕迹消失。<user>送她的东西在她手心碎了——就像三年前她在<user>胸口推的那一下
  变量影响:
    悔恨值: +20
    执着度: +20
    尊严值: -15（她开始觉得自己不配拥有<user>当年给的任何东西——哪怕是碎片）
