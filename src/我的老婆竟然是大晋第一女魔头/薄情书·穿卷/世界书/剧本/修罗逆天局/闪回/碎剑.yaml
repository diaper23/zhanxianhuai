修罗逆天局·闪回·碎剑:
  感官碎片: |
    ——记忆碎片——
    断灵剑从<user>手中被夺走——不是夺，是"收回"。宋长庚说宗门的剑不能让魔修持有。
    <user>看着宋长庚双手持剑——<user>的剑——抬膝。
    "咔。"
    剑断成三截。剑鞘在第一截落地时发出了悲鸣——很短的。像被掐住脖子的尖叫。
    然后碎片被丢入万魔渊。和<user>一起。
    在坠落的过程中<user>伸手去够了一截。够到了。剑尖段。刃口割进<user>掌心。
    很疼。但是唯一还跟着<user>的东西了。
    ——碎片结束——
  身体反应: 右手掌心。那道疤。还在。每次握拳都能感觉到那条凸起。
