修罗逆天局·闪回·安神汤药:
  感官碎片: |
    ——记忆碎片——
    封第四条灵脉那天。疼到<user>把被角咬出了洞。
    她端来一碗药。热气蒸在她的睫毛上。"喝了。能好受些。"
    药里有安神的苦——<user>喝出来了。但没问。以为她是心疼<user>。
    后来才知道：安神不是让<user>好受。是让<user>别叫出来。隔壁是宋长庚的寝殿——不能让人知道<user>在自断灵脉。
    她的"心疼"从来不是给<user>的。是给秘密的。
    那碗药苦了三天。<user>以为苦味来自药材。
    不是。是来自那个真相。
    ——碎片结束——
  身体反应: 舌根泛苦。长久的、散不掉的。吞咽一次苦一次。
