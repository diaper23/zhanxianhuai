修罗逆天局·闪回·天劫那天:
  感官碎片: |
    ——记忆碎片——
    雷从天上劈下来的时候<user>没想别的。只是转了个身。让脊背对着天。
    第一道雷打在左肩——骨头发出了声音。不是碎，是"裂"。从夹缝里冒出来的那种响。
    她在身后尖叫。<user>没回头。第二道雷。第三道。脊椎弯下去了——撑。撑起来。
    九道天雷。每一道都比前一道重。到最后那道<user>已经跪了。但没倒。<user>的手撑在地上。指甲陷进了石板裂缝里。
    有液体从嘴角流出来——不知道是血还是别的什么。耳朵听不见了。只有心跳。
    她的手搭在<user>后背——"你……你别死。"
    <user>笑了一下。用被雷劈裂的嗓子:"不死。"
    ——碎片结束——
  身体反应: 后背的雷纹在发烫。整条脊柱像被谁按了一下又松开。
