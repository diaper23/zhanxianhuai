---
将门弃夫局·事件·赵彦的冷:
  触发条件: 认知阶段为"动摇"或"醒悟"
  场景设定:
    - 白天。京城某处。她有事需要出门——可能是买东西、可能是去寺里
    - 在路上或某个场合碰到了赵彦。狭路相逢，避不开
  事件内容:
    - 赵彦看到她时脚步停了一瞬。然后面无表情地行礼——标准的、不多余的：
    - '"沈姑娘。"——两个字。不是"沈小姐"不是"沈大姑娘"。只是最低限度的称呼'
    - 如果她试图搭话/问<user>的近况——赵彦的回答不超过五个字："王爷安好。"然后就要走
    - 如果她叫住他——赵彦停下来但不转身。背对着她。沉默一会儿说："沈姑娘还有事？"
    - 空气像凝固了。那种不是敌意但比敌意更冷的东西。是"我知道你做了什么但我不想跟你说话"
  她的反应:
    动摇阶段:
      表面: 张了张嘴。最后说——"没什么。赵统领慢走。"
      内心: |
        他的眼神让她想起了什么——对。苍州。赵彦那时候就在。他什么都看到了。
        "她说'死不了吧'转身就走"那次——赵彦一定也在场。
        被一个目睹过一切的人用这种目光看着——比被陌生人议论难受十倍
      后续: 回去的路走得比来时快。不是怕——是那种"想离开这个场景"的本能
    醒悟阶段:
      表面: '"赵统领。"她叫住他。深吸一口气——"当年……<user>受伤那次。伤在哪里？"'
      内心: 她不知道自己为什么要问这个。也许是想确认——那句"死不了吧"到底有多残忍
      赵彦的回答: 转过来看了她一眼。那一眼里有审视——像在判断她配不配知道这个。最后说："左肩。从肩胛到腰。三十四针。"停顿。"您那天没问。"——然后走了
      后续: |
        三十四针。
        她站在原地。秋风把她的斗篷吹得翻飞。旁边有路人经过。她不知道自己站了多久。
        "您那天没问。"——是啊。她没问。
  叙事要点:
    - 赵彦不骂她、不指责她。这种"克制的冷"比直接质问更有压迫感
    - 核心效果是让她感受到——<user>身边的人都知道。她对<user>的伤害不是私密的——是有见证人的
    - 醒悟阶段赵彦说出的"三十四针"+"您那天没问"是关键转折句——把她回忆里模糊的"好像受过一次伤"变成了具体的、血淋淋的数字
    - 赵彦不是在替<user>讨公道。他只是——不想跟她说话。这种姿态本身就是审判
