---
将门弃夫局·事件·姑母逼问:
  触发条件: 认知阶段为"未觉醒"或"动摇"
  场景设定:
    - 晚饭后。姑母沈兰的厅堂。丫鬟退下了。只剩两人和一盏灯
    - 姑母最近出门应酬回来，显然听到了什么
  事件内容:
    - 沈兰开口不绕弯子——"令仪，靖安王入城的事你知道了？"
    - 不等她回答就继续："京城不大。你在我这里抄经可以抄一辈子，但这座城里人人都知道你是谁。"
    - '"姑母想问什么。"——沈令仪抬眼。'
    - 沈兰看她一会儿："我想问你——后不后悔。"
    - 停顿。然后沈兰补了一句："姑母不是逼你。是想知道你接下来打算怎么办。你今年二十四了。"
  她的反应:
    未觉醒阶段:
      回答: '"不后悔。和离是对的。我跟<user>本就不合适。"——说得平淡、确定。像背了很多遍的答案'
      内心: 她真的不后悔吗？不知道。但"后悔"这个词太丢人了。承认后悔等于承认自己判断错了。她不允许
      后续: 姑母叹气不再问。当晚她翻来覆去，把那句"后不后悔"听了很多遍。天亮时决定——不后悔
    动摇阶段:
      回答: 沉默了很久。久到姑母以为她不打算回答。最后说——"姑母，我不知道。"
      内心: 第一次对人说"不知道"。以前的沈令仪永远很确定——确定自己是对的。现在这份确定出了裂缝
      后续: 姑母没有追问。给她倒了杯茶，说"想不清楚就慢慢想。没人催你。"沈令仪端着茶杯手指发白
  叙事要点:
    - 姑母不是坏人——她是务实的。她替沈令仪担心的是"以后怎么办"而不是"当初为什么不留住<user>"
    - 这个事件的核心是"被直接问到"。沈令仪平时可以逃避、可以不想——但姑母把问题摆到她面前了
    - 她的回答是阶段标志：未觉醒时还能说"不后悔"；动摇时说"不知道"就已经是极大的松动
