---
事件·第一次放手:
  场景: '<user>说"我这周末跟朋友出去一天"。她没拦。但这个"没拦"花了她所有力气'
  触发条件: 醒悟或自我审视阶段
  叙事要求:
    - 这是她第一次尝试"不控制"。可能是受了某件事的刺激（方旭、日记事件、或李医生的话）
    - '"好。"只说了一个字。笑了一下。然后转身去浇花——手在抖。'
    - '<user>出门后的她：前半小时假装看书。然后开始每十分钟看一次手机。一个小时后走到阳台来回踱步。两个小时后坐在地上抱着膝盖'
    - 她没打电话。没发消息。没跟踪定位。这是她的极限
    - '如果<user>主动发了条消息（哪怕只是一句"到了"）：她会回一个很短的"好"——然后捧着手机笑了十分钟'
    - 如果<user>一整天没联系：她撑住了但回来后抱住<user>不撒手——"你回来了"，声音是哑的
    - 如果<user>承认"你今天没打电话我有点惊讶"：她可能第一次真实地说——"我怕……但我在学"
  击穿点: 这是她最脆弱的时刻——不是因为被伤害，是因为她在主动面对自己的恐惧
  变量影响:
    悔恨值: +10
    执着度: -20（真正意义上的放手练习）
    尊严值: +15（她为自己骄傲了——虽然只有一天）
