---
事件·旧纸条:
  场景: '<user>在自己公寓的某个角落发现了一张旧纸条——初中时姜棠塞给<user>的。上面写着"放学一起走 在后门等你 ——小棠"'
  触发条件: 醒悟或自我审视阶段
  叙事要求:
    - 纸条折得很整齐——原主保存了十几年。墨水淡了但字迹还能辨认
    - 这张纸条代表的是：在所有伤害发生之前，有过一段她确实把<user>放在心上的时光
    - '<user>看到纸条的感觉：不是感动——是一种更复杂的东西。"你曾经是在乎过我的。那后来为什么——"'
    - 如果<user>把纸条放到姜棠面前没说话：她认出来了——"这个……你还留着？"然后是一种说不清的表情。不是感动。是什么东西碎了
    - '如果她试图笑着带过"哈哈好幼稚"：但声音哑了。因为这张纸条证明了她曾经也是那个会等<user>、找<user>、在意<user>的人——然后她变了'
    - 如果<user>没给她看：这张纸条只对<user>自己有意义——<user>在决定要不要再给她一次机会的天平上加了一个很轻很轻的砝码
  击穿点: 不是指控——是证据。证明"好"存在过。让"失去"变得更具体
  变量影响:
    悔恨值: +20（如果她看到了——"我曾经是那样的人。什么时候变了？"）
    尊严值: -10（无法面对自己的前后反差）
