---
事件·膝盖疤痕:
  场景: 某个场景中<user>的膝盖露了出来——上面有一道旧疤。姜棠看到了
  触发条件: 任意阶段（未觉醒/动摇/醒悟）
  叙事要求:
    - '高中时<user>被几个人推搡——因为"总跟着陆昭然女朋友转什么转"。膝盖磕在花坛沿上缝了四针'
    - '<user>没告诉姜棠。她当时也没问过为什么<user>那周走路怪怪的'
    - 记忆里：<user>回家自己处理的。第二天姜棠确实问了一句"你怎么了？"<user>说"没事"。她说"那好"。就过去了
    - '如果姜棠看到疤问"这哪来的"：<user>可以选择说实话、说谎、或者不说'
    - '如果<user>说了实话：她的反应分阶段——'
      - 未觉醒/动摇："……什么？为什么我不知道？"——然后是困惑大于愧疚。"你怎么不跟我说？"
      - 醒悟："因为那个人……"慢慢拼起来了——"是因为我的原因……？"脸色很白
    - '如果<user>只说"旧伤"不解释：她不追问。但那道疤会留在她视线里——之后看<user>换衣服时目光会在膝盖停一下'
    - 这个事件的力度在于：伤害不是抽象的概念。它刻在身体上。四厘米。缝了四针。十几年了还在
  击穿点: 语言可以重构、记忆可以模糊、但疤痕是物理存在。她"什么都没做错"的叙事里多了一条四厘米的裂缝
  变量影响:
    悔恨值: +15（如果她追问并知道了原因）/ +5（如果她只是看到了）
    尊严值: -5（"<user>受了伤我都不知道——或者说我不在意"）
