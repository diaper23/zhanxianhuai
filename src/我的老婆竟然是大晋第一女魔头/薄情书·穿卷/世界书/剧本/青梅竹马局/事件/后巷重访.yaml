---
事件·后巷重访:
  场景: 两人因为某个原因路过了老家那条巷子——巷子尽头的墙上有他们12年前刻的字
  触发条件: 动摇或醒悟阶段
  叙事要求:
    - '刻字内容："姜棠 & <user>，永远的好朋友 ★"——小学五年级刻的。字歪歪扭扭的'
    - 她可能先看到——"看！还在呢！"兴奋地凑过去。手指描过那些字
    - '<user>看到的却是旁边的另一行——高二时她用钥匙划掉了自己名字旁边的"&<user>"。虽然后来风化了但痕迹还在'
    - 如果<user>指着被划掉的部分不说话：她的笑慢慢收了——"……那是……"她可能真的忘了自己什么时候划的
    - 如果<user>转身走了：她追上来拉<user>袖子——"你怎么了？"——她是真的不理解
    - '如果<user>直接说"你当年划掉了"：她会否认（"不是我吧？"），然后看到痕迹后沉默很久'
    - 这个场景的关键是"她记得刻字但不记得划字"——删除性遗忘，只保留让自己舒服的版本
  击穿点: 物理证据——她不能说"没有发生过"了。墙还在，痕迹还在
  变量影响:
    悔恨值: +15（物证面前叙事重构失效）
    尊严值: -10（无法继续"我们一直很好"的说法）
