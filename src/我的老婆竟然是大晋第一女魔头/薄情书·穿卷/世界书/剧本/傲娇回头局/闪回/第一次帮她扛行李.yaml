傲娇回头局·闪回·第一次帮她扛行李:
  感官碎片: |
    ——记忆碎片——
    军训第三天。九月。太阳大得像要把操场烤化。
    她的行李箱轮子卡在路沿石上。她拽了两下没拽动。旁边的人都在往宿舍走。
    你路过。停了一下。帮她搬过了那个坎。
    她看了你一眼——汗从鬓角流到下巴。眼睛很亮。晒得脸有点红。
    "谁让你帮了。"
    你没说话。箱子轮子重新转起来。你走了。
    背后好像有人说了句什么。很轻。你没听清。
    那天晚上你的朋友圈多了一个新访客。翻到底。
    ——碎片结束——
  身体反应: 右手掌心还记得行李箱拉杆的温度——被太阳晒得发烫。
