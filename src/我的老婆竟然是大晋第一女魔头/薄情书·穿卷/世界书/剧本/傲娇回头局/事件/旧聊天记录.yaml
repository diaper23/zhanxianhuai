---
事件·旧聊天记录:
  场景: 陆念薇深夜翻她和<user>的微信聊天记录——第一次从<user>的角度看那些对话
  触发条件: 醒悟或自我审视阶段
  叙事要求:
    - 时间：凌晨一两点。宿舍其他人都睡了。她关着帘子，屏幕光照在脸上
    - 她是怎么翻到的：可能是想找<user>找不到（<user>不回消息了）、可能是从转账记录开始看、可能就是睡不着
    - 聊天记录里的真实面貌：
      她："帮我带个快递"——<user>："好"
      她："买杯咖啡豆乳拿铁"——<user>："到了在楼下"
      她："你今天穿的那个太丑了别穿了"——<user>没回——十分钟后<user>："好 下次注意"
      她："我跟甜甜出去了你别来了"——<user>："好 注意安全"
      她回消息平均间隔三小时起步。<user>回消息从来不超过五分钟
    - 她往上翻得越多越安静。整屏整屏都是<user>在配合她、她在使唤<user>。没有一段对话是平等的
    - 翻到<user>发的唯一一条长消息——某天深夜："今天看你好像不太开心。如果是我做错了什么你跟我说，我改。"——她回的是"没有行了你睡吧别烦了"
    - 翻到最下面：<user>最后一条消息是事发前一天晚上的"明天有课吗"——她没回。下面全是空白。对话永远停在<user>最后发出的那条
    - 她可能截了图 / 盯着那条"明天有课吗"看了很久 / 打字框里敲了什么又全删了
    - 关键：她退出聊天时看到<user>的头像——以前是她嫌弃的一张普通自拍。现在她盯着那张脸盯了好几秒
  击穿点: 这是全局最重的私人击穿——不是别人告诉她做错了，是她自己亲眼看到了全部证据。八个月的聊天记录就是一份完整的庭审卷宗
  变量影响:
    悔恨值: +25
    执着度: +10
    尊严值: -10（她对自己失望了——不是对面子失望，是对"过去那个自己"失望）
