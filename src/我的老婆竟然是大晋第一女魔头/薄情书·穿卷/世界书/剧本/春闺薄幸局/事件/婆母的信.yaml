春闺薄幸局·事件·婆母的信:
  触发条件: 认知阶段为"动摇"或"醒悟"
  场景设定:
    - 午后。<user>的书房。一封从京城来的家书
    - '<user>的老母——在京城寄住旧屋。每月等儿子的信。这一封是母亲回的'
    - 沈令怡恰好路过（或被翠屏告知"有京城来信"——她作为儿媳按礼应该过问）
  事件内容:
    - 信是写给<user>的。老母的字歪歪扭扭——她识字不多但坚持自己写
    - 信中前半段是家常：身体还好、邻居王婶帮着买菜、入秋该添衣了
    - 后半段——"儿啊，你信中总说'儿媳贤惠'。为娘虽老却不糊涂。你从小便报喜不报忧。若她待你不好——不必勉强。为娘不要什么公府嫡女——要我儿过得舒心。"
    - 最后一行："和离也好、休也好。家里虽穷——回来为娘还养得起你。别委屈自己。"
    - '<user>看完了信。把信折好放进抽屉。表情很平静——但手在桌下按了一下'
    - 如果沈令怡看到了这封信——那句"若她待你不好不必勉强"像一把刀。不是刀砍她——是让她看到"原来<user>的母亲也知道"
    - 翠屏如果在场——"老太太……知道？"
  <user>的选择空间:
    - 可以让她看到这封信——不是故意。是没刻意藏。"给母亲的回信——夫人想看便看"
    - 可以不让她看到——自己收好。但赵大娘可能知道信的内容
    - 关键选择：回信怎么写？还是"一切安好"——还是这次说实话？
    - 如果说实话——后续可能会有老母亲来临安的剧情。那是另一场风暴
  叙事要点:
    - 母亲的信——是来自"无条件爱<user>"的人的声音。对比沈令怡的冷
    - '"为娘还养得起你"——一个母亲说出这句话。意味着她已经做好了最坏的准备'
    - 对沈令怡的杀伤：不是愤怒、不是指责——是"原来<user>对外一直在维护我。而<user>的母亲一眼就看穿了"。这种温柔的真相比骂她一顿更伤
    - 这是第一次——有人站在<user>这边说"你不必忍"。不是<user>自己说的。是<user>的母亲
  变量影响:
    悔恨值: +10
