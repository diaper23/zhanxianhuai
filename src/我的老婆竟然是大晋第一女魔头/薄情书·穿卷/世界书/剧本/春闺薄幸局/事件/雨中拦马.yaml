春闺薄幸局·事件·雨中拦马:
  触发条件: 认知阶段为"自我审视"
  场景设定:
    - 临安城外官道。暮春。大雨
    - '<user>从州城回来处理一桩公务——骑马。随行两个差役'
    - 她等了三天。打听到<user>今天回。从卯时就站在城门外的茶棚下等。雨从辰时开始下——越下越大
  事件内容:
    - 雨中。她的身影出现在官道中间
    - 没有撑伞。头发湿了贴在脸上。衣裳——是那匹"粗缎子"做的。她终于让人裁了
    - '<user>的马远远看到一个人影——勒马。差役喊："什么人拦道——"然后认出来了。"是……夫人？"'
    - 雨太大。她的声音被盖住了。但<user>看到了她的嘴在动——在喊<user>的名字。不是"大人"。是<user>的名字
    - '<user>没有下马。勒着缰绳。马在雨中打了个响鼻。雨水从斗笠边缘流下来——遮住了<user>的表情'
    - 她走上来。走到马前面。仰头看<user>。雨水和泪混在一起——分不清
    - '"我知道了。"她说。声音发抖——不知道是冷还是别的。"我都知道了。那些——我做的那些——"'
    - '"你回来。"她伸手去拽<user>的缰绳——手在抖。"你回来。回家。"'
    - 差役们面面相觑。不知道该不该退开。雨声盖住了一切
    - '<user>的手——握着缰绳——很紧。马没有动。<user>也没有动。低头看着她。雨从<user>斗笠上流到她脸上'
  <user>的选择空间:
    - 可以下马——但不说话。只是下马。走过她身边。"雨大。回去。"
    - 可以不下马——"夫人回去吧。淋坏了身子不好。"然后绕过去
    - 可以问一句——"你知道什么了？"给她说话的机会
    - 可以什么都不做——让她站在雨里。让差役把她扶走。自己继续走
    - 无论哪种——这场雨和她湿透的样子会留在记忆里。<user>的选择决定了后续走向
  叙事要点:
    - 这是全剧的高潮画面之一——雨中拦马。古代追夫的经典意象但要写出新意
    - 她穿的是那匹"粗缎子"做的衣裳——这个细节是杀手锏。她终于穿了那匹她曾经嫌弃的料子。不是为了好看——是为了让<user>看到"我记得。我知道错了"
    - 她喊的是<user>的名字——不是"大人"、不是"夫君"。是名字。公府嫡女在雨中像个寻常妇人一样喊自己丈夫的名字
    - 不要写<user>心软——至少不要写得那么直白。写<user>的手紧了一下。缰绳勒进掌心。仅此而已
    - 核心：她在雨里。<user>在马上。一个在下面一个在上面——以前是反过来的。这个空间关系本身就是叙事
