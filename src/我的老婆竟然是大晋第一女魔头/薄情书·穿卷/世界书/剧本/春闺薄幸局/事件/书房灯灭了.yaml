春闺薄幸局·事件·书房灯灭了:
  触发条件: 认知阶段为"未觉醒"或"动摇"
  场景设定:
    - 夜。正房。沈令怡在梳妆台前卸钗环。翠屏侍候
    - 以往每晚——从窗纸上能看到书房那盏灯。亮到子时、丑时。她从不关心那灯为什么亮那么久。但它亮着——像一种"<user>还在等"的背景音
    - 今晚。她照例往窗外看了一眼——书房黑的。灯灭了。比平时早了两个时辰
  事件内容:
    - 翠屏也注意到了："小姐——大人书房的灯灭了。这才戌时……"
    - 她手里的梳子顿了一下。然后继续梳头："<user>爱几时歇就几时歇。跟我有什么相干。"
    - 但那天晚上她没有很快入睡。翻了几回身。窗外的院子安安静静——以前那个时辰总还能听到翻公文的沙沙声
    - 第二天。第三天。灯都是戌时灭的。再没有亮到子时过
    - 第四天她忍不住让翠屏去"看看大人是否安好"——翠屏回来说："大人在衙门歇的。昨晚就没回来。"
    - 她放下茶盏的手稍微重了一点
  <user>的选择空间:
    - 可以真的在衙门过夜（处理积案、或单纯不想回那个冷清的西厢）
    - 可以回来但早早灭灯——不再为任何人熬着
    - 如果她派翠屏来问——可以客气地回"公务繁忙，劳夫人挂心"。不冷不热
    - 也可以什么都不说——让沉默比任何话都响
  叙事要点:
    - 核心画面：那盏灯。它灭了——就像一个人收回了等待
    - 她的反应不是"心疼"——是"不习惯"。像背景音乐突然消失了才意识到它一直存在
    - 不要写她"意识到自己在意"——太早了。写她"莫名烦躁"、"睡不好"、"让翠屏去看看"——这些行为本身就是在意但她自己不承认
  变量影响:
