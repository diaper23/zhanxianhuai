春闺薄幸局·闪回·<user>给她披衣:
  感官碎片: |
    ——记忆碎片——
    深秋。临安的秋比京城冷得早。

    她坐在天井的石凳上。你从书房出来时看见的——她穿得单薄，发散着，手里捏着一封信。月光把她脸照得很白。

    你不知道那是沈玉衡的信。你只看见她一个人坐在风里发呆。

    你回屋拿了件披风。走过去的时候故意把脚步踩重了一些——不想吓她。

    她没抬头。

    你把披风搭在她肩上。手指碰到她肩的时候——她抖了一下。像被烫到。

    你缩回手。「夜凉。别受寒。」

    她没说话。没看你。手把信往袖子里一塞——动作很快。

    你看见了。但你装没看见。

    你回书房了。关门的时候从窗缝看了一眼——她还坐着。披风没摘。但她低着头，肩膀在微微发颤。

    你以为她是冷。

    她不是冷。她是在那封信和你的披风之间，感受到了某种她不愿意承认的东西——然后用发颤的方式把它压回去了。

    那件披风第二天被放在了西厢门口。叠得很整齐。上面没有她的香味——她用冷水搓过了。

    你拿起来的时候还湿着。
    ——碎片结束——
