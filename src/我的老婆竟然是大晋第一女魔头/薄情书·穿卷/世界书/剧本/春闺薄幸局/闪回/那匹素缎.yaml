春闺薄幸局·闪回·那匹素缎:
  感官碎片: |
    ——记忆碎片——
    你攒了两个月的俸禄。

    七品县令月俸四十五两。扣掉孝敬老母的、衙门杂支的、日常吃用的——能省下来的不到八两。两个月就是十六两。

    你进了临安城里最好的缎子铺。老板看你官服迎上来——「大人要什么料子？」

    你说：「最好的。给内人做件春衫。」

    最好的。十六两。老板拿出一匹月白素缎。手感确实好——你不懂布料，但你摸得出来它比你身上的官袍细腻十倍。

    你让老板包好了。抱回去的路上你心情很好。你想：她说临安什么都没有。那至少——料子还是有的。

    你把它放在她梳妆台旁边。没说是你买的——放了张条子写「新到的料子，可做春衫」。

    你等了一天。两天。第三天你从翠屏嘴里听到了——

    「料子粗。」

    三个字。翠屏转述的时候眼神躲着你。你笑了笑说「无妨，收起来吧。」

    那匹缎子被放在了柜子最底层。压在她从京城带来的十匹苏绣锦缎下面。你攒了两个月的东西——排在第十一位。最底下。

    你回到书房坐了很久。算了一笔账：她的一匹苏绣锦缎值三十两。你的月俸买不起半匹。这笔账你以前不算的。从那天起你算了。

    然后你把条子上的字迹从记忆里删掉了。
    ——碎片结束——
  身体反应: 指腹下意识摩挲了一下——像在摸一段布料的纹理。然后手收回来了。攥成拳又松开。胸口闷了一瞬——不疼，只是闷，像有什么东西沉在底下压着
