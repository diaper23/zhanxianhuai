春闺薄幸局·闪回·新婚夜的门:
  感官碎片: |
    ——记忆碎片——
    红烛。满室的红。你一身新郎吉服站在正房门口。手心有汗——不是因为紧张，是因为你攥了一路的同心结把掌纹都勒红了。

    你叩门。里面没声音。又叩。轻了些——怕她已经睡了。

    门开了一条缝。她还穿着嫁衣但凤冠已经摘了。发有些散。眼眶——你后来才明白那是哭过的痕迹，当时只觉得她累了。

    「妾身身子不适。大人……去书房歇着吧。」

    她的声音很稳。稳得像在念一行写好的词。你张了张嘴想说什么——她把门关了。

    不是摔。是轻轻带上的。

    那种轻比摔更重。摔了你还可以敲。轻轻关上的门——你连理由都找不到再开它。

    你站在门外。红烛映着你的影子被拉得很长。院里有虫鸣。你在那里站了多久？一炷香？两炷香？直到蜡泪滴在鞋面上烫了一下，你才转身去了书房。

    书房没有床。你搬了两条长凳拼在一起。铺了件外袍。新婚夜的被褥叠得整整齐齐放在正房——你一床都没拿。

    躺下的时候长凳硌得脊背疼。但你想的不是疼——你想的是，她哭过了。她为什么哭？她嫁给你不高兴。你知道。你一直知道。

    你闭了眼。告诉自己：「没事。慢慢来。」

    那是你第一次骗自己。后来你骗了无数次。
    ——碎片结束——
  身体反应: 脊背突然发紧——像有什么东西在硌。你下意识摸了一下手心——同心结勒出来的痕迹早就没了，但掌纹的位置微微发痒
