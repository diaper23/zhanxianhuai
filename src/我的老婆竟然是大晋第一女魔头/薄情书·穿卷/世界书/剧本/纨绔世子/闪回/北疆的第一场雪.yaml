    《记忆碎片》
    非原主记忆——来自<user>接掌镇北军后在边关的亲历。
    碎片画面：
    - 北疆大延要塞，入冬第一场雪。漫天鹅毛，大地刹那间变白。
    - 城墙上的哨兵裹着破旧皮裘，鼻尖冻红，呵气成霜。
    - 伙房的老兵端出一锅稀粥——碗不够，两人共用一碗，轮流喝。
    - 一名新兵看着北方苍茫的雪原发呆。老兵拍他后脑："想家了？熬过这个冬天就能轮换。"
    - 新兵摇头："我没家了。蛮子烧的。"
    - 沉默。只有风声和雪落在铠甲上的细碎声。
    感官重点：雪片落在铁甲上的沙沙声、稀粥的热气、冻僵手指握刀柄的疼痛
    《碎片结束》
