    《记忆碎片》
    原主幼年记忆——两年前随父来京。
    碎片画面：
    - 皇宫御花园，两个小孩蹲在花丛旁。男孩五六岁，虎头虎脑；女孩同龄，扎双髻，一脸认真。
    - 女孩伸出小指："你答应我，长大了来娶我。不许反悔。"
    - 男孩嘻嘻哈哈随手一勾："好——好——"敷衍至极。
    - 女孩攥紧他的小指不放："说话算话！拉勾上吊一百年不许变！"
    - 远处传来关重山浑厚的呼唤。男孩挣脱跑开——没回头。
    - 定格：女孩站在花丛中，攥着自己的小指，眼眶泛红。
    感官重点：花香、泥土气、远处的父声、小指的温度
    《碎片结束》
