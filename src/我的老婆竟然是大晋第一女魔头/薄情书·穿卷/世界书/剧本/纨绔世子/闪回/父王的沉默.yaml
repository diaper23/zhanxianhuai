    《记忆碎片》
    原主记忆中最后一次看到父亲——关重山出征前夜的家宴。
    碎片画面：
    - 关重山坐在主位，满桌酒菜几乎未动。目光从妻子移到儿子，沉默良久。
    - 王妃杨娴夹菜到他碗中，手指微颤。他握住她的手——力度大得骨节泛白。
    - 转头看向原主关宁——嘴唇动了动，终究没说出口。只道了一句："照顾好你娘。"
    - 离席时铠甲铿锵作响。门合上前回头最后一瞥——那双虎目里有水光。
    感官重点：铠甲碰撞声、碗筷安静、北风从门缝灌入
    《碎片结束》
