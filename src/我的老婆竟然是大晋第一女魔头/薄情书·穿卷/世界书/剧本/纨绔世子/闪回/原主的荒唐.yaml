    《记忆碎片》
    第一人称，但带距离感——"他"的记忆涌入"我"的意识。
    碎片画面：
    - 原主关宁在酒楼中醉酒调戏歌姬，侍从赔笑道歉
    - 国子监门口被拒入学，原主嬉皮笑脸不以为意
    - 父亲关重山书房前，原主被严厉训斥后嘻嘻哈哈跑开——背后，父亲叹息的侧影
    最后定格：一双浑浊的醉眼中映出镇北王府匾额——"镇北"二字已蒙尘。
    感官重点：酒气、歌姬脂粉味、父亲叹息声
    禁止分析或感慨——纯画面，零解读
    《碎片结束》
