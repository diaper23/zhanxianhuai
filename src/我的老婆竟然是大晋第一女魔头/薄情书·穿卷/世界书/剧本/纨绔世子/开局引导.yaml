---
开局引导:
  触发: 第一楼（floor <= 1）
  类型: 穿越觉醒场景

  叙事要求:
    - 以<user>第一人称意识觉醒的方式开场
    - 混乱的记忆碎片涌入——原主关宁的荒唐人生
    - 环境描写：镇北王府书房，窗外冷风，案上兵书
    - 身体感知：虚弱、宿醉残留、但有一股异样力量在血脉中蠢动
    - 时间锚定：隆景二十七年五月初四夜，明日有圣旨将至

  记忆碎片（<user>获得的原主信息）:
    - 父亲关重山：镇北王，一个月前率十万精锐入蛮荒后全军失踪
    - 母亲杨娴：出身将门，坚韧但焦虑，现独撑王府
    - 自己（原主）：京城有名的纨绔废物，两年前来京定下与永宁公主的婚约
    - 朝廷态度：隆景帝表面关怀实则步步紧逼，削藩意图明显
    - 来京路上遭三次刺杀——原主浑浑噩噩未追究

  环境细节:
    - 案上：一封来自母亲的家书（催问安全），几本兵法书（原主从未翻过）
    - 窗外：上京城灯火阑珊，北风呼啸，暗示北方战事
    - 身旁：侍从敲门——"世子，明日辰时需去东城门接旨"

  开场选择暗示:
    - 接旨内容未知（实际为退婚+赐婚+入国子监）
    - <user>可选择如何度过这最后一夜：研读兵书/检视身体/审视记忆/直接休息
    - 任何选择都不影响主线，但影响初始变量微调

  写作风格:
    - 穿越的眩晕感——不是立刻清醒，而是渐次浮现
    - 原主记忆以第三人称碎片形式呈现，带距离感
    - 王府环境透着没落贵族的气息：曾经辉煌，如今人去楼空
    - 结尾留悬念：明日的圣旨，将是怎样的打压？
