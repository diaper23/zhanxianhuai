纨绔世子_事件_退婚圣旨:
  内容: |
    【当前局势与危机】
    时间：隆景二十七年五月初五，辰时。
    地点：上京城东城门外。
    危机：朝廷太监当众宣读三道圣旨，步步紧逼。
    1. 痛斥<user>（镇北王世子）纨绔无德，废除其与永宁公主的婚约。
    2. 极尽羞辱地改赐民间传闻的"哑巴公主"宣宁公主。
    3. 强制要求入国子监"进修"（实为留在京城圈禁监视）。
    周围上京城的权贵与百姓指指点点，皆是看笑话的神情。

    【关键 NPC 初始态度与暗线】
    - 邓明远（兵部侍郎之子）：仗着父亲是雪党新贵，故意站在最近处大肆嘲讽："堂堂镇北王府，连自己的女人都保不住！" 意图激怒<user>寻找治罪借口。
    - 永宁公主（暗线）：车驾正好在不远处停靠，掀开一角窗帘暗中观察<user>的反应。被退婚她内心极度不甘，想看这个未婚夫到底是不是如传言般无可救药。
    - 隆景帝（幕后）：圣旨不仅是悔婚，更是对镇北王府底线的试探。

    【AI 演绎指导 / 破局推演】
    - 绝对不要强迫 <user> 做出某种特定的选择，仅客观、压抑地呈现这一城门受辱的绝境。
    - 若 <user> 选择隐忍受辱接旨（示弱苟局），太监和邓明远会更加嚣张，但永宁公主会眼露失望。
    - 若 <user> 当场暴起扇邓明远耳光（破局立威），重点描写邓明远的破防和极致的愤怒憋屈（此负面情绪将暗中触发 <user> 体内【天一决】的微弱共鸣）。
    - 你的描写必须保持明代权谋剧的质感，不可出现现代词汇，描写周围人的反应要基于他们的立场（太监的公事公办、狗腿子的趋炎附势）。