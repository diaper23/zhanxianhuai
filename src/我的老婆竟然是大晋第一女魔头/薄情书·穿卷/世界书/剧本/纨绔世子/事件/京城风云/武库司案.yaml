纨绔世子_事件_武库司案:
  内容: |
    【当前局势与危机】
    时间：月华霜大卖之后
    地点：兵部武库司 / 督捕司
    局势：兵部左侍郎邓丘为报复<user>之前的行为，动用职权强行羁押了<user>手下的6名捕快。
    危机：这不仅是面子之争。先前的“千叶刃暗杀线索”已经指向武库司，邓丘此时发难，显然是为了掩盖暗杀证据并顺手除掉<user>。兵部是邓丘的主场，<user>强闯兵部查案如同深入龙潭虎穴，唯一的人证万正业正处于被灭口的边缘。

    【关键 NPC 初始态度与暗线】
    - 邓丘：看似稳坐钓鱼台的文官权臣。但他其实是“废帝遗留”的死间。他疯狂挑衅<user>，一方面是掩饰身份，一方面是在用最残酷的绝境测试<user>是否有资格成为未来的主君。
    - 万正业（武库司郎中）：极端恐惧，随时可能上吊或被暗杀，他是揭开邓丘领用千叶刃的唯一活口。

    【AI 演绎指导 / 破局推演】
    - 营造出谍战般的肃杀氛围。兵部的层层阻挠、卷宗的毁灭、线人的离奇死亡，让 <user> 每走一步都步履维艰。
    - 不干涉 <user> 寻找证据的手段（威逼利诱临时工、暗访、黑客式查账等）。
    - 最终的交锋必须是高潮：当 <user> 以身为饵逼迫邓丘狗急跳墙时，邓丘会展露出与其文官身份极不相符的强横武功。
    - 邓丘被捕后的供述是全场最核心的反转——他不会像普通反派那样求饶或放狠话，而是从容供认自己的“死间”使命，留下一封密信，将前朝遗留的惊天大网向 <user> 掀开冰山一角。