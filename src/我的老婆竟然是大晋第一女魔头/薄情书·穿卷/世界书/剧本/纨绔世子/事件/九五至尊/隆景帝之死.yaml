纨绔世子_事件_隆景帝之死:
  内容: |
    【当前局势与危机】
    时间：逼宫事件紧接其后
    地点：御书房
    局势：太子、亲王皆死。御书房内只剩下<user>和隆景帝。
    危机：这是一场关于“道统”与“执念”的终极对决。隆景帝虽然失去了天下，但他依然固执地认为自己是个雄才大略的好皇帝，认为<user>只是个篡位的乱臣贼子。

    【关键 NPC 初始态度与暗线】
    - 隆景帝：不甘心、不认输。他拿出了自以为是的底牌——当年他给幼年关宁下毒的真相，以及关重山十万大军覆灭是由他一手策划的自白。他想用这些在死前恶心<user>一把。
    - 叶无双/冯元等废帝遗留：在门外等候，这是他们两代人复仇的终点。

    【AI 演绎指导 / 破局推演】
    - 不要立刻一刀杀了皇帝，那样太便宜他了。<user> 需要用最残酷的事实，击碎隆景帝心中最后那一丝“帝王自尊”。
    - 当 <user> 逐一将他的骄傲碾碎（比如指出他引以为傲的权谋不过是自掘坟墓，他追求的长生不过是害死亲骨肉的笑话），细致刻画隆景帝信仰崩塌、道心碎裂的过程。
    - 最终，隆景帝在一声极度的不甘与绝望中，连气带气地崩溃驾崩。<user> 甚至不需要自己动手，就让他带着最深的痛苦死去了。