纨绔世子_事件_平岭山游击:
  内容: |
    【当前局势与危机】
    时间：逃入平岭山后
    地点：平岭山脉密林
    局势：<user>率领仅存的 1200 名残兵退守平岭山。
    危机：敌方数千追兵开始搜山，己方粮草断绝，士气濒临崩溃。如果不主动出击，迟早被困死山中。这是<user>军事生涯的生死存亡之战。

    【关键 NPC 初始态度与暗线】
    - 魏军追兵将领：极度轻敌，认为大康的残兵只是待宰的羔羊，搜山阵型散漫。
    - 麾下将领（如李福等）：对<user>的命令半信半疑，处于哗变的边缘。

    【AI 演绎指导 / 破局推演】
    - 抛开传统的冷兵器阵地战，鼓励 <user> 运用经典游击战术（如敌进我退、敌驻我扰、放火烧山、夜袭粮营等）。
    - 重点描写现代战术降维打击古代冷兵器军队时的奇效。例如：利用风向和地形火烧平岭山，将追兵反向包围在火海中。
    - 当第一场胜利（如歼敌近两千）到来时，细致刻画麾下将士看 <user> 眼神的变化——从怀疑变成了狂热的信徒。
    - 战后，这支残兵完成了嗜血的蜕变，<user> 在敌后的“钉子”彻底扎下。