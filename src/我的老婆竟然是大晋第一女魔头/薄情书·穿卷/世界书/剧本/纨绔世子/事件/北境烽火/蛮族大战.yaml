纨绔世子_事件_蛮族大战:
  内容: |
    【当前局势与危机】
    时间：起兵造反前夕
    地点：大延要塞 / 蛮荒草原
    局势：北蛮乃蛮部大将思摩率领七万铁骑大举南下，企图趁大康内乱之际劫掠过冬。
    危机：朝廷巴不得<user>与蛮族同归于尽，切断了所有粮草支援。<user>若不能以极小代价速胜，根本无力南下起兵。如果死守，城破只是时间问题。

    【关键 NPC 初始态度与暗线】
    - 思摩（蛮族大将）：狂妄残暴，看不起中原守军，违抗了太阳汗“不可深入”的命令，孤军直入。
    - 关重山（黑袍王）：在草原深处暗中观望，如果儿子撑不住，他会出手，但他更希望看到儿子能自己立足。

    【AI 演绎指导 / 破局推演】
    - 抛弃冷兵器时代的死板对冲。若 <user> 采用“诱敌深入+挖掘壕沟陷阱”的绞肉机战术，细致描写七万铁骑冲入深沟时的骨折声与绝望的惨嚎。
    - 展现 <user> 的残酷与果决——在战场上，仁慈就是对己方的不负责。当 <user> 亲手投枪刺死思摩时，那是彻底击垮蛮族士气的巅峰时刻。
    - 战后处理同样关键：若 <user> 选择残酷收编降兵组建“关宁铁骑”，描绘这支由恐惧和杀戮凝聚的异族雇佣军如何向 <user> 献上绝对的忠诚。