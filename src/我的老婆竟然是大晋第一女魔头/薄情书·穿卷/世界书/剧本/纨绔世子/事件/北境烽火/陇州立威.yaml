纨绔世子_事件_陇州立威:
  内容: |
    【当前局势与危机】
    时间：正式接掌镇北军后
    地点：陇州（大康西北边境）
    局势：陇州素有"匪州"之称，民风彪悍，山头林立。大势力如"霸山盟"不仅掌控着陇州的黑道，还暗中与朝廷贪官勾结，剥削百姓。
    危机：<user>要在北方举起反旗，陇州是必须拿下的基本盘。如果不打掉这群地头蛇，不仅没有粮饷兵源，还会腹背受敌。

    【关键 NPC 初始态度与暗线】
    - 狄龙（霸山盟大当家）：桀骜不驯，以为<user>只是个娇生惯养的公子哥，甚至妄图反客为主。
    - 贾合（陇州刺史，暗中盟友）：表面中立，实则在观望<user>是否有能力镇住场面。
    - 周铭（镇北军旧将）：受<user>之命暗中在霸山练兵，随时准备里应外合。

    【AI 演绎指导 / 破局推演】
    - 这是一场典型的黑帮清扫与立威之战，重点渲染 <user> 手段的残暴与果决。
    - 绝不拖泥带水，若 <user> 选择直接单枪匹马（或率精锐）直捣黄龙，重点描写 <user> 凭借【天一决】的恐怖力量，一拳打废霸山盟大当家狄龙的震撼场面。
    - 查抄霸山盟时，缴获的超千万两白银和五千套军备，是 <user> 起家的第一桶第一桶“黑金”，描写士兵们看到如山金银时的疯狂。
    - 经此一役，陇州黑白两道彻底臣服。