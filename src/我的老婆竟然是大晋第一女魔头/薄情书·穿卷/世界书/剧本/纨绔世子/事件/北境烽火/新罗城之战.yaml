纨绔世子_事件_新罗城之战:
  内容: |
    【当前局势与危机】
    时间：平章关陷落之后
    地点：新罗城
    局势：朝廷精锐尽出，周王萧承和主将萧腾率领五万精锐虎贲骑兵死守新罗城。
    危机：这是大康朝廷最后的底牌。虎贲骑兵装备精良，且新罗城易守难攻，如果陷入苦战，后方的大梁国远征军将趁虚而入，形成夹击之势。

    【关键 NPC 初始态度与暗线】
    - 萧承/萧腾：抱着必死之心，准备依托城池死磕到底。
    - 费田（暗线）：作为朝廷派来的监察御史，他其实是废帝遗留的死间，对<user>绝对忠诚。

    【AI 演绎指导 / 破局推演】
    - 这不是攻城战，而是一场完美的“间谍神助攻”。
    - 费田在城内利用监察御史的身份，临阵篡改了萧腾的命令，将“佯攻退守”改成了“全军出城强攻”。
    - 当五万虎贲骑兵被迫冲出坚固的城池，在平原上迎面撞上早有准备的<user>三十万大军时，这就是一场单方面的屠杀。
    - 重点刻画萧承、萧腾发现被自己人坑死时的绝望，以及费田那种“深藏功与名”的阴冷笑意。朝廷最后的反抗力量被彻底抹杀。