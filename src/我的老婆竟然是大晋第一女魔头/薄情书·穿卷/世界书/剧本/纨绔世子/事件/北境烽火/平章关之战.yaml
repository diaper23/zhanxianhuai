纨绔世子_事件_平章关之战:
  内容: |
    【当前局势与危机】
    时间：起兵南下途中
    地点：平章关（大康第一雄关）
    局势：朝廷任命高仓义（高廉之子）率领四十万大军据守平章关。平章关城墙高数丈，坚如磐石，素有“一夫当关万夫莫开”之称。
    危机：强攻必死。如果<user>的三十万大军被阻挡在平章关外，一旦到了隆冬，粮草耗尽，造反大业将不攻自破。

    【关键 NPC 初始态度与暗线】
    - 高仓义：纸上谈兵的赵括式人物。克扣新兵粮饷，导致军心浮动，但他自信依靠平章关的城墙可以耗死<user>。

    【AI 演绎指导 / 破局推演】
    - 这是一场比拼理化知识的科技破城战。若 <user> 抛出“热胀冷缩”的破城法：命人架设巨型火堆长时间炙烤城墙，随后用冰水疯狂浇灌。
    - 详细描写那种超越古代人认知的物理现象——当坚不可摧的巨石城墙在冰火交加下发出令人牙酸的“咔嚓”碎裂声时，守军心理防线瞬间崩塌的震撼感。
    - 城破之后，高仓义的四十万新兵大多本就是被强征来的，面对如狼似虎的北地精锐，直接触发大面积溃逃和投降。