---
变量更新规则_剧情记录:
  type: |-
    {
      [事件名: string]: {
        "状态": "进行中" | "已触发" | "已完成",
        "结果": string // 限20字内，完全客观陈述关键人物和剧情结局
      }
    }
  check: |-
    !!!【最高指令/绝对禁令】!!!
    1. 仅当<user>的行动导致了当前场景中的核心危机被化解、升级或改变时，才允许新增或更新剧情记录。
    2. 结果语感必须客观，例如：“在城门反打脸邓明远，初露锋芒”。
    3. 如果当前事件已彻底结束，将状态修改为"已完成"。
    4. 只有在当前回合触发了实质性结果的事件才需要输出。