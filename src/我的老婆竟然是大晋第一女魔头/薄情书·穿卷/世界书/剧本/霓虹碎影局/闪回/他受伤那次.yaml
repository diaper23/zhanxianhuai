霓虹碎影局·闪回·<user>受伤那次:
  感官碎片: |
    ——记忆碎片——
    眉骨上的伤口在滴血。纱布按着——红色洇透了白纱。跑新闻时被人推搡。或者是摔的。记不清了。
    你进门的时候尽量不出声。但她从卧室里出来了——可能是听到了什么。
    她看到你的脸。停了一秒。
    "怎么了？"
    两个字。语调平。没有惊慌也没有心疼——像问"外面下雨了？"一样随便。
    你说"没事。碰了一下。"
    她看了一眼。"哦。"然后转身回了卧室。
    但她后来出来过一次——把一小瓶碘酒放在茶几上。没说话。也没留下来看你怎么擦。
    碘酒瓶很小。是新的。不知道什么时候买的。
    ——碎片结束——
  身体反应: 眉骨隐隐发麻。像旧伤在阴天犯酸。
