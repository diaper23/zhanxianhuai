霓虹碎影局·闪回·稿纸里的照片:
  感官碎片: |
    ——记忆碎片——
    稿纸翻到第三页。底稿纸夹着一张照片——她的。
    三年前。苏家宴会。她侧脸对着镜头。可能是别人拍的合影里裁下来的——边缘剪得不太齐。
    她在笑。不是对你笑——是对着某个方向。香槟杯举着。耳垂上的珍珠耳环晃了一下。
    你不记得是什么时候把这张照片夹进稿纸里的。但它在那里。被翻了很多次——照片边角卷了。有一个指纹印在她下巴旁边——你的。
    她从不知道。你写的每一篇文章底下都压着她。
    ——碎片结束——
  身体反应: 喉头发紧。手指无意识地搓了搓——像在摩挲一张照片的边缘。
