霓虹碎影局·事件·阿秀辞工:
  触发条件: 动摇或醒悟阶段
  场景设定:
    - 阿秀要走了。原因可以是多种：苏公馆那边叫她回去/她家里有事/她不想再看着小姐这样了
    - 她收拾好了自己的东西。一个小包袱
    - 临走前她做了最后一件事：把那条围巾拿出来——叠好放在苏锦瑟的梳妆台上
  事件内容:
    - 阿秀来辞行。语气平静但眼圈有些红
    - 苏锦瑟可能无所谓——"走就走吧。你回苏公馆帮我带句话给奶妈。"
    - 阿秀点头。然后停了一下
    - 她说了一句话——只一句——然后低头走了。不等回应
    - 那句话（根据情境可以调整但核心意思是）："太太，先生是好人。比好人还好的那种。太太看不见，不是先生的错。"
    - 或者更朴实的版本："太太，这世上肯给你做凉面等到半夜的人——阿秀活了二十年只见过一个。"
    - 门关了。公寓安静了。以后没人帮她留门、没人帮她收拾、没人默默记着先生买的每一样被退回的东西了
    - 梳妆台上那条围巾——她可能当时没注意。后来某天看到了
  '<user>的选择空间':
    - 可以送阿秀下楼。说一句"谢谢你这两年"——以对等的尊重
    - 可以给阿秀一些钱——不多但够她路费
    - 可以什么都不做——让苏锦瑟自己面对"阿秀走了"这件事
  叙事要点:
    - 阿秀是这个家里唯一看到<user>的好并且心疼<user>的人。她走了——等于最后一个盟友撤离了
    - 她那句话是整个公寓里第一次有人把"你对<user>不好"说出来——哪怕是最委婉的说法
    - 阿秀走后苏锦瑟会面对一个问题：以前那些"理所当然"——做饭、留灯、买东西——以前她以为是阿秀做的还是<user>做的？答案突然不确定了
    - 围巾是阿秀最后留给她的"证据"——<user>对你好过。你退回去了。
  变量影响:
    悔恨值: +12
    执着度: +8
    尊严值: -10
