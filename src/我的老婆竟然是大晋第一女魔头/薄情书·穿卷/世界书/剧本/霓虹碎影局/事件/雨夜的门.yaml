---
霓虹碎影局·事件·雨夜的门:
  触发条件: 自我审视阶段
  场景设定:
    - 深秋的一个雨夜。很大的雨。黄浦江方向风灌过来的那种
    - '<user>加班到很晚——或者出去参加什么活动。总之不在家'
    - 她在家。以前她从不在家等<user>——<user>在家等她才是日常。今天反过来了
    - 她站在公寓门口的走廊里。或者坐在门口的台阶上
  事件内容:
    - 雨很大。梧桐叶被打得啪啪响。路灯在雨帘里变成模糊的光晕
    - 她出来了。不知道什么时候出来的。可能是等不住了——可能是想去找<user>
    - 没有撑伞。或者撑了但风太大伞翻了她就那么淋着
    - 站在门口。或者走到了霞飞路。或者走到了报馆楼下——然后在门口停住了。不敢进去
    - 雨水把她的旗袍淋透了。发丝贴在脸上。高跟鞋里灌了水——踩一步滑一步
    - 她在等<user>回来。第一次。像<user>等了她两年那样——在门口。在雨里。不确定等到等不到
    - <user>回来了。或者<user>没回来。但她等了——这个"等"本身就是她所有改变的结晶
    - 如果<user>回来了看到她：她浑身湿透。发抖。但看到<user>的时候想笑又忍住了——嘴唇在抖是因为冷还是因为别的不知道
    - 她没说"我在等你"。她说的是："……下雨了。你没带伞吧。我——出来看看。"
  '<user>的选择空间':
    - 如果看到她淋在雨里：可以把外套脱下来——不说话。披上去
    - 可以问一句"你怎么在这"——语气里第一次有不是客气的关心
    - 可以牵她进去。或者不牵——各自进门。但给她倒一杯热水
    - 也可以心软了。也可以还没准备好原谅。都可以
    - 核心：这是她第一次"等"<user>。要不要回应——全由<user>决定
  叙事要点:
    - 意象翻转：以前<user>等她到凌晨。现在她等<user>到深夜。同样的"等"、同样的不确定——但她是第一次体会
    - 雨是洗礼——不是烂俗的"雨中浪漫"。是冷的、不舒服的、有代价的。高跟鞋里的水是真的磨脚。第二天她可能会发烧。但她选择了站在这里
    - 千金小姐从来不在雨里等人。千金小姐被人等。今天她把"被等"换成了"等人"——这一步比她做饭烧糊了、比她叫<user>"丈夫"——都要难。因为这一步是纯粹的"卑微"。她从来没卑微过
    - 不要写得太浪漫。要写得狼狈。美在狼狈里——因为她选择了狼狈
  变量影响:
    悔恨值: +10
    执着度: +20
    尊严值: -15
