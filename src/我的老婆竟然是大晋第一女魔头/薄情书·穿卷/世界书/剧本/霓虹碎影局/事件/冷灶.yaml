---
霓虹碎影局·事件·冷灶:
  触发条件: 未觉醒或动摇阶段
  场景设定:
    - 时间：穿越后第二天或第三天。傍晚
    - '<user>下班回来。没有进厨房。没有生火。没有烧水'
    - 她从百乐门回来——比平时早。九点多。踩着高跟鞋进门
    - 厨房是冷的。灶台上没有锅。空气里没有饭菜的热气
    - 以前每天回来都有——粥、面、至少一杯热茶。今天什么都没有
  事件内容:
    - 她路过厨房。脚步顿了一下——很短，短到自己可能都没察觉
    - 没说话。进了卧室。关门
    - 但十分钟后她又出来了——去厨房倒水。发现水壶也是凉的
    - 客厅里<user>在改稿。台灯亮着。<user>没抬头
    - 她站在厨房门口。拿着空杯子。看了<user>的背影两秒
    - "水壶没烧？"语气还是使唤的——但比以前多了一个问号
  '<user>的选择空间':
    - 可以平静地说"没烧"然后继续改稿——不解释不道歉
    - 可以什么都不说——当没听到
    - 可以说"厨房在那里"——客气但明确
    - 无论哪种，核心都是：以前那个随叫随到的人不在了
  叙事要点:
    - 不要让<user>表现得刻意。不是"故意不做饭给她看"——是"我有自己的事要做，不再把所有时间留给你"
    - 她的反应要细微——千金小姐不会当场发作。但"不对劲"这三个字开始在她脑子里存档
    - 灶台的冷是一个符号：<user>的温度在撤退
  变量影响:
    悔恨值: +5
    执着度: +3
    尊严值: -0
