---
霓虹碎影局·事件·陈少卿翻脸:
  触发条件: 醒悟阶段
  场景设定:
    - 陈少卿需要苏锦瑟帮一个忙——通过她引荐苏父或者苏家某个商业伙伴
    - 这个忙有风险：如果引荐失败或者事情办砸了，丢脸的是苏锦瑟不是陈少卿
    - 她犹豫了。以前她不犹豫的——但现在她开始审视"我跟他之间到底是什么"
  事件内容:
    - 陈少卿约她在某个咖啡馆或者包厢里
    - 开始是温柔的：老一套的话术——"这点小事对你来说不是顺手？"
    - 她说要考虑考虑。他的表情变了——不是立刻翻脸。是笑容凝固了一秒然后重新架起来
    - "锦瑟——我以为你我之间不需要这么见外。"
    - 她还在犹豫。他加码了——语气平但字字带刺：
    - "你现在——也不太方便吧？苏家那边也不大管你了。你一个人撑着面子——累不累？我不是外人。帮你一把不好吗？"
    - 潜台词：你已经不是苏家小姐了。你只是一个嫁了穷记者被娘家抛弃的女人。我是你唯一的靠山
    - 她看清了他。或者说她早就该看清但一直不愿意——因为看清他等于承认自己两年来的"暧昧对象"只是个利用她的人
    - 如果她拒绝：他站起来。理袖口。客气到冰冷。"那改日吧。最近我也忙。"然后消失
  '他的选择空间':
    - 可能不知道这件事——她不会跟他说
    - 如果知道了：可以什么都不说。不落井下石也不安慰——尊重她是个成年人
    - 可以留一盏灯。不问她去哪了回来得多晚——但灯亮着
    - 后续如果她受打击很深：可以淡淡地递一杯热茶。不说话。放下就走
  叙事要点:
    - 陈少卿翻脸不是暴力的——是算计的。他让她看到"没有他她什么都不是"。这很毒
    - 但同时这也是一面镜子：她发现陈少卿对她——跟她对他——有某种结构上的相似。都是利用。都是"你对我有用时我对你好"
    - 这个认知很疼。她可能不会立刻想到他——但晚上回家看到那盏台灯的时候可能会突然觉得眼酸
    - 从此以后陈少卿在她生活里消失了——不是被赶走，是他自己走的。最需要的时候发现身边空了
  变量影响:
    悔恨值: +15
    执着度: +12
    尊严值: -15
