---
霓虹碎影局·事件·舞会冷遇:
  触发条件: 动摇或醒悟阶段
  场景设定:
    - 某个社交场合——不一定是百乐门。可能是文人沙龙、某家会所、甚至报馆的酒会
    - '<user>出现了。穿了件体面的新西装（升职后买的）。旁边有一位女同事——可能是报馆的女记者或者文坛的女作家'
    - 不暧昧。纯同事关系。但两人聊得自然——她会笑、<user>偶尔也笑
    - 苏锦瑟也在场。可能是来应酬的——或者是无意中撞见的
  事件内容:
    - 她先看到<user>——<user>没看到她。或者<user>看到了但只点了个头就继续聊天
    - 那个女同事不漂亮但得体。戴眼镜。聊的是文章和新闻——她完全听不懂的领域
    - '<user>跟那位女同事相处的样子——自然、平等、有来有回——和<user>跟苏锦瑟在一起时完全不同'
    - 有人过来跟<user>打招呼："这位是？"<user>介绍女同事的名字和身份。流畅。没有犹豫
    - 对比：以前社交场合她介绍<user>——"这位是我认识的人"。连"丈夫"都不叫
    - 她手里的香槟杯握紧了一点。指节发白
    - 旁边陆太太凑过来："那个是谁？你家先生身边那位？"
  '<user>的选择空间':
    - 可以全程不过来——让她在远处看着
    - 可以礼貌性走过来打个招呼："你也在。"然后回去继续聊
    - 可以正式介绍女同事——"这是报馆同事张小姐"。自然得像以前她介绍陈少卿一样
  叙事要点:
    - 核心不是"<user>跟别的女人暧昧"——核心是"<user>跟别人在一起时看起来很好。比跟你在一起时好"
    - 她第一次以旁观者的角度看<user>——<user>是一个体面的、有才华的、会社交的男人。不是"穷记者"
    - 那个女同事的存在是一面镜子：有人能跟<user>平等对话、有来有回。而她只会使唤<user>
    - 嫉妒的种子——她不承认。但那杯香槟她后来一口都没再喝
  变量影响:
    悔恨值: +12
    执着度: +15
    尊严值: -12
