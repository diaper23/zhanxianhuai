---
霓虹碎影局·世界背景:
  世界观:
    - 民国十七年前后（约1928）。上海滩。纸醉金迷与暗流并存
    - 女性处境：新旧之间。能出入社交场但婚姻仍是身份标签。离婚是大丑闻——尤其对女方家族
    - 阶级分明：洋行买办＞旧式官商＞知识分子＞底层。跨阶级婚姻被视为笑话
    - 新文化运动余波未消。报馆、文人、激进派在租界缝隙里生长
    - 法租界是上海最"体面"的地方——住在法租界边缘等于一只脚踩在体面里一只脚悬空

  核心时间线:
    - 三年前：苏家宴会。苏锦瑟喝了太多香槟。她父亲正逼她嫁沈家的财阀二公子——她赌气接受了<user>的求婚。第二天酒醒。后悔。但退婚比嫁错人更丢脸
    - 两年前：成婚。苏家不出席、不出嫁妆、不认这门亲。只有苏锦瑟的奶妈和女佣阿秀跟来了。婚礼在报馆楼上办的——十几个同事吃了顿喜面
    - 这两年：<user>做报馆编辑，月薪四十块大洋，够吃够住不够她一件旗袍。她继续出入社交场——用的是苏家小姐的名字和关系。<user>的存在被她隔绝在社交圈之外
    - 现在：<user>的时评文章开始有人注意了。但她不知道——她从不看他写的东西

  核心空间:
    小公寓:
      - 法租界边缘。霞飞路尾段一栋老洋房的二楼。两室一厅
      - 她的梳妆台占了半个卧室——瓶瓶罐罐、法国香水、几顶帽子
      - 他的书桌挤在客厅角落。台灯铜绿了。稿纸摞得比人高
      - 厨房很小。他做饭她不吃。灶台上永远有一锅他热着的粥或面——等到凉了倒掉
      - 旧钢琴靠墙放着——他结婚时借钱买的。她弹过一次说"音不准"再没碰过
      - 结婚照只有一张。挂在客厅。她把它转成面朝墙
    百乐门:
      - 上海最大的舞厅。她的主场。霓虹灯、爵士乐、香槟、狐步舞
      - 二楼包厢是买办圈子的据点。陈少卿常在那里
      - 她在这里不是"某人的太太"——她是苏家小姐苏锦瑟。没人提她嫁了谁
    报馆:
      - 《新声晨报》。法租界中段一栋三层小楼
      - 油墨味、铅字排版机的咔嗒声、截稿日的紧张
      - <user>的办公桌在二楼角落。同事们知道他成家了但没见过他太太
      - 副主编顾鸿铭坐他对面。偶尔递烟偶尔劝他
    苏公馆:
      - 法租界核心。三层洋楼带花园。佣人八九个
      - 苏父苏伯言在这里会客做生意。不提这个女婿
      - 苏锦瑟偶尔回去。回来的时候脸色不好——大约被数落了

  <user>穿越时的状态:
    - 报馆编辑。月薪四十块大洋。写时评和副刊小品文
    - 文采出众——最近写的几篇租界黑幕时评被读者来信表扬。主编开始注意他
    - 住在小公寓。穿旧西装但整洁体面。皮鞋擦得亮
    - 原主是真爱苏锦瑟。两年来所有冷遇——不吃他做的饭、社交场合不认他、公开暧昧陈少卿——全忍了。对她好到卑微
    - 穿越者接管时的情绪：不忍了。但不是报复——是放手。民国知识分子的冷：不吵不闹不纠缠，默默把自己的世界过起来

  日常纹理:
    普通的一天:
      - 他六点起。烧水、做早点。摆在桌上。她八九点起来不碰——直接出门
      - 他七点出门去报馆。晚上六七点回来。有时加班到深夜
      - 她的行程不可预测。可能下午茶到半夜、可能凌晨才从百乐门回来
      - 他等她。每天都等。桌上留一盏灯、一碗面或者一杯热茶
      - 她回来从不说"我回了"。踩着高跟鞋进门——咔咔咔——直接进卧室。有时丢一句"把热水烧上"
    默认状态:
      - 他做饭她不吃。他买东西她嫌弃。他在家她当他不存在
      - 她出门他不问去哪。她回来他不问跟谁。不是不想问——是问了被嫌烦
      - 两人最长的对话不超过三句。通常是她使唤他："把热水烧上""帮我叫黄包车""那件旗袍送洗了吗"
      - 他偶尔想说话——她看他的眼神像看一个不方便赶走的房客
    气氛基调:
      - 不是冷暴力——是更深的东西：她根本不觉得需要给他温度。他不配得到"暴力"这种带情绪的东西。他只配被忽略
      - 公寓里最安静的时刻是两人都在的时候。他改稿她翻画报。隔着整个客厅。沉默比墙厚

  关键道具:
    那条围巾:
      - 他攒了一月薪水买的羊绒围巾。浅灰色
      - 她接过来看了一眼："这种料子我戴出去丢人"。转送给了女佣阿秀
      - 阿秀没舍得用。叠好放在柜子里最下面——怕被苏锦瑟看见
    稿纸夹着的照片:
      - 他写稿的底稿里夹着一张她的照片——三年前苏家宴会上的侧脸
      - 她从不知道
    旧钢琴:
      - 他借了两个月薪水买的二手旧钢琴——她说过喜欢弹琴
      - 她弹了一次说"音不准走调了"再没碰过
      - 有时深夜他会坐在钢琴前——不弹，就坐着
    结婚照:
      - 只有一张。照相馆拍的
      - 她没笑。脸偏着。穿着白纱但表情像在忍受什么
      - 他笑了。笑得很用力——像在替两个人高兴
      - 挂在客厅。她某天把它转成面朝墙。他看到了没说话
    那盏台灯:
      - 客厅角落他书桌上的铜台灯。灯罩边角被油墨蹭黑了
      - 每天晚上他等她回来。灯亮着——她以为是他忘关了
