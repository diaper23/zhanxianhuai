情深不寿局·闪回·评委席上的那姑娘:
  感官碎片: |
    ——记忆碎片——
    那是四年前。摄影大赛的评审席。
    一张黑白照片在你手里停了很久——侧脸，逆光，眼是冷的也是烫的。你偷拍的。你不敢知道她叫什么名字。
    评委席上一位短发的女前辈把照片拿过去。她的手指摸了摸屏幕上那姑娘侧脸的鼻影。
    "这姑娘是谁。"
    你脑子里只剩下一件事：不能让他们知道你偷拍了一个陌生的影后预备役。
    "我女朋友。"你说。声音没抖。
    那个前辈笑了一下。举杯。没解释她为什么不解释。
    ——碎片结束——
  身体反应: 喉头一紧。短信弹出来"见一面"那一秒，喉咙里藏的还是四年前那句"我女朋友"的尾音。
