情深不寿局·闪回·那句为他好:
  感官碎片: |
    ——记忆碎片——
    那天亲密过后。
    她头发还没梳好。你已经够着水杯要起来给她倒水。她已经看过你三年这种动作了。
    "我们分手吧。"她说。
    你杯子停在半空。你以为她要说什么——她跑得太远你跟不上了。但她下一句不是这个。
    "你天天围着我转，耽误你摄影了。"
    她说得那么平静、那么贴着你该走的路。一个你以为会替你下判决书的人替你下了判决书——所以你信了。
    你点头。你穿好衣服。你走。
    你三年里告诉自己无数次："她是替我想的。" 你没去想过这句话其实替谁省事——替她。
    ——碎片结束——
  身体反应: 胃在抖。你那时起就胃有时候疼。所以你今天摄影棚躲进厕所的时候，你不知道带胃药——是因为你不会替自己带。
