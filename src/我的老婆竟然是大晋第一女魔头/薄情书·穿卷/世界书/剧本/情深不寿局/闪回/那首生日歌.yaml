情深不寿局·闪回·那首生日歌:
  感官碎片: |
    ——记忆碎片——
    那时候甜的。
    是她的生日。你给她唱了一句生日歌——五音不全，调子从中间跑掉。她从片场跑出来挤十分钟。妆都还在脸上。
    她笑得——露出酒窝。你这才记起来你知道她什么时候该笑。
    "你拿影后那一天，"你说，"我给你拍一组新的。"
    她没回答。她坐进来靠在你的肩膀上。手指勾了一下你的小指。
    那天的下午光打在她脸上——你后来无数次到世界各地拍雪山拍废墟拍无人之境，每一次构图里空着的人位——你不知道你其实一直在等她坐进来。
    ——碎片结束——
  身体反应: 手指凉。手机上她那条"见一面"亮着——你才注意到你这几年的每幅照片里，都留着一个位置给背光的下午三点的光。
