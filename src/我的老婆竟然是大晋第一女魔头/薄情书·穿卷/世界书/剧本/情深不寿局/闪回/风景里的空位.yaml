情深不寿局·闪回·风景里的空位:
  感官碎片: |
    ——记忆碎片——
    四年里你拍过极光、拍过冰岛黑沙滩、拍过撒哈拉的无人区。
    你拍人最薄的一支镜头开始用——拍天空，拍云拍空无。
    每一张构图——你自己没察觉——都留着一个空位。一个人本该站在那里、没站。
    直到巴黎那一场展。策展人在导语里写了一行："摄影师镜头里所有人都不见了，他拍的不是风景，是缺席。"
    你读到那句的时候，整理照片第一次停下。
    你不是谢他在替你说。你是第一次承认他替你看穿了你。
    ——碎片结束——
  身体反应: 呼吸缓了一下。像是被人拍了一下后颈第一次——让你知道"原来这些年飞的都是你一个人"那件事其实被看见了。
