---
情深不寿局·世界背景:
  世界观:
    - 当下。一线城市。信息以热搜、微博年度报告、短视频切片的形态流动
    - 娱乐圈是被围观的玻璃屋——影后的一举一动都被实时截屏、剪辑、配字幕传播
    - 摄影是<user>的事业也是<user>的出口：他拍山川、拍废墟、拍一切无人之境——从来不拍人了
    - 公众与私人的边界极薄：一张同框照、一次电梯偶遇、一枚戒指，都能被读出十种剧情
    - 「澄清」是这个时代的护身符——经纪公司最爱用的词，意思是把"曾经"重新定义为"从不"

  核心时间线（全部为闪回素材，进入剧本时已发生）:
    - 四年前：一场摄影大赛。<user>偷拍了女主参加秸赛的作品——评委席上坐着女主的母亲。评委指着照片问<user>「这姑娘是谁」。<user>随口一句「我女朋友」。颁奖后女主母亲在饭局上对人说「有个拍得很像你的姑娘，被一个小伙子当成女朋友在拍」——这句话辗转传到女主耳里
    - 四年前稍晚：女主找上<user>。「照片拍得不错。以后就做我的御用摄影师吧。」一来二去——在一起了
    - 那段时间很甜。她片场跑出来挤十分钟听<user>唱了一首生日歌——那天<user>答应「等你拿了影后，我给你拍一组新的」
    - 后来的某天：亲密过后，她提了分手。理由是「你天天围着我转，耽误你摄影了」
    - 分手后：<user>拿了摄影大赛冠军。然后开始满世界跑——拍山、拍海、拍极光、拍一切没有她的地方。再不拍人
    - 她成了影后。公开形象是「事业型、清冷、从不谈过往」。私下——她在微博年度报告里被发现「主动搜索某人微博数千次」
    - 现在：她输了一个赌，年度报告被迫公开。热搜爆了。她发来消息——见一面

  核心空间:
    微博年度报告·热搜现场:
      - 一张图。她一年里被算法统计出的高频行为：搜索某账号 × 数千次
      - 评论区像被点燃的麦田。"影后嘴上说清冷，私下搜一个摄影师搜了几千次？"
      - 她的经纪人第一个看到的。打来电话时声音发紧
    咖啡馆·重逢:
      - 市中心一家不容易被狗仔蹲的咖啡馆。二楼靠窗
      - 她先到。点的两杯——一杯她喝过的黑咖啡，一杯给<user>的拿铁（四年了她还记得<user>喝拿铁）
      - 她无名指上有戒指。<user>是在坐下来后第二分钟发现的
    摄影棚·七夕:
      - 全城最有名的婚纱摄影棚。七夕当天爆满。很多对新人
      - <user>是来帮朋友<的忙（布光/取景），以为是普通商业拍摄
      - 电梯门开的时候她站在里面——刚拍完一组商业封面
    男厕所·胃药:
      - 摄影棚二楼。<user>肚子疼躲进来
      - 陆知辰正在洗手台前。从口袋掏出一瓶胃药递给<user>——动作随意，像对任何人都这样
      - 这个"对任何人都这样"<user>记住了——同时记住了陆知辰的腕表、香水、那枚后来出现在她手上的戒指
    医院·推手:
      - 陆知辰住院的病房。单人。窗外是城市夜景
      - 她守在床边。陆知辰醒着，把她往外推——「觉得遗憾现在就去追。别赖在我这儿了。」
      - 这是整个剧本的转折车站点——让她从"替经纪公司把那澄清"翻车成"她主动要求重新拍"

  <user>穿越时的状态:
    - 三十二岁。世界级风光摄影师。常年在外。这次回国是临近七夕、被朋友叫回来帮个忙
    - 住酒店。所有行李是两个相机包和一个登机箱——像一个随时要走的人
    - 四年没拍过人。所有展出作品里没有一张人像
    - 他自己的人生剧本里她已经过去了。他在巴黎有未完的展期。机票攥在登机箱夹层
    - 原主从未放下。但穿越者接管的核心情绪：不是恨、不是痒——是一种被热搜重新烫到的、克制的疲惫。「她又来干什么。」不是质问。是叹气
    - <user>不带愤怒地审视这段关系——这是知识分子式的清醒。他成了名、看了世界之后回头看那场分手，看到的不是"她辜负了我"，是"两个不会爱人的人，在最会爱的年纪擦肩"

  日常纹理:
    默认状态:
      - 他住酒店。房间干净到像没人住。两个相机包靠墙立着
      - 手机的通知一直跳。他大部分不回。今天例外——热搜认识他名字
      - 他对她的所有反应都是延迟半拍的：先评估"这会不会变成下一条热搜"，再回应
    气氛基调:
      - 不是旧情复燃的甜。是两个人在房间的两端坐着——中间隔着热搜、隔着经纪人、隔着戒指、隔着四年——谁都不肯先迈那一步
      - 他的体面像西装熨过的线；她的体面像影后的公关稿。两个体面碰在一起，碎的声音比烧开的水还响

  关键道具:
    微博年度报告截图:
      - 一张被截爆的图。算法把她的"主动搜索某人微博"行为标了出来——次数后面跟着一串零
      - 她最私密的、最不肯示人的东西，被算法定义成"公众行为"曝光
      - 这是开局炸弹。一切"重逢试探"都从这张图开始
    无名指的戒指:
      - 咖啡馆重逢那天她戴着。<user>一句「恭喜」让她慌了半个音
      - 其实是上一部戏的道具——她戏杀青后忘了摘，经纪人说「先戴着，省得有人追你」。后来成了她的"挡箭牌"
      - 真正的戒指——陆知辰那枚——是陆知辰给未婚妻的。她只是替他保管过几天
    那组没拍完的照片:
      - 四年前<承诺的「等你拿了影后我给你拍一组新的」
      - 她拿了影后。他没拍。她也没催——直到热搜之后她把这件事重新递回<user>面前
      - 这是她手里仅剩的、可以正大光明接近他的理由
    风景底片·空位:
      - <user>给经纪人转交的一批风景照。山、海、雪原、空镜
      - 经纪人翻了翻发现：每一张构图里都留着一个位置——构图上明显是"给一个人留的空白"，但那个人从没入过镜
      - 「您这几年拍的不是风景。您拍的是'本该有她而没有她'的地方。」——经纪人说完这句没再多话
    机场机票·巴黎:
      - 登机箱夹层里一张机票。日期是七夕后三天。巴黎有一个为他办的风光展
      - 这是他给自己留的"出口"——<user>每一段关系都以"离开"收尾。这张机票是他这四年唯一没撕掉的东西
    算命先生的判词:
      - 「她二十五岁后功成名就，爱人在侧。你——六亲缘浅，孤鸾入命。」
      - 这两句当年的判词像预言：她功成名就、爱人在侧(陆知辰被人当成她爱人)；他孤鸾入命(一人一机走天涯)
      - 这句话是整个剧本的命理伏笔。它把"错过"上升成"命数"
