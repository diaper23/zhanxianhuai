情深不寿局·事件·画廊的空位墙:
  触发条件: 前置【巴黎影后红毯】已完成
  场景设定:
    - 画廊二层展厅。冷光。墙上挂着他三年间拍的山川——每一幅构图都有一个明显的"空位"
    - 策展语写在一面墙的开头：「摄影师镜头里所有人都不见了。他拍的不是风景，是缺席。」
  事件内容:
    - 她站在第三张照片前。是一张极光的雪山——前景左边留着一个明显的人形空位，背后灯照出来是逆光余温
    - 她转身。第四张。一张冰岛黑沙滩黄昏——构图正中是一个明显给一个女生站的地方，没站。空着。是她那盏光
    - 她一字一句把策展语默念完
    - 走到展厅末端。墙上挂着最大一张——巴黎塞纳河夜景。一张桥边。一个明显给人站的地方空了。是他到了巴黎之后才拍的——没拍她，留了一个她从来没出现过的位置
    - 她把手机拿出来。打开那个"老相机"相簿。截过的每一张他巡展报道——她快速对照展墙。一边一边重叠
    - 她在最后一幅前哭了。哭得很轻——影后这辈子第一次在公共场合失态。展厅只剩她和那盏灯
    - <user>不知道站得离她多远——他不打断。他知道的，她在她那几千次搜索里，今天第一次把搜索结果的真实形状看到了
  '<user>的选择空间':
    - 可以走近。也可以站门口等
    - 可以递一张纸巾——这是四年里他第一次在她的眼泪里伸手
    - 可以什么都不做，让她哭完——影后第一次有人愿意让她哭完而不是接住
  变事要点:
    - 这场戏是整个剧本的情绪顶点。她不只看了底片——她数了一遍照片墙上一整面"我"缺席的四年
    - "桥边那个位置"是他到巴黎以后才拍的——他的心一直在巴黎找她的空位
    - 缺席的座位(The Absent Seat)的展览题目这时刻落地
  变量影响:
    悔恨值: +15
    真相已知度: +20
