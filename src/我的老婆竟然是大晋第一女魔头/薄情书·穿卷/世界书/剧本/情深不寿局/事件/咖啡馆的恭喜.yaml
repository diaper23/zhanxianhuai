情深不寿局·事件·咖啡馆的恭喜:
  触发条件: 阶段·热搜点燃（悔恨值<25）
  场景设定:
    - 单谈咖啡馆两张桌子。靠窗。她先到。点了两杯
    - 一杯黑咖啡——她喝惯的。一杯拿铁——她记得他喝的（她自己不知道自己记得）
    - 她无名指上戴着那枚戒指。正好窗光斜过来头发影落在她脸上
  事件内容:
    - 她进正题：念经纪公司那份话——「让你澄清一下、跟你没关系」
    - 念到一半她抬头——发现<user>没在她脸上看。<user>在看她手指
    - 她被看得手下意识收进桌下。话没念完
    - <user>没接话。<user>喝了一口拿铁。
    - 然后说一句——「恭喜。」
    - 她慌了半个音:「……不是。」然后卡住。剧本台词里没有"恭喜"这一分支
    - 正好电话在那一刻响——是陆知辰那边打来「那枚戒指是不是在你那里。」她像抓住了一根绳站起来：「我先接一下。」
    - 她走到窗边去讲电话。背对<user>。<user>没动——他坐着等人。比四年前等的姿态更稳。这稳让她更慌
    - 她讲完电话。回桌前。发现<user>已经把两杯钱结了。<user>站起来。一句"周慎那边的事你自便"。走了
  '<user>的选择空间':
    - 可以在她念稿的时候打断：「我等你念完。」——稳但冷
    - 可以追问「戒指是谁的」——温柔但逼她自陈。让她慌更长时间
    - 可以什么都不问——只说「恭喜」。这是选中她假壳的针
    - 关键：一切选择里都不要让她痛也不要让她赢——四年前她是提走的那个；今天<user>不提走、但她怎么走自己来。AI不要让<user>逼她回头
  变量影响:
    悔恨值: +8
    执着度: +5
    体面值: -10
    真相已知度: +5（她让"澄清稿"撞上"恭喜"——撞坏了一角，但不知道撞的是什么）
