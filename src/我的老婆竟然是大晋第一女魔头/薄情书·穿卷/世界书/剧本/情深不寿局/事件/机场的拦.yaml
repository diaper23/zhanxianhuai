情深不寿局·事件·机场的拦:
  触发条件: 阶段·放手或回头（悔恨值75-90；前置：陆知辰已退出、澄清稿已撤销）
  场景设定:
    - 七夕后第三天。<user>候机厅。登机箱在脚边。
    - 飞航巴黎的机票在登机箱夹层。机场是<user>给这段人生留的出口
  事件内容:
    - 她一个人来了。没有助理、没有周慎。衣服是普通便服
    - <user>抬头看见她。脚步只停半秒
    - 她把过去一个礼拜里演了几次"我没事"的全部预备背稿撕掉了。这次她一张稿都没有
    - 她说："那一年你说我耽误你摄影。我答应了分手。那个理由是我编的。是我怕的。是我刚签了那部大片，你还没出圈——我受不了自己得承认'我爱的人还在低处'、还得替你在我的圈里解释。我把'我承担不起'写成了'为你好'。我知道你后来提前拿了冠军。我那套逻辑反着闭合了。我欠你的不是解释——是我亲手把你踹开了四年没承认过。"
    - 说完她把手机里的"老相机"相簿打开——里头四年里她偷偷截的他所有巡展报道、加保的所有退票记录
    - "我搜了你四年的微博。算法替我记着。我自己没认账。今天我认了。"
    - <user>没立刻说话。登机广播在头顶响——巴黎航班最后一个登机口提醒
    - 她不抢话。她站着等。这是她人生里第一次一个人追一个人、不预设结果
  '<user>的选择空间':
    - 可以撕掉那张巴黎机票——这是把出口自己合掉。彻底的回头
    - 可以照常登机——让两个人各自飞。她不演"我没事"了，他也不演"我画句号"了。结果各自承担
    - 可以暂别一句「我回来再谈」给两人一个不在媒体下的窗口期——这是最克制也最干净的一条
    - 关键：本剧本是多结局分叉——AI不预设偏锋任何一方。三种结局各有它的清算
  叙事要点:
    - 这场戏是整个剧本的入口出口同一处——机场是她一等就是四年的场所、是<user>这一剧本给自己搭的预案出口。两人最终在出口撞了脸
    - 她的话一字不多。AI不要让她苦情。她演过八年的清冷——今天她也才第一次演"我有事"。生涩是她演得不好的原因也是感人的原因
    - <user>的反应不取决于怒——<user>没怒过。他的反应取决于"自己有没有把门合上"——这是他四年唯一的"出口"。这是他自己的事不是她的
  变量影响:
    悔恨值: +0（这是释放不是增长）
    执着度: -10（放下了"一定要追到"——变成"我送到了，他选不选是他的事"）
    体面值: -10
    真相已知度: +30
