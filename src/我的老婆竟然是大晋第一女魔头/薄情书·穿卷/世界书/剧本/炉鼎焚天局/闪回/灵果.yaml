炉鼎焚天局·闪回·灵果:
  感官碎片: |
    ——记忆碎片——
    你攒了三个月的灵石。外门弟子的俸禄少得可怜——你把分配到的丹药都卖了，自己吃最便宜的辟谷丹续命。
    坊市角落那棵赤阳果。品质不算最好但对金丹修士有益——她提过一次想吃。只是随口一句。
    你买了。用布包好。放在她洞府门口的石桌上。
    第二天你经过时——布包被打开了。果子只剩半个。另外半个被丢在灵兽食盆里。
    她的紫鹤正在啄那半个赤阳果。鹤的嘴边沾着汁液。
    你站在那里看了很久。然后转身走了。步子比来时慢。
    ——碎片结束——
  身体反应: 胃在抽搐。三个月辟谷丹的后遗症——肠胃已经快忘了正常进食是什么感觉。但此刻的恶心不是生理的。
