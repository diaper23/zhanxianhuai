炉鼎焚天局·闪回·雪夜三秒:
  感官碎片: |
    ——记忆碎片——
    大雪。偏院没有取暖阵法——太费灵石。
    你发着烧。灵力虚空到连体温都维持不住。被褥像冰做的。
    有人推开了门。她的冷香。你没睁眼——但你知道是她。
    她站在床边。三秒。
    三秒里你能感觉到她的目光——像在称量什么东西的重量。
    然后她转身走了。脚步声消失在雪里。
    后来你高烧退了。是老姜来的——不知道谁告诉他的。他塞了两颗退烧丹骂骂咧咧地走了。
    你问过一次："那天晚上——是你让老姜来的吗？"
    她的表情像是第一次听说这件事。「什么？」然后就没有然后了。
    那三秒——你后来想了很久。她是心疼了三秒还是在算"<user>还能用多久"。
    现在你知道答案了。
    ——碎片结束——
  身体反应: 皮肤起了一层细密的寒栗。不是冷——是身体记住了那个雪夜灵力枯竭时骨头被冻透的感觉。指尖发白。
