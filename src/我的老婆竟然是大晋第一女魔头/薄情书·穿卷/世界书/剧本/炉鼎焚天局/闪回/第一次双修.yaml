炉鼎焚天局·闪回·第一次双修:
  感官碎片: |
    ——记忆碎片——
    她的手指搭上你的手腕时——温凉。像玉。
    「别紧张。」她笑了笑。嘴角的弧度刚好让你觉得被善待。
    你那时候信了。纯阳灵体的灵气被牵引出来时有一种被抽空的酥麻——你以为那是双修本该有的感觉。
    她闭着眼。睫毛微颤。面容如入定般平静。美极了。
    你不知道你在被抽走什么。你只觉得她靠近你的时候——你这辈子第一次觉得自己对一个人有用。
    事后你躺在榻上发不出力。她起身整理衣裳。动作行云流水。
    回头看了你一眼。「不错。下次会更好。」
    你以为"更好"是指你们之间。
    ——碎片结束——
  身体反应: 经脉里残留的抽取痕迹在隐隐作痛。丹田深处有一种被掏空后留下的凉意——像伤疤记住了刀。
