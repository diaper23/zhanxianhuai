炉鼎焚天局·事件·散功抵命:
  触发条件: 认知阶段为自我审视。悔恨值>=80且尊严值<40时触发。全剧最终事件
  场景设定:
    - 青冥宗后山悬崖。灵气充沛的绝地——适合散功。也适合死
    - 柳映霜独自站在崖边。白衣已不复从前的整洁——灵力反噬让她形容憔悴
    - 她面前的石台上放着一枚玉简——里面刻着"逆转引灵"的术法。她查了三个月才找到
    - 术法要求：将抽取者本身的修为化作灵力，灌注回被抽取者。代价——散功。一切归零

  事件内容:
    - 她找到了"还"的方法。但代价是散尽自己所有修为——从金丹跌回凡人
    - 这意味着什么：天才的名号没了。几十年修炼归零。在修仙界，散功者比废人还不如——至少废人还有一丝可能
    - 她已经决定了。不是一时冲动——是三个月来每天夜里反复推演的结论
    - 她做了准备：把洞府的灵物分了（给苏璃一份、给宗门一份）。写了一封信给梁师叔说明真相。冷玉簪放在了<user>偏院门口
    - 然后她来到这里。开始运转术法
    - 散功的过程不是瞬间的——灵力一丝一缕地从丹田剥离，化作金色的光点飘散。每一缕都疼。像把筋从骨头上一根根撕下来
    - 她没有叫出声。咬着嘴唇。血从唇角流下来混着散出的灵光
    - 如果<user>赶到——<user>看到的是：她被金色灵光包裹，面色惨白，嘴角带血，双目紧闭——正在一点点把自己的修为化为灵力外放
    - 那些灵力——如果<user>靠近就能感应到——正在向<user>的方向汇聚。纯净的、带着她毕生修炼痕迹的灵力。在找回家的路

  '<user>的选择空间':
    - 阻止她——打断术法。她的修为已经散了一部分但还有救。但她可能会反抗——"别拦我"
    - 让她继续——看着她散功。接受她"还"的灵力。这是她的选择
    - 接受一部分然后阻止——让她还够了就停。但术法一旦启动能不能中断取决于<user>的实力
    - 在最后一刻做出选择——全剧的终极分支。<user>对这段关系的最终态度在这里定义

  叙事要点:
    - 散功不是"我为你去死"的浪漫化自杀——是一个做错事的人在用唯一能用的方式偿还
    - 她的平静比任何情绪化的表达都更有力——因为这是深思熟虑的决定不是冲动
    - 那封给梁师叔的信意味着她不打算逃避后果——散功后她以凡人之身面对宗门审判
    - 冷玉簪放在偏院门口——这个细节是全剧第一幕的呼应。第一幕她在铜镜前系簪子时那个从容的姿态，和现在这个对比
    - 不要把结局写死——<user>的选择决定故事走向。阻止了也不代表原谅。没阻止也不代表无情
    - 她散功时不要写内心独白——只写动作、只写疼、只写沉默。让读者自己填
    - 如果这是全剧最后一幕——最后一个画面应该是：散去的灵力像金色萤火虫一样飘向<user>的方向。她的白发从黑变白（修为散尽的表征）。她睁开眼——第一次用凡人的眼睛看着世界

  变量影响:
    悔恨值: 归零（她已经用行动偿还了。悔恨不再有意义）
    执着度: 归零（这不是追夫。是了断。之后如果还有执着——那是全新的、不带负罪的感情）
    尊严值: 归零（天才的壳彻底碎了。但碎掉之后——她第一次是完整的人）
