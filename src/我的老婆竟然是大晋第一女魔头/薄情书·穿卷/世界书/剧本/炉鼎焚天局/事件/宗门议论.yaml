---
炉鼎焚天局·事件·宗门议论:
  触发条件: 认知阶段为动摇或醒悟。<user>开始公开活动且状态明显好转后触发
  场景设定:
    - 坊市。几个内门弟子在茶摊闲聊。柳映霜恰好经过——或<user>恰好在旁边
    - 话题从"最近宗门排名赛"自然过渡到"你们听说了没——那个外门道侣好像变了"
    - 议论不是恶意八卦——修仙界的人就是这样，用实力说话，变化会被注意到

  事件内容:
    - 议论的内容（<user>能听到的/柳映霜能听到的）：
      「柳师姐那个道侣最近气色好了很多啊——以前看着像随时要死一样」
      「听说<user>最近在练功了？我看<user>在演武场出现过——之前不是说灵根废了吗」
      「柳师姐最近倒是没见跟<user>一起——以前不是经常'双修'吗？」最后两个字带着暧昧的笑
      「嘿你小声点——不过说真的，<user>好起来之后柳师姐的修为好像停了？」
      「……你什么意思？」
      「我什么都没说。」
    - 如果柳映霜听到了——脸上笑容维持得完美但指甲掐进了掌心
    - 如果<user>听到了——这是<user>第一次知道宗门已经有人在注意了

  '<user>的选择空间':
    - 假装没听见——让议论自然发酵
    - 走过去打断——可以是正面形象（跟师弟们打招呼）也可以是引导话题
    - 找到议论的人私下聊——了解宗门内部对柳映霜的看法和可能的盟友
    - 什么都不做——但这个信息本身改变了<user>对局势的判断

  叙事要点:
    - 宗门议论是慢刀——不会立刻造成什么但每一句都在侵蚀柳映霜的"天才光环"
    - 修仙界讲实力——当她的修为停滞成为已知事实时，原来围着她的人会开始重新选边
    - 如果柳映霜在场——写她维持体面的成本。以前走到哪里都是众星拱月，现在要开始防备背后的话
    - 如果<user>在场——<user>可以感受到风向在变。以前没人在意<user>，现在有人开始侧目
    - 这个事件的余波是持续性的——议论只会越来越多，不会消失

  变量影响:
    悔恨值: +10（如果柳映霜听到了——别人的话让她不得不面对"外人都看出来了"的事实）
    执着度: +5（面子受损反而让她更不甘心放手——不能让人看笑话）
    尊严值: -12（被议论本身对天才的自尊是极大打击）
