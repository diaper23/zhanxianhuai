---
闪回指导:
  格式要求:
    - 以"——记忆碎片——"开头，以"——碎片结束——"收尾
    - 第一人称。不超过150字。纯感官+情绪，零分析零解释
    - 时态为过去时的"正在发生"（沉浸式回放）
    - 不点名女主名字——用"她"或感官描写代替
    - 结束后<user>可能出现短暂恍惚/身体反应（左腿痛、心跳加速、攥紧拳头等）
  效果:
    - 对<user>：可能微幅增加冷漠度(+3~5)或心软度(+2~3)取决于片段性质
    - 对叙事：制造"过去的痛"与"现在她的改变"之间的张力
    - 应在闪回后自然过渡回当前场景，不刻意解读
  写作原则:
    - 像被电击一样突然——没有过渡没有铺垫
    - 重感官轻叙事：气味>声音>触感>画面>语言
    - 结尾切断——不给闭合。让痛悬在那里
