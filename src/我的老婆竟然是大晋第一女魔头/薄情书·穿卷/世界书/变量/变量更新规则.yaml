---
变量更新规则:
  系统:
    当前场景:
      check:
        - 每次场景转换时更新为简短的场景描述（地点+时间段）
        - 保持简洁，如"咖啡厅·傍晚"、"公司楼下·深夜"
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 每次事件推进后更新，保持时间流逝合理
        - 一般每次互动推进15分钟~数小时不等

  女主:
    悔恨值:
      type: number
      range: 0~100
      check:
        - 常规调整：根据女主当前反思程度 ±(2~5)
        - 击穿点机制：当女主被具体事实击中时跳跃上升 +(15~25)
          击穿触发场景：发现<user>曾独自承受的重大事件、看到<user>对别人的自然笑容、第三方揭露真相、事件触发后的关键冲击
        - 未觉醒阶段尤其难涨——她在自我保护，常规互动几乎不动
        - 击穿不是均匀发生的——可能连续几个回合不动，然后一个事件直接打穿
        - 悔恨值下降几乎不发生——认知一旦击穿就难以回到自欺状态
        - 仅在女主内心真正产生悔意时才增加，嘴上说说不算

    执着度:
      type: number
      range: 0~100
      check:
        - 根据女主追回<user>的决心调整 ±(3~6)
        - 被反复拒绝时：性格倔强者可能反弹上升，脆弱者可能下降
        - 发现<user>有心软迹象时上升
        - 执着度过低(<20)意味着她可能主动放手——不是BE，是她自己的成长
        - 执着度过高(>85)意味着可能做出偏执行为

    尊严值:
      type: number
      range: 0~100
      check:
        - 女主做出卑微行为时下降 -(3~10)
        - 卑微行为：跪求、当众哭泣、死缠烂打、放弃自我主张
        - 女主开始自我审视、找回独立人格时上升 +(2~5)
        - 尊严值<20时女主行为可能变得不体面甚至疯狂
        - 尊严值归零是重大事件节点（崩溃/黑化/彻底觉醒 三选一）
        - 顾衍辰相关事件中尊严值可能回升——她以为"白月光"还在等她，骄傲回来了一点

    认知阶段:
      type: "'未觉醒' | '动摇' | '醒悟' | '自我审视'"
      check:
        - 此字段由系统根据悔恨值/尊严值自动推进，不要手动设置
        - 推进条件：
          未觉醒→动摇：悔恨值>=30
          动摇→醒悟：悔恨值>=60 且 尊严值<70
          醒悟→自我审视：悔恨值>=80 且 尊严值>=40
        - 回退条件（允许进两步退一步）：
          醒悟→动摇：顾衍辰相关事件后尊严值回升至>75 且 悔恨值回落至<50
          自我审视→醒悟：被<user>重创后 悔恨值<40 且 尊严值<30
        - 回退不是倒退成长，是她又缩回了壳里——但下次推进会更快

    当前情绪:
      check:
        - 每次回复更新为女主当前的核心情绪（2~6字）
        - 示例：焦虑不安、卑微期待、绝望固执、释然苦涩

    关键记忆:
      type: |-
        {
          [记忆名: string]: string; // 记忆描述
        }
      check:
        - 记录剧情中重要的转折事件或对话
        - 新增时机：重大拒绝、关系突破、情感爆发、关键选择
        - 最多保持6条，超出时移除最早的
