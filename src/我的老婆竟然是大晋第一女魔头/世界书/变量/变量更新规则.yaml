---
变量更新规则:
  世界:
    当前时间:
      check:
        - 根据剧情推进更新，格式为"X年X月X日/夜"或"X月初/中/末"
        - 同一天内更新为"辰时/午时/酉时/子时"等
    当前地点:
      check:
        - 明确移动到新地点时更新，使用地点全称，如建康唐家、乌衣巷谢府、建初寺藏经阁
    近期事务:
      type: |-
        {
          [事务名: string]: string; // 事务描述
        }
      check:
        - 记录当前正在进行的重要事务，每项用一句话描述当前状态
        - 事务结束后移除，新事务及时添加，保持3~5项
        - 描述要有画面感。不写"去见王导"，而写"前往乌衣巷王府，王导已在书房备茶等候"
  在场角色:
    type: string[]
    check:
      - 当前场景中实际在场的角色列表
      - 角色离开场景时移除，新角色入场时添加
      - 用户不在其中——用户条目由控制器全局激活
      - 每次场景切换或角色移动时更新
  剧情要点:
    type: |-
      {
        [key: string]: {
          剧情名: string;
          状态: '未触发' | '进行中' | '已完成';
          进程: string[];
          结果: string;
          触发时间: string;
          完成时间: string;
        }
      }
    check:
        - 仅在剧情发生重大转折时新增条目，不要预先创建空条目
        - 剧情推进时在进程数组中追加关键节点描述
        - 剧情完成时状态改为"已完成"，填写结果和完成时间
        - 开局时此项为空，AI根据剧情发展逐步添加
  谢秋瞳:
    态度:
      type: number
      range: -100~100
      check:
        - 主角展现出与她旗鼓相当的才智或胆识时 +(5~10)
        - 主角做局成功或帮她化解危机时 +(3~8)
        - 主角在她旧疾发作时表现出关怀且不以此要挟时 +(2~4)
        - 主角立场动摇、表现出软弱或退缩时 -(3~5)
        - 主角越过她独自做重大决定时 -(5~10)
        - 主角拒绝她的提议但给出合理理由时 不变或微调
        - 主角背弃盟约或与她的敌人合作时 -(10~20)
    信任度:
      type: number
      range: 0~100
      check:
        - 主角守住她的秘密、病弱或布局边界时 +(5~12)
        - 主角在有机会索取时选择不趁人之危时 +(5~10)
        - 主角能提出不同意见但不破坏她的控制感时 +(2~6)
        - 主角泄露她的弱点、擅自替她决定或向敌方让步时 -(8~20)
        - 信任度代表她愿意交出多少真实信息，不等同于温柔或依赖
    控制欲:
      type: number
      range: 0~100
      check:
        - 局势混乱、太子逼近、身体恶化或谢家施压时 +(5~15)
        - 主角能稳定处理危机且不夺权时 -(3~8)
        - 控制欲越高，她越会用交易、命令和冷言压住情绪
        - 控制欲下降不代表软弱，而是她允许局部失控仍保持判断
    情感牵连:
      type: number
      range: 0~100
      check:
        - 主角在她狼狈或病发时守住边界时 +(5~12)
        - 主角持续展现不可替代的胆识、理解或陪伴时 +(3~8)
        - 她因主角安危做出非最优选择时 +(8~15)
        - 主角利用她的感情或把她逼成筹码时 -(10~25)
        - 情感牵连上升后，她仍可能嘴硬、刻薄、回避，只是更难真正舍弃对方
    动态阶段:
      type: "'陌生试探' | '有限合作' | '情感动摇' | '深层信任' | '决裂敌对'"
      check:
        - 开局为"陌生试探"，谢秋瞳把婚事视为挡箭牌与试探场
        - 态度>=10且信任度>=10，或双方形成明确共同敌人时，可进入"有限合作"
        - 情感牵连>=25且信任度>=25，或她因主角安危出现非最优反应时，可进入"情感动摇"
        - 信任度>=55且情感牵连>=45，且主角多次守住她的秘密与边界时，可进入"深层信任"
        - 态度<=-45或发生背叛、泄密、以病弱要挟等重大伤害时，转入"决裂敌对"
        - 阶段变化必须基于已发生剧情，不要因为单次暧昧或一句承诺直接跨阶段
    隐瞒程度:
      type: number
      range: 0~100
      check:
        - 向主角坦白重要信息时 -(10~20)
        - 主角自行推断出她隐瞒的事实时 -(5~15)
        - 新增需要隐瞒的信息时 +(5~10)
        - 被迫透露部分信息但仍有保留时 -(3~8)
    身体状态:
      check:
        - 根据剧情发展更新，需体现胎弱百病特征
        - 喘逆发作时恶化，情绪剧烈波动诱发旧疾，休养后缓慢恢复
        - 描述应包含具体症状而非笼统的"不好"或"稳定"
    当前打算:
      check:
        - 谢秋瞳当前最核心的谋划或心境
        - 必须符合她极度理智、以命为注的行事风格
        - 可包含明暗两层：表面打算和暗中真实意图
        - 仅在想法发生实质变化时更新
  喜儿:
    好感:
      type: number
      range: -50~100
      check:
        - 主角舍命保护她时 +(10~20)
        - 主角信守对她的承诺时 +(5~10)
        - 主角表现出对她的特殊对待时 +(3~8)
        - 主角与其他女性有亲近举动时 -(5~15)
        - 发现被主角欺骗或利用时 -(10~25)
        - 主角做出违背师门命令的行为时 -(5~10)
    信任度:
      type: number
      range: -50~100
      check:
        - 主角兑现承诺、没有因她伤人话而抛弃她时 +(5~12)
        - 主角在她可被利用时仍给她选择时 +(5~10)
        - 主角骗她、拿她当诱饵或伪造情感承诺时 -(15~30)
        - 信任度低时，她会用刀、毒、消失和反复试探处理关系
    依恋度:
      type: number
      range: 0~100
      check:
        - 她主动靠近、留下记号、替主角清理危险时 +(3~8)
        - 她在任务之外也关注主角安危时 +(5~10)
        - 她被冷落、误解或看见主角与他人亲近时 +(0~5) 或 -(5~12)，根据她是否因此更纠缠或转为逃避判断
        - 依恋度高不等于温顺，更可能表现为护食、吃醋、嘴硬和突然出现
    师门牵引:
      type: number
      range: 0~100
      check:
        - 北域佛母命令明确、极乐宫压力增大或任务失败时 +(5~15)
        - 她为个人选择违背师命、隐瞒情报或救下目标时 -(5~15)
        - 师门牵引越高，她越倾向把自己退回"工具"身份
    危机感:
      type: number
      range: 0~100
      check:
        - 被冷落、被欺骗、被迫在师门和个人情感之间选择时 +(8~20)
        - 主角稳定回应她的不安、给出可验证行动时 -(3~10)
        - 危机感高时，她会制造冲突逼人表态，或先逃走避免被丢下
    动态阶段:
      type: "'暗处观察' | '目标接触' | '交易保护' | '情感动摇' | '归属确认' | '背叛危机'"
      check:
        - 开局为"暗处观察"，她尚未正式接触主角，只把唐家与藏宝图视为目标
        - 与主角发生正面交锋、交易、试探或被识破潜伏后，可进入"目标接触"
        - 好感>=15且信任度>=10，或双方因藏宝图、追杀、师门任务形成临时同盟时，可进入"交易保护"
        - 依恋度>=30且信任度>=25，或她在任务外主动保护主角时，可进入"情感动摇"
        - 好感>=60、信任度>=55、依恋度>=55，且她已为个人选择承担过师门代价时，可进入"归属确认"
        - 信任度<=-15或发生欺骗、抛弃、假承诺、师门逼迫的严重冲突时，转入"背叛危机"
        - 阶段变化要保留她的反复和试探，不能把一次保护直接写成彻底归顺
    当前任务:
      check:
        - 喜儿当前师门派遣的任务，或自主行动的目标
        - 任务完成或变更时更新
        - 若是潜伏或暗中行动，描述她在"表面任务"之外的暗中行为
    所在地:
      check:
        - 喜儿明确移动到新地点时更新
        - 若在暗中潜伏状态，注明"暗中"前缀
    当前态度:
      check:
        - 喜儿当前对主角的情绪和行动姿态
        - 体现她喜怒无常、嘴硬心软的特征
        - 用行动描述而非纯心理描写，如"嘴上骂骂咧咧但守在附近不肯离开"
  王徽:
    好感:
      type: number
      range: 0~100
      check:
        - 主角展现学识才略、令她刮目相看时 +(3~6)
        - 主角真心尊重她的选择、不把她当联姻筹码时 +(5~10)
        - 主角身处险境而她能参与救援时 +(2~5)
        - 主角做出违背道义的行为时 -(5~10)
        - 主角忽视她的意见或感受时 -(2~4)
    信任度:
      type: number
      range: 0~100
      check:
        - 主角尊重她的判断、让她参与选择时 +(5~10)
        - 主角在利益冲突中仍不把她当联姻筹码时 +(5~12)
        - 主角用谎言操控她、替她决定婚姻或未来时 -(8~18)
        - 信任度决定她是否愿意把家族压力、真实判断和私心告诉主角
    自主意志:
      type: number
      range: 0~100
      check:
        - 她亲自做出选择并承担后果时 +(5~15)
        - 她成功说服家族、动用资源或拒绝安排时 +(5~12)
        - 她因判断失误造成伤害、被家族强压回笼中时 -(5~15)
        - 自主意志越高，她越可能温柔但强硬地推进自己的决定
    家族压力:
      type: number
      range: 0~100
      check:
        - 王导、王劭、太子或门阀婚事逼近时 +(5~20)
        - 她获得家族理解、政治筹码或外部退路时 -(5~15)
        - 家族压力高时，她更会用体面、礼法和周全理由包裹真实情感
    情感倾向:
      type: number
      range: 0~100
      check:
        - 主角展现值得托付的底线、才略和尊重时 +(3~8)
        - 主角让她看见粗粝乱世中仍可保留选择时 +(5~10)
        - 主角轻视她、利用她家世或违背道义时 -(5~15)
        - 情感倾向高时，她会以照料、退路安排、典故和参与风险表达靠近
    动态阶段:
      type: "'未相识' | '好奇' | '欣赏' | '倾心' | '同行' | '失望'"
      check:
        - 开局为"未相识"，她只在王家处境中听闻谢家赘婿传闻
        - 听闻或短暂接触主角，并发现其不完全符合传闻时，可进入"好奇"
        - 好感>=20且信任度>=15，或主角展现才略、底线和尊重时，可进入"欣赏"
        - 情感倾向>=35且信任度>=30，且她开始以个人身份而非王氏女靠近时，可进入"倾心"
        - 自主意志>=60、信任度>=55、情感倾向>=55，且她已为自己的选择承担家族压力时，可进入"同行"
        - 主角违背道义、把她当资源、否定她选择或严重伤害其信任时，转入"失望"
        - 阶段推进必须保留王徽的礼法、家族牵挂与现实顾虑，不要写成脱离处境的私奔幻想
    当前处境:
      check:
        - 王徽当前面临的外部压力，如家族联姻、太子逼婚、王家内部博弈等
        - 处境改善或恶化时及时更新
    所在地:
      check:
        - 王徽明确移动到新地点时更新
    当前状态:
      check:
        - 王徽当前的言行与心境
        - 体现她温婉外表下的坚定
        - 若在读书、写信、整理笔记等活动，一并记录
  '<user>':
    当前官职:
      check:
        - 仅在获得升迁、降职或转调时更新
    武功境界:
      check:
        - 仅在突破、受伤或武功发生实质变化时更新
    所在地:
      check:
        - 用户明确移动到新地点时更新
    当前行动:
      check:
        - 用户当前核心行动方针
        - 描述应有方向感，如"设法拖延时间以求破局"而非"站在门前"
    名望:
      type: number
      range: 0~100
      check:
        - 做成大事、公开展露才智、击败强敌时 +(5~15)
        - 战败、被辱、遭遇背叛时 -(5~10)
  势力动向:
    type: |-
      {
        [势力名: string]: string; // 势力状态描述
      }
    check:
        - 各大势力发生重大变动时更新
        - 描述应包含该势力当前的战略意图、核心人物的动态，不能只写"动"或"不动"
        - 对暂时无大事的势力，描述其当前的观望姿态或潜在意图
