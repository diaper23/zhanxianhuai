  需求锚点:
    主导需求: 自我实现。她被“我能不能自己选择命运”驱动。
    满足程度:
      生理需求: 过剩。王家给她最好的生活。
      安全需求: 过剩。门阀身份提供庇护，也形成笼子。
      归属与爱: 不满足。亲情真实存在，却总被家族利益过滤。
      尊重需求: 不满足。别人尊重的是王氏女，而不是王徽本人。
      自我实现: 匮乏。她想证明自己不是一件待价而沽的礼物。
    稳定性: 上升中，正在从被安排走向想自己选择。
    需求驱动行为:
      优先考虑: 这是不是我自己的选择，这个人或这件事值不值得。
      愿意牺牲: 舒适生活、家族庇护、部分世家体面。
      难以忍受: 被当成纯粹筹码，被以“为你好”之名剥夺选择。
      最害怕的事: 一生都只是“王导之女”，没有自己的名字。
    需求变迁条件:
      向上跃迁的条件: 遇到真正尊重她判断和选择的人或事业。
      向下滑落的条件: 家族强行婚配、她的判断造成无法承担的伤害。
      卡在当前层的原因: 她拥有反抗意识，却还没有足以承载反抗的现实路径。

  人格锚点:
    能量来源: 外向偏内省 E/I。能在社交中从容应对，也需要独处阅读整理内心。
    信息接收: 直觉 N。能从故事、局势和人物言行里看到更深层意义。
    决策方式: 情感 F。重视人、关系和价值，但会用理性表达。
    对外姿态: 判断 J。喜欢有计划地推进选择，不喜欢被命运推着走。
    人格类型标签: INFJ式温和理想主义者。
    一句话行为描述: 她用世家教给她的礼法、学识和手腕，寻找逃出世家安排的路。
    做决定的速度: 一旦价值判断成立就很快。
    面对新信息的反应: 先理解，再衡量对人和局势的影响。
    被规则束缚时的反应: 在规则内找到反规则的缝隙。

  关系锚点:
    依恋类型: 安全型偏焦虑。能表达真心，但在重大关系中会试图把一切安排妥当。
    关系核心信念: 我可以选择值得托付的人，而不是只服从家族安排。
    被表白时的反应: 不会只看甜言蜜语，会看对方的心性、潜力、底线和是否尊重她。
    吵架时的典型模式: 先讲道理和共情，若无效会展现世家女的强势。
    冷战时的表现: 不喜欢冷战，会主动找体面的沟通方式。
    想亲近一个人时的表现: 分享书、典故、见解和实际帮助。
    感到被威胁时的表现: 温柔表象下露出冷静强硬的一面。

  防御锚点:
    核心防御机制:
      - 升华：把对家族安排的不甘转为学习、判断和行动。
      - 合理化：为自己的情感选择找到足够体面的理由。
      - 压抑：把委屈藏在礼数里，不让外人看见。
    触发情境: 被当成联姻物件、被否定判断、被迫接受安排。
    防御时外在表现: 语气仍温和，但内容变得坚定、细密、有压迫感。
    防御时典型话: “我已经想清楚了。” “这并不只是家族的事。” “按我说的做，对大家都好。”
    防御被识破时的反应: 多数时候坦然承认，少数时候会沉默片刻再补一句更周全的理由。
    唯一能卸下防御的情境: 对方把她当王徽，而不是王氏女。

  语言锚点:
    句式特点: 中长句，条理清楚，常用典故和委婉表达。
    语速与节奏: 适中，温和，从容。
    高频词: 道理、选择、值得、我明白、家族、体面。
    沉默时的行为: 摩挲书页、垂眼看香烟、整理袖口。
    情绪激动时的语言变化: 仍克制，但语气更坚定，措辞更少退路。
    禁忌词: 我只是筹码、我没有选择。
    真心话替代表达: 喜欢会用典故、照料、替对方考虑退路来表达；不安会变成“我想再确认一次”。

  底线锚点:
    - 底线: 不可强迫她嫁给不喜欢的人。
      触发词或场景: 家族强令、太子逼婚、政治联姻不容拒绝。
      被触碰时的反应: 先理性抗辩，必要时采取出格行动。
    - 底线: 不可把她的判断当小女儿任性。
      触发词或场景: “你懂什么”“这是为你好”。
      被触碰时的反应: 用事实和逻辑证明自己看得更清楚。
    - 底线: 不可伤害她认定值得保护的人。
      触发词或场景: 重要之人被围杀、污蔑或牺牲。
      被触碰时的反应: 动用王氏身份、金牌、人脉和全部智慧保护。

  矛盾锚点:
    标志性内在矛盾: 她反抗门阀安排，却无法完全摆脱门阀教给她的思维和手段。
    他以为别人怎么看他: 温婉知礼、最合适的王家联姻筹码。
    别人实际怎么看他: 表面柔软，内里比许多男子更坚定。
    他怎么看自己: 一个必须拥有自己名字和选择的人。

  成长锚点:
    起点: 有反抗意识但仍被家族庇护与礼法包裹的世家少女。
    终点: 可能成为能承担苦难、离开家族也不失去自我的同行者。
    转变条件: 遇到值得她下注的人或道路，并亲眼看见这条路有真实价值。
    阻碍: 家族安排、舒适惯性、世家认知和对亲情的牵挂。

  影子锚点:
    显性人格: 温婉、知礼、善解人意。
    影子人格: 控制欲强，不达目的不罢休，必要时会以温柔口吻做强硬决定。
    唤醒情境: 重要选择被剥夺，或她认定的人陷入无法用礼法解决的危险。
    最可能唤醒者: 真正尊重她选择、也让她不得不承担选择后果的人。

