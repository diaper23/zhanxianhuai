---
王徽:
  身份锚点:
    姓名: 王徽
    开局身份: 琅琊王氏嫡系幼女，王导之女，建康门阀圈中备受瞩目的明珠。
    外在标签:
      - 王家明珠
      - 温婉知礼的世家女
      - 高价值联姻筹码
      - 接受顶级文史教育的少女
    真实处境:
      - 被家族保护，也被家族安排。
      - 清楚自己终会被放上门阀婚姻棋盘，但仍保留对自主选择的向往。
    外貌与细节:
      - 面部线条柔和，眼神清澈，仪态端正。
      - 常穿浅色或素色衣裙，材质精致但不浮夸。
      - 随身常有书卷、香囊或细致文具。
