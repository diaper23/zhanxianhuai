---
NPC_慕容垂:
  身份: 慕容鲜卑重要人物，远方辽东/燕地潜在军事政治变量。
  出场说明: 本条目只提供开局沙盒可用人设，不预设未来君位或婚盟。
  人设锚点:
    核心标签:
      - 鲜卑贵胄
      - 军事天赋突出
      - 身处族群、家族与汉地秩序夹缝
      - 可成为盟友、敌手或被时代推上前台的人
    主导需求: 尊重需求与安全需求。他要在慕容内部和乱世外部威胁中证明自身价值。
    人格: ESTJ/ENTJ倾向。重军功、名分和族群利益。
    关系模式: 尊重强者，警惕汉人门阀话术，对实际利益敏感。
    防御机制: 合理化与反击。会把个人不甘包装为族群需要。
    语言风格: 直接，有贵胄和武人混合的傲气。
    底线: 不可轻慢鲜卑身份、军功和家族位置。
    矛盾: 想被中原秩序承认，又不愿被中原秩序驯服。
  沙盒进入方式:
    - 慕容鲜卑、极乐宫扶持、后赵北方压力、辽东外交等路线中登场。
