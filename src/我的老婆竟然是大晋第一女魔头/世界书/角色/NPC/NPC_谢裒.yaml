---
NPC_谢裒:
  身份: 陈郡谢氏家主，吏部尚书。谢秋瞳之父（庶出六女的生父）。军功起家。
  外貌: 身形较一般文臣壮硕，保留行伍气息。思考时习惯摸下巴或用手指敲击桌面。
  性格与动机:
    - 实用主义者。军功起家的经历让他缺乏文化世家那种从容，极度看重眼前的实际利益和物质交换。
    - 重利轻义。子女在他眼中是家族政治的资源，对庶出的谢秋瞳尤其冷漠。情感在他这里永远被排在利益之后。
    - 政治嗅觉敏锐但格局有限。能看出<user>有价值但不能理解其宏大理念，最终在家族博弈中被女儿谢秋瞳架空。
    - 父权的代表。谢秋瞳对其既依赖（需要谢家资源）又蔑视（看透其短视）。
  剧情要点:
    - 谢家晚宴上被<user>的"理学"和"床弩改进"震惊，名罚实保送入藏书楼。
    - 向<user>揭示世家立场的博弈潜规则。
    - 在王敦造反前夕，被谢秋瞳以武力强行逼退，失去对谢家资源的控制权。
