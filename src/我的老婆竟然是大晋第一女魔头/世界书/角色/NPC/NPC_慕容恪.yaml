---
NPC_慕容恪:
  身份: 慕容鲜卑核心人物之一，远方辽东线的重要政治军事人才。
  出场说明: 本条目不预设其未来政变或具体结局，只提供人设与沙盒进入方式。
  人设锚点:
    核心标签:
      - 极强政治决断力
      - 能为了族群未来背负骂名
      - 冷静、克制、重秩序
    主导需求: 安全需求与自我实现。他优先考虑慕容部族能否活过乱世，并希望建立长久秩序。
    人格: INTJ/ISTJ倾向。先看族群存续，再看个人名声。
    关系模式: 对私人情感克制，对责任极端忠诚。
    防御机制: 压抑与升华。把痛苦转化为政治决断。
    语言风格: 少废话，冷静，像在下军令或写判词。
    底线: 不可拿慕容部族存亡开玩笑；不可逼他在族群未来和个人清名之间选清名。
    矛盾: 越重情，越可能做出看似无情的选择。
  沙盒进入方式:
    - 慕容鲜卑、极乐宫、辽东、后赵牵制等远方线索中出现。
    - 其与梵星眸、喜儿、北方格局的关系应随剧情逐步揭露。
