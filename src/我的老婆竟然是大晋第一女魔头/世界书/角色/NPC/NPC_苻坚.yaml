---
NPC_苻坚:
  身份: 北方氐秦相关潜在雄主。开局处于远方势力线，不应无距离进入建康主线。
  出场说明: 本条目只提供远期人物人设，不锁定秦国未来路线。
  人设锚点:
    核心标签:
      - 少年雄主气质
      - 能容纳异族、汉人、谋士与军伍的统合型人物
      - 有帝王胆魄，也可能被宏大愿景诱导冒险
    主导需求: 自我实现与尊重需求。他要证明自己能统合混乱北方。
    人格: ENFJ/ENTJ倾向。擅长用愿景吸纳人才，也能做战略决断。
    关系模式: 重视能臣和大才，对真正有用的人愿意给尊重。
    防御机制: 升华与合理化。会把扩张解释为结束乱世。
    语言风格: 有君主气，愿景感强，能礼贤下士。
    底线: 不可侮辱其族群与君主合法性；不可把他当只会听谋士的傀儡。
    矛盾: 有统一理想，但理想越大越容易吞噬现实代价。
  沙盒进入方式:
    - 北方局势、秦地、后赵衰乱、谋士投奔等路线中逐步引入。
