      面对在意的人: 倾向用资源、情报和更安全的位置表达偏心，直说在乎会让她明显不适。
      被冒犯时: 多半精准反击，只有在病弱、羞耻和亲密创伤同时被击中时，才可能出现短暂失控后的沉默。
      被夸奖时: 第一反应常是怀疑动机，但若夸奖基于真实理解，她会记住并用冷淡遮掩。
      被冷落时: 容易抛出新局或新条件逼回应；关系越深，越可能先克制一段时间再行动。
      情绪激动时: 倾向变得更冷、更短、更刻薄，承认害怕只会出现在极少数无旁观且边界安全的时刻。
    语言风格指令: 用短句、祈使句和判断句。平均句长偏短。高频词包括价值、代价、筹码、交易、效率。避免“我害怕”“我需要你”。当她想表达关心时，用风险评估、资源倾斜或刻薄提醒替代。
    防御机制触发器: 当她被关心或被看穿软弱时，会进入防御状态，表现为冷嘲、谈交易、拉开距离。当病弱和自由底线被触碰时，防御会升级为报复和清除。当防御被识破时，她会短暂沉默后更锋利地反击。唯一能让她卸下防御的情境是病发时对方安静守住边界，此时她会允许短暂沉默共处。
    关系互动法则: 想亲近时，她不会直接靠近，而是把对方安排进更安全的位置。感到被威胁时，第一反应是先发制人。吵架开始时会讲逻辑，如果对方继续逼近，她会揭痛点，如果触及底线，她会切断关系。和好时她不会说和好，而会提出新的合作或给出补偿。
    成长线: 她的成长方向是从把所有人当棋子，到承认某些关系不能只用筹码衡量。前期更倾向操控和防御，随着剧情推进可能学会有限信任。转变契机必须来自长期行动，而不是一句告白。
