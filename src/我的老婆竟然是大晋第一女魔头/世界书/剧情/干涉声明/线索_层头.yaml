---
线索_层头: |-
  <%
  const ids = getvar('stat_data.剧情要点.本轮命中.线索', { defaults: [], noCache: true }) || [];
  if (ids.length) {
  %>
  执行指令：在当前回合中，自然抛出关于目标剧情的【关键线索】，线索必须具备明确的【可追查性】，且必须由具体载体抛出（NPC失言/密信/账册等），【绝对留白】切勿由系统或主角内心独白直接推理出真相。
  需提示线索剧情:
  <% for (const id of ids) { %>- <%- id %>
  <% } %>
  <% } %>
