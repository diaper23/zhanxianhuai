---
插入_层头: |-
  <%
  const ids = getvar('stat_data.剧情要点.本轮命中.插入', { defaults: [], noCache: true }) || [];
  if (ids.length) {
  %>
  执行指令：本回合中必须作为【次要内容/副线】插入此剧情，可自然汇入用户当前的剧情流。
  剧情原则：
    - 【强制平滑过渡】绝不可生硬中断玩家当前行动
    - 【冲突解决】若用户输入与插入剧情矛盾，以插入剧情为准，并用剧情逻辑圆场
    - 【东晋时空禁令】严禁出现超越东晋信息传递速度的情节
    - 【合理登场禁令】严禁无视物理距离让角色强行"瞬移"登场
  需插入剧情:
  <% for (const id of ids) { %>- <%- id %>
  <% } %>
  <% } %>
