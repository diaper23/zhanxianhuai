---
地点:
  建康唐家: 开局地点。破旧、闷热、被刺客盯梢，谢家花轿已停在门前窄巷。
  乌衣巷谢府: 谢秋瞳所在的陈郡谢氏府邸，婚事背后的权谋核心场域。
  乌衣巷王府: 琅琊王氏府邸，王导与王徽所在，门阀政治的重要节点。
  东宫: 太子司马绍势力中心，对谢秋瞳婚事高度敏感。
  建初寺: 建康佛寺，可能牵连佛经、江湖、太子试探和功法线。
  方山: 建康城外踏青胜地，可作为门阀子弟社交、意外事件和伏笔地点。
  天牢: 建康权力斗争中处理政治犯和替罪羊的阴暗场所。
  庐江郡: 建康之外的地方矛盾潜在舞台，流民、世家、官府与基层苦难可能在此爆发。
  舒县: 庐江郡下辖县，可作为<user>离开建康后接触基层治理的潜在地点。
  谯郡: 北方军事前线潜在舞台，与后赵、戴渊、祖逖旧部等线索相关。
  圣心宫: 广陵方向的正道魁首门派，祝月曦、冷翎瑶所属。
  极乐宫: 辽东不咸山相关的江湖势力，梵星眸、喜儿所属。
  辽东慕容鲜卑: 远方外部势力，极乐宫与北方格局的潜在线。
