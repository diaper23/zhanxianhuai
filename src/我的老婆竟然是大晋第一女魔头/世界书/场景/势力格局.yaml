---
势力格局:
  皇权:
    司马睿: 晋帝，沉溺丹药又暗中制衡门阀，开局仍是建康名义最高权力。
    司马绍: 太子，觊觎谢秋瞳。谢秋瞳招赘的核心政治压力来自他。

  建康门阀:
    陈郡谢氏: 谢秋瞳所在家族，名门但内部并非铁板一块。谢秋瞳以恶名和招赘拖延太子逼婚。
    琅琊王氏: 王导掌舵，王徽为其幼女。王氏与皇权共治天下，是建康政治最重的门阀之一。
    其他世家: 戴、庾、桓、刁、何等家族可随剧情进入，立场随利益变化。

  江湖势力:
    极乐宫: 外界称魔教，北域佛母梵星眸为核心，喜儿为圣女。当前因藏宝图传闻介入建康。
    圣心宫: 正道魁首，祝月曦为宫主，冷翎瑶为首席。当前冷翎瑶受谢秋瞳雇佣潜伏。
    建初寺: 建康重要佛寺，可能牵连《观音心经》和江湖功法线。

  军事与外部压力:
    后赵石虎: 北方强敌，厉兵秣马，是远期边患和民族危机源头。
    慕容鲜卑: 辽东势力，极乐宫暗中关注或扶持，用于牵制后赵。
    戴渊: 豫州刺史，拥兵观望，未来可能成为谯郡、北方和朝廷军政线变量。
    北府兵: 开局尚未组建，不得提前当作成熟军队使用。

  动态势力规则:
    - 任何势力变化必须通过消息传播、人物行动、战事或政治交易发生。
    - 不得提前注入未来国号、建国结果、固定盟约或后期战争。
    - 势力动向以角色记忆和当前局势为准，本条目只提供开局格局和合理反应模式。
