---
伏笔追踪: |-
  <%_
  if (typeof _伏笔_首夜 === 'undefined') var _伏笔_首夜 = getvar('stat_data.剧情要点.状态表.E001_Wedding_Night_Survived.状态', { defaults: '未触发' });
  if (typeof _伏笔_喜儿 === 'undefined') var _伏笔_喜儿 = getvar('stat_data.剧情要点.状态表.E002_Xier_First_Contact.状态', { defaults: '未触发' });
  if (typeof _伏笔_太子 === 'undefined') var _伏笔_太子 = getvar('stat_data.剧情要点.状态表.E003_Taizi_Attention_Raised.状态', { defaults: '未触发' });
  if (typeof _伏笔_旧疾 === 'undefined') var _伏笔_旧疾 = getvar('stat_data.剧情要点.状态表.E004_Xie_Qiutong_Illness_Exposed.状态', { defaults: '未触发' });
  if (typeof _伏笔_王徽 === 'undefined') var _伏笔_王徽 = getvar('stat_data.剧情要点.状态表.E005_Wanghui_First_Meet.状态', { defaults: '未触发' });
  _%>
  <%_ if (_伏笔_首夜 !== '已完成') { _%>
  ◆ 入赘首夜［<%- _伏笔_首夜 %>］
    证据: 谢秋瞳前五任赘婿皆死，<user>是第六任。
    未解: 谢秋瞳会杀、试探、囚禁、利用，还是暂时留下<user>。
  <%_ } _%>
  <%_ if (_伏笔_喜儿 !== '已完成') { _%>
  ◆ 喜儿与藏宝图［<%- _伏笔_喜儿 %>］
    证据: 极乐宫圣女潜伏建康查探藏宝图传闻。
    未解: 藏宝图是假消息、另有隐情，还是被人借题做局。
  <%_ } _%>
  <%_ if (_伏笔_太子 !== '已完成') { _%>
  ◆ 东宫注意［<%- _伏笔_太子 %>］
    证据: 太子司马绍觊觎谢秋瞳，必然关注第六任赘婿。
    未解: 太子会试探、拉拢、刺杀，还是借朝堂施压。
  <%_ } _%>
  <%_ if (_伏笔_旧疾 !== '已完成') { _%>
  ◆ 谢秋瞳旧疾［<%- _伏笔_旧疾 %>］
    证据: 她畏寒、咳嗽、常年用药，却极力掩饰。
    未解: <user>何时发现，发现后是利用、保护还是交易。
  <%_ } _%>
  <%_ if (_伏笔_王徽 !== '已完成') { _%>
  ◆ 王徽初遇［<%- _伏笔_王徽 %>］
    证据: 王导幼女是建康门阀圈重要人物，也是潜在联姻与社交线关键。
    未解: 她会如何评价<user>，又是否会介入谢家婚事余波。
  <%_ } _%>
  ◆ 建初寺经文
    证据: 极乐宫、建初寺、佛经和江湖功法之间存在潜在线索。
    未解: 是否会因喜儿、太子或谢秋瞳的布局而进入主线。
