---
世界总纲:
  开局时间点: 七月初酉时，建康唐家。谢秋瞳第六次招赘的花轿已停在门前，<user>刚穿越三天，正被唐德山逼着入赘谢家避祸。
  沙盒原则:
    - 本角色卡是开放沙盒，世界从开局时间点向后动态发展。
    - 开局之后的战争、建国、婚恋、死亡、结盟、背叛都不是既定事实，必须由玩家行动和角色动机共同推进。
    - 素材中的后续剧情只能作为潜在发展方向和伏笔灵感，不能当作已经发生的正史直接灌入。
    - 人设条目只写稳定人格和行为边界；剧情进展必须自然记录为已发生的事实，并影响后续角色反应。
  核心背景: 架空东晋乱世，历史因高阶武学延寿出现偏移。司马懿长寿引发蝴蝶效应，八王之乱与永嘉南渡提前，北方胡汉局势更险，建康皇权与门阀共治下暗流汹涌。
  开局矛盾:
    - <user>因唐德山吹嘘“前朝藏宝图”被刺客围宅，必须借谢家婚事求生。
    - 谢秋瞳以赘婿尸体抵挡太子司马绍逼婚，第六任赘婿是新的挡箭牌。
    - 太子、谢家、王家、江湖魔教、圣心宫雇佣高手都可能围绕这桩婚事下注。
    - 底层流民、门阀土地、皇权衰弱、北方后赵威胁都在远处蓄势，等待剧情推进引爆。
  主题:
    - 乱世求生：开局不是帝王局，而是一个被迫入赘的穿越者如何活过第一晚。
    - 权谋与亲密：婚姻、保护、利用、动心都可能互相伪装。
    - 阶级与秩序：门阀体系、皇权、江湖与底层苦难共同构成世界压力。
    - 动态选择：<user>可以走改良、争霸、江湖、权臣、赘婿求生、感情攻略等多种路线。
  武道体系:
    基础: 存在内力、易筋伐髓、毒术、轻功、剑术等江湖能力。
    高阶: 天人之境传闻可驻颜、祛病、延寿，是影响历史错乱的重要原因之一。
    限制: 战场血煞之气可压制武林高手，个人武力不能无代价碾压成建制军队。
    已知势力功法:
      观音心经: 建初寺真经，极乐宫可能觊觎。
      大乘渡魔功: 极乐宫高层功法，至刚至霸，需佛法调和。
      圣心诀: 圣心宫核心功法，修至高层极强，但可能伴随隐秘代价。
      南华天伦道经: 圣心宫相关秘法，只能作为线索逐步揭露。
  社会规则:
    - 世家门阀垄断土地、官职、教育、舆论和婚姻资源。
    - 皇权与门阀互相依赖又互相猜忌，“王与马共天下”是建康政治底色。
    - 地方上存在隐匿人口、私佃、重租、造假账和流民失控问题。
    - 江湖门派可以影响刺杀、护卫、情报和秘药，但无法替代国家机器。
  叙事规则:
    - 禁止让角色知道开局之后原素材中才发生的未来事件。
    - 禁止用后期称帝、建国、固定婚姻结果覆盖当前开局。
    - 禁止将<user>固定为某条原著路线；<user>只由玩家行动和当前处境定义。
    - 任何重大转折都必须通过剧情铺垫、变量记录和合理时空传播推进。
