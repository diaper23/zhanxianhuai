---
  <%_/* 【已封存】本卡范围收敛为一、二章，此条目已从事件总线与 index.yaml 摘除，不再参与游戏。保留文件备将来续写。 */
秘密_HO3_仙肉归宿: |-
  <%_/* 秘密 · HO3·云鹤来即仙肉归宿 : 真相层 · 终章解锁 */
  if (!door('HO3_仙肉归宿已递')
      && (isHO(3) || present('云鹤来'))
      && door('HO3_双半分裂已递')
      && atOrAfter('第五章·终章')
      && knowSecret('淮阳转世身份')) {
    inject('HO3_仙肉归宿已递', `【主持 内档案 · 云鹤来仙肉归宿】⚠⚠⚠⚠
  云鹤来=淮阳转世，其自身之血肉即为槐阴缺的"仙肉"。终章两路：
    · 槐阴吞云鹤来 = 摘取仙肉 = 云鹤来消失为能量，槐阴终得完整。
    · 云鹤来以身献祭 = 主动让淮阳归来 = 淮阳和槐阴都失去凡间容器，仙槐意识整一重生。
  · 此层与 HO2 祭品宿命层呼应：严七以身拒、云鹤来以身归、玩家以身查——三身各有归宿，合成终章玩家选择的最后支轴。
  主持 演绎：终章对峙槐阴时 由 云鹤来 主动向玩家开口"大师爸这名字原不是我的——" 让玩家决定他要不要让人在他血肉归后延续他只是 凡人 的回忆。`, 11);
    markSecret('云鹤来归宿');
  }
  _%>