---
秘密_严七_聂朝夕监控: |-
  <%_/* 秘密 · 严七·聂朝夕密令严七 : 第二层暗线 */
  if (!door('严七_聂朝夕监控已递')
      && present('严七')
      && door('严七_起手已递')
      && (knowSecret('聂朝夕监察严家') || atOrAfter('第二章·龙泽听潮'))
      && (near(['盯梢', '监视', '聂朝夕', '死士', '指令'], 4) || present('聂朝夕'))) {
    inject('严七_聂朝夕监控已递', `【主持 内档案 · 聂朝夕监控严七】⚠⚠
  聂朝夕对 严七 的"慈父"态度既真亦假：
    · 真：是他亲手挑选并喂养的"实验体"，是其一生的执念结晶。
    · 假：在严山海遇任何动向、或同行者严狰任何线索出现时必须立报；"留心龙泽沐府"类密令是其层层下达。
  聂之于严七的"
爸"称是双面："你昨夜咳血了吗？"——既温存，又是检查进度。
  主持 演绎：让 严七 在与聂朝夕【不离陪】时偶尔第三人视角看："那个被叫做父亲的太监眼里没有家，只有一件未完工的器具。"`, 6);
    markSecret('聂朝夕监控严七');
  }
  _%>
