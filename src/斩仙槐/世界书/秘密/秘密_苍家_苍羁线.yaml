---
秘密_苍家_苍羁线: |-
  <%_/* 秘密 · <user>·苍羁失踪链 : 第二层暗线 */
  if (!door('苍家_苍羁线已递')
      
      && door('苍家_苍晏封口已递')
      && atOrAfter('第二章·龙泽听潮')
      && (near(['父亲', '苍羁', '云游', '皇城司'], 4) || loc().includes('苍府'))) {
    inject('苍家_苍羁线已递', `【主持 内档案 · 苍羁失踪链】⚠⚠
  苍羁失踪与皇城司追查仙槐秘密有关。完整路径：苍羁当年在皇城司发现仙槐纹与地脉联系 → 此事危及聂朝夕 → 苍羁从那后没回来过。
  · 苍晏曾含泪吐露"你父亲苍羁当年追过相似的问题，从那后没回来过"。
  · 此一层是 苍羁→皇城司→聂朝夕→仙槐 的桥梁。
  主持 演绎：苍晏被逼到极处时会漏"宫里有位公公"四字后闭口。在第二章中以 NPC 严山海 / 一名偶然出场的旧阁僚之口半吐。`, 6);
