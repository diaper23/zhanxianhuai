---
  <%_/* 【已封存】本卡范围收敛为一、二章，此条目已从事件总线与 index.yaml 摘除，不再参与游戏。保留文件备将来续写。 */
秘密_HO2_祭品宿命: |-
  <%_/* 秘密 · HO2·祭品宿命 : 真相层 · 终章解锁 */
  if (!door('HO2_祭品宿命已递')
      && (isHO(2) || present('严七'))
      && door('HO2_仙骨之实已递')
      && atOrAfter('第五章·终章')
      && knowSecret('仙骨收网')) {
    inject('HO2_祭品宿命已递', `【主持 内档案 · 仙骨成熟即祭品】⚠⚠⚠⚠
  严七 自阴蜉寨童年、寒坼控骨、天机监视的一整条线，皆为槐阴"铸仙骨→养→收"的链路：仙骨成熟→严七将成槐阴祭品。
  · 反转余地：终章可由 严七 以血尽自决拒祭 → 反向折向：以自己的仙骨作"反喂"（以血肉自毁为器，留一线玩家报仇的纸）——这一伏笔让 HO2 不是被动牺牲品，而是宿命中的主动者。
  主持 演绎：终章对峙槐阴时让 严七 喊出一句让所有人怔住的不是求生的话，是认命但不认输的判词——内容待玩家当时的情感状态由 主持 即兴撷取。`, 12);
    markSecret('严七祭品宿命');
  }
  _%>