---
秘密_严七_仙骨之实: |-
  <%_/* 秘密 · 严七·仙骨之实 : 真相层（仙骨真相） */
  if (!door('严七_仙骨之实已递')
      && present('严七')
      && door('严七_寒坼毒已递')
      && atOrAfter('第二章·龙泽听潮')
      && (knowSecret('聂朝夕监控严七') || near(['自愈', '伤口', '仙骨', '体内', '身体不对劲'], 3))) {
    inject('严七_仙骨之实已递', `【主持 内档案 · 仙骨之实】⚠⚠⚠
  阴蜉寨幼童的血肉浇灌仙槐余能，在严七体内铸成"完美仙骨"。自愈、嗜血、耐痛、近异变事物反应皆即仙骨印记。
  · 此即 槐阴 最终要吞入补完自己的"仙骨"容器。
  · 仙骨成熟时会向"三个方向"绽放：仙骨会自我催熟，须槐阴亲手摘取；摘取后严七如树梢折断、消失。
  主持 演绎：让 玩家 在 龙泽 接触一件异变物（如 沐府药柜里"乌丝菌根茎"）后身体感应先于思考做出反应；或由 严七 在与玩家私下诺中低语"伱我里面，有某一物会接我归去——绝非阎王的那边。"——谜面，不解。`, 8);
    markSecret('仙骨始现');
  }
  _%>
