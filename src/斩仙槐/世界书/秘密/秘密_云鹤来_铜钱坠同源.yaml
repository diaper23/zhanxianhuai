---
秘密_云鹤来_铜钱坠同源: |-
  <%_/* 秘密 · 云鹤来·铜钱坠同源刺猬 : 第二层暗线 */
  if (!door('云鹤来_铜钱坠同源已递')
      && present('云鹤来')
      && door('云鹤来_起手已递')
      && atOrAfter('第一章·诏起龙庭')
      && (near(['铜钱坠', '坠子', '烫'], 4) || loc().includes('老槐'))) {
    inject('云鹤来_铜钱坠同源已递', `【主持 内档案 · 铜钱坠同源】⚠⚠
  云鹤来的铜钱坠不是寻常法器，与他前世"淮阳"血契相关：梁一笑见坠跪磕非戏；近老槐会发烫（感应仙槐同源气息）；坠子被卖掉几日即自回（与血主同源，难离）。
  · 此一层不直陈"云鹤来=淮阳转世"，只露"坠与云鹤来深层血契"——是坠与他而非"他主人"。
  主持 演绎：玩家在老槐或桐淮堂口·仪式后 的近场可让 云鹤来 烫得缩手；若玩家问"这坠是你的？"，云鹤来不答只摸坠"……我也不知道它要不要我。"`, 5);
    markSecret('铜钱坠同源');
  }
  _%>