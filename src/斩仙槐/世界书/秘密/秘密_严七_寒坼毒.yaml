---
秘密_严七_寒坼毒: |-
  <%_/* 秘密 · 严七·寒坼毒非自然 : 第一层暗线 */
  if (!door('严七_寒坼毒已递')
      && present('严七')
      && door('严七_起手已递')
      && atOrAfter('第一章·诏起龙庭')
      && (near(['寒坼', '毒', '解药', '药痛'], 4) || near(['伤口', '自愈', '愈合'], 4))) {
    inject('严七_寒坼毒已递', `【主持 内档案 · 寒坼真相】⚠
  寒坼非天然疾病；是聂朝夕用养骨之物（如"仙肉残片+地脉余能+草药"）化成的控骨毒药：取少量压制仙骨外溢以免幼年铸成时溢出失控；解药经天机或亲见聂取。
  · 严七知异样但不敢深究：每百日发作一次，剧痛一日，服解药则平如常；不发作时身体却极度便利——耐痛嗜血自愈如常人加倍。
  主持 演绎：严七 NEVER 主动提；玩家自追时只让其以极简碎语"我每百日要痛"或展示手心针痕暗自警觉。`, 5);
    markSecret('寒坼毒养骨');
  }
  _%>
