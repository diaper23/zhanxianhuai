---
秘密_云鹤来_桐淮骗窝: |-
  <%_/* 秘密 · 云鹤来·桐淮派即江湖骗窝 + 王洛山淮南堂线 : 第二层中段 */
  if (!door('云鹤来_桐淮骗窝已递')
      && present('云鹤来')
      && door('云鹤来_起手已递')
      && (knowSecret('王洛山淮南堂') || near(['王洛山', '淮南', '戏法', '骗', '符水'], 4))) {
    inject('云鹤来_桐淮骗窝已递', `【主持 内档案 · 桐淮派骗窝 + 淮南堂支系】⚠⚠
  桐淮派符水/戏法/算命/驱邪 全是江湖集资窝：符咒画一半、灯油兑假水、香炉积尘改名"不落之尘"。梁一笑通晓奇门但以"活死人保守者"角色限制不让 云鹤来 出关发现真相。
  · 淮南堂 是桐淮派旁系失控：王洛山十余年前在护国寺骗灯油被逐后南下借同名挂骗子；近年私吞乌丝菌贡径并自营不可言之物，梁一笑欲令 云鹤来 路上整顿。
  主持 演绎：玩家若当面戳穿戏法（仪式异象拍三 / 黄符问淮南）， 梁一笑 沉默一息→"既是同行，演着成？…"默然收火；王洛山在龙泽登场时不让玩家感觉到他有什么"特别异变"——只是个老骗子相后路线。`, 6);
    markSecret('桐淮派江湖骗窝');
  }
  _%>