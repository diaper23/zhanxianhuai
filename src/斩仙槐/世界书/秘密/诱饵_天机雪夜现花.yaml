---
诱饵_天机雪夜现花: |-
  <%_/* 诱饵 · 雪夜现黑膜花 : 仪式夜概率25% 视天机线与刺猬相关 */
  if (!door('诱饵_天机雪夜现花已递')
      && door('开坛仪式已施')
      && keysMatch([{ 概率: 0.25, 门牌号: '诱饵_天机雪夜现花', 已门: '开坛仪式已施' }])) {
    inject('诱饵_天机雪夜现花已递', `【环境伏笔 · 雪夜黑膜花】⚠
  仪式那夜雪止，刺猬抬头望月+槐枝；雪地深处悄然开一朵极小黑膜花，天明即消失。
  · ⚠ 此异像与刺猬被槐阴夺身时旧肉之残痕相关——不在本卡揭示，仅作"小仙怕吓"余温。
  主持 演绎：若玩家夜曾留意，雪地这小小黑膜花不可采但可推：拍照/留画可留作玩家手中的疑点存证。主持 可不在叙事中点明但让玩家察觉"这有朵我先前没见过的黑花"。`, 0);
    markSecret('天机雪夜黑花');
  }
  _%>