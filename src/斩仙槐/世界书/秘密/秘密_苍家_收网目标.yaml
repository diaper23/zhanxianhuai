---
  <%_/* 【已封存】本卡范围收敛为一、二章，此条目已从事件总线与 index.yaml 摘除，不再参与游戏。保留文件备将来续写。 */
秘密_HO1_收网目标: |-
  <%_/* 秘密 · HO1·收网目标 : 真相层 · 仅终章解锁 */
  if (!door('HO1_收网目标已递')
      && isHO(1)
      && atOrAfter('第五章·终章')
      && knowSecret('聂朝夕真身')) {
    inject('HO1_收网目标已递', `【主持 内档案 · 主角即收网之标】⚠⚠⚠⚠
  皇城司查抄严家前三日，聂朝夕曾召见 苍晏，当晚闭门长叹。
  苍羁当年在皇城司发现仙槐纹与地脉联系后，因危及聂而被盯上消失。
  <user> 的"纯善命格"是聂朝夕计算补完仙人的最后一味——主角本人即收网目标。
  · 此层仅第五章节高潮编排用，禁止提前泄露。
  · 主持 演绎时机：终章对峙聂朝夕时由其本人一笑点破"你以为是你爷爷护着你？是我让你长到了该被回收的时候。"`, 12);
    markSecret('主角即补完之标');
  }
  _%>
