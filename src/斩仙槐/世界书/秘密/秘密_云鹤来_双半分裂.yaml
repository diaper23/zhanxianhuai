---
秘密_云鹤来_双半分裂: |-
  <%_/* 秘密 · 云鹤来·仙槐双半 · 刺猬 = 槐阴夺身残躯 : 真相层（第二章·龙泽）*/
  if (!door('云鹤来_双半分裂已递')
      && present('云鹤来')
      && door('云鹤来_铜钱坠同源已递')
      && atOrAfter('第二章·龙泽听潮')
      && (knowSecret('刺猬失名') || knowSecret('老槐心跳') || near(['刺猬', '失名', '忘了', '名字', '朝夕'], 4))) {
    inject('云鹤来_双半分裂已递', `【主持 内档案 · 双半分裂】⚠⚠⚠
  槐阴夺身时旧刺猬精"朝夕"魂魄未全灭——被打回原型成一只会说人话但记忆残缺的刺猬。这便是 云鹤来身边那只。
  · 刺猬记得自己曾有名字但想不起叫什么（"失名症"）——失名对精怪是命脉大害，失之则浑浑噩噩忘前尘。
  · 云鹤来 = 淮阳转世（仙肉轮回）；刺猬 = 槐阴夺身后的残躯。二同源相遇 = 仙槐意识"庇护与吞噬之两半"在凡间重聚的预兆。
  · 在老槐关键点上 刺猬 会喟叹"这树好生眼熟"（"朝夕"残魂对仙槐的微唤）——但永远说不出具体的关联。
  主持 演绎：刺猬之口永远是"谜面不解谜底"。让玩家自己起疑。`, 7);
    markSecret('槐阴真相半解');
    markSecret('云鹤来仙肉');
  }
  _%>