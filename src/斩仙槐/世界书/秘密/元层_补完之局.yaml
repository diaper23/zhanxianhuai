---
  <%_/* 【已封存】本卡范围收敛为一、二章，此条目已从事件总线与 index.yaml 摘除，不再参与游戏。保留文件备将来续写。 */
元层_补完之局: |-
  <%_/* 元层 · 补完之局 = 槐阴整理心念路线（应前预测与不精确） */
  if (!door('元层_补完之局已递')
      && door('元层_槐阴布局已递')
      && atOrAfter('第五章·终章')) {
    inject('元层_补完之局已递', `【主持 终章内档案 · 补完之局终态与玩家应变量】⚠⚠⚠⚠ — 灵活弹性，由玩家行为决定终态。
  槐阴始终谋求以四五物补完为"完整仙人"，但实际有以下玩家可改写的非确定轴：
    · 严 Valle（严狰）是否被取仙魂：玩家可救回严狰并清洗血污命格 → 严狰返回原纯阳命格 → 仙魂存位改写或不用。
    · 严七 祭品：血尽自决拒祭 → 仙骨反喂 → 槐阴失仙骨容器，补完不成。
    · 云鹤来 献祭归淮阳 → 仙肉反生产 → 槐阴失仙肉容器，反被仙槐意识重生中的"淮阳"吞入。
    · <user> 纯善命格是玩家自身 → 一旦玩家自愿入阵，槐阴得纯善改写仙魂之"凡心全失"目标方成；玩家拒绝/反杀 ─ 槐阴所有捕获均靠暴力（不如补完之完整）。
    · 梁一笑（梁修原）：知过去江槐村惨剧的活死人，可选择做"+玩家扎破真相+为旧人安魂"或"-自毁随仙槐陪葬"评定。
    · 苍晏、裴书砚、张玄清（庇护者）：可在不同节点为玩家提供"反制术/解药/封魂品"。

  主持 演绎原则：
    · 终章是玩家选择开放的多元动玩法 —— 不预判玩家走"救赎/反杀/自我归零/被补完"哪一路。
    · 玩家行为决定 NPC 归宿即终章定性，不为 NPC 强压归宿。
    · 槐阴对玩家唯一的"完整胜利"是"/玩家入阵/严七养熟留/云鹤来吞下/严狰清洗取魂/"四件齐 — 玩家可阻止任意一项即不至于完整补完。`, 100);
    markSecret('槐阴非完美');
  }
  _%>