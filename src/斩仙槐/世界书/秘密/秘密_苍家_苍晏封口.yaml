---
秘密_苍家_苍晏封口: |-
  <%_/* 秘密 · <user>·苍晏封口令 : 第一层暗线 */
  if (!door('苍家_苍晏封口已递')
      
      && door('苍家_起手已递')
      && (atOrAfter('第一章·诏起龙庭'))
      && (near(['严狰', '苍晏', '爷爷'], 4) || scene().includes('初露') || loc().includes('苍府'))) {
    inject('苍家_苍晏封口已递', `【主持 内档案 · 苍晏封口令】⚠
  苍晏"再别提严狰"非个人愧疚——是朝堂直接的封口令。
  · 苍晏辞去阁老职亦非"年迈抱恙"，是因追严狰案触到皇城司眼线。
  · 玩家渠道可达"光熙十五年皇城司查抄严家、领队太监聂朝夕"。
  主持 演绎：苍晏若被玩家逼问严狰案，仅会含糊吐露"你父亲当年追过相似的问题"七字后闭目；手抖则饮茶避之；不解释，由玩家自拼。`, 5);
    markSecret('苍晏封口令');
  }
  _%>
