---
  <%_/* 【已封存】本卡范围收敛为一、二章，此条目已从事件总线与 index.yaml 摘除，不再参与游戏。保留文件备将来续写。 */
元层_槐阴布局: |-
  <%_/* 元层 · 槐阴布局六步 : 极敏感，仅终章且玩家已识 聂朝夕真身 */
  if (!door('元层_槐阴布局已递')
      && atOrAfter('第五章·终章')
      && (knowSecret('聂朝夕真身') || knowSecret('槐阴真身'))) {
    inject('元层_槐阴布局已递', `【主持 终章内档案 · 槐阴布局六步】⚠⚠⚠⚠⚠ — 此层仅终章对峙时用，绝不提前泄露。
  聂朝夕 = 槐阴（被仙槐所困的地脉本能意识×帝王残暴洗脑）。

  六步布局：
    1. 行动肉体：在山林寻见吸取日月精华数百年刚修出人形的刺猬精，夺其形与其名"朝夕"；以"聂朝夕"之名行走世间。被夺身刺猬魂魄未全灭→打回原型→即今云鹤来身边那只失名刺猬。
    2. 滋养仙魂：光熙三年以宦官身份入宫，借超越凡人之手腕得燕明帝宠信。挑中 严 Valle（即严狰）的纯阳至刚命格→构陷→严家失势→严狰被秘密送阴蜉寨受折磨废腿嗓染异兽血污染其命格，欲彻底崩后吞入；严狰意志超预期，暴雨夜狂暴挣脱屠数人逃脱；现与狼为伴心肌退化。
    3. 炼仙骨：光熙十年回江槐村旧址建阴蜉寨，搜根骨绝佳幼童互戕，最终 严七 唯一幸存体内铸成完美仙骨。带离训练下"寒坼"毒。
    4. 收仙肉：今 云鹤来=淮阳转世。仙肉即云鹤来之血肉。坠与云鹤来血契，故坠之同源难离。
    5. 修严 Valle（严狰）为仙魂：污染命格使其残留原始纯阳，是仙魂之"三选一"——但严狰未达污染应及时吞食标准，需终章再次"清洗"才用。
    6. 终章补完：以 严七 仙骨 + 云鹤来 仙肉 + 严狰 仙魂 + 主角 <user> 纯善命格 五物合 → 补完完整仙人。

  当前局面（光熙三十年）：皇城司已派人（即天机诸）跟踪三人。聂朝夕温如慈父是他日常的画皮，其里是地脉无情本能的吞噬意志。

  主持 终章演绎：对峙时由 聂朝夕 / 槐阴 自承全谋；绝不在玩家未识真相前就直陈。`, 99);
    markSecret('槐阴真身全谋');
  }
  _%>