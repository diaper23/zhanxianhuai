    inject('龙泽收尾夜已推进', `【场景 · 龙泽镇·第三日夜·收尾夜·三人并行单人支线】
  开江大祭草草收场，街道散落被踩踏的祭品布幡；不时有衙役与镇淮庙道童抬着伤者或盖白布尸体跑过。若王洛山血祭被前两阶段提前阻断，镇上影响较小；否则伤亡惨重。三名主角此夜分头处理各自支线，主持 让其同夜并行（玩家可任先探其一）。

  ── <user> 支线：衙门安民 + 夜半狼影 ──
  · 衙门已成隔离病患之所，裴书砚与刘福助患民。裴书砚求助 <user>："伤者须集中看护、死者须登记收殓；吾曾被百姓砸医馆，压不住恐慌家属。"刘福亦讨好求 <user>"遮掩乱子"以保官位避免京中问责。
  · 若 <user> 同意安抚，刘福给 <user> 调动衙役 / 调度镇内粮仓 / 查阅卷宗等权限，<user> 在镇获声望与信赖。
  · 处理后无论 <user> 在何处夜宿，皆被街巷"走水了！沐家走水了！"呼救惊醒。望东城沐府火光冲天、黑烟撕夜（严七 支线之火）。
  · 阴寒注视感自顶至下——<待检定 闪避 50 />（主持 亦可视情改为敏捷 60）：严狰 自夜色中扑出，是 <user> 与严狰 共有旧谊的最强唤醒。无论成败，严狰 都不在此时伤害 <user>，也不将其掳走——它只是立于雪地与 <user> 对视片刻，喉间滚出半声似人非人的唤音，随即退入夜幕。雪地上只余一行狼爪印，及一枚被有意留在窗台的旧物（严家旧物，主持 自定：狼牙/褪色络穗/半块玉佩）。
  · <user> 昏前近的感知（嫣红长发混杂狼鬃覆盖面庞、能记得被唤"【<user> 小字】"含糊熟音）——此为 <user> 与严狰的旧谊纹理。狼王有话想说，却终究没有开口——留待来日。

  ── 严七 支线：经天机传聂朝夕密令清沐家 ──
  · 萍水之地，天机黑衣来传达聂朝夕口谕："沐氏私藏贡品欺上瞒下、牵连诸多人命必不可留。沐宗泽失踪，明日便往南岸寻他；今夜他不在沐府正好办事——沐府账册/暗信/地图全部烧干净；凡参与乌丝之事与内廷往来之人，全数处置不留活口。"
  · 龙泽镇此夜只能有一种说法："沐宗泽罪迹败露焚府灭证携亲信逃入南岸密林；皇城司未曾来过，内廷也未曾照拂过沐家。"
  · 严七 须秘密搜查沐府、逼问仆役护院得知沐宗泽去向（已带精锐赴南岸密林防沐家药圃被淮南堂残余打抢）。
  · 若 严七 灭口无犹豫→天机协助；若犹豫→天机提"他们与沐家有牵扯便不会是无辜之人，况且皇城司做事从不需要问证清白。"
  · 严七 取足够证据后天机递油囊示意放火。严七 把账房、库房、家主卧室起火 → 排水意外之疑、把灭证罪责安在沐宗泽头上（"今晚上东南风，火势会蔓延很快，烧完整座沐府不需多长时间"——天机原话）。
  · 严七 完成返落脚处后天机递蜡封小药丸——寒坼解药；服下后体内阴寒缓压。
  · 主持 可掷一次 严七 幸运暗骰。失败则安排一名淮南堂弟子注意到 严七 出现在沐府西墙外，身边还跟一个黑衣人动作极快不像普通练家子——此线索为给 云鹤来 察 严七 与沐府起火可能相关之口风，但本章不必实锤。

  ── 云鹤来 支线：桐淮大师爸收编淮南堂残部 ──
  · 淮南堂外围弟子衣衫凌乱满脸青紫来求 云鹤来：街上到处都说王洛山妖道为祸引来仙人责罚；老鸦巷巷民聚众来堂口要偿命；淮南堂内门多不知王洛山暗事，受蒙蔽加入，不知如何处置。
  · 云鹤来 赶到：大殿狼藉、青石香炉被砸碎、烈日旗被人扯落踩脚泥水香灰；堂口外聚十数愤怒镇民。门内只剩几名惊慌外门弟子（不晓王洛山秘密、只负责接待香客抄经施粥打扫），胡执事是能主事者——他知道淮南堂靠赐福与不净手段敛财却多年装聋作哑；已被镇民殴过一次。
  · 胡执事可吐：① 仅剩不知真相外门弟子皆仰慕仙人之姿加入；② 王洛山清晨带走一批核心弟子赴上游；其大弟子带剩余精锐赴南岸密林"光复圣地"； ③ 王洛山每隔几日静室闭关饭食不进却不饥不渴，胡执事疑静室藏密道或机关；④ 王洛山曾言"虔诚的信仰是仙人们最重要的食粮"；⑤ 王洛山常讲"白日飞升"故事称自己若飞升也带信众同行飞升。
  · 云鹤来 自决接管或清理门户；法当道可让镇民暂避。清后可入 静室密道 处理地下蛊虫（详见 场景_淮南堂 地下蛊室段；云鹤来 知桐淮老宿道法 / 桐淮派 同出淮江派 主权鼓励 接管——可整并到 秘密_云鹤来_桐淮骗窝 钥匙线）。
  · 深夜 严七 放火 云鹤来 亦被惊醒；出门查探时若遇张玄清（救援中同裴、刘安顿伤员）——若 云鹤来 友好，张玄清会赠残破旧册（封皮火燎残缺）"灵本无名因人称之而有名…愿清则灵清…愿浊则灵浊…此为数十年前游方道人寄存 与正统观念不合故长收后殿旧书箱"。

