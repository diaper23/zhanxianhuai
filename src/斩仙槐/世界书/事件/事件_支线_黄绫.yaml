---
事件_支线_黄绫: |-
  <%_/* 支线 · 黄绫：黄家遗孤复仇线（京城相识 → 龙泽收束）
   *  四门：初遇 → 旧案风闻 → 试探 → 相认 →（余波期）金东家反转与复仇抉择
   */
  if (!door('黄绫初遇已递')
      && present('黄绫')
      && loc().includes('阜财坊')
      && door('桐淮已破冰')) {
    inject('黄绫初遇已递', `【支线 · 阜财坊钱庄 · 账房姑娘黄绫】
  钱庄柜房里算盘声不停。账房姑娘黄绫素衣旧袖，头也不抬："客官的兑银在第三格，请自取。"若主角指出账册上一处真正的错漏（【侦查】或【翻检文牍】），她才抬头正眼看人一次："……眼力不错。"
  · 主持：把 黄绫 记入 在场角色（抵达钱庄时 insert，离开 remove）。好感变动见 NPC关系表。`, 80);
  }

  if (!door('黄家旧案已递')
      && loc().includes('阜财坊')
      && (near(['黄家', '旧账', '五年前', '灭门'], 3) || affinity('黄绫') >= 20)) {
    inject('黄家旧案已递', `【支线 · 黄家旧案风闻】
  金东家呷着茶："黄家？提它做甚。五年前一夜之间，满门殁了，官府结案是'仇杀'。"柜后的伙计们集体低头。镇淮庙张玄清口径可互印证：黄家曾与沐家同营山货，沐家上位后"礼遇"黄家甚至赠其乌丝菌——礼遇一个灭门绝户，传出去是要被笑的。
  · 线索点：黄家灭门与沐家发迹的时间线严丝合缝；黄家旧宅如今圈在沐家名下。`, 81);
    markSecret('黄家灭门旧案');
  }

  if (!door('黄绫试探已递')
      && affinity('黄绫') >= 30
      && knowSecret('黄家灭门旧案')
      && present('黄绫')
      && loc().includes('阜财坊')) {
    inject('黄绫试探已递', `【支线 · 黄绫 · 试探】
  对完账她忽然问："客官走南闯北，觉得沐家的钱……干净么？"问完就低头拨算盘，仿佛没问过。主角的回答她一字不落收进心里——答案令她安心，好感 +10；敷衍或替沐家说话，好感 -5 且她此后只谈账目。
  · 若主角提到乌丝菌或夜间贡运，她拨珠的手会停半息——她在拿主角当刀，也在掂这把刀认不认得路。`, 82);
  }

  if (!door('黄绫身世已递')
      && affinity('黄绫') >= 50
      && door('黄绫试探已递')
      && present('黄绫')
      && ['夜晚', '深夜'].includes(time())) {
    inject('黄绫身世已递', `【支线 · 黄绫 · 后巷相认】
  打烊后她把主角让进钱庄后巷："跟你说件事，说完你若想告官，我认。"黄家五年前一夜倾覆，爹娘兄嫂皆殁，她是从狗洞里爬出来的幼女；改名换姓进钱庄做账，只为等沐家的账自己烂出来。"我没指望谁帮我。你听着，就行。"
  · 任务目标维护：insert 任务目标「黄绫的账」：描述'陪她把灭门旧案的最后一页翻出来'，状态 进行中。
  · 好感依据：此刻起 ±10 一档。`, 83);
    markSecret('黄绫遗孤身份');
  }

  if (!door('黄绫抉择已递')
      && door('黄绫身世已递')
      && affinity('黄绫') >= 60
      && door('龙泽收尾夜已推进')) {
    inject('黄绫抉择已递', `【支线 · 黄绫 · 最后一页（余波期）】⚠ 抉择节点
  沐府焚塌后她查到最后一页账：当年给沐家引路、卖主求荣出卖黄家的，正是收留她的金东家——他吞了黄家的银子，又收留黄家的女儿，"养着账，等它自己长利息"。
  三条路，由玩家陪她选：
    · 杀：当夜事了，无痕则已；留痕则官面记档，主角公信受损。
    · 报官：金东家攀咬她在钱庄做过的手脚，她须担"伪籍"之责——主角以官面身份可压下（消耗一次人情）。
    · 放下：她把账册投入淮水。好感 +15；此后她留龙泽重开黄家旧宅门户。
  · 任一选择，好感≥70 且主角表态挽留 → 她愿随行回京；否则按所选收束。
  · 任务目标维护：replace 任务目标「黄绫的账」为 已完成 或 已失败。`, 84);
    markSecret('金东家出卖黄家');
  }
  _%>
