---
事件_支线_柳拂衣: |-
  <%_/* 支线 · 柳拂衣：迎仙楼掌柜线（相识 → 酒谈 → 交心 → 摊牌 → 收网抉择）
   *  危险系：她的双面身份与聂朝夕的眼线网相连，摊牌前不得泄露一字。
   */
  if (!door('拂衣初遇已递')
      && present('柳拂衣')
      && door('龙泽初抵')) {
    inject('拂衣初遇已递', `【支线 · 迎仙楼 · 掌柜柳拂衣】
  迎仙楼的灯笼底下，掌柜娘子拂去桌尘："三位大人住店？楼上临江的房刚空出来，大祭这三日，价已经翻了两番——你们是官差，我按旧价。"笑意周到，眼睛把三位从头到脚各称了一遍斤两。
  · 主持：把 柳拂衣 记入 在场角色（主角在迎仙楼大堂时 insert，回房/外出 remove）。`, 80);
  }

  if (!door('拂衣酒谈已递')
      && affinity('柳拂衣') >= 20
      && present('柳拂衣')
      && door('龙泽迎神日已推进')
      && ['黄昏', '夜晚'].includes(time())) {
    inject('拂衣酒谈已递', `【支线 · 柳拂衣 · 一壶特酿】
  她拎着一壶"大祭特酿"坐到主角邻桌："官爷从京里来？讲个京里的新鲜事，这壶算我的。"酒过三巡，她以大祭八卦、沐家旧闻回敬——主持可借她的口合法递送公开情报。临了收壶，笑吟吟："官爷的来历我不问，银子问就行。"醉话里夹着一个她不该知道的词。`, 81);
    markSecret('拂衣酒谈');
  }

  if (!door('拂衣交心已递')
      && affinity('柳拂衣') >= 40
      && door('龙泽开江日决战完成')
      && present('柳拂衣')
      && ['深夜'].includes(time())) {
    inject('拂衣交心已递', `【支线 · 柳拂衣 · 柜台独酌】
  大事落定后的深夜，大堂只剩一盏灯。她在柜台后独酌，见主角下楼也不躲，只推过去一只空杯。半真半假一句："这镇上的风，把人吹成两截活着——一截见人，一截见鬼。"酒壶见底，她摆摆手上楼，背影比白日里薄。`, 82);
  }

  if (!door('拂衣摊牌已递')
      && affinity('柳拂衣') >= 50
      && door('龙泽收尾夜已推进')
      && present('柳拂衣')) {
    inject('拂衣摊牌已递', `【支线 · 柳拂衣 · 摊牌】⚠ 高危秘密
  她把柜台最底层的抽屉推给主角：三页没交出去的行踪记录，记的是主角一行在大祭前后的每一步。"聂朝夕的网早罩着这镇子。天机按月来取，我按月誊抄——这三页，我压下了。我当你是客，不当我欠那份钱。"
  · 玩家此刻可追问整张耳目网，主持按秘密递送规则控层；她知道的到"天机上线"为止，再深处她也不知道。
  · 任务目标维护：insert 任务目标「拂衣的网」：描述'她压下了三页记录，天机迟早来收'，状态 进行中。`, 83);
    markSecret('拂衣耳目身份');
  }

  if (!door('拂衣抉择已递')
      && door('拂衣摊牌已递')
      && affinity('柳拂衣') >= 60
      && ['夜晚', '深夜'].includes(time())
      && onceChance(0.5, '拂衣收网' + day())) {
    inject('拂衣抉择已递', `【支线 · 柳拂衣 · 收网之夜】⚠ 抉择节点
  打烊时分，戴斗笠的黑衣人坐进大堂角落——天机亲自来收这一月的账。柳拂衣斟酒的手稳得反常："客官要的账，今夜齐。"眼神却越过酒壶落在主角身上。
  三条路，由玩家落子：
    · 伪造记录帮她脱网：须瞒过天机当场验看（【术数】或【布置】对抗，失败则三人当场撕破脸，主角官面身份暴露于聂朝夕网中）；
    · 送她连夜远走：她从后门下淮水，此线情缘以"江上无信"收束，但天机的怀疑落到她一人身上；
    · 交人换人情：她被天机带走，主角在天机处记下一份"重诺"的人情（后续可用一次）。
  · 任务目标维护：replace 任务目标「拂衣的网」为 已完成 或 已失败。`, 84);
    markSecret('拂衣收网之夜');
  }
  _%>
