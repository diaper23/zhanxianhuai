---
事件_四物_灯油: |-
  <%_/* 事件 · 四物·护国寺取灯油 : 明面贿借 / 夜潜盗两态（旧 P020+P021+P022） : 门牌"不灭灯油已取" + 副门"护国寺黄符已拾" */
  if (!door('不灭灯油已取')
      && door('桐淮已破冰')
      && (loc().includes('护国寺') || loc().includes('寺'))) {
    const isNight = near(['夜', '月', '潜', '偷', '盗'], 2);
    const body = isNight
      ? `【场景 · 护国寺 · 半夜偷灯油】
  长明灯百年不灭，悬于后殿；守殿僧 净白 已睡。换班间隔约半刻。
    · 取油须【潜行/困难】避开净白；玩家若想得灯油须从灯盏里舀一勺半，过满则溢洒惊寺。
    · ⚠ 失败代价【迟滞/误导】：撞见净白 → 桐淮派口惠难圆、圣旨含金量被净白当面拆穿；或逃出后被护国寺上报朝廷，朝中再添麻烦。
  副节点 · 黄符已拾（仅当云鹤来 在场时附带露出一次）
    僧寮案上一张褪色旧黄符，落款"淮南堂 王洛山 庚申年"。云鹤来抬眼望你：诧异→厌→不语。
    · ⚠ 玩家追问可得知十余年前有人假符水在此骗灯油，被净白逐走，南下开了"淮南堂"。取走黄符即解锁后续线索门（事件总线会在玩家提到王洛山/淮南时自动触达）。`
      : `【场景 · 护国寺 · 白日取油】
  净白见江湖人便不待见。
    · 须【交涉/普通】动苍家名头，若圣旨在手可硬借（净白不悦但放）；或【欺瞒/困难】扮桐淮派"奉旨镇龙"哄骗（骗不过则净白甩袖而出）；或贿雪花银若干。`
    ;
    inject('不灭灯油已取', body, 31);
    markSecret('护国寺灯火');
  }
  if (!door('护国寺黄符已拾')
      && door('桐淮已破冰')
      && (loc().includes('护国寺'))
      && near(['黄符', '符', '王洛山', '淮南'], 3)) {
    inject('护国寺黄符已拾', `【线索物证 · 护国寺旧黄符】
  案上旧黄符写："淮南堂 王洛山 庚申年"，边角写"借油护镇以驱阴祟"。
  净白（被问及时）：王洛山船过路，骗油倒不算甚么，符水兑的假货；将在桐淮派那更是瘾者自养的勾当。
    · ⚠ 这条物证把"王洛山→护国寺→淮南堂"路径连上；但不揭王洛山背景、不揭桐淮派即骗窝全貌。`, 32);
    markSecret('王洛山淮南堂');
  }
  _%>
