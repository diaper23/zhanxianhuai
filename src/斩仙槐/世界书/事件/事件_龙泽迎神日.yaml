---
事件_龙泽迎神日: |-
  <%_/* 事件 · 龙泽迎神日：第一日（硬时钟拍级节点）
   *  总纲门在抵达龙泽后首个清晨/上午开出，并锚定 大祭首日；三拍子门各按时段自启——
   *  错过的拍会顺延到之后的同窗口再开，不丢内容。
   */
  if (!door('龙泽迎神日已推进')
      && door('龙泽初抵')
      && atOrAfter('第二章·龙泽听潮')
      && ['清晨', '上午', '午后'].includes(time())) {
    const 首日 = Number(getvar('stat_data.剧情进度.大祭首日', { defaults: 0 })) || 0;
    if (!首日) setvar('stat_data.剧情进度.大祭首日', day(), { scope: 'message' });
    inject('龙泽迎神日已推进', `【场景 · 龙泽镇·第一日·迎神日】
  今日为大祭首日。本节点只给总纲，三拍随硬时钟自动展开：
    · 昼拍（上午/午后）——沐家粥棚施粥 + 镇淮庙道士宣讲 + 王洛山城西驱邪公演
    · 夜拍（夜晚/深夜）——裴书砚江心潭取水
    · 深夜拍（深夜）——城南私家码头·贡品夜运（本日核心）
  主持：把 剧情进度.当前场景='迎神日'。玩家此刻去哪、先见谁，由玩家定；到点的拍会送上门。`, 60);
  }

  if (!door('迎神日_昼拍已推进')
      && door('龙泽迎神日已推进')
      && ['上午', '午后'].includes(time())) {
    inject('迎神日_昼拍已推进', `【迎神日 · 昼拍】
  · 沐宗泽亲到粥棚博民望；主角可与沐家长随接洽"贡运"内容（<user> 可潜察官文）。
  · 镇淮庙住持张玄清 晨入静室闭关（详见 场景_镇淮庙）；玩家可隔屏风简短问话。
  · 王洛山（落山道人）在城西平民小场"驱邪治愈"一例发狂病人显法；玩家若【术数/困难】或【反向运用：药理/医学】可察觉"驱邪实为人工拙计"（符水+江心潭水+休眠蛊卵）；玩家若狙击，遇其随行打手 1d4+1（见 场景_淮南堂 暗示数值）。`, 61);
  }

  if (!door('迎神日_夜潭已推进')
      && door('龙泽迎神日已推进')
      && ['夜晚', '深夜'].includes(time())) {
    inject('迎神日_夜潭已推进', `【迎神日 · 夜拍 · 江心潭取水】
  · 裴书砚会划小渔船自芦苇荡驶往开江祭坛正对面之江心潭，取系长绳特制铜瓶沉水。玩家若陪往可【侦查】发现江底极微荧光淡绿光点一闪；【术数/极难】可感该光点去向"自江底延向远处山林"。
  · 云鹤来 近江心潭时随身铜钱坠温热、闻异常清新芬芳；刺猬表现舒适。此为 淮阳 于江底之远沿信号，本章不解释。
  · 离江时全主角【聆听】可闻南岸密林狼嚎；【侦查/困难】或【追踪/困难】可于月光下捕南山脊上数对幽绿狼眼转瞬即逝（本章无须亮明严狰/白狼身影，默伏）。`, 62);
    markSecret('江心潭微光');
    markSecret('南岸狼群迹象');
  }

  if (!door('迎神日_贡运已推进')
      && door('龙泽迎神日已推进')
      && time() === '深夜') {
    inject('迎神日_贡运已推进', `【迎神日 · 深夜拍 · 城南沐府私家码头·贡品夜运（本日核心）】
  · 沐安率 1d6+4 精锐护院 + 10~15 护院押三艘中型货船；1d3+1 名活人血食置最底货舱（必含前周失踪猎户吴五，舌被割）。黑衣斗笠人同行——严七 与天机的默契；若 严七 陷险天机会出手、暴露隐秘关联线索。
  · 主角抵达时机依 主持 判断：丑时前至→装货中；2~3点→血食上船；3 点后→船已离岸、唯留事后痕迹。【潜行/困难】或以官方身份/贿赂/声东击西获奖励骰；失败则与沐安及护院接触、首拟贿赂→戒备→舍弃一船走另两艘。
  · 潜入货舱得证：黑漆木盒装乌丝菌；【锁匠】开后见墨色菌丝凛冽异香；铁栅隔间呜咽处可见吴五；直面此景须 心神 检定 "1/1d3"（主持 填 <待检定 心神 50 "1/1d3" />）。
  · 救出吴五须【精神分析】安抚后方以手语/写字示：半月前在南岸密林被毒打掳走、关押温暖带异香山洞、数人隔几天少一个、洞里那批人不像山匪；南岸狼群近年成精懂战术包抄设伏。
  · 击杀沐安→沐家死敌全力追杀；不击杀只取情报→开江日前夕沐宗泽戒心增。
  · 任务目标维护：救出吴五并取得链证后，可 insert 任务目标「血食链证」为 已完成 记录（若本就有此目标则 replace）。
  本拍演毕 主持 把 剧情进度.当前场景='迎神日毕'。`, 63);
    markSecret('沐家夜间贡运');
  }
  _%>
