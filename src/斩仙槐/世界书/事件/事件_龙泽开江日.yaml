---
事件_龙泽开江日: |-
  <%_/* 事件 · 龙泽开江日：第三日决战（硬时钟拍级节点）
   *  总纲门在大祭首日的第三日清晨开出；江畔异变是按时段必发的世界事件；
   *  决战门在主角真正介入上游血祭时开出；若主角全程不介入，入夜后由收尾夜节点兜底收官。
   */
  const 首日 = Number(getvar('stat_data.剧情进度.大祭首日', { defaults: 0 })) || 0;
  if (!door('龙泽开江日已启')
      && door('龙泽巡游日已推进')
      && 首日 > 0 && day() >= 首日 + 2
      && atOrAfter('第二章·龙泽听潮')
      && ['清晨', '上午', '午后'].includes(time())) {
    inject('龙泽开江日已启', `【场景 · 龙泽镇·第三日·开江日】
  今日为大祭终日，第二章高潮。两战场：开江祭坛（江畔万人庆典）与淮水上游峡谷（王洛山血祭）。详见 场景_开江祭坛与江心潭 与 场景_淮水上游峡谷。
  · 江畔异变于上午大典中必然发生（世界事件，与主角是否在场无关）。
  · 上游血祭：主角可经各渠道获增援（曾助张玄清获道士相助 / 与刘福合作获官兵 / 严七 经天机报聂朝夕暗援——此援后续须自行解释来源不得泄露）。
  · 任务目标维护：insert 任务目标「挫败上游血祭」：描述'王洛山欲借万人愿力血祭成仙；介入越早，其异化越弱'，状态 进行中。
  主持：把 剧情进度.当前场景='开江日'。玩家可全力赴上游、坐镇江畔或分兵——由玩家定，代价自负。`, 60);
  }

  if (!door('开江日_江畔异变已推进')
      && door('龙泽开江日已启')
      && ['上午', '午后'].includes(time())) {
    inject('开江日_江畔异变已推进', `【开江日 · 江畔大祭异变（世界事件）】
  · 晨钟张玄清高声诵祭文，岸边民众放花灯入江；诵毕一句"开江献礼"，原本平缓江面突翻涌暗流，铁锈暗红自上游蔓延，几眨眼间江水化作血色。
  · 人群尖叫"水变色了！河神发怒了！妖邪作祟！"；观礼台沐宗泽满脸惊骇望上游，吩咐身边护院撤走大半（【侦查】跟踪——其护卫未参与救灾，径直穿混乱入南岸深山方向）。
  · 数十镇民栽倒狂扯皮肤，重症者口鼻喷涌半透胶状秽物——血宫蛊全镇爆发，【目睹此景须 心神 检定 1d3/1d6】（主持 写 <待检定 心神 50 "1d3/1d6" />）。
  · 裴书砚能否救场取决于 门"镇灵散可得"是否已开：
     · 已开：裴书砚背药箱冲入混乱中心，高呼"不要慌这不是邪祟是蛊毒先按住他们"，镇灵散以烈酒化开强灌，狂症肉眼可见平复，混乱渐控制。
     · 未开：裴书砚仍背药箱入场，但缺特效药；以银针镇定或常见草药无效，呼喊被淹没，眼看病患癫狂死或踩踏死——混乱持续伤亡惨重，王洛山获更多力量强化等级提高。`, 61);
  }

  if (!door('龙泽开江日决战完成')
      && door('龙泽开江日已启')
      && (loc().includes('峡谷') || scene().includes('上游') || near(['血祭', '上游', '峡谷', '法阵', '王洛山'], 2))) {
    inject('龙泽开江日决战完成', `【开江日 · 淮水上游峡谷血祭 · 决战】
  · 王洛山立于兽血朱砂绘法阵上，边缘绑 1d4+2 名信徒祭品；4 名最精锐黑衣执事护法。
  · 介入时机分三阶段（详见 场景_开江祭坛与江心潭 与 场景_淮水上游峡谷）：
     阶段一·准备：王洛山未念咒文 → 最佳突袭，战力最弱
       落山道人: 力 50 / 体 55 / 型 60 / 敏 60 / 意 60   气血 11 / 法力 12 / DB+0 / 护甲 0 -- 格斗(桃木剑/短刀)55% 1d6 / 投掷(蛊毒银针)40% 1d3+毒(失败每轮 -1 持 1d4 轮) / 闪避 35% / 无法强力法术
     若本阶段击退 → 血祭全败，下游不会爆蛊、王洛山无法异化强化。
     阶段二·仪式初：王洛山已割喉 1~2 祭品，身体膨胀眼发红光，下游江色变、爆发血宫蛊
       落山道人·异化初阶: 气血 同上 + 法力 12+7 / DB +1d4 / 护甲 +1 / 法术【秽血诅咒】消耗 2 法力 对一目标【意志】对抗，失败则其下次攻击-1惩罚骰
     此阶段阻止可让下游混乱稳在可范围。
     阶段三·仪式中后：王洛山采完大多数祭品全身血红光焰包裹身形高大皮长树皮角质层
       落山道人·异化完成: 力 70 / 体 70 / 型 70 / 敏 40 / 意 40   气血 30 / 法力 20 / DB +1d4 / 护甲 +1
       法术【污秽诅咒】同秽血 /【腐化光环】对 5米内生物物理攻击-1惩罚骰 /【生命回复(信仰汲取)】50% 每 2 回合回 1d6 气血
       若玩家巡游日成功破坏阳主巡游+稳住巡游人群，其每达成一项将其回复阶梯降至 1d3 再至无法回；王洛山每判定再加一层惩罚骰（玩家行动反馈细节详见 场景_开江祭坛与江心潭 + 巡游日 线一记录）。
  · 战斗 2 回合后狼群加入战场：山脊响起狼嚎，1d6+2 只毛皮乌黑发亮的狼俯冲而入直扑王洛山（详见 场景_开江祭坛与江心潭 尾部"狼群趁异动"）
       野狼: 力 75 / 体 65 / 型 60 / 敏 70 / 气血 13 / DB+1d4 / 斗殴(啃咬)55% 1d8 / 闪避 35%；狼群优先攻王洛山/护法弟子，唯玩家主动攻狼时反击。

  击败王洛山（气血 归 0）
  · 身体于悔恨恐惧中（"这……不是飞升……原来……我……才是……"）几息内化为飞灰随风入淮水。
  · 原地遗留一组道袍、罗盘、两本小册（《南疆蛊术杂考》与王洛山笔记）。【翻检文牍】从《南疆蛊术杂考》得"坛中养蛊以怨为食百死存一为坛仙以血饲之可得其形"+王洛山批注"于南山寻得其所生之地有异香伴生菌落或为仙迹"；笔记记仙三宝"不朽仙骨/不灭仙肉/不散仙魂"+王洛山成仙雄心。
  · 罗盘磁针非指南北，固执指向淮水南岸某片深山——个中缘由无可考，只作余韵谜面。
  · 法阵经【风水学】/【术数】判为吸能祭坛兼定位指针，能量纹路终交汇于罗盘所指方位。

  战后狼群不攻玩家，警惕缓步逼近；山脊传来悠长咆哮后，狼群阵形锐变——最壮者断后其余循"雁形散阵"（可让主角【教育】/【历史】辨出）高效有序撤退入密林。山崖最高处白狼脊背驼一黑影同隐（本章不直陈其人，详见 NPC_严狰 档案）。
  云鹤来 的刺猬闻地脉可带玩家追味以入密林（"亲切舒适的味道和江心潭类似但更浓"——见 云鹤来 秘密门链），引出"收尾夜"收官。
  · 任务目标维护：按战果 replace 任务目标「挫败上游血祭」为 已完成（击退）或 已失败（血祭完成）；同时把「三日大祭」相应推进。
  本战演毕 主持 把 剧情进度.当前场景='开江日决战完成'。`, 62);
    markSecret('王洛山勾结血魔');
    markSecret('异化可成仙狂道');
    markSecret('南岸密林有罗盘指示');
  }
  _%>
