---
  <%_/* 【已封存】本卡范围收敛为一、二章，此条目已从事件总线与 index.yaml 摘除，不再参与游戏。保留文件备将来续写。 */
事件_第三章封禁: |-
  <%_/* 事件 · 第三章封禁（输出固定"未完待续"）：玩家欲离开龙泽镇入南岸密林时触发
   *  本卡开发状态——"第三章·龙潜于渊/第四章·龙眠旧梦/第五章·终战"剧本尚未在本卡建模推进
   *  为防止玩家被推进入空白章节后获不到实质叙事/规则支撑——本门触发后约束 主持 暂停实质叙事
   *  而以一段优雅"未完待续"话术与玩家互動收束
   */
  if (!door('第三章封禁已触发')
      && door('龙泽收尾夜已推进')
      && atOrAfter('第三章·龙潜于渊')) {
    // 触发钥匙：玩家近 4 楼出现"入林/南岸/严狰/罗盘"等关键语，或 当前场景含"密林"
    const 入林信号 = near(['密林', '南岸', '上山', '入林', '找', '严狰', '罗盘', '寻人', '追', '进山'], 4) || scene().includes('密林');
    if (!入林信号) return;
    inject('第三章封禁已触发', `【第三章 · 封禁节点 · 未完待续】

  ──雪落南岸，密林沉沉。──

  主角踩过滩地最后几丛芦苇，回头望去——龙泽镇在身后渐隐于雾雪。灯火一盏盏熄，烟火之声被风雪压下。

  就在这一步跨向南岸之时——

  ──远处密林深处又响起一声悠长的狼嚎。

  主角停步于岸，回首淮水无情，前望幽林有命。

  ══════════════════════════════════
  守密人 · 封禁提示（硬红线）
  ══════════════════════════════════

  本卡《斩仙槐》卷至此处暂作折页——【第三章·龙潜于渊】及之后章节的剧本尚未在本卡建模推进。

  主持 本回应起须遵守：
    · 不再做出密林内具体场景、新 NPC、新检定、新 心神 风险的实质叙事
    · 不让任何 NPC 推动"南岸密林进一步展开"
    · 不报出后续章节的真相挖掘、邂逅、战斗或新场景
    · 不主动鼓励玩家"反正我应该试一下"故意往空白章节蹭

  主持 唯一应做的事——以一段优雅"未完待续"收束本轮。参考话术（可在此基础上润饰，但不可推进实质剧情）：

  「南岸林深，狼嚎自远而去——
    你这一步已至风雪之界。
    本卡《斩仙槐》卷至此处暂作折页——
    严狰 与 <user> 在林深处再度相见的那一夜，
    淮阳 与 槐阴 双半归一的真相全谋，
    聂朝夕 的"补完之局"渐至最后一步——
    那些后续，待后续卷轴续写。
    ——本章·未完待续。」

  然后结束本回应，并在变量更新里做收束：
    · 主角.气血.当前 补至上限（休整满血）；心神 delta +1d3
    · 剧情进度.当前场景='第二章收尾毕'
    · 剧情进度.当前章节='第三章·龙潜于渊'（记里程至此）

  若玩家仍坚持推进入林：
    · 仍回到上述"未完待续"话术，不强行模仿剧情推进
    · 礼貌而坚定告知玩家本卡不提供未完成章节的实质内容
    · 玩家可自由回 龙泽镇 / 重新调查已开放调查点 / 触发尚未开场秘密门 / 打磨已收集线索

  ══════════════════════════════════
  收束语──
  淮水汤汤，雪自天来。
  下一卷开篇：等你回到这棵树下。`, 70);
    reach('第三章·龙潜于渊');
    markSecret('本卡第三章封禁已尽');
  }
  _%>