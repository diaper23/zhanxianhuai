---
事件_支线_茯苓: |-
  <%_/* 支线 · 沈茯苓：医棚药娘线（相识 → 病链发现 → 采药 → 余波告白）
   */
  if (!door('茯苓初遇已递')
      && present('沈茯苓')
      && loc().includes('医棚')
      && door('龙泽初抵')) {
    inject('茯苓初遇已递', `【支线 · 城郊医棚 · 药娘沈茯苓】
  医棚里药香压着病气。沈茯苓踮脚够高处的药匣，被主角吓一跳，药戥子差点脱手："要、要抓药吗？义兄裴书砚出诊去了，一般的病我也能看……"说罢耳根通红。
  · 主持：把 沈茯苓 记入 在场角色（抵达医棚时 insert，离开 remove）。`, 80);
  }

  if (!door('茯苓病链已递')
      && affinity('沈茯苓') >= 20
      && present('沈茯苓')
      && loc().includes('医棚')
      && door('龙泽迎神日已推进')) {
    inject('茯苓病链已递', `【支线 · 沈茯苓 · 病案发现】
  主角撞见她躲在药柜后抄写医案，慌得把纸攥皱。纸上是她私录的怪病名录：得枯萎症的病人，无一例外都在沐家做过工，或买过沐家的"补药"。她小声："这不是瘴气。义兄不许我乱说，可我抄得不会错……"
  · 这份名录是明面线索，可自由转述；好感依据 +10（她拿主角当第一个"肯听的人"）。
  · 任务目标维护：insert 任务目标「怪病源头」：描述'沈茯苓的病案名录：枯萎症指向沐家'，状态 进行中（若已立则并入）。`, 81);
    markSecret('茯苓病链发现');
  }

  if (!door('茯苓采药已递')
      && affinity('沈茯苓') >= 40
      && door('茯苓病链已递')
      && present('沈茯苓')
      && ['清晨', '上午'].includes(time())) {
    inject('茯苓采药已递', `【支线 · 沈茯苓 · 下游崖岸采药】
  她抱着空药篓拦在门口："下游崖岸新出了避瘴草，一个人不敢去……你去吗？"采药半日：她进山判若两人，指崖辨草、蹚水如飞；【敏捷】或【生存】检定可助她多得两株。回程她在滩边洗手，忽然说了句与药无关的话——"京城的公子哥，为什么要听我讲这些呢。"
  · 好感依据 +10；若玩家主动提议改去上游峡谷，主持须借一声狼嚎劝返（上游留给开江日）。`, 82);
  }

  if (!door('茯苓平蛊散已递')
      && door('龙泽收尾夜已推进')
      && affinity('沈茯苓') >= 60
      && (present('沈茯苓') || loc().includes('医棚'))) {
    inject('茯苓平蛊散已递', `【支线 · 沈茯苓 · 平蛊散（余波期）】⚠ 告白节点
  血宫蛊爆发后她以镇灵散为底改良出"平蛊散"，彻夜施救，眼下青黑却眼里有光。疫情稍缓之夜，主角行经医棚后院：她在晾药，月光把药匾照成一片白。她头也不回地开口——疫村那一夜、裴书砚从灰烬里把她刨出来、以及"你第一次来医棚抓药，我记到现在"。
  · 告白由她递到唇边，接不接、怎么接，由玩家落子；止乎礼亦不失——她是余波期最长久的盟友。
  · 赠礼：平蛊散 ×3（对蛊毒之症如验；主持记入物品栏）。
  · 任务目标维护：replace 任务目标「怪病源头」为 已完成（若仍在则并线）。`, 83);
    markSecret('平蛊散');
  }
  _%>
