---
事件_支线_吴五: |-
  <%_/* 支线 · 吴五归乡：迎神夜贡运中救出的割舌猎人（余波期独立支线，非攻略）
   */
  if (!door('吴五归乡已递')
      && door('龙泽收尾夜已推进')
      && knowSecret('沐家夜间贡运')
      && (present('吴五') || near(['吴五', '猎户'], 3))) {
    inject('吴五归乡已递', `【支线 · 吴五归乡】
  吴五还留在镇上——舌头残了，写不了几个字，比划着不想回山下的家："没脸。"他想办三件事：给同船没救出来的人立个牌位；把南岸的事画下来；讨一口酒。
  · 帮他：画出的南岸见闻图是实在的奖励——狼群哨位与包抄路线入图，此后凡【追踪】/【侦查】关于南岸狼群，+1 奖励骰（主持记入主角特长与加成："吴五的南岸见闻图"）。
  · 沈茯苓若在（好感≥40 或 主持酌情），可为吴五医舌——良言难医的其实不是舌。
  · 任务目标维护：insert 任务目标「吴五的心愿」：描述'牌位、见闻图、一口酒'，按完成度 replace 状态。`, 80);
    markSecret('吴五南岸见闻');
  }
  _%>
