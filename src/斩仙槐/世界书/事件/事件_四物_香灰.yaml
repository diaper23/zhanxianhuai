---
事件_四物_香灰: |-
  <%_/* 事件 · 四物·阜财坊钱庄取香灰 + 副门"圣旨含金量" + 副门"乌丝菌龙泽暗线" : 合旧 P030+P031 */
  if (!door('不落之尘已取')
      && door('桐淮已破冰')
      && (loc().includes('阜财坊') || loc().includes('钱庄'))) {
    inject('不落之尘已取', `【场景 · 阜财坊百年钱庄 · 取不落之尘】
  钱庄东家姓金，年过七十；这间百年钱庄的"不落之尘"实为后院大香炉积年沉灰，不入市出售。
  · 玩家须【交涉/普通】亮圣旨或苍家文书借灰；东家痛快许之，但借时顺手提了一桩自家账簿的"乌丝菌"动向——这是埋伏笔的口风。
  · ⚠ 主持 可在东家闲谈中泄露半句："前年内廷采买'乌丝菌'数千斤，名目为宫廷药膳；账簿里收货地名写得不详，但落款是个缩写'龙泽'。" 玩家追问亦只甲方给到这半步，不揭聂朝夕背后角色。
  东家另一桩口风（须 玩家抵达[神植达官] 或 圣旨在手 才会讲）：龙泽镇出产乌丝菌久矣；此菌久服"短促精力换根本伤"——是谓"以命添力"。属埋伏笔，但绝不点破乌丝菌与槐阴/聂朝夕的关系。`, 33);
    markSecret('不落之尘');
  }

  // 副门1 · 圣旨含金量 已识：仅当玩家有香灰线索 + 也面对淮南堂/王洛山/圣旨追问时露
  if (!door('圣旨含金量')
      && door('不落之尘已取')
      && atOrAfter('第二章·龙泽听潮')
      && near(['圣旨', '乌丝', '内廷', '皇帝', '采买', '贡品'], 4)) {
    inject('圣旨含金量', `【线索 · 圣旨背后】⚠⚠
  阜财坊账簿闲谈里玩家可拼出一条："圣旨明面'寻仙求长生'，实则近年内廷与南隅龙泽镇有'乌丝菌'贡品往来，圣旨仍是皇命不假，可意图不只长生一途。"——不能在第一章抛，第一章只露半句缩写'龙泽'埋伏笔；第二章玩家向 聂朝夕 / 严山海 / 苍家追圣旨时方完全解锁"皇帝私索贡品"线索。
  注意：玩家自拼但这扇门开后，主持 方可在叙事里以"随官低语""东家补一句"呈现完整 picture。`, 34);
    markSecret('圣旨含金量');
  }
  _%>
