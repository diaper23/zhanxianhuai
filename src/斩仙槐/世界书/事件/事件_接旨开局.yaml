---
事件_接旨开局: |-
  <%_/* 事件 · 接旨开局 : 门牌"圣旨已接" : 推动苍府第一幕
   *  接旨为单主角通用开局，不再限定 isHO(1)——自定义身份同样从这里开始。
   */
  if (!door('圣旨已接')
      && loc().includes('苍府')
      && (scene().includes('接旨') || near(['接旨', '圣旨'], 3))) {
    inject('圣旨已接', `【场景 · 苍府 · 接旨开局】
  传令太监已展开红绸金字圣旨，宣读完毕：「—即刻整备，五日内出京，前往南隅龙泽镇，寻前朝应太祖长生之秘；若有怠慢推诿、泄露机密、私藏所得者，皆以欺君论处。」
  皇城司番子八人分立庭侧，无一出声。
  本节点目标：
    · 让玩家感知皇命不可违、限期出京的威压；玩家可在场质问太监若干细节。
    · 太监身份温和而程式化，眼里有几分审视；问到关键点（为甚点名我？同行者何人？龙泽镇上有何物？）将以"此乃上意，不便多言""到了自知"等回避。
    · 玩家可在接旨前后简短问询，问完自然接过圣旨即收尾——不得替玩家做"接 / 不接"决定。
  得到此门后 主持 应将 剧情进度.当前章节=第一章·诏起龙庭、地点=苍府、当前场景=整备待发；玩家准备就绪后自会前往桐淮派堂口会合同行者。
  任务目标维护（写入 <UpdateVariable>）：
    · insert 任务目标「奉旨南下」：描述'五日内整备出京，赴南隅龙泽寻前朝长生之秘'，状态 进行中
    · insert 任务目标「采齐仪式四物」：描述'向阳木心/不灭灯油/不落之尘/清晨初露，开坛所需；东市/护国寺/阜财坊/城北四线并行'，状态 进行中`, 10);
    markSecret('皇命寻仙');
    reach('第一章·诏起龙庭');
  }
  _%>
