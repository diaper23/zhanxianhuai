---
事件_桐淮破冰: |-
  <%_/* 事件 · 桐淮破冰 三拍合一（接旨→桐淮→会合→下马威→四物委派） : 门牌"桐淮已破冰" */
  if (!door('桐淮已破冰')
      && door('圣旨已接')
      && (loc().includes('桐淮') || scene().includes('桐淮'))
      && present('梁一笑') && present('云鹤来')) {
    inject('桐淮已破冰', `【场景 · 桐淮派堂口 · 会合破冰】
  玩家此时来到桐淮派堂口，与同伴 云鹤来（江湖术士、桐淮派"大师爸"，腰间一把铜钱坠，肩头伏着小刺猬）会合；师爷 梁一笑（人称"一笑大师"，看似散漫实则通晓命理）出场。
  本节点建议四拍推进（每拍≤100 字，让玩家有回应空间）：

  拍一 · 下马威
    · 梁一笑抬手把铜钱一掷落卜："此行黑雾罩顶，怕是有去难回。" 语气越淡越压人。
    · 若玩家查【术数/普通】成功，可看出太湖石侧"镇煞符"只画了一半——明里护派，暗里另有门道，但不当面揭穿。
  拍二 · 称量圣旨
    · 梁一笑私拉 云鹤来 低语："接旨不接旨、皇命值几文，咱们得心里有数。" 此话玩家若贴耳倾听（【聆听/普通】）能拾碎片：桐淮派对皇命的真实态度是"应差+应景"，并非真心去寻长生。
    · ⚠ 不点破桐淮实是江湖骗窝；仅以"堂口里几面蒲团垫了些来路不明的银钱"暗示。
  拍三 · 委派四物
    · 梁一笑言明此去龙泽非止寻墓，须先备四样"压路法器"以镇龙气（实为开坛做法的凑数仪式；不揭穿）：
      东 · 向阳木心     ← 取自京城东市百年老槐
      南 · 不灭灯油     ← 取自护国寺长明灯
      西 · 不落之尘     ← 取自阜财坊百年钱庄的香灰积华
      北 · 清晨初露     ← 取自城北高门区，卯时以玉瓶收拂第一露
    · 时限两日，四方位象征"龙兴东南西北"——是桐淮派江湖话术（玩家追考古方术成色可拼出"凑数戏法"端倪）。
  拍四 · 同伴搭档
    · 云鹤来毛遂自荐同行；其刺猬吱吱叫出"大师爸"声（玩家只会听到模糊句子，但 听"老仙渡劫生新刺识草木辨阴阳"足以起疑——不解释）。
    · ⚠ 不暴露刺猬失名、不暴露铜钱坠同源；仅以"那坠子逛了几场集市后又自己回来了"埋伏笔。

  此门过后 主持 应把 剧情进度.当前场景=四物采办；玩家可在京城四个点位分别采办四物，或自由排序推进。`, 20);
    markSecret('同行者就位');
    markSecret('四物任务');
  }
  _%>
