---
事件_启程前夜: |-
  <%_/* 事件 · 启程前夜嘱托六合一（旧 P060-P064）: 门牌"启程嘱托已闻" : 不再每角色单条而是合场一条门 */
  if (!door('启程嘱托已闻')
      && door('开坛仪式已施')
      && (scene().includes('启程') || scene().includes('前夜') || near(['启程', '前夜', '翌晨', '行装'], 3))) {
    inject('启程嘱托已闻', `【场景 · 启程前夜嘱托】
  四物备好，明日队伍于天明出京。各路人于此时分头低语嘱托。主持 只命中此刻"在场"的那几个 NPC：

  梁一笑（在场）
    · 公共赠语："提防的不是槐君，是打'阳主之名的邪派。"——警示而非解释。⚠ 这是 梁 在不揭己身的情况下间接暗示某派借'阳主之名'行邪事（即淮南堂王洛山一脉）。
    · 单独对 云鹤来：要其整顿"违背祖训的旁系"——淮南堂乱套了，须于路上清理；不直接点破王洛山背景。
    · 异象解密："倒悬之槐不吉利，暗中作祟。" ——是桐淮派江湖术语，主持 不解释术语指向。

  严山海（在场+严七 在场）
    · ⚠ 夜嘱 严七："信你直觉，别被命令牵着走；龙泽见守宫卵样之物，记得淮水下游见过类似的'地泄'。"——隐晦点拨"仙槐地脉溪流"，但措辞圆而玄，不填背景。圆而玄即谜面，不解谜底。
    · 严七 表面应，内心翻腾。⚠ 是 聂朝夕→天机→严七 单向灌话，玩家只听 严七 转述极简一句"父亲嘱我别被牵着鼻子走"。

  聂朝夕（仅 当 严七 在场 才偕来私低语）
    · ⚠⚠ 聂朝夕笑眯眯召 严七 私语："留心龙泽沐府，凡与'乌丝菌'及内廷往来者要适时让它们消失。" ——市井口吻却沉重如压山。玩家若偷听：【聆听/极难】可拾"沐府"四字。
    · 聂对 严七 任何直白毒质问含糊不答——这是槐阴的腐儒手段：温和似慈父，永远滴水不漏。

  苍晏（仅 <user> 玩家在 苍家府邸 过宿才偕来）
    · 敕令牌、山川纹玉佩 出手："你的事，爷爷拦不了；可有些路是不能走的。"——不点与严狰、苍羁旧事，玉佩与严家旧物可拼合但不许深问此夜。

  ⚠ 不在此节点揭"严狰被利用为命格"、"聂朝夕 = 槐阴"、"严七 = 仙骨"、"云鹤来 = 淮阳转世"——这些所有 HO 终极真相门牌在后三章慢慢开。此夜只剩嘱托。`, 50);
    markSecret('梁一笑警语');
    markSecret('聂朝夕密令沐府');
    markSecret('苍晏临别信物');
  }
  _%>
