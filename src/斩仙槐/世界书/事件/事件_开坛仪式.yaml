---
事件_开坛仪式: |-
  <%_/* 事件 · 开坛仪式四拍合一（布阵→四步→异象→谶言）（旧 P050+P051+P052+P053）: 门牌"开坛仪式已施" : 副门"仪式异象机关破解" + "仪式谶言" */
  // 主门 · 开坛仪式（仅当四物齐 全、在桐淮派堂口、未做过仪式时）
  if (!door('开坛仪式已施')
      && door('桐淮已破冰')
      && hasFour() === true
      && (loc().includes('桐淮') || scene().includes('桐淮'))) {    inject('开坛仪式已施', `【场景 · 桐淮派堂口 · 开坛仪式】
  本节点四拍顺序推进，每拍凝住让玩家写出"做哪一步"再演；不替玩家做拣选与声明。

  拍一 · 布阵
    · 外堂清空；中央以石灰画圆法阵；东、南、西、北四方各设供桌。
    · 玩家将四物分陈方位：东·向阳木心、南·不灭灯油、西·不落之尘、北·清晨初露。
    · ⚠ 玩家若以【术数/普通】成功可看出四物摆放不严合古法——是桐淮派自家凑数戏法，但不当面戳穿。
    · 任务目标维护：replace 任务目标「采齐仪式四物」为 已完成；insert「出京南下」：描述'谶言已指龙泽，启程前夜之后动身'，状态 进行中。

  拍二 · 仪式四步
    · 柳枝洒清晨初露于圆心
    · 焚旧黄符 + 向阳木心投火 + 不灭灯油浇燃 → 焰色诡绿不自然
    · 不落之尘语录星火撒向圆周，金火星齐起不自然
    · 第三步中途须有人念谶，可由 云鹤来 代念也可玩家自念——此口风成"向仙槐告问路径"

  拍三 · 仪式异象 ⚠
    · 供桌轻震，供案上黄符半空翻字；绿焰深处显一旧槐树轮廓——这是桐淮派化学戏法，木心投火+灯油混铜屑即可成。云鹤来袖里犹藏磷硝粉。当场揭穿则两师徒不动声色但不承认，云鹤来只低喃该段须演完了。
    · 玩家【术数/困难】或【侦查/困难】可看出袖中磷硝 → 真相是戏法而非天启——但不揭桐淮派总身世（避开 X050 桐淮骗窝节点即玩家可自拼）。
    · 若玩家当面戳破：梁一笑沉默一息→"既是同行，演着成？…"默然收火。

  拍四 · 谶言 ⚠⚠
    · 同时金火星"逆流"南飘，与化学戏法不合一处——这是真异象。
    · 绿焰深处闪现倒悬龙须槐树虚影一瞬——非桐淮控制；玩家可投【术数/极难】或【幸运】方得窥见。
    · 云鹤来铜钱坠烫得发烫刺猬刺毛炸竖退半步："吓死小仙了…"——这是暗示此异象非戏法。
    · 主持 让玩家在最后一叩时闻得谶言概要："龙兴之地，淮水之源，向南去往龙泽之地。" 此为下一章"龙泽"标题之主引。

  节点收尾 · 主持 应在叙事中 patch 剧情进度.地点 可以是 启程前夜 或 整理行装。`, 40);
    markSecret('仪式戏法端倪');
  }

  // 主门 · 缺物权宜（五日之期届满而四物未齐时，梁一笑 决定凭现有之物强行开坛）
  // 触发：主持 按硬时钟把玩家带回桐淮派堂口且近楼提及"限期/届满/强行开坛"；此后主线不再被四物卡死
  if (!door('开坛仪式已施')
      && door('桐淮已破冰')
      && hasFour() === false
      && (loc().includes('桐淮') || scene().includes('桐淮'))
      && near(['限期', '届满', '强行开坛', '来不及', '出京'], 3)) {
    inject('开坛仪式已施', `【场景 · 桐淮派堂口 · 开坛仪式（缺物权宜）】
  五日之期已至，四物未齐。梁一笑 面色难看却不再等："圣旨不等物，等人的脑袋。缺什么，老夫给你们凑。"桐淮派以自家戏法补位强行圆场。
  本节点四拍顺序推进（同正常仪式），差异仅在：
    · 缺何物，仪式即在该方位"空供"——由 桐淮派 戏法顶替；玩家【术数/困难】可看出补位痕迹（不必当面戳穿）。
    · 拍四 · 谶言照旧发生——真异象不依赖四物："龙兴之地，淮水之源，向南去往龙泽之地。"（云鹤来铜钱坠烫、刺猬炸毛等演出与正常仪式一致。）
    · 代价（主持 记入后续）：缺物的方位在龙泽之旅中以一次麻烦兑现
    · 任务目标维护：replace 任务目标「采齐仪式四物」为 已失败（缺物强行开坛）；insert「出京南下」：描述'谶言已指龙泽，启程前夜之后动身'，状态 进行中。——如初抵时随行物资折损、官面交接不顺、或 梁一笑 对 <user> 信任下降（NPC关系表 相应 -5）。`, 40);
    markSecret('仪式戏法端倪');
    markSecret('缺物开坛');
  }

  // 副门 · 谶言偏解（仪式已施 + 近4楼提"龙泽/淮水/向南"）
  if (!door('谶言提及龙泽')
      && door('开坛仪式已施')
      && near(['龙泽', '淮水', '向南'], 4)) {
    inject('谶言提及龙泽', `谶言内文已并入开坛仪式第四拍。玩家事后回味时 主持 可用 NPC 之口重述"龙兴之地，淮水之源，向南去往龙泽之地"——出京目的地由此锁定为龙泽镇。`, 41);
    markSecret('龙泽为终点');
  }
  _%>
