---
事件_四物_木心: |-
  <%_/* 事件 · 四物·东市取木心 : 白日采集 / 夜潜两态合一（旧 P010+P011） : 门牌"向阳木心已取" */
  if (!door('向阳木心已取')
      && door('桐淮已破冰')
      && (loc().includes('东市') || loc().includes('老槐'))) {
    const isNight = near(['夜', '月', '子时', '潜', '攀'], 2);
    const body = isNight
      ? `【场景 · 东市百年老槐 · 月下夜潜】
  月光下老槐树皮似有微动，近其身则手心暗热。
    · 老槐周围住着管事与巡夜人两人；玩家若取木心须经【潜行/困难】绕过巡夜，或【欺瞒/普通】扮作桐淮派弟子"奉命夜收晨露"。
    · ⚠ 玩家若伸手触及树皮：会感到极缓慢的搏动如心跳，且云鹤来腰间铜钱坠发出微热（玩家可在喊"你这坠子怎么烫了"时被迫开口）；此时只露"老槐活物"之异，不解释为何。
    · 失败后果【代价/迟滞】：惊动巡夜人 → 整条东市小户睁眼叫嚷、玩家须越过矮墙脱身（【敏捷/普通】）；木心不足取则带半凝之蜡质物，仪式时方现勉强。`
      : `【场景 · 东市百年老槐 · 白日采集】
  槐下守候一老管事与二三闲人围炉焖酒。
    · 玩家可【交涉/普通】动用苍家名号求借槐芯一段，或【欺瞒/困难】扮桐淮派外办拿采集凭；如 云鹤来 在场则刺猬闻其气息钻地探询不歇，老管事惊讶但无碍。
    · ⚠ 取成时槐芯剖面带骚甜似尸蜡的沉滞（旧木经尘吸人畜精血方凝结），玩家若博物学/术数/图书馆任一≥50 可点出"百年槐木吸了大量人气"；不解释缘由，仅星点状草木志怪的证物。
    · 玉盆铜匕在管事人手；玩家可半贿（雪花银1吊钱）半借半取；不取时仅得当代栽槐之芯，仪式会蹩脚。`;

    inject('向阳木心已取', body, 30);
    markSecret('木心尸蜡疑点');
    // 玩家完成木心采集后由 主持 在叙事里patch物品栏+仪式四物.向阳木心=true；事件总线不做无授权写
  }
  _%>
