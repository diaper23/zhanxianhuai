---
事件_四物_初露: |-
  <%_/* 事件 · 四物·城北取清晨初露 : 白日家宿 / 夜潜爬墙两态（旧 P040+P041）: 门牌"清晨初露已取" */
  if (!door('清晨初露已取')
      && door('桐淮已破冰')
      && (loc().includes('城北') || loc().includes('苍府') || loc().includes('严府') || loc().includes('高门'))) {
    // 夜态判定：以硬时钟时段为准（黄昏前为家宅拜访态，黄昏后/清晨取露为夜攀态）；
    // 近楼关键词只作"爬墙/潜入"等明确动作佐证，不再含"露""卯时"等歧义词
    const t = time();
    const isNight = ['黄昏', '夜晚', '深夜', '清晨'].includes(t) || near(['爬墙', '潜行', '夜攀', '翻墙'], 2);
    const body = isNight
      ? `【场景 · 城北高门区 · 卯时夜攀取露】
  城北苍府 / 严府皆设守兵巡夜；玩家若夜入高墙须【潜行/困难】上墙，或【敏捷/普通】攀槐以玉瓶收拂第一露。
  · 失败代价【迟滞】：惊兵丁 → 一夜奔逃，初露半瓶不足，仪式时勉强凑数；或被押入京兆府牢狱一夜，改写下一步行动自由。
  · ⚠ 玩家功德圆满时云鹤来口中："老仙常说'露之清者，承天意'，倒像是给有人提前听见的——" 戏谑半句自己敛住，由 严七 横它一眼。`
      : `【场景 · 城北高门区 · 家宅夜宿 / 拜访】
  玩家可在大宅府里过夜，与 苍晏（爷爷）或 严山海 等长辈浅浅寒暄。
  · ⚠ 苍晏（仅 <user> 在场才深入）若玩家追问严狰、苍羁或朝堂事，老人沉默半晌，最终以"再别提"四字避之——他不是不愿，是被封口；主持 只露"封口"的肢体语言（手抖、闭目、避茶），不解释为朝堂封口令。
  · ⚠ 严山海（仅 严七 / 玩家是其家友 时）咳出黑血半口，绢帕上血呈晚枯黑；玩家问其身状况则"老毛病罢了"；不显寒坼毒名。
  卯时起身，玉瓶在廊接露——这是这一节点主任务，不收则缺北物。`;

    inject('清晨初露已取', body, 35);
    markSecret('清晨初露');
  }
  _%>
