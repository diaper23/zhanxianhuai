---
事件_传闻轮盘: |-
  <%_/* 事件 · 传闻轮盘：可再生的每日环境层（沙盒的"空气"）
   *  机制：inject 的门牌号带当前日数（如 传闻_京城_日3_午），同一日只发一次、次日生成新门牌——
   *  一次性门由此变成"每日一次"的可再生内容。概率用 onceChance 以 日+键 为种子，同楼层重生成结果稳定。
   *  铁律：传闻只是市井空气——主持择一演绎、不解释、不入线索链、不与秘密门互相指认。
   */
  const d = day();

  // ── 第一章 · 京城（四物并行期的市井风闻）──
  if (door('桐淮已破冰') && !door('龙泽初抵') && ['午后', '黄昏'].includes(time())
      && onceChance(0.3, '京闻午' + d)) {
    inject(`传闻_京城_日${d}_午`, `【市井风闻 · 京城 · 今日】⚠ 环境层：主持择一条当闲谈佐料，不解释、不入线索链。
    · 东市老槐昨夜有更夫闻树身"咚咚"如心跳，天明再问，人皆笑他冻糊涂了。
    · 护国寺香火陡旺，皆因"求仙符"灵验——提符僧人眼色躲闪。
    · 皇城司番子在阜财坊一带查问生面孔，似在核对南下名单。
    · 桐淮派堂口前多了几辆外地车马，说是来"求仙水"的富贾。
    · 钱庄新换的账房姑娘是个外乡女子，一个人住庄后小院，夜夜灯亮到三更。`, 90);
  }
  if (door('桐淮已破冰') && !door('龙泽初抵') && ['夜晚', '深夜'].includes(time())
      && onceChance(0.3, '京闻夜' + d)) {
    inject(`传闻_京城_日${d}_夜`, `【市井风闻 · 京城 · 今夜】⚠ 环境层：主持择一条当闲谈佐料，不解释、不入线索链。
    · 城北高门区夜里有家丁传"严府的灯亮到三更"，老将军又在咳了。
    · 酒楼说书人把"前朝应太祖求仙"的话本又捡了起来，满堂喝彩里有人冷笑。
    · 雪地里有人瞧见一行细碎爪印，从城墙根一路向北，走着走着就没了。
    · 苍府门房收到一封无署名拜帖，只一句"故人之后，好自为之"。`, 90);
  }

  // ── 第二章 · 龙泽 · 余波期（收尾夜后的沙盒空气）──
  if (door('龙泽收尾夜已推进') && atOrAfter('第二章·龙泽听潮')) {
    // 每日清晨：天气与镇况简报（无概率，每日一条）
    if (time() === '清晨') {
      inject(`传闻_余波简报_日${d}`, `【余波简报 · 第${d}日晨】⚠ 主持据此 replace 世界.天气，并在晨间叙事里带一笔镇况（一句即可，不必逐条）：
    · 天气按 冬雪→雪霁→阴冻→风止→再雪 轮换，约两日一换。
    · 镇况底色：大祭创口渐愈；沐府废墟余烟未散、孩童被叮嘱绕着走；迎仙楼的食客又敢高声谈笑了。
    · 若 淮南堂 已被 云鹤来 接管：堂口重开施粥，旧信徒三三两两来上香，神情茫然。`, 5);
    }
    if (['午后', '黄昏'].includes(time()) && onceChance(0.35, '余闻午' + d)) {
      inject(`传闻_余波_日${d}_午`, `【市井风闻 · 龙泽 · 今日】⚠ 环境层：主持择一条演绎，不解释、不入线索链。
    · 集市上有人贱价兜售"沐家抄来的账册"，纸是真的，字迹说不清。
    · 几个孩子在江滩捡花灯残骸，捡到一盏没烧完的，里头祝词写着"来年别再死人了"。
    · 镇淮庙香客又多了；有人看见张大弟子的袖口露出镇灵散的纸包角。
    · 老鸦巷的老人凑在一起压低嗓子："那晚江心的绿光，我年轻时候也见过一回……"`, 90);
    }
    if (['夜晚', '深夜'].includes(time()) && onceChance(0.35, '余闻夜' + d)) {
      inject(`传闻_余波_日${d}_夜`, `【市井风闻 · 龙泽 · 今夜】⚠ 环境层：主持择一条演绎，不解释、不入线索链。
    · 夜里有更夫说南岸又起狼嚎，比大祭前更近、更沉，像在数着什么。
    · 义庄那盏长明灯连着几夜无风自晃；老更夫添了三遍油都不肯走。
    · 迎仙楼掌柜压低声：有个戴斗笠的客人包了顶房，天不亮就退了房，桌上留着一枚黑色蜡封。
    · 雪地上又见一行爪印，这回绕着镇子外沿走了一整圈，不多不少。
    · 迎仙楼掌柜娘子近来夜夜留一盏灯、温一壶酒，也不知等谁。`, 90);
    }
  }
  _%>
