---
事件_龙泽巡游日: |-
  <%_/* 事件 · 龙泽巡游日：第二日（硬时钟拍级节点）
   *  总纲门在大祭首日的次日清晨开出；四线子门按时段自启，迟到的线顺延不丢。
   */
  const 首日 = Number(getvar('stat_data.剧情进度.大祭首日', { defaults: 0 })) || 0;
  if (!door('龙泽巡游日已推进')
      && door('龙泽迎神日已推进')
      && 首日 > 0 && day() >= 首日 + 1
      && atOrAfter('第二章·龙泽听潮')
      && ['清晨', '上午', '午后'].includes(time())) {
    inject('龙泽巡游日已推进', `【场景 · 龙泽镇·第二日·巡游日】
  今日为大祭二日"巡游日"。本节点只给总纲，四线随硬时钟自动展开（详见 场景_镇淮庙/场景_沐府/场景_城郊医棚/场景_老鸦巷）：
    · 午后线（未时起）——神驾巡游点香 + 阳主巡游破秽显圣（双巡游同时较量）
    · 午后线——沐府流水午宴
    · 入夜线——淮南堂打手袭裴书砚医棚
  主持：把 剧情进度.当前场景='巡游日'。玩家分头或择重皆可。`, 60);
  }

  if (!door('巡游日_点香已推进')
      && door('龙泽巡游日已推进')
      && ['午后', '黄昏'].includes(time())) {
    inject('巡游日_点香已推进', `【巡游日 · 午后线一 · 神驾巡游点香（开江祭坛，与阳主巡游同时）】
  · 镇淮庙队伍自城东沿主干道至城西市集折返，至淮水畔开江祭坛点"头香"。张玄清持火折子近香，连三次火苗一近即灭——顶符被淮南堂内鬼涂湿润蜡脂、香炉底灰掺潮湿沙土。
  · 【侦查】可发现香头油亮蜡状物、香炉底灰异常潮湿；【察言观色】可发现道童中一人低头慌乱。
  · 淮南堂信徒借势煽动"头香点不燃是大凶！仙君生气了！去求阳主！"——人群动摇。
  · 主角可干涉四式：① 揭香炉手脚当众清理可恢复点香；② <user> 凭官面/南巡敕令牌安抚人群 1 奖骰；③ 锁定道童逼问或安抚让其承认被淮南堂威胁；④ 锁定带头煽动者（与真心恐慌民众不同、眼神带计划得逞得意）制服或当众揭穿。
  · 解围成功→王洛山开江日信仰汲取少一级（不影响 boss 数据但叙事压力减）；解围失败→王洛山获更多强化（开江日 boss 数据 1d6→1d4→1d3 阶梯降至无效，详见 场景_开江祭坛与江心潭）。
  · 张玄清对淮南堂敌意顶点，巡游毕后视主角为盟友，全盘吐"妖人所图必在万民祈愿愿力最盛之时——开江献礼那一刻恐有大变故，几位大人务必当心江水上游"。`, 61);
    markSecret('点香仪式被淮南堂破坏');
  }

  if (!door('巡游日_破秽已推进')
      && door('龙泽巡游日已推进')
      && ['午后', '黄昏'].includes(time())) {
    inject('巡游日_破秽已推进', `【巡游日 · 午后线二 · 阳主巡游破秽显圣（老鸦巷）】
  · 王洛山肩舆巡至老鸦巷法坛"破秽显圣"：黑衣弟子拖捆绑"污秽之人"，王洛山持桃木剑配朱砂符作"诛邪"——实为生石灰+磷化钙粉抖落+背后黑衣弟子短匕真杀（【侦查】可穿）。
  · 黑衣弟子在不经意间抓挠手腕后颈（被血宫蛊寄生受控）；【侦查】或【药学】得符水样本，闻出草药硫磺雄黄加极淡血腥（符水内混休眠蛊卵，饮者虽缓痒但内含蛊虫）。
  · 主角若有 云鹤来 神鬼话术/桐淮派大师爸身份、或 <user> 官面身份，可当众戳破"诛邪"造假或制约信徒；严七 武力威慑可压扫堂弟子（详见 场景_老鸦巷）。
  · 与王洛山交涉时他极恭逊装"山野之人"/称只治人、未治病源；对 云鹤来 自称晚辈桐淮同脉礼让，但若 云鹤来 强硬清理门户他提前赴上游血祭、削弱 boss 准备（开江日战斗数值由 主持 酌情降阶）。`, 62);
    markSecret('阳明符水含休眠蛊卵');
  }

  if (!door('巡游日_午宴已推进')
      && door('龙泽巡游日已推进')
      && ['午后', '黄昏'].includes(time())) {
    inject('巡游日_午宴已推进', `【巡游日 · 午后线三 · 沐府流水午宴】
  · 沐宗泽府内水榭邀权贵：里间首位存在黑衣人——<user> 若曾在码头见过天机，能凭身形认出（但身份保密）；严七 可与天机碰面。
  · 宴至中途沐宗泽命上"乌丝养神汤"（以白玉瓷碗盛）——病状疲惫官员刘福饮下神情明显好转，眼神仍瞟向银壶喉结滚动。
  · 玩家饮下 气血/心神 各回 1d3；严七 饮时短压寒坼但快速反噬（须【体质/困难】，失败则当场脱力受寒并增强解药依赖）。饮时揭迅捷猛烈异于寻常药理。
  · 天机会把汤含袖暗帕不咽【侦查】可注意到；【医学】/【药学】/【术数】者点出"提神过快、像直接刺激精神"。
  · 沐宗泽席间试探主角掌握证据、言语将怪病全推淮南堂；刘福【察言观色/普通】可看出他对"怪病是否危及自身官位"亦在焦虑。`, 63);
    markSecret('乌丝养神汤猛刺激精神副作用');
  }

  if (!door('巡游日_医棚已推进')
      && door('龙泽巡游日已推进')
      && ['黄昏', '夜晚', '深夜'].includes(time())) {
    inject('巡游日_医棚已推进', `【巡游日 · 入夜线四 · 淮南堂打手袭裴书砚医棚】
  · 路人巷或老鸦巷民传"淮南堂看门人结队往裴家医棚去了"——5~6 名黑衣打手打砸医棚、抢唯一病患陈三。裴书砚持药锄对峙落败在即。
  · 主角及时赶可救：<user> 亮南巡敕令牌 1 奖骰；云鹤来 桐淮大师爸话术独门仙术 1 奖骰；严七/云鹤来 武力正面交锋。
  · 打手 1d4+1 人，力量 65 / 体质 60 / 敏捷 55 / 气血 12 / DB+0；斗殴 45% 1d3 / 格斗(棍棒) 50% 1d8 / 闪避 30%。
  · 解围后裴书砚连夜制"镇灵散"（对主角各 2~3 剂）——第三日开江若血宫蛊爆发，裴以镇灵散救人；若解围失败裴研报被毁 → 第三日伤亡惨重、王洛山吸更多力量。
  · 严七 喝镇灵散可暂压体内寒坼（论寒坼毒同源相压、反噬则更烈——见 严七 寒坼毒秘密门链）。
  本日终末 主持 把 剧情进度.当前场景='巡游日毕'。`, 64);
    markSecret('镇灵散可得');
  }
  _%>
