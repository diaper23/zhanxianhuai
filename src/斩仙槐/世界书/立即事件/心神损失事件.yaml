---
心神损失事件:
  标题: 心神损失事件
  说明: "主持 在判定遭遇不可名状恐怖时须触发 心神 检定；本卡不再自跑引擎，改由骰子引擎显式掷骰。"

  触发时机:
    - 坛仙/异兽/被污染的严狰出现
    - 聂朝夕真身一瞥
    - 仙槐臆障、村民异变、尸蜡木心剖面直视
    - 由 主持 判断恐怖出现的瞬间为必然触发

  主持 操作流程:
    - 在回应末尾写一行 心神 标记：
      `<待检定 心神 55 "1/1d3" />`
      （目标=主角 心神 当前值；理由位填"成功损失量/失败损失量"区间，如 1/1d3、1d3/1d6、1d3/1d10）
    - 骰子引擎下轮掷骰并附掷损失骰，回灌【心神检定｜...】+损失量提示给 主持
    - 主持 在叙事中演绎该损失，并把 心神 当前值的 delta 写进 <UpdateVariable>

  损失量参考（与 心神管理 条目一致）:
    轻微_1/1d2: 诡异传闻、异常非直面
    轻度_1/1d3: 目睹尸体非自然变相、轻微异象
    中度_1/1d6: 直面精怪/异植、体证、血腥屠杀
    重度_1d3/1d10: 槐阴本形、面证仙槐异变、直视不可名状
    极高_1d10/1d100: 直面槐阴/淮阳类异象本体显现

  失魂发作判定:
    - 单次损失 ≥5 → 触发失魂发作：主持 掷 1d10 查 心神管理 的症状表，1d10+1d4 回合演绎
    - 大成功(1) → 不损 心神 且可能获"窥破一角"瞬时线索
    - 大失败(96~100) → 加大损失且直接触发失魂发作
    - 累计损失 ≥ 心神 上限/5（约 12）→ 持久失魂，剧情断章（疯人院/避世/隐居），玩家可短疗后回归