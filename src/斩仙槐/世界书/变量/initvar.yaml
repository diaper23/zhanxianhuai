# yaml-language-server: $schema=../../schema.json
# 在编写 initvar 之前, 请先保证终端有在运行 `pnpm watch`, 这会生成 schema.json 用于检验 initvar 是否有效
主角:
  姓名: 待填写
  身份: 待选择
  性别: 待填写
  年龄: 0
  出身: 待填写
  力量: 50
  敏捷: 50
  体质: 50
  外貌: 50
  智力: 50
  意志: 50
  教育: 50
  体型: 50
  幸运: 50
  气血:
    当前: 10
    上限: 10
  法力:
    当前: 10
    上限: 10
  心神:
    当前: 50
    上限: 50
  技能: {}
  特长与加成: []
  物品栏: {}

剧情进度:
  当前章节: 第一章·诏起龙庭
  # 模组内第几日（接旨当日=第1日）；硬时钟由 主持 按 主持协议 推进
  当前日: 1
  # 大祭首日锚点（抵达龙泽后首个大祭日的 当前日 值）；事件总线维护，主持不写
  大祭首日: 0
  当前场景: 接旨
  在场角色:
    - 传令太监
  地点: 苍府
  # 已到达过的章节名集合。事件总线用 reached()/atOrAfter() 判定里程碑，避免"主持 忘切章导致整章断流"
  到达章节:
    - 第一章·诏起龙庭
  仪式四物:
    向阳木心: false
    不灭灯油: false
    不落之尘: false
    清晨初露: false
  # 「门」模型：每条事件/秘密标一个稳定门牌号；事件总线命中钥匙且首次开门后置 true，永久锚定，防重复注入
  门: {}
  任务目标: {}

世界:
  当前地点: 京城·苍府
  现实时间: 光熙三十年 12月初·大雪
  天气: 入冬以来最大的一场雪
  现实日期推进: 0
  # 硬时钟六格时段：清晨/上午/午后/黄昏/夜晚/深夜
  时段: 清晨

NPC关系表: {}

秘密知晓: {}

# 事件总线运行时缓冲（每回合扫描阶段清空、注入阶段读取后用完即弃；玩家无须关心）
_本轮注入: []
