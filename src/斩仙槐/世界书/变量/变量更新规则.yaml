---
变量更新规则:
  主角:
    姓名:
      check:
        - 仅在创建引导阶段 replace；此后保持稳定
    身份:
      check:
        - 仅在创建引导阶段允许 replace；此后保持稳定
        - 模组固定单主角模式，玩家身份初始为 苍家文官（<user>），严七 与 云鹤来 为 NPC 同伴
    年龄:
      check:
        - 仅创建引导阶段 replace；此后保持稳定
    八大属性_力量敏捷体质外貌智力意志教育体型:
      check:
        - 创建时一次性赋值，此后除魔法/异变/长篇成长外不得改变
        - 力量/敏捷/体质/外貌/智力/意志/教育/体型 范围 0~99
    幸运:
      check:
        - 创建时一次性赋值，0~99；幸运为独立值，不受意志影响
        - 玩家在检定失败后可用 `/幸运` 翻盘：按本次翻盘恰需花费的幸运点数，由你在回应末尾写一次 delta 扣减
        - 关键剧情节点可由你回 1d3 幸运；其余时机不可凭空回血
    气血:
      check:
        - 上限取 (体质 + 体型) / 10 取整；当前不超上限、不低于 0
        - 战斗或外伤时由你 delta 扣减；归零触发昏迷/死亡判定
        - 战斗结束可申请急救/包扎恢复 1d3（须有急救技能或同伴协助）
    法力:
      check:
        - 上限 = 意志 / 5；施法/精神消耗后由你 delta
    心神:
      check:
        - 遭遇恐怖时按 心神 检定结果 delta：成功扣损失较小值、失败扣损失较大值
        - 上限默认 50（可由你在创建阶段微调到 50~60）
        - 单次损失 ≥5 触发失魂发作（由你掷 1d10 查 心神管理 失魂发作表，持续 1d10+1d4 回合真演）
        - 累计损失 ≥上限的 1/5（约 12）→ 触发持久失魂，由你停下主线给出"疗养/避世"剧情路径
        - 章节完成时可掷 1d6+1 恢复；同伴安慰可恢复 1d2；镇灵散/祈福可恢复 1d3
    技能:
      check:
        - 用「技能名」做键的对象；每项含「等级:0~99」与「本职: 是/否」两个子项
        - 关键  技能名规范：翻检文牍/历史/交涉/潜行/欺瞒/术数/侦查/察言观色/格斗(摔)/闪避/弓弩 等
        - 技能升级仅在"完成章节"或"显著使用"时 insert 新键或 replace 已有键的等级
        - 本职技能等级上限 < 99，兴趣技能 < 99
    特长与加成:
      check:
        - 一组文字标签（如 "教育+5"、"图书馆/历史/交涉 检定奖励骰"）
        - 苍家文官身份特征：教育 +5、图书馆/历史/交涉 检定奖励骰
        - 自定义主角：按其填写的出身合理赋予 1~2 项加成
    物品栏:
      check:
        - 用「物品名」做键的对象；每项含「描述」与「数量:不小于 0」两个子项
        - 仪式四物收集成功时 insert 对应物品（向阳木心/不灭灯油/不落之尘/清晨初露），数量 1
        - 数量归 0 时该条目由系统自动剔除，你不用特地 retain 空对象
        - 敕令牌/玉佩/铜钱坠等任务物品不计消耗数量
  剧情进度:
    当前日:
      check:
        - 模组内第几日（接旨当日=第 1 日）；玩家休整、守夜或过夜时 replace +1
        - 硬时钟变量，每轮都须核对是否需要推进；详见 主持协议·硬时钟推进协议
    大祭首日:
      check:
        - 抵达龙泽后首个大祭日的 当前日 值；由事件总线在"迎神日"节点自动锚定
        - 你不要写它；三日大祭的换日判定（迎神→巡游→开江）由总线依此锚点自启
    当前章节:
      check:
        - 二章之一：「第一章·诏起龙庭」「第二章·龙泽听潮」（本卡只建模两章）
        - 仅在章节重大节点（如启程切章、开江日决战）才 replace
        - 切章时你必须做两件事（写一次本轮的变量更新里）：
          1) replace 当前章节 为新章名
          2) 把"刚离开的旧章名"insert 到 到达章节 数组（避免回合遗漏里程）
    当前场景:
      check:
        - 章节内的小场景关键名（如 接旨/桐淮派堂口/东市百年老槐/护国寺/阜财坊/城北高门区/启程前夜/入镇安顿 等）
        - 由你根据玩家行动 replace；它决定哪条场景条目被读取并注入提示词
    在场角色:
      check:
        - 一个 NPC 名的数组（如 ['传令太监', '梁一笑']）
        - NPC 离场时你 remove 该项；NPC 入场时 insert 追加
    地点:
      check:
        - 单一字符串，对应 场景_ 前缀的条目名（如 '桐淮派堂口'）
        - 由你每次换幕时 replace
    到达章节:
      check:
        - 已经到达过的章节名数组；用来防止你忘切章导致整章内容无法被剧情节点激活
        - 一旦置入不再移除
        - 切章时由你 insert 旧章名（与 当前章节 的 replace 同步做）
    任务目标:
      check:
        - 以「目标名」为键的对象，每项含「描述」与「状态：进行中/已完成/已失败」
        - 主线事件节点注入时会给出应写入/收束的目标，你按其指引 insert 新目标或 replace 状态
        - 已完成/已失败的目标保留不删，供状态栏"奉旨"面板展示历程
        - 自由探索中玩家自己立下的心思，你也可以合理 insert 为目标（状态 进行中）
    仪式四物:
      check:
        - 固定四件物品各一个 是/否 标记：向阳木心 / 不灭灯油 / 不落之尘 / 清晨初露
        - 收集到时 replace 对应键为 是，并同步 insert 物品栏 对应项
        - 四物齐全与否由系统自行判定，你不用写"齐"或"完成"标志位
  门:
    check:
      - 此变量由本卡脚本自动维护，每次你在回应末尾写变量更新时不要把它写进变量更新里（不准 replace、insert、remove、move）
      - 它记录"某段剧情是否已演过"用来避免重复剧透；你叙事时不必关心这些门牌号的变量状态
  秘密知晓:
    check:
      - 一组以「秘密名」做键的 是/否 对象
      - 主角确实通过剧情或推理"得知"某秘密时 insert 为 是
      - 秘密名以事件总线各门实际写入的为准（如 老槐心跳 / 刺猬失名 / 铜钱坠同源 / 槐阴真相半解 / 仙骨始现 / 沐家被聂朝夕清算 等），你不要自创新键名，只在其为"是/否"布尔上做 insert
      - 详见「秘密递送规则」条目：同章最多解一层；玩家未主动追问 → 不主动宣告
  世界:
    当前地点:
      check:
        - 每次换幕/换场所时 replace，与 剧情进度.地点 联动保持一致
    现实时间:
      check:
        - 模组内时间，每次跨场时由你自然推进（如 "光熙三十年 12月初·大雪" → "元月初·阴" 等）
    天气:
      check:
        - 仅当剧情显现天气变化时更新
    现实日期推进:
      check:
        - 从开局起经过的天数累加，与 剧情进度.当前日 保持一致（当前日 = 现实日期推进 + 1）
        - 用于章节推进与严七寒坼毒 / 解药倒计时
    时段:
      check:
        - 六格之一：清晨 / 上午 / 午后 / 黄昏 / 夜晚 / 深夜
        - 每拍实质行动（场景切换/检定结算/有结果的交涉）推进一格；过夜则 replace 回 清晨 并把 当前日 +1
        - 硬时钟变量，每轮必须维护；详见 主持协议·硬时钟推进协议
  NPC关系表:
    check:
      - 一组以「NPC 名」做键的对象；每项含「警惕度(0~100)」「态度」「好感(-100~100)」「存活(是/否)」「备注」五个子项
      - 态度取值之一：敌意 / 戒备 / 中立 / 友善 / 信任
      - 仅对已登场的关键 NPC 设置条目
      - 警惕度、好感 根据主角行为 ±5~15 变动
      - 失效或死亡示例直接 replace 存活 为 否
  _本轮注入:
    check:
      - 此变量由本卡脚本每回合清空，并暂时存放本轮新触发的剧情节点文本，供你叙事参考
      - 每次你在回应末尾写变量更新时不要把它写进变量更新里
  _rollLog:
    check:
      - 此变量由本卡脚本在你显式掷骰后自动追加，保留最近 30 条
      - 每次你在回应末尾写变量更新时不要把它写进变量更新里
      - 它供玩家在前端的状态栏 / 检定录簿查阅

# 【每次你在回应末尾写变量更新时的概要】
# 应正常更新的字段：主角 的 八大属性/幸运/气血/法力/心神/技能/特长与加成/物品栏；剧情进度 的 当前日/当前章节/当前场景/在场角色/地点/到达章节/仪式四物/任务目标；世界 的所有字段（含 硬时钟 时段）；NPC关系表 的所有字段；秘密知晓
# 不要写进变量更新里的字段：「门」「_本轮注入」「_rollLog」「剧情进度.大祭首日」（这些由本卡脚本自动维护）