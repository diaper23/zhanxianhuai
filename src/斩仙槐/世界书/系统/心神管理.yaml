---
心神管理:
  说明: " 心神（心神）完整管理规则。心神 是主角的精神耐久值，遇不可名状恐怖即损失。"

  基础概念:
    心神上限: 本模组主角初始 心神 上限为 60（可填 50~60）。上限随异闻认知累积而降低：心神上限 = 99 - 已知异闻相关技能值
    心神当前: 每次遇恐怖场景损减至 0 进入永久失魂

  心神损失分级:
    轻微_1/1d2: 听诡异传闻、观察异常但非直面恐怖
    轻度_1/1d3: 目睹尸体非自然变相、轻微异象
    中度_1/1d6: 直面精怪/异植、发现真实体证、目睹血腥屠杀
    重度_1d3/1d10: 遭遇槐阴本形、面证仙槐异变、直视不可名状
    极高_1d10/1d100: 终极真相揭示、槐阴/淮阳类异象本体显现（罕见，主持 视剧情自定）

  检定流程:
    1_遇恐怖: 主持 声明 心神 损失范围
    2_掷骰: 主角 心神 检定（1d100 ≤ 心神当前 = 成功）
      - 大成功(1): 不改 心神，并可能获得"窥破一角"线索
      - 成功: 损失 【失败 心神 损失量】(较小值)
      - 失败: 损失 【成功 心神 损失量】(较大值)
      - 大失败(96~100): 损失两值中的较大且触发失魂发作

  失魂发作:
    触发: 单次 心神 损失 ≥5
    症状: 主持 掷 1d10 查以下表，演绎 1d10+1d4 回合
      1_假性昏迷/失神: 倒地不动、双目直视虚空
      2_强迫性动作: 反复计数/碎碎念/拭刀/理衣襟
      3_谵妄: 眼见不存在之物——见亡者、见槐树妄生
      4_妄想: 被害/拯救——"你们都已被槐化！"
      5_阵发性恐惧: 对特定物象——老槐/刺猬/符纸
      6_失语: 或以兽性短促呼喝替代
      7_攻击性爆发: 冲向最近的活物，不分敌我
      8_嗜睡/瘫软冷淡: 蜷缩不动、对外界无回应
      9_强迫性禁忌: 食生食/舔血/抓地土入口
      10_暴走逃窜: 不顾一切远离源头
    失魂发作期结束: 主角恢复心神，但该段记忆模糊，可 RP 为"发生什么了..."

  耐久失魂:
    触发: 心神 累计损失 ≥ 初始上限的1/5（即 ≥12）
    后果: 主角进入长期疗养态/隐居。玩家可在短期内创造新主角或延续残章线索
    主持判定: 允许以"避难所"/"苍家隔护"/"裴书砚庇护"等剧情元素延缓发作

  心神恢复:
    关键节点: 完成每章主要目标的主角，可掷 1d6+1 恢复 心神
    同伴安慰: 剧情感人的同伴交互（严七袒露心事/云鹤来授符）可恢复 1d2
    精神治疗: 裴书砚"镇灵散"或张玄清祈福可恢复 1d3
    心神上限恢复: 极少（异闻认知不可逆）；仅通过极度关键事件（如毁蛊/护村）回升 1d3

  输出格式:
    遇恐怖时: 「【心神检定｜当前 52｜投出 14｜成功｜损失 1d3=2｜剩余 50】心中一股如期而至的冷意，但你压抑了那妄想，手仍稳稳握着剑柄。」
    触发失魂时: 「【心神损失≥5｜失魂发作｜1d10投出 7｜攻击性爆发｜持续1d10+1d4=9回合】他眼中掠过的不是人——是一头被鞭抽过的狼。」

与骰子引擎联动（新 · 自动失魂判定）:
    - 心神 检定写法：`<待检定 心神 55 "1/1d3" />`（目标=心神当前；理由位填"成功损失量/失败损失量"，如 1/1d3、1d3/1d6）
    - 引擎掷骰+附掷损失骰；提示"单次 ≥5 → 失魂发作"
    - 触发失魂发作时，主持 在回应里追加：
      `<待失魂 持续=1d10+1d4 />`
      引擎下轮掷 1d10 查下方症状表 + 1d10+1d4 持续回合，正文由 主持 真演该症状
    - 大成功(1)：不损 心神 + 窥破一角瞬时线索，不触发失魂
    - 大失败(96~100)：损失加倍 + 直接触发失魂发作
    - 持久失魂：累计损失 ≥ 上限/5（约 12）→ 主持 停下主线给"疗养/避世"剧情路径