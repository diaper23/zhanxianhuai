---
斗战规则:
  说明: " 简化战斗规则（本模组采用）。以叙事推动回合，主持 负责回合管理、掷骰裁判与剧情衔接。"

  触发条件:
    - 当主角或同伴主动发起攻击、或遭遇敌方强制开战时，进入战斗
    - 主持 第一回合先声明「进入战斗」，列出所有参战方
    - 战斗不设网格，距离用叙事描述（近身/短距/中距/远距）

  回合流程:
    1_声明意图: 所有参战方按敏捷值高低依次声明本回合行动；主持 先声明敌方意图
    2_执行与判定: 按声明顺序逐个执行
    3_结算伤害: 命中成功后计算伤害，更新 气血
    4_状态检查: 回合内触发 心神 检定或失魂发作的照常执行
    5_下一回合: 重复，直至一方全灭/投降/逃跑

  命中判定:
    格斗(摔): 1d100 ≤ 格斗(摔)等级 = 命中
    闪避: 被攻击者可用闪避对抗；闪避成功(1d100 ≤ 闪避等级)则攻击落空
    弓弩: 1d100 ≤ 弓弩等级 = 命中；被攻击者不可闪避（可用掩体，主持 判定是否有效）
    大成功(1): 伤害取最大值，且附带特殊效果（缴械/击倒/部位致残）
    大失败(96~100): 武器脱手/误伤友军/主持 叙事酌情

  伤害计算:
    徒手: 1d3 + 伤害加值(db)
    小型近战武器(匕首/棍棒): 1d4 + db
    中型近战武器(刀剑/斧): 1d6 + db
    大型近战武器(长枪): 1d8 + db
    短弩: 1d8
    劲弩: 2d6
    伤害加值(db): 力量+体型合计
      - 2~64: -2
      - 65~84: -1
      - 85~124: 0
      - 125~164: +1d4
      - 165~204: +1d6

  护甲:
    轻甲(皮甲/厚棉袍): 减伤 1
    重甲(铁甲/锁子甲): 减伤 2
    仙骨/异质防护(严七): 减伤 2
    护甲减伤在骰出伤害后扣除

  气血与退出:
    气血归0: 主角/同伴陷入昏迷，若 6 回合内不被施救则死亡
    敌方气血归0: 敌死亡或丧失战斗力
    投降: 任何一方可声明投降；敌方投降需由 主持 判断合理性
    逃跑: 需成功通过敏捷检定（1d100 ≤ 敏捷×2），失败则本回合被额外攻击一次

  NPC战力模板:
    普通喽啰: 气血 8~12, 格斗(摔)35~45, 伤害 1d4
    精锐护卫: 气血 13~18, 格斗(摔)50~65, 伤害 1d6
    精英强者: 气血 20~30, 格斗(摔)70~85, 伤害 1d8+1
    精怪/异植: 气血 5~25, 手法特殊(主持 自定)，通常附带 心神 检定威胁

  叙事输出格式:
    「【回合N】<user> 拔剑直刺匪首。【检定｜格斗(摔) 60｜投出 34｜普通成功】剑锋没入那玄衣番子的护臂——太浅。【伤害｜1d6 投出 2｜对方轻甲减伤1｜剩余1】左肩血溅三寸，往前踉跄半步。"
    "敌方回合：玄衣番子回劈一刀。【检定｜格斗(摔) 45｜投出 89｜失败】【代价】刀刃在擦过你腰侧木架——架上一只青瓷碗碎落。"

  战斗结束:
    输出: 「一行脱身/交锋毕——【检定｜战斗结束】<user> 当前 气血 X / 严七 当前 气血 Y / 云鹤来 当前 气血 Z ，神殿残留在血与雪的渍痕里。」

与骰子引擎联动（新 · 自动伤害结算）:
    - 命中判定的写法见 检定规则「与检定引擎联动」段：`<待检定 格斗(摔) 60 "拔剑直刺"/>` 或玩家 `/投 格斗(摔) 60`
    - 命中后，主持 在同一回应里追加一行伤害标记：
      `<待伤害 武器=中型 护甲=1 目标=玄衣匪首 />`
      引擎下轮自动取最近命中检定 → 结果为成功则掷伤害骰 + db → 减护甲 → 输出实伤 气血
    - 武器分类与骰面（与下方伤害计算表一致）：
      徒手 1d3 / 小型 1d4 / 中型 1d6 / 大型 1d8 / 短弩 1d8 / 劲弩 2d6
    - db 自动按 主角.力量+体型 取（不会自动算敌方 db；敌方伤害由 主持 据模板掷 1d4~1d8+1）
    - 大成功命中：伤害取最大 + 缴械/击倒/部位致残（主持 择一演绎）
    - 实伤后由 主持 把 气血 delta 写进本轮 <UpdateVariable>（引擎不直写 气血，避免与 MVU 双写）